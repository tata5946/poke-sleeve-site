  <script src="./assets/common.js?v=20260826i"></script>
  <script>
    let currentAssetPeriod = "3m";
    let currentAssetTimeline = [];

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatPrice(price) {
      const n = Number(price);
      return Number.isFinite(n) && n > 0 ? `${Math.round(n).toLocaleString()}円` : "価格データなし";
    }

    function formatCurrency(price) {
      const n = Number(price);
      return Number.isFinite(n) && n >= 0 ? `¥${Math.round(n).toLocaleString()}` : "―";
    }

    function parsePositiveNumber(value) {
      const n = Number(String(value ?? "").replace(/[^\d.-]/g, ""));
      return Number.isFinite(n) && n > 0 ? n : null;
    }

    function normalizeDate(value, fallbackDay = "01") {
      const text = String(value ?? "").trim();
      if (!text) return "";
      if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text;
      if (/^\d{4}-\d{2}$/.test(text)) return `${text}-${fallbackDay}`;
      if (/^\d{4}$/.test(text)) return `${text}-01-01`;
      const parsed = new Date(text);
      return Number.isFinite(parsed.getTime()) ? parsed.toISOString().slice(0, 10) : "";
    }

    function getCollectionQuantity(item) {
      const quantity = Number(item?.quantity);
      return Number.isFinite(quantity) && quantity > 0 ? quantity : 1;
    }

    function getLatestPrice(sleeve) {
      if (window.common && typeof window.common.getLatestPositivePrice === "function") {
        return window.common.getLatestPositivePrice(sleeve);
      }
      const rows = Array.isArray(sleeve?.weeklyPrices) ? sleeve.weeklyPrices : [];
      let latest = null;
      for (const row of rows) {
        const week = String(row?.week || "").slice(0, 10);
        const price = Number(row?.price);
        if (!week || !(Number.isFinite(price) && price > 0)) continue;
        if (!latest || week > latest.week) latest = { week, price };
      }
      return latest ? latest.price : null;
    }

    function getReleaseTimestamp(sleeve) {
      const releaseDate = normalizeDate(
        sleeve?.releaseDate
        ?? sleeve?.release_date
        ?? sleeve?.releaseAt
        ?? sleeve?.releasedAt
        ?? sleeve?.releasedDate
        ?? sleeve?.released_date
        ?? sleeve?.releaseDatetime
        ?? sleeve?.release_datetime
        ?? sleeve?.["発売日"]
        ?? sleeve?.["発売年月日"]
      );
      let timestamp = Date.parse(releaseDate);
      if (Number.isFinite(timestamp)) return timestamp;
      const releaseYear = Number(sleeve?.releaseYear ?? sleeve?.release_year ?? sleeve?.["発売年"]);
      if (Number.isFinite(releaseYear) && releaseYear > 0) {
        timestamp = Date.parse(`${releaseYear}-01-01`);
        if (Number.isFinite(timestamp)) return timestamp;
      }
      return null;
    }

    function buildWeeklyPricePoints(sleeve, releaseTimestamp = getReleaseTimestamp(sleeve)) {
      const seen = new Set();
      return (Array.isArray(sleeve?.weeklyPrices) ? sleeve.weeklyPrices : [])
        .map((row) => {
          const date = normalizeDate(row?.week);
          const price = parsePositiveNumber(row?.price);
          const timestamp = Date.parse(date);
          if (!date || !(price > 0) || !Number.isFinite(timestamp)) return null;
          if (Number.isFinite(releaseTimestamp) && timestamp < releaseTimestamp) return null;
          if (seen.has(date)) return null;
          seen.add(date);
          return { date, timestamp, price };
        })
        .filter(Boolean)
        .sort((a, b) => a.timestamp - b.timestamp);
    }

    function isSleeveIndexWeek(date) {
      const normalized = normalizeDate(date);
      return /^\d{4}-\d{2}-\d{2}$/.test(normalized) && normalized.slice(-2) !== "01";
    }

    function getLatestSleeveIndexWeek(sleeves) {
      let latest = "";
      for (const sleeve of Array.isArray(sleeves) ? sleeves : []) {
        for (const row of Array.isArray(sleeve?.weeklyPrices) ? sleeve.weeklyPrices : []) {
          const week = normalizeDate(row?.week);
          if (!isSleeveIndexWeek(week)) continue;
          if (!latest || week > latest) latest = week;
        }
      }
      return latest;
    }

    function isExplicitPurchaseWeek(item) {
      if (window.common && typeof window.common.hasExplicitMyCollectionPurchaseWeek === "function") {
        return window.common.hasExplicitMyCollectionPurchaseWeek(item);
      }
      return item?.purchaseWeekSet === true;
    }

    function getExplicitPurchaseWeekDate(item) {
      if (!isExplicitPurchaseWeek(item)) return "";
      return window.common.normalizeMyCollectionPurchaseWeek(item?.purchaseWeek);
    }

    function clampTimestampToLatestIndex(timestamp, latestIndexTimestamp) {
      if (!Number.isFinite(timestamp)) return timestamp;
      return Number.isFinite(latestIndexTimestamp) ? Math.min(timestamp, latestIndexTimestamp) : timestamp;
    }

    function resolvePurchaseTimestamp(item, weeklyPoints, releaseTimestamp, latestIndexTimestamp) {
      const explicitPurchaseWeek = getExplicitPurchaseWeekDate(item);
      const explicitTimestamp = Date.parse(explicitPurchaseWeek);
      if (Number.isFinite(explicitTimestamp)) {
        const timestamp = Number.isFinite(releaseTimestamp) ? Math.max(explicitTimestamp, releaseTimestamp) : explicitTimestamp;
        return clampTimestampToLatestIndex(timestamp, latestIndexTimestamp);
      }
      if (Number.isFinite(releaseTimestamp)) return clampTimestampToLatestIndex(releaseTimestamp, latestIndexTimestamp);
      const firstPoint = Array.isArray(weeklyPoints) ? weeklyPoints[0] : null;
      if (Number.isFinite(firstPoint?.timestamp)) return clampTimestampToLatestIndex(firstPoint.timestamp, latestIndexTimestamp);
      return clampTimestampToLatestIndex(Date.parse(window.common.normalizeMyCollectionPurchaseWeek(new Date())), latestIndexTimestamp);
    }

    function getPurchaseWeekForInput(item, weeklyPoints, releaseTimestamp, latestIndexTimestamp) {
      const explicitPurchaseWeek = getExplicitPurchaseWeekDate(item);
      if (explicitPurchaseWeek) {
        const explicitTimestamp = Date.parse(explicitPurchaseWeek);
        const clampedTimestamp = clampTimestampToLatestIndex(explicitTimestamp, latestIndexTimestamp);
        return Number.isFinite(clampedTimestamp) ? new Date(clampedTimestamp).toISOString().slice(0, 10) : explicitPurchaseWeek;
      }
      const resolvedTimestamp = resolvePurchaseTimestamp(item, weeklyPoints, releaseTimestamp, latestIndexTimestamp);
      return Number.isFinite(resolvedTimestamp)
        ? new Date(resolvedTimestamp).toISOString().slice(0, 10)
        : window.common.normalizeMyCollectionPurchaseWeek(new Date());
    }

    function timestampToDateValue(timestamp) {
      return Number.isFinite(timestamp) ? new Date(timestamp).toISOString().slice(0, 10) : "";
    }

    function formatPurchaseWeekLabel(date) {
      const normalized = normalizeDate(date);
      const parsed = new Date(normalized);
      if (!Number.isFinite(parsed.getTime())) return "日付を選択";
      return `${parsed.getFullYear()}/${parsed.getMonth() + 1}/${parsed.getDate()}週`;
    }

    function clampPurchaseDate(value, min, max) {
      let date = normalizeDate(value);
      const minDate = normalizeDate(min);
      const maxDate = normalizeDate(max);
      if (!date) date = maxDate || minDate || window.common.normalizeMyCollectionPurchaseWeek(new Date());
      if (minDate && date < minDate) date = minDate;
      if (maxDate && date > maxDate) date = maxDate;
      return date;
    }

    function getPriceAtOrBefore(points, timestamp) {
      let latest = null;
      for (const point of Array.isArray(points) ? points : []) {
        if (point.timestamp > timestamp) break;
        latest = point.price;
      }
      return latest;
    }

    function buildCollectionRows(stored, sleeveMap, latestIndexWeek) {
      const latestIndexTimestamp = Date.parse(latestIndexWeek);
      return stored.map((item) => {
        const sleeveId = window.common.normalizeMyCollectionSleeveId(item?.sleeveId);
        const sleeve = sleeveMap.get(sleeveId);
        const name = String(sleeve?.name || item?.name || `ID: ${sleeveId}`).trim();
        const image = String(sleeve?.imageUrl || item?.image || "").trim();
        const releaseTimestamp = sleeve ? getReleaseTimestamp(sleeve) : null;
        const weeklyPoints = sleeve ? buildWeeklyPricePoints(sleeve, releaseTimestamp) : [];
        return {
          sleeveId,
          name,
          image,
          quantity: getCollectionQuantity(item),
          purchaseWeek: getPurchaseWeekForInput(item, weeklyPoints, releaseTimestamp, latestIndexTimestamp),
          purchaseWeekSet: isExplicitPurchaseWeek(item),
          minPurchaseDate: timestampToDateValue(releaseTimestamp),
          maxPurchaseDate: latestIndexWeek,
          price: sleeve ? getLatestPrice(sleeve) : null,
          releaseTimestamp,
          weeklyPoints,
          href: window.common.buildSleeveDetailHref(sleeveId)
        };
      }).filter((row) => row.sleeveId);
    }

    function buildTrackedRows(stored, sleeveMap, latestIndexWeek) {
      const latestIndexTimestamp = Date.parse(latestIndexWeek);
      return (Array.isArray(stored) ? stored : []).map((item) => {
        const sleeveId = window.common.normalizeMyCollectionSleeveId(item?.sleeveId);
        if (!sleeveId) return null;
        const sleeve = sleeveMap.get(sleeveId);
        const releaseTimestamp = sleeve ? getReleaseTimestamp(sleeve) : null;
        const weeklyPoints = sleeve ? buildWeeklyPricePoints(sleeve, releaseTimestamp) : [];
        const purchaseTimestamp = resolvePurchaseTimestamp(item, weeklyPoints, releaseTimestamp, latestIndexTimestamp);
        return {
          sleeveId,
          currentQuantity: getCollectionQuantity(item),
          purchaseTimestamp,
          releaseTimestamp,
          weeklyPoints
        };
      }).filter(Boolean);
    }

    function calculateCurrentAssetTotal(rows) {
      let total = 0;
      let pricedCount = 0;
      for (const row of rows) {
        if (Number.isFinite(row.releaseTimestamp) && Date.now() < row.releaseTimestamp) continue;
        const price = parsePositiveNumber(row.price);
        if (!(price > 0)) continue;
        total += price * row.quantity;
        pricedCount += 1;
      }
      return { total: pricedCount > 0 ? total : null, pricedCount };
    }

    function evaluateRowsAt(rows, timestamp) {
      let total = 0;
      let pricedCount = 0;
      for (const row of rows) {
        if (Number.isFinite(row.releaseTimestamp) && timestamp < row.releaseTimestamp) continue;
        const price = getPriceAtOrBefore(row.weeklyPoints, timestamp);
        if (!(price > 0)) continue;
        total += price * row.quantity;
        pricedCount += 1;
      }
      return pricedCount > 0 ? { total, pricedCount } : null;
    }

    function evaluateTrackedRowsAt(rows, timestamp) {
      let total = 0;
      let pricedCount = 0;
      let totalQuantity = 0;
      for (const row of rows) {
        const quantity = Math.max(0, Math.trunc(Number(row.currentQuantity) || 0));
        if (quantity <= 0) continue;
        if (Number.isFinite(row.purchaseTimestamp) && timestamp < row.purchaseTimestamp) continue;
        if (Number.isFinite(row.releaseTimestamp) && timestamp < row.releaseTimestamp) continue;
        totalQuantity += quantity;
        const price = getPriceAtOrBefore(row.weeklyPoints, timestamp);
        if (!(price > 0)) continue;
        total += price * quantity;
        pricedCount += 1;
      }
      if (totalQuantity <= 0) return null;
      return pricedCount > 0 ? { total, pricedCount, totalQuantity } : null;
    }

    function buildAssetTimeline(rows, latestIndexWeek) {
      const dates = new Map();
      const latestIndexTimestamp = Date.parse(latestIndexWeek);
      const currentTimestamp = Number.isFinite(latestIndexTimestamp) ? latestIndexTimestamp : Date.now();
      dates.set(new Date(currentTimestamp).toISOString(), currentTimestamp);
      for (const row of rows) {
        if (Number.isFinite(row.purchaseTimestamp)) {
          dates.set(new Date(row.purchaseTimestamp).toISOString(), row.purchaseTimestamp);
        }
        if (Number.isFinite(row.releaseTimestamp)) {
          dates.set(new Date(row.releaseTimestamp).toISOString(), row.releaseTimestamp);
        }
        for (const point of row.weeklyPoints) {
          if (Number.isFinite(latestIndexTimestamp) && point.timestamp > latestIndexTimestamp) continue;
          dates.set(point.date, point.timestamp);
        }
      }
      const timeline = [];
      for (const [date, timestamp] of Array.from(dates.entries()).sort((a, b) => a[1] - b[1])) {
        const evaluated = evaluateTrackedRowsAt(rows, timestamp);
        if (!evaluated) continue;
        timeline.push({
          date: String(date).slice(0, 10),
          timestamp,
          value: Math.round(evaluated.total),
          pricedCount: evaluated.pricedCount,
          totalQuantity: evaluated.totalQuantity
        });
      }
      return compactTimelineByDate(timeline);
    }

    function compactTimelineByDate(timeline) {
      const byDate = new Map();
      for (const point of Array.isArray(timeline) ? timeline : []) {
        const date = String(point?.date || "").slice(0, 10);
        if (!date) continue;
        const previous = byDate.get(date);
        if (!previous || point.timestamp >= previous.timestamp) byDate.set(date, point);
      }
      return Array.from(byDate.values()).sort((a, b) => a.timestamp - b.timestamp);
    }

    function formatDeltaAmount(currentTotal, pastTotal) {
      if (!(Number.isFinite(currentTotal) && Number.isFinite(pastTotal) && pastTotal >= 0)) return { amount: "―", rate: "" };
      const diff = Math.round(currentTotal - pastTotal);
      const sign = diff > 0 ? "+" : diff < 0 ? "-" : "";
      const rate = pastTotal > 0 ? ((currentTotal / pastTotal) - 1) * 100 : null;
      return {
        amount: `${sign}${formatCurrency(Math.abs(diff))}`,
        rate: Number.isFinite(rate) ? `（${rate > 0 ? "+" : ""}${rate.toFixed(1)}%）` : ""
      };
    }

    function getTimelinePointAtOrBefore(timeline, timestamp) {
      let latest = null;
      for (const point of Array.isArray(timeline) ? timeline : []) {
        if (point.timestamp > timestamp) break;
        latest = point;
      }
      return latest;
    }

    function updateAssetSummary(rows, timeline) {
      const totalEl = document.getElementById("collectionAssetTotal");
      const countEl = document.getElementById("collectionCount");
      const quantityEl = document.getElementById("collectionQuantityTotal");
      const weekDeltaEl = document.getElementById("collectionWeekDelta");
      const weekRateEl = document.getElementById("collectionWeekRate");
      const monthDeltaEl = document.getElementById("collectionMonthDelta");
      const monthRateEl = document.getElementById("collectionMonthRate");
      const current = calculateCurrentAssetTotal(rows);
      const currentTotal = current.total;
      const latestPoint = timeline.length ? timeline[timeline.length - 1] : null;
      const weekPast = latestPoint ? getTimelinePointAtOrBefore(timeline, latestPoint.timestamp - (7 * 24 * 60 * 60 * 1000)) : null;
      const monthPast = latestPoint ? getTimelinePointAtOrBefore(timeline, latestPoint.timestamp - (30 * 24 * 60 * 60 * 1000)) : null;
      const weekDelta = formatDeltaAmount(currentTotal, weekPast?.value);
      const monthDelta = formatDeltaAmount(currentTotal, monthPast?.value);
      const totalQuantity = rows.reduce((sum, row) => sum + getCollectionQuantity(row), 0);

      if (totalEl) totalEl.textContent = currentTotal != null ? formatCurrency(currentTotal) : "―";
      if (countEl) countEl.textContent = `${rows.length}種類`;
      if (quantityEl) quantityEl.textContent = `${totalQuantity}個`;
      if (weekDeltaEl) weekDeltaEl.textContent = weekDelta.amount;
      if (weekRateEl) weekRateEl.textContent = weekDelta.rate;
      if (monthDeltaEl) monthDeltaEl.textContent = monthDelta.amount;
      if (monthRateEl) monthRateEl.textContent = monthDelta.rate;
    }

    function filterTimelineByPeriod(timeline, period) {
      if (!timeline.length || period === "all") return timeline;
      const daysByPeriod = { "1m": 31, "3m": 92, "6m": 183, "1y": 366 };
      const days = daysByPeriod[period] || 92;
      const latestTs = timeline[timeline.length - 1].timestamp;
      const cutoff = latestTs - (days * 24 * 60 * 60 * 1000);
      return timeline.filter((point) => point.timestamp >= cutoff);
    }

    function formatChartDate(date) {
      const parsed = new Date(date);
      if (!Number.isFinite(parsed.getTime())) return date;
      return parsed.toLocaleDateString("ja-JP", { month: "numeric", day: "numeric" });
    }

    function formatCompactChartCurrency(price) {
      const n = Number(price);
      if (!(Number.isFinite(n) && n >= 0)) return "―";
      if (n >= 100000000) return `¥${Math.round(n / 100000000).toLocaleString()}億`;
      if (n >= 10000) {
        const man = n / 10000;
        const value = man >= 100 ? Math.round(man) : Math.round(man * 10) / 10;
        return `¥${value.toLocaleString()}万`;
      }
      return `¥${Math.round(n).toLocaleString()}`;
    }

    function getMobileAssetLabelIndexes(count) {
      if (count <= 1) return [0];
      if (count <= 3) return Array.from({ length: count }, (_, index) => index);
      const candidates = count >= 10
        ? [0, Math.round((count - 1) * 0.33), Math.round((count - 1) * 0.66), count - 1]
        : [0, Math.round((count - 1) / 2), count - 1];
      return Array.from(new Set(candidates.map((index) => Math.min(count - 1, Math.max(0, index)))));
    }

    function getNiceAxisStep(rawStep) {
      const safeStep = Math.max(1, Number(rawStep) || 1);
      const pow = Math.pow(10, Math.floor(Math.log10(safeStep)));
      const normalized = safeStep / pow;
      const multiplier = normalized <= 1 ? 1 : normalized <= 2 ? 2 : normalized <= 2.5 ? 2.5 : normalized <= 5 ? 5 : 10;
      return multiplier * pow;
    }

    function buildAssetAxis(minValue, maxValue, targetIntervals = 4) {
      if (!(Number.isFinite(minValue) && Number.isFinite(maxValue))) return { min: 0, max: 1, ticks: [0, 1] };
      if (minValue === maxValue) {
        const pad = Math.max(1000, Math.round(maxValue * 0.12));
        minValue = Math.max(0, minValue - pad);
        maxValue = maxValue + pad;
      }
      const min = 0;
      const rawStep = Math.max(1, maxValue - min) / Math.max(1, targetIntervals);
      const step = getNiceAxisStep(rawStep);
      const max = Math.ceil(maxValue / step) * step;
      const ticks = [];
      for (let value = min; value <= max + step * 0.001; value += step) ticks.push(Math.round(value));
      return { min, max, ticks };
    }

    function buildQuantityAxis(maxValue) {
      const max = Math.max(1, Math.ceil(Number(maxValue) || 1));
      const rawStep = max / 3;
      const pow = Math.pow(10, Math.floor(Math.log10(rawStep)));
      const normalized = rawStep / pow;
      const step = Math.max(1, (normalized <= 1 ? 1 : normalized <= 2 ? 2 : normalized <= 5 ? 5 : 10) * pow);
      const axisMax = Math.ceil(max / step) * step;
      const ticks = [];
      for (let value = 0; value <= axisMax + step * 0.001; value += step) ticks.push(Math.round(value));
      return { min: 0, max: axisMax, ticks };
    }

    function formatFullChartDate(date) {
      const parsed = new Date(date);
      if (!Number.isFinite(parsed.getTime())) return date;
      return parsed.toLocaleDateString("ja-JP", { year: "numeric", month: "numeric", day: "numeric" });
    }

    function renderAssetChart(timeline) {
      const root = document.getElementById("collectionAssetChart");
      if (!root) return;
      const scoped = filterTimelineByPeriod(timeline, currentAssetPeriod);
      if (scoped.length < 1) {
        root.innerHTML = '<div class="my-asset-chart-empty">資産推移を表示できる価格データがまだありません。</div>';
        return;
      }

      const isMobileChart = window.matchMedia("(max-width: 700px)").matches;
      const W = isMobileChart ? Math.max(840, 96 + Math.max(1, scoped.length - 1) * 28) : 760;
      const H = isMobileChart ? 520 : 320;
      const padL = isMobileChart ? 58 : 82;
      const padR = isMobileChart ? 36 : 64;
      const padT = isMobileChart ? 26 : 32;
      const padB = isMobileChart ? 46 : 54;
      const values = scoped.map((point) => point.value);
      const quantities = scoped.map((point) => point.totalQuantity || 0);
      const axis = buildAssetAxis(Math.min(...values), Math.max(...values), isMobileChart ? 4 : 5);
      const quantityAxis = buildQuantityAxis(Math.max(...quantities));
      const chartW = W - padL - padR;
      const chartH = H - padT - padB;
      const xToPx = (index) => scoped.length === 1 ? padL + (chartW / 2) : padL + (index / (scoped.length - 1)) * chartW;
      const yToPx = (value) => padT + (1 - ((value - axis.min) / Math.max(1, axis.max - axis.min))) * chartH;
      const quantityToPx = (value) => padT + (1 - ((value - quantityAxis.min) / Math.max(1, quantityAxis.max - quantityAxis.min))) * chartH;
      const lineD = scoped.map((point, index) => `${index === 0 ? "M" : "L"} ${xToPx(index).toFixed(2)} ${yToPx(point.value).toFixed(2)}`).join(" ");
      const areaD = `${lineD} L ${xToPx(scoped.length - 1).toFixed(2)} ${H - padB} L ${xToPx(0).toFixed(2)} ${H - padB} Z`;
      const labelIndexes = isMobileChart
        ? getMobileAssetLabelIndexes(scoped.length)
        : Array.from(new Set([0, Math.floor((scoped.length - 1) / 2), scoped.length - 1]));
      const barW = isMobileChart
        ? Math.max(2, Math.min(10, (chartW / Math.max(1, scoped.length)) * 0.32))
        : Math.max(3, Math.min(18, (chartW / Math.max(1, scoped.length)) * 0.56));
      const axisFontSize = isMobileChart ? 10 : 12;
      const dateFontSize = isMobileChart ? 11 : 13;
      const lineWidth = isMobileChart ? 4.6 : 4;
      const dotRadius = isMobileChart ? 3.2 : 4;
      const latestDotRadius = isMobileChart ? 4.8 : 5.5;
      const hitRadius = isMobileChart ? 14 : 18;
      const quantityBarOpacity = isMobileChart ? 0.22 : 0.34;
      const assetTickLabel = isMobileChart ? formatCompactChartCurrency : formatCurrency;

      root.innerHTML = `
        <div class="my-asset-chart-wrap${isMobileChart ? " is-mobile-density" : ""}">
          <div class="my-asset-chart-tooltip" hidden></div>
          <svg class="my-asset-chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="資産額の推移グラフ"${isMobileChart ? ` style="width:${W}px"` : ""}>
            <defs>
              <linearGradient id="myAssetAreaGradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#1e5bd7" stop-opacity="${isMobileChart ? "0.18" : "0.24"}"></stop>
                <stop offset="100%" stop-color="#1e5bd7" stop-opacity="0.03"></stop>
              </linearGradient>
            </defs>
            ${axis.ticks.map((tick) => `<line x1="${padL}" y1="${yToPx(tick).toFixed(2)}" x2="${W - padR}" y2="${yToPx(tick).toFixed(2)}" stroke="#dce4f0"></line>`).join("")}
            <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="#a8b3c7"></line>
            <line x1="${W - padR}" y1="${padT}" x2="${W - padR}" y2="${H - padB}" stroke="#c4cedd"></line>
            <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="#a8b3c7"></line>
            ${scoped.map((point, index) => {
              const x = xToPx(index) - (barW / 2);
              const y = quantityToPx(point.totalQuantity || 0);
              return `<rect class="my-asset-quantity-bar" x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${barW.toFixed(2)}" height="${Math.max(0, H - padB - y).toFixed(2)}" rx="2" fill="#9fb3d1" opacity="${quantityBarOpacity}"></rect>`;
            }).join("")}
            <path d="${areaD}" fill="url(#myAssetAreaGradient)"></path>
            <path d="${lineD}" fill="none" stroke="#1e5bd7" stroke-width="${lineWidth}" stroke-linecap="round" stroke-linejoin="round"></path>
            ${axis.ticks.map((tick) => `<text x="${padL - 8}" y="${yToPx(tick) + 4}" text-anchor="end" font-size="${axisFontSize}" font-weight="800" fill="#475467">${escapeHtml(assetTickLabel(tick))}</text>`).join("")}
            ${quantityAxis.ticks.map((tick) => `<text x="${W - padR + 7}" y="${quantityToPx(tick) + 4}" text-anchor="start" font-size="${axisFontSize}" font-weight="800" fill="#667085">${escapeHtml(isMobileChart ? String(tick) : `${tick}個`)}</text>`).join("")}
            ${labelIndexes.map((index) => {
              const point = scoped[index];
              const anchor = scoped.length === 1 ? "middle" : index === 0 ? "start" : index === scoped.length - 1 ? "end" : "middle";
              return `<text x="${xToPx(index).toFixed(2)}" y="${H - 17}" text-anchor="${anchor}" font-size="${dateFontSize}" font-weight="800" fill="#475467">${escapeHtml(formatChartDate(point.date))}</text>`;
            }).join("")}
            <g aria-hidden="true">
              <circle cx="${W - padR - (isMobileChart ? 104 : 154)}" cy="${isMobileChart ? 15 : 18}" r="${isMobileChart ? 3.5 : 4}" fill="#1e5bd7"></circle>
              <text x="${W - padR - (isMobileChart ? 96 : 144)}" y="${isMobileChart ? 19 : 22}" font-size="${isMobileChart ? 10 : 11}" font-weight="800" fill="#475467">総資産額</text>
              <rect x="${W - padR - (isMobileChart ? 48 : 80)}" y="${isMobileChart ? 12 : 14}" width="${isMobileChart ? 6 : 8}" height="${isMobileChart ? 6 : 8}" rx="2" fill="#9fb3d1" opacity="${isMobileChart ? 0.36 : 0.5}"></rect>
              <text x="${W - padR - (isMobileChart ? 38 : 68)}" y="${isMobileChart ? 19 : 22}" font-size="${isMobileChart ? 10 : 11}" font-weight="800" fill="#667085">保有数</text>
            </g>
            ${scoped.map((point, index) => `<circle class="my-asset-chart-dot" cx="${xToPx(index).toFixed(2)}" cy="${yToPx(point.value).toFixed(2)}" r="${index === scoped.length - 1 ? latestDotRadius : dotRadius}" fill="#1e5bd7"></circle><circle class="my-asset-hit-point" data-index="${index}" cx="${xToPx(index).toFixed(2)}" cy="${yToPx(point.value).toFixed(2)}" r="${hitRadius}" fill="transparent"></circle>`).join("")}
          </svg>
        </div>
      `;

      const wrap = root.querySelector(".my-asset-chart-wrap");
      const tooltip = root.querySelector(".my-asset-chart-tooltip");
      const showTip = (event, index) => {
        const point = scoped[index];
        if (!wrap || !tooltip || !point) return;
        tooltip.innerHTML = `<strong>${escapeHtml(formatFullChartDate(point.date))}</strong><span>総資産額　${escapeHtml(formatCurrency(point.value))}</span><span>総保有数　${escapeHtml(`${point.totalQuantity || 0}個`)}</span>`;
        tooltip.hidden = false;
        const rect = wrap.getBoundingClientRect();
        const clientX = event.touches?.[0]?.clientX ?? event.clientX ?? rect.left + rect.width / 2;
        const x = Math.min(Math.max(clientX - rect.left, 70), rect.width - 70);
        tooltip.style.left = `${x}px`;
      };
      const hideTip = () => {
        if (tooltip) tooltip.hidden = true;
      };
      root.querySelectorAll(".my-asset-hit-point").forEach((hit) => {
        const index = Number(hit.getAttribute("data-index"));
        hit.addEventListener("mouseenter", (event) => showTip(event, index));
        hit.addEventListener("mousemove", (event) => showTip(event, index));
        hit.addEventListener("click", (event) => showTip(event, index));
        hit.addEventListener("touchstart", (event) => showTip(event, index), { passive: true });
      });
      wrap.addEventListener("mouseleave", hideTip);
    }

    function setupAssetPeriodButtons() {
      document.querySelectorAll("[data-asset-period]").forEach((button) => {
        button.classList.toggle("is-active", button.getAttribute("data-asset-period") === currentAssetPeriod);
        button.addEventListener("click", () => {
          currentAssetPeriod = button.getAttribute("data-asset-period") || "3m";
          document.querySelectorAll("[data-asset-period]").forEach((btn) => {
            btn.classList.toggle("is-active", btn === button);
          });
          renderAssetChart(currentAssetTimeline);
        });
      });
    }

    function buildCard(row) {
      const maxPurchaseDateValue = normalizeDate(row.maxPurchaseDate) || window.common.normalizeMyCollectionPurchaseWeek(new Date());
      const minPurchaseDateValue = row.minPurchaseDate && row.minPurchaseDate <= maxPurchaseDateValue ? row.minPurchaseDate : "";
      const purchaseDateValue = clampPurchaseDate(row.purchaseWeek, minPurchaseDateValue, maxPurchaseDateValue);
      const purchaseWeekLabel = formatPurchaseWeekLabel(purchaseDateValue);
      return `
        <article class="my-collection-card">
          <a class="my-collection-card-link" href="${escapeHtml(row.href)}" data-sleeve-link="1" aria-label="${escapeHtml(row.name)}の詳細を見る">
            <span class="my-collection-thumb">
              ${row.image ? `<img src="${escapeHtml(row.image)}" alt="${escapeHtml(row.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null; this.style.display='none';">` : ""}
            </span>
            <h2 class="my-collection-title">${escapeHtml(row.name)}</h2>
            <div class="my-collection-price">
              <span class="my-collection-price-label">現在相場</span>
              ${escapeHtml(formatPrice(row.price))}
            </div>
          </a>
          <div class="my-collection-quantity" aria-label="${escapeHtml(row.name)}の保有数">
            <span class="my-collection-quantity-label">保有数</span>
            <div class="my-collection-stepper">
              <button type="button" data-quantity-action="decrease" data-sleeve-id="${escapeHtml(row.sleeveId)}" aria-label="保有数を1減らす">−</button>
              <span>${escapeHtml(row.quantity)}</span>
              <button type="button" data-quantity-action="increase" data-sleeve-id="${escapeHtml(row.sleeveId)}" aria-label="保有数を1増やす">＋</button>
            </div>
          </div>
          <div class="my-collection-purchase-week">
            <span>購入週</span>
            <span class="my-collection-date-picker">
              <button class="my-collection-date-button" type="button" data-purchase-week-open="${escapeHtml(row.sleeveId)}" aria-label="${escapeHtml(row.name)}の購入週を選ぶ">
                <span data-purchase-week-label="${escapeHtml(row.sleeveId)}">${escapeHtml(purchaseWeekLabel)}</span>
                <span class="my-collection-calendar-mark" aria-hidden="true"></span>
              </button>
              <input class="my-collection-date-input" type="date" value="${escapeHtml(purchaseDateValue)}" min="${escapeHtml(minPurchaseDateValue)}" max="${escapeHtml(maxPurchaseDateValue)}" data-purchase-week="${escapeHtml(row.sleeveId)}" aria-label="${escapeHtml(row.name)}の購入週">
            </span>
          </div>
          <button class="my-collection-remove" type="button" data-remove-collection="${escapeHtml(row.sleeveId)}">コレクションから削除</button>
        </article>
      `;
    }

    function renderEmpty(root) {
      root.innerHTML = `
        <div class="my-collection-empty">
          <h2 class="my-collection-empty-title">まだデッキシールドが登録されていません。</h2>
          <p>気になるデッキシールドのページから『マイコレクションに追加』を押して登録できます。</p>
          <a class="btn primary" href="./sleeves/">デッキシールドを探す</a>
        </div>
      `;
    }

    async function renderCollection() {
      const root = document.getElementById("collectionList");
      const countEl = document.getElementById("collectionCount");
      if (!root || !countEl || !window.common) return;

      const stored = window.common.readMyCollection();
      countEl.textContent = `${stored.length}種類`;
      window.common.updateMyCollectionCountBadges(stored.length);

      if (!stored.length) {
        currentAssetTimeline = [];
        updateAssetSummary([], []);
        renderAssetChart([]);
        renderEmpty(root);
        return;
      }

      root.innerHTML = '<div class="my-collection-empty"><p>読み込み中...</p></div>';

      let data;
      try {
        data = await window.common.loadData();
      } catch (e) {
        currentAssetTimeline = [];
        const totalEl = document.getElementById("collectionAssetTotal");
        const weekDeltaEl = document.getElementById("collectionWeekDelta");
        const weekRateEl = document.getElementById("collectionWeekRate");
        const monthDeltaEl = document.getElementById("collectionMonthDelta");
        const monthRateEl = document.getElementById("collectionMonthRate");
        const quantityEl = document.getElementById("collectionQuantityTotal");
        if (totalEl) totalEl.textContent = "―";
        if (weekDeltaEl) weekDeltaEl.textContent = "―";
        if (weekRateEl) weekRateEl.textContent = "";
        if (monthDeltaEl) monthDeltaEl.textContent = "―";
        if (monthRateEl) monthRateEl.textContent = "";
        if (quantityEl) quantityEl.textContent = "0個";
        renderAssetChart([]);
        root.innerHTML = `<div class="my-collection-empty"><p>${escapeHtml(e.message || "データの読み込みに失敗しました。")}</p></div>`;
        return;
      }

      const sleeveMap = new Map();
      for (const sleeve of Array.isArray(data?.sleeves) ? data.sleeves : []) {
        const id = window.common.normalizeMyCollectionSleeveId(sleeve?.id);
        if (id) sleeveMap.set(id, sleeve);
      }

      const latestIndexWeek = getLatestSleeveIndexWeek(data?.sleeves);
      const rows = buildCollectionRows(stored, sleeveMap, latestIndexWeek);
      const trackedRows = buildTrackedRows(stored, sleeveMap, latestIndexWeek);
      currentAssetTimeline = buildAssetTimeline(trackedRows, latestIndexWeek);
      updateAssetSummary(rows, currentAssetTimeline);
      renderAssetChart(currentAssetTimeline);

      root.innerHTML = rows.map(buildCard).join("");
      root.querySelectorAll("[data-remove-collection]").forEach((button) => {
        button.addEventListener("click", () => {
          window.common.removeFromMyCollection(button.getAttribute("data-remove-collection"));
        });
      });
      root.querySelectorAll("[data-quantity-action]").forEach((button) => {
        button.addEventListener("click", () => {
          const sleeveId = button.getAttribute("data-sleeve-id");
          const row = rows.find((item) => item.sleeveId === sleeveId);
          if (!row || !window.common.updateMyCollectionQuantity) return;
          const delta = button.getAttribute("data-quantity-action") === "increase" ? 1 : -1;
          window.common.updateMyCollectionQuantity(sleeveId, Math.max(1, row.quantity + delta));
        });
      });
      root.querySelectorAll("[data-purchase-week-open]").forEach((button) => {
        button.addEventListener("click", () => {
          const sleeveId = button.getAttribute("data-purchase-week-open");
          const input = Array.from(root.querySelectorAll("[data-purchase-week]")).find((item) => item.getAttribute("data-purchase-week") === sleeveId);
          if (!input) return;
          if (typeof input.showPicker === "function") {
            input.showPicker();
          } else {
            input.click();
          }
        });
      });
      root.querySelectorAll("[data-purchase-week]").forEach((input) => {
        input.addEventListener("change", () => {
          const sleeveId = input.getAttribute("data-purchase-week");
          if (!sleeveId || !window.common.updateMyCollectionPurchaseWeek) return;
          const selectedDate = clampPurchaseDate(input.value, input.min, input.max);
          input.value = selectedDate;
          const label = Array.from(root.querySelectorAll("[data-purchase-week-label]")).find((item) => item.getAttribute("data-purchase-week-label") === sleeveId);
          if (label) label.textContent = formatPurchaseWeekLabel(selectedDate);
          window.common.updateMyCollectionPurchaseWeek(sleeveId, selectedDate);
        });
      });
    }

    async function main() {
      await window.common.setupDashboardChrome({ sidebarActive: "collection", topbarActive: "collection" });
      setupAssetPeriodButtons();
      await renderCollection();
      document.addEventListener("pokesuri:my-collection-change", () => renderCollection());
      let resizeTimer = 0;
      window.addEventListener("resize", () => {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(() => renderAssetChart(currentAssetTimeline), 120);
      });
    }

    document.addEventListener("DOMContentLoaded", () => main());
  </script>
</body>

</html>
