  <script src="./assets/common.js?v=20260806a"></script>
  <script>
    const ACCESS_RANKING_ENDPOINT = window.GAS_URL || "";
    const ACCESS_RANKING_CACHE_KEY = "home_access_ranking_cache_v2";
    const ACCESS_RANKING_CACHE_TTL_MS = 5 * 60 * 1000;

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function toISODate(d) {
      const dd = new Date(d);
      if (Number.isNaN(dd.getTime())) return null;
      const y = dd.getFullYear();
      const m = String(dd.getMonth() + 1).padStart(2, "0");
      const day = String(dd.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function isLegacyMonthlyRow(weekISO) {
      return String(weekISO || "").slice(-2) === "01" && String(weekISO || "") < "2026-01-01";
    }

    function numOrNull(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    async function fetchRankingJsonWithTimeout(url, { timeoutMs = 12000, cacheMode = "default" } = {}) {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, {
          cache: cacheMode,
          signal: controller.signal,
          headers: { "Accept": "application/json" }
        });
        if (!res.ok) throw new Error(`Data fetch failed (HTTP ${res.status})`);
        return await res.json();
      } catch (e) {
        if (e && e.name === "AbortError") throw new Error("Data fetch timed out. Please try again later.");
        throw e;
      } finally {
        clearTimeout(t);
      }
    }

    function normalizeSleeveDataId(id) {
      const sleeveId = String(id || "").trim();
      if (/^4521329\d{6,7}$/.test(sleeveId)) return sleeveId.slice(7);
      return sleeveId;
    }

    function getSleeveIdFromAccessRankingItem(item) {
      const direct = item?.sleeveId ?? item?.sleeve_id ?? item?.id ?? item?.itemId ?? item?.item_id;
      const directId = normalizeSleeveDataId(direct);
      if (directId) return directId;

      const source = String(item?.page || item?.url || item?.path || item?.href || "").trim();
      if (!source) return "";
      try {
        const url = source.startsWith("http") ? new URL(source) : new URL(source, location.origin);
        const segments = url.pathname.split("/").filter(Boolean);
        const sleeveIndex = segments.findIndex((segment) => segment === "sleeve");
        if (sleeveIndex >= 0 && sleeveIndex < segments.length - 1) {
          return normalizeSleeveDataId(decodeURIComponent(segments[sleeveIndex + 1] || ""));
        }
        const queryId = url.searchParams.get("id") || url.searchParams.get("sleeveId");
        return normalizeSleeveDataId(queryId);
      } catch (_) {
        const match = source.match(/(?:^|\/)sleeve\/([^/?#]+)/);
        return match ? normalizeSleeveDataId(decodeURIComponent(match[1])) : "";
      }
    }

    function getAccessCountFromRankingItem(item) {
      const value = item?.access ?? item?.count ?? item?.views ?? item?.pv ?? item?.pageviews ?? item?.accessCount ?? item?.access_count;
      const n = Number(value);
      return Number.isFinite(n) && n > 0 ? n : 0;
    }

    function normalizeAccessRankingResponse(data) {
      const source = Array.isArray(data?.ranking)
        ? data.ranking
        : Array.isArray(data?.rows)
          ? data.rows
          : Array.isArray(data?.items)
            ? data.items
            : Array.isArray(data)
              ? data
              : [];
      const byId = new Map();
      for (const item of source) {
        const id = getSleeveIdFromAccessRankingItem(item);
        if (!id) continue;
        const access = getAccessCountFromRankingItem(item);
        if (access <= 0) continue;
        byId.set(id, (byId.get(id) || 0) + access);
      }
      return Array.from(byId.entries()).map(([id, access]) => ({ id, access }));
    }

    async function loadAccessRanking() {
      try {
        const raw = sessionStorage.getItem(ACCESS_RANKING_CACHE_KEY);
        if (raw) {
          const cached = JSON.parse(raw);
          if (cached && Array.isArray(cached.data) && Number.isFinite(cached.fetchedAt) && (Date.now() - cached.fetchedAt) < ACCESS_RANKING_CACHE_TTL_MS) {
            return normalizeAccessRankingResponse(cached.data);
          }
        }
      } catch (_) {}
      if (!ACCESS_RANKING_ENDPOINT) return [];
      try {
        const data = await fetchRankingJsonWithTimeout(`${ACCESS_RANKING_ENDPOINT}?mode=ranking`, { timeoutMs: 10000, cacheMode: "no-store" });
        const list = normalizeAccessRankingResponse(data);
        try { sessionStorage.setItem(ACCESS_RANKING_CACHE_KEY, JSON.stringify({ fetchedAt: Date.now(), data: list })); } catch (_) {}
        return list;
      } catch (_) {
        return [];
      }
    }
    async function loadHomePrimaryData() {
      return await window.common.loadData();
    }

    const HOME_ARTICLE_LOCAL_KEY = "pokeSleeve:articles:local:v1";

    function formatHomeArticleDate(value) {
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return "";
      return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
    }

    function normalizeHomeArticle(article) {
      if (!article || typeof article !== "object") return null;
      const slug = String(article.slug || article.id || "").trim();
      const title = String(article.title || "").trim();
      if (!slug || !title || String(article.status || "published") === "draft") return null;
      return {
        slug,
        title,
        excerpt: String(article.excerpt || "").trim(),
        category: String(article.category || "記事").trim(),
        linkUrl: String(article.linkUrl || "").trim(),
        publishedAt: String(article.publishedAt || article.updatedAt || "").trim()
      };
    }

    async function loadHomeArticles() {
      let fileArticles = [];
      try {
        const res = await fetch("./articles.json", { cache: "reload", headers: { "Accept": "application/json" } });
        if (res.ok) {
          const data = await res.json();
          fileArticles = Array.isArray(data?.articles) ? data.articles : [];
        }
      } catch (_) {}
      let localArticles = [];
      try {
        if (window.common?.readLocalArticles) {
          localArticles = await window.common.readLocalArticles(HOME_ARTICLE_LOCAL_KEY);
        } else {
          const raw = localStorage.getItem(HOME_ARTICLE_LOCAL_KEY);
          const data = raw ? JSON.parse(raw) : [];
          localArticles = Array.isArray(data) ? data : [];
        }
      } catch (_) {}
      const map = new Map();
      [...fileArticles, ...localArticles].forEach((item) => {
        const article = normalizeHomeArticle(item);
        if (article) map.set(article.slug, article);
      });
      return Array.from(map.values()).sort((a, b) => String(b.publishedAt).localeCompare(String(a.publishedAt))).slice(0, 3);
    }

    function renderHomeArticles(articles) {
      const el = document.getElementById("homeArticleGrid");
      if (!el) return;
      if (!articles.length) {
        el.innerHTML = `<div class="home-empty">記事はまだありません。</div>`;
        return;
      }
      el.innerHTML = articles.map((article) => `
        <a class="home-article-card" href="${escapeHtml(article.linkUrl || "./article.html?id=" + encodeURIComponent(article.slug))}">
          <div class="home-article-meta">${escapeHtml(article.category)} / ${escapeHtml(formatHomeArticleDate(article.publishedAt))}</div>
          <h3 class="home-article-title">${escapeHtml(article.title)}</h3>
          <p class="home-article-excerpt">${escapeHtml(article.excerpt || "記事を読む")}</p>
        </a>
      `).join("");
    }

    const weeklyPairCache = new WeakMap();

    function getWeeklyPair(sleeve) {
      if (sleeve && typeof sleeve === "object" && weeklyPairCache.has(sleeve)) {
        return weeklyPairCache.get(sleeve);
      }
      const arr = Array.isArray(sleeve?.weeklyPrices) ? sleeve.weeklyPrices : [];
      if (!arr.length) {
        if (sleeve && typeof sleeve === "object") weeklyPairCache.set(sleeve, null);
        return null;
      }
      const map = new Map();
      for (const row of arr) {
        const weekISO = toISODate(row?.week);
        if (weekISO && isLegacyMonthlyRow(weekISO)) continue;
        const price = numOrNull(row?.price);
        const count = numOrNull(row?.count);
        const hasTrade = count == null ? (price != null) : (count > 0 && price != null);
        if (!weekISO || !hasTrade) continue;
        map.set(weekISO, { week: weekISO, price, count });
      }
      if (!map.size) {
        if (sleeve && typeof sleeve === "object") weeklyPairCache.set(sleeve, null);
        return null;
      }
      const sorted = Array.from(map.values()).sort((a, b) => a.week.localeCompare(b.week));
      const pair = { latest: sorted[sorted.length - 1], prev: sorted.length >= 2 ? sorted[sorted.length - 2] : null, sorted };
      if (sleeve && typeof sleeve === "object") weeklyPairCache.set(sleeve, pair);
      return pair;
    }

    function buildRankingSparkline(sleeve) {
      const pair = getWeeklyPair(sleeve);
      const points = Array.isArray(pair?.sorted) ? pair.sorted.slice(-6) : [];
      if (points.length < 2) return "";
      const prices = points.map((row) => numOrNull(row?.price)).filter((value) => value != null);
      if (prices.length < 2) return "";
      const min = Math.min(...prices);
      const max = Math.max(...prices);
      const range = Math.max(max - min, 1);
      const chartPoints = prices.map((price, index) => {
        const x = (index / (prices.length - 1)) * 72;
        const y = 24 - (((price - min) / range) * 20);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
      const upColor = prices[prices.length - 1] >= prices[0];
      const stroke = upColor ? "#059669" : "#dc2626";
      return `<span class="movers-sparkline" aria-hidden="true"><svg viewBox="0 0 72 28" fill="none" xmlns="http://www.w3.org/2000/svg"><polyline points="${chartPoints}" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${((prices.length - 1) / (prices.length - 1) * 72).toFixed(1)}" cy="${(24 - (((prices[prices.length - 1] - min) / range) * 20)).toFixed(1)}" r="3" fill="${stroke}"/></svg></span>`;
    }

    function buildSpotlightSparkline(sleeve) {
      const pair = getWeeklyPair(sleeve);
      const points = Array.isArray(pair?.sorted) ? pair.sorted.slice(-8) : [];
      const prices = points.map((row) => numOrNull(row?.price)).filter((value) => value != null && value > 0);
      if (prices.length < 2) {
        return `<span class="spotlight-sparkline spotlight-sparkline--empty" aria-label="price trend unavailable"><span class="spotlight-sparkline-empty">&#25512;&#31227;&#12394;&#12375;</span></span>`;
      }

      const width = 86;
      const height = 36;
      const padX = 5;
      const padY = 5;
      const min = Math.min(...prices);
      const max = Math.max(...prices);
      const range = Math.max(max - min, 1);
      const step = (width - padX * 2) / Math.max(1, prices.length - 1);
      const chartPoints = prices.map((price, index) => {
        const x = padX + (step * index);
        const y = height - padY - (((price - min) / range) * (height - padY * 2));
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
      const firstX = padX.toFixed(1);
      const lastX = (padX + (step * (prices.length - 1))).toFixed(1);
      const areaPoints = `${firstX},${height - padY} ${chartPoints} ${lastX},${height - padY}`;

      return `<span class="spotlight-sparkline" aria-label="recent ${prices.length} week price trend"><svg viewBox="0 0 ${width} ${height}" focusable="false" aria-hidden="true" preserveAspectRatio="none"><line class="spotlight-sparkline-grid" x1="${padX}" y1="${height - padY}" x2="${width - padX}" y2="${height - padY}"></line><polygon class="spotlight-sparkline-area" points="${areaPoints}"></polygon><polyline class="spotlight-sparkline-line" points="${chartPoints}"></polyline></svg></span>`;
    }

    function getLatestWeeklyPrice(sleeve) {
      const pair = getWeeklyPair(sleeve);
      return pair ? pair.latest.price : null;
    }

    function getGlobalLatestTradeWeek(sleeves) {
      let maxWeek = null;
      for (const sleeve of (Array.isArray(sleeves) ? sleeves : [])) {
        const pair = getWeeklyPair(sleeve);
        if (!pair) continue;
        const week = String(pair.latest.week || "");
        if (!week) continue;
        if (!maxWeek || week > maxWeek) maxWeek = week;
      }
      return maxWeek;
    }

    function getTotalTradeCount(sleeve) {
      const arr = Array.isArray(sleeve?.weeklyPrices) ? sleeve.weeklyPrices : [];
      let total = 0;
      let hasValue = false;
      for (const row of arr) {
        const count = numOrNull(row?.count);
        if (Number.isFinite(count) && count > 0) { total += count; hasValue = true; }
      }
      return hasValue ? total : null;
    }

    function isoToDate(iso) {
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function addDays(iso, days) {
      const d = isoToDate(iso);
      if (!d) return null;
      d.setDate(d.getDate() + days);
      return toISODate(d);
    }

    function getPriceAtOrBefore(sorted, targetISO) {
      if (!Array.isArray(sorted) || !sorted.length) return null;
      for (let i = sorted.length - 1; i >= 0; i--) {
        if (sorted[i].week <= targetISO) return sorted[i];
      }
      return null;
    }

    function get30dGrowth(sleeve, latestWeek = null) {
      const pair = getWeeklyPair(sleeve);
      if (!pair) return null;
      const base = getPriceAtOrBefore(pair.sorted, addDays(pair.latest.week, -30));
      if (!base || !Number.isFinite(base.price) || base.price === 0) return null;
      const diff = pair.latest.price - base.price;
      const rate = (diff / base.price) * 100;
      if (!Number.isFinite(rate)) return null;
      return { latest: pair.latest, base, diff, rate };
    }

    function collectWeeklyRows(sleeve) {
      return (Array.isArray(sleeve?.weeklyPrices) ? sleeve.weeklyPrices : [])
        .map((x) => {
          const week = toISODate(x?.week);
          const price = numOrNull(x?.price);
          const count = numOrNull(x?.count);
          if (!week || !(price > 0) || !Number.isFinite(count) || isLegacyMonthlyRow(week)) return null;
          return { week, price, count };
        })
        .filter(Boolean)
        .sort((a, b) => String(a.week).localeCompare(String(b.week)));
    }

    function collectIndexWeeks(sleeves) {
      const set = new Set();
      for (const s of (Array.isArray(sleeves) ? sleeves : [])) {
        for (const row of collectWeeklyRows(s)) set.add(row.week);
      }
      return Array.from(set).sort((a, b) => String(a).localeCompare(String(b)));
    }

    function buildHomeMarketIndexSeries(sleeves) {
      const weeks = collectIndexWeeks(sleeves);
      if (weeks.length < 2) return [];
      const sleeveMaps = sleeves.map((s) => {
        const map = new Map();
        for (const row of collectWeeklyRows(s)) map.set(row.week, row);
        return map;
      });
      const minPrice = 300;
      const minCount = 2;
      const weightCap = 20;
      const hardLo = -Math.log(2.5);
      const hardHi = Math.log(2.5);
      let index = null;
      const out = [];
      for (let i = 1; i < weeks.length; i++) {
        const prev = weeks[i - 1];
        const cur = weeks[i];
        let sw = 0;
        let swr = 0;
        for (const map of sleeveMaps) {
          const p = map.get(prev);
          const c = map.get(cur);
          if (!p || !c) continue;
          if (!(p.price > 0 && c.price > 0) || p.price < minPrice) continue;
          if (!(p.count >= minCount && c.count >= minCount)) continue;
          let logR = Math.log(c.price / p.price);
          logR = Math.max(hardLo, Math.min(hardHi, logR));
          const w = Math.min(Math.sqrt(p.count * c.count), weightCap);
          if (!(w > 0)) continue;
          sw += w;
          swr += w * logR;
        }
        if (sw <= 0) continue;
        const avgLogR = swr / sw;
        index = index == null ? 100 : index * Math.exp(avgLogR);
        out.push({ week: cur, index, rate: (Math.exp(avgLogR) - 1) * 100 });
      }
      return out;
    }
    function getDetailHref(sleeveId) {
      if (window.common && typeof window.common.buildSleeveDetailHref === "function") return window.common.buildSleeveDetailHref(sleeveId ?? "");

    function normalizeHomeSearchText(value) {
      return String(value ?? "")
        .normalize("NFKC")

        .replace(/\s+/g, "")
        .replace(/[‐‑‒–—―ーｰ\-_.・･]/g, "");
    }

    function getHomeSleeveSearchText(sleeve) {
      const parts = [
        sleeve?.name,
        sleeve?.id,
        sleeve?.series,
        sleeve?.type,
        sleeve?.feature,
        sleeve?.illustrator,
        sleeve?.acquisitionType,
        ...(Array.isArray(sleeve?.categories) ? sleeve.categories : []),
        ...(Array.isArray(sleeve?.pokemonCategories) ? sleeve.pokemonCategories : []),
        ...(Array.isArray(sleeve?.trainerCategories) ? sleeve.trainerCategories : []),
        ...(Array.isArray(sleeve?.categoryTags) ? sleeve.categoryTags : [])
      ];
      return normalizeHomeSearchText(parts.filter(Boolean).join(" "));
    }

    function findHomeSleevesByText(sleeves, query, limit = 8) {
      const q = normalizeHomeSearchText(query);
      if (!q) return [];
      const starts = [];
      const contains = [];
      for (const sleeve of Array.isArray(sleeves) ? sleeves : []) {
        const name = String(sleeve?.name || "").trim();
        const id = String(sleeve?.id || "").trim();
        if (!name || !id) continue;
        const nameKey = normalizeHomeSearchText(name);
        const haystack = getHomeSleeveSearchText(sleeve);
        if (!haystack.includes(q)) continue;
        const row = { sleeve, score: nameKey.startsWith(q) ? 0 : haystack.indexOf(q) + 1 };
        if (nameKey.startsWith(q)) starts.push(row);
        else contains.push(row);
      }
      starts.sort((a, b) => String(a.sleeve.name || "").length - String(b.sleeve.name || "").length);
      contains.sort((a, b) => a.score - b.score);
      return starts.concat(contains).slice(0, limit).map((row) => row.sleeve);
    }

    function loadImageForProfile(src, timeoutMs = 4500) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const timer = setTimeout(() => {
          img.onload = null;
          img.onerror = null;
          reject(new Error("image timeout"));
        }, timeoutMs);
        img.crossOrigin = "anonymous";
        img.referrerPolicy = "no-referrer";
        img.onload = () => {
          clearTimeout(timer);
          resolve(img);
        };
        img.onerror = () => {
          clearTimeout(timer);
          reject(new Error("image load failed"));
        };
        img.src = src;
      });
    }

    function buildImageColorProfile(image) {
      const size = 12;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      if (!ctx) return null;
      ctx.drawImage(image, 0, 0, size, size);
      const data = ctx.getImageData(0, 0, size, size).data;
      const vector = [];
      for (let y = 0; y < size; y += 3) {
        for (let x = 0; x < size; x += 3) {
          let r = 0;
          let g = 0;
          let b = 0;
          let count = 0;
          for (let yy = y; yy < y + 3; yy += 1) {
            for (let xx = x; xx < x + 3; xx += 1) {
              const i = (yy * size + xx) * 4;
              r += data[i];
              g += data[i + 1];
              b += data[i + 2];
              count += 1;
            }
          }
          vector.push(r / count / 255, g / count / 255, b / count / 255);
        }
      }
      return vector;
    }

    function getImageProfileDistance(a, b) {
      if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return Infinity;
      let sum = 0;
      for (let i = 0; i < a.length; i += 1) {
        const d = a[i] - b[i];
        sum += d * d;
      }
      return Math.sqrt(sum / a.length);
    }

    async function getImageProfileFromFile(file) {
      const objectUrl = URL.createObjectURL(file);
      try {
        const img = await loadImageForProfile(objectUrl, 3000);
        return buildImageColorProfile(img);
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    }

    const homeImageProfileCache = new Map();
    async function getImageProfileFromUrl(url) {
      const key = String(url || "").trim();
      if (!key) return null;
      if (homeImageProfileCache.has(key)) return homeImageProfileCache.get(key);
      try {
        const img = await loadImageForProfile(key, 3200);
        const profile = buildImageColorProfile(img);
        homeImageProfileCache.set(key, profile);
        return profile;
      } catch (_) {
        homeImageProfileCache.set(key, null);
        return null;
      }
    }

    async function runHomeImageSearch(sleeves, file) {
      const preview = document.getElementById("homeSleeveSearchPreview");
      const previewImg = document.getElementById("homeSleeveSearchPreviewImage");
      const statusEl = document.getElementById("homeSleeveSearchStatus");
      const input = document.getElementById("homeSleeveSearchInput");
      if (!file || !preview || !previewImg || !statusEl) return;

      const previewUrl = URL.createObjectURL(file);
      previewImg.src = previewUrl;
      preview.hidden = false;
      statusEl.textContent = "画像から候補を探しています...";
      renderHomeSleeveSearchResults([]);

      let targetProfile = null;
      try {
        targetProfile = await getImageProfileFromFile(file);
      } catch (_) {
        targetProfile = null;
      }

      const filenameQuery = String(file.name || "").replace(/\.[^.]+$/, "");
      if (!targetProfile) {
        const fallback = findHomeSleevesByText(sleeves, filenameQuery, 8);
        if (input && filenameQuery) input.value = filenameQuery;
        renderHomeSleeveSearchResults(fallback, "画像を読み取れませんでした。ファイル名に近い候補を表示しています。");
        return;
      }

      const catalog = (Array.isArray(sleeves) ? sleeves : [])
        .filter((sleeve) => String(sleeve?.id || "").trim() && String(sleeve?.imageUrl || "").trim());
      const scores = [];
      let cursor = 0;
      const workerCount = Math.min(8, catalog.length);
      const worker = async () => {
        while (cursor < catalog.length) {
          const sleeve = catalog[cursor];
          cursor += 1;
          const profile = await getImageProfileFromUrl(String(sleeve.imageUrl || ""));
          if (!profile) continue;
          scores.push({ sleeve, distance: getImageProfileDistance(targetProfile, profile) });
        }
      };
      await Promise.all(Array.from({ length: workerCount }, worker));

      scores.sort((a, b) => a.distance - b.distance);
      const visualResults = scores.slice(0, 8).map((row) => row.sleeve);
      if (visualResults.length) {
        renderHomeSleeveSearchResults(visualResults, "画像の見た目が近い候補を表示しています。");
        return;
      }
      const fallback = findHomeSleevesByText(sleeves, filenameQuery, 8);
      if (input && filenameQuery) input.value = filenameQuery;
      renderHomeSleeveSearchResults(fallback, "画像照合に使えるサムネイルが少なかったため、名前検索も試してください。");
    }

    function buildReleaseBannerRows(sleeves) {

        .map((sleeve) => ({
          sleeve,

        }));
      const latestReleaseTime = Math.max(
        ...withDates.map((row) => row.releaseTime).filter((time) => time != null)
      );
      const cutoff = Number.isFinite(latestReleaseTime) ? latestReleaseTime - (180 * 24 * 60 * 60 * 1000) : null;
      return withDates
        .filter((row) => row.tagged || (cutoff != null && row.releaseTime != null && row.releaseTime >= cutoff))
        .sort((a, b) => {

    function getCenteredReleaseBannerIndex(track) {
      const cards = Array.from(track.querySelectorAll(".release-feature-card"));
      if (!cards.length) return 0;
      const trackRect = track.getBoundingClientRect();
      const center = trackRect.left + trackRect.width / 2;
      let bestIndex = 0;
      let bestDistance = Infinity;
      cards.forEach((card, index) => {
        const rect = card.getBoundingClientRect();
        const cardCenter = rect.left + rect.width / 2;
        const distance = Math.abs(cardCenter - center);
        if (distance < bestDistance) {
          bestDistance = distance;
          bestIndex = index;
        }
      });
      return bestIndex;
    }

    function updateReleaseBannerDots(track) {
      const loopSize = Number(track?.dataset?.loopSize || 0);
      if (!track || !loopSize) return;
      const centeredIndex = getCenteredReleaseBannerIndex(track);
      const activeIndex = ((centeredIndex % loopSize) + loopSize) % loopSize;
      const dots = document.querySelectorAll("#releaseBannerDots .release-banner-dot");
      dots.forEach((dot, index) => dot.classList.toggle("is-active", index === activeIndex));
    }

    function normalizeReleaseBannerLoop(track) {
      const loopSize = Number(track?.dataset?.loopSize || 0);
      if (!track || !loopSize) return;
      const cards = Array.from(track.querySelectorAll(".release-feature-card"));
      if (cards.length < loopSize * 3) return;
      const centeredIndex = getCenteredReleaseBannerIndex(track);
      let targetIndex = centeredIndex;
      if (centeredIndex < loopSize) targetIndex = centeredIndex + loopSize;
      if (centeredIndex >= loopSize * 2) targetIndex = centeredIndex - loopSize;
      if (targetIndex === centeredIndex) return;
      const before = track.scrollLeft;
      cards[targetIndex].scrollIntoView({ inline: "center", block: "nearest" });
      track.scrollLeft = track.scrollLeft;
      if (Math.abs(track.scrollLeft - before) < 1) cards[targetIndex].scrollIntoView({ inline: "center", block: "nearest" });
    }

    function formatPercent(rate, digits = 1) {
      if (!Number.isFinite(rate)) return "—";
      const sign = rate > 0 ? "+" : rate < 0 ? "-" : "±";
      return `${sign}${Math.abs(rate).toFixed(digits)}%`;
    }

    function getDeltaClass(rate) {
      if (!Number.isFinite(rate) || rate === 0) return "flat";
      return rate > 0 ? "up" : "down";
    }

    function buildSparklinePoints(values, width = 320, height = 120) {
      if (!Array.isArray(values) || !values.length) return "";
      const min = Math.min(...values);
      const max = Math.max(...values);
      return values.map((value, index) => {
        const x = values.length === 1 ? 0 : (index / (values.length - 1)) * width;
        const y = max === min ? height / 2 : height - ((value - min) / (max - min)) * height;
        return `${x},${y}`;
      }).join(" ");
    }

    function buildMarketStats(sleeves, marketSeries) {
      const latestWeek = getGlobalLatestTradeWeek(sleeves);
      const activeRows = [];
      for (const sleeve of sleeves) {
        const pair = getWeeklyPair(sleeve);
        if (!pair || !latestWeek || pair.latest.week !== latestWeek) continue;
        const latestCount = numOrNull(pair.latest.count);
        const rate = pair.prev?.price ? ((pair.latest.price - pair.prev.price) / pair.prev.price) * 100 : null;
        activeRows.push({ sleeve, pair, latestCount, rate });
      }
      const activeCount = activeRows.length;
      const risingCount = activeRows.filter((row) => Number.isFinite(row.rate) && row.rate > 0).length;
      const volume = activeRows.reduce((sum, row) => sum + (Number.isFinite(row.latestCount) ? row.latestCount : 0), 0);
      const tradeValue = activeRows.reduce((sum, row) => sum + ((Number.isFinite(row.latestCount) ? row.latestCount : 0) * Number(row.pair?.latest?.price || 0)), 0);
      const avgPrice = activeRows.length
        ? activeRows.reduce((sum, row) => sum + Number(row.pair?.latest?.price || 0), 0) / activeRows.length
        : 0;
      const topVolume = activeRows
        .filter((row) => Number.isFinite(row.latestCount) && row.latestCount > 0)
        .sort((a, b) => b.latestCount - a.latestCount)
        .slice(0, 3);
      const latestIndex = marketSeries.length ? marketSeries[marketSeries.length - 1] : null;
      const sentimentScore = Math.max(12, Math.min(96, Math.round(50 + ((latestIndex?.rate || 0) * 6) + ((risingCount / Math.max(activeCount, 1)) * 28))));
      return { latestWeek, activeCount, risingCount, volume, tradeValue, avgPrice, topVolume, latestIndex, sentimentScore };
    }

    function getSentimentProfile(stats) {
      const score = Number(stats?.sentimentScore || 0);
      if (score >= 72) return { label: "強気", state: "strong_up" };
      if (score >= 58) return { label: "やや強気", state: "up" };
      if (score <= 28) return { label: "弱気", state: "down" };
      if (score <= 42) return { label: "やや弱気", state: "soft_down" };
      return { label: "中立", state: "flat" };
    }

      up: "スリーブ相場は堅調です。指数は前週比で上昇しており、全体として価格が上向きやすい流れです。幅広い価格帯で底堅さが見られます。",
      volume_up: "スリーブ相場では売買が活発です。指数の動きはまだ大きくないものの、値上がりスリーブの広がりが見られます。価格上昇の前段階として取引の熱量が高まっている可能性があります。",
      flat: "スリーブ相場は横ばい圏です。指数の変動は限られており、全体としては落ち着いた推移です。足元ではスリーブごとの差が出やすい状態です。",

      down: "スリーブ相場は下落基調です。指数は前週比で大きく下がっており、全体として慎重な値動きになっています。短期的には様子見が増えやすいタイミングです。"
    });

    function classifyMarketState(stats) {
      const rate = Number(stats?.latestIndex?.rate);
      const activeCount = Number(stats?.activeCount || 0);
      const risingCount = Number(stats?.risingCount || 0);
      const ratio = activeCount > 0 ? (risingCount / activeCount) : 0;

      if (Number.isFinite(rate) && rate >= 2.0 && ratio >= 0.55) return "strong_up";
      if (Number.isFinite(rate) && rate <= -2.0) return "down";
      if (Number.isFinite(rate) && rate >= 0.8 && ratio >= 0.45) return "up";
      if (Number.isFinite(rate) && rate <= -0.8) return "soft_down";
      if (Number.isFinite(rate) && rate > -0.8 && rate < 0.8 && ratio >= 0.45) return "volume_up";
      return "flat";
    }

    function buildMarketCommentAddon(stats) {
      const activeCount = Number(stats?.activeCount || 0);
      const risingCount = Number(stats?.risingCount || 0);
      const ratio = activeCount > 0 ? (risingCount / activeCount) : 0;
      const volume = Number(stats?.volume || 0);
      const tradeValue = Number(stats?.tradeValue || 0);
      const avgPrice = Number(stats?.avgPrice || 0);

      if (ratio >= 0.6) {
        return "値上がりしているスリーブの裾野が広く、相場全体に動きが広がっています。";
      }
      if (ratio <= 0.3 && activeCount > 0) {
        return "一部の人気スリーブを除くと、全体にはやや弱さが残っています。";
      }
      if (volume >= 45) {
        return "取引件数が多く、売買の回転が活発です。";
      }
      if (tradeValue >= 180000) {
        return "高額帯を含めた成約があり、取引総額も大きめです。";
      }
      if (avgPrice >= 3500) {
        return "高額帯スリーブの成約が平均価格を押し上げています。";
      }
      return "";
    }

      const state = getSentimentProfile(stats).state || classifyMarketState(stats);
      const base = MARKET_COMMENT_TEMPLATES[state] || MARKET_COMMENT_TEMPLATES.flat;
      const addon = buildMarketCommentAddon(stats);

    function initScrollReveal() {
      const nodes = Array.from(document.querySelectorAll(".reveal-on-scroll"));
      if (!nodes.length) return;
      if (!("IntersectionObserver" in window)) {
        nodes.forEach((node) => node.classList.add("is-visible"));
        return;
      }
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add("is-visible");
          observer.unobserve(entry.target);
        });
      }, { threshold: 0.15, rootMargin: "0px 0px -40px 0px" });
      nodes.forEach((node) => observer.observe(node));
    }

    function wireSidebarCategoryToggle() {
      const shell = document.getElementById("sidebarCategoryShell");
      const button = document.getElementById("sidebarCategoryToggle");
      const panel = document.getElementById("categoryNav");
      const list = panel ? panel.querySelector(".category-nav-list") : null;
      if (!shell || !button || !panel || !list || button.dataset.sidebarCategoryWired === "1") return;
      button.dataset.sidebarCategoryWired = "1";

      const setOpen = (open) => {
        shell.classList.toggle("is-open", open);
        button.setAttribute("aria-expanded", open ? "true" : "false");
        panel.hidden = !open;
      };

      const syncVisibility = () => {
        const hasItems = !!list.querySelector(".category-nav-item");
        shell.hidden = !hasItems;
        if (!hasItems) setOpen(false);
      };

      button.addEventListener("click", () => {
        if (shell.hidden) return;
        setOpen(!shell.classList.contains("is-open"));
      });

      document.addEventListener("click", (event) => {
        if (!(event.target instanceof Node)) return;
        if (shell.contains(event.target)) return;
        setOpen(false);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") setOpen(false);
      });

      const observer = new MutationObserver(syncVisibility);
      observer.observe(list, { childList: true, subtree: true });
      syncVisibility();
    }

        return { s, pair, diff };
      }).filter(Boolean).sort((a, b) => b.diff - a.diff).slice(0, 10);
      const growthRank = sleeves.map((s) => {
        const g = get30dGrowth(s, latestWeek);
        return g ? { s, g } : null;
      }).filter(Boolean).sort((a, b) => b.g.rate - a.g.rate).slice(0, 10);

      renderTrendLists({ surgeRank, growthRank, priceRank });
      renderMobileCategoryDiscovery(sleeves);
      initScrollReveal();

      runDeferred(async () => {
        try {
          renderHomeArticles(await loadHomeArticles());
        } catch (_) {
          renderHomeArticles([]);
        }
      });

      runDeferred(() => {
        const marketSeries = buildHomeMarketIndexSeries(sleeves);
        renderMarketSnapshot(marketSeries, sleeves);
      });

      runDeferred(async () => {
        if (window.common && typeof window.common.ensureCategoryNavsRendered === "function") {
          try {
            await window.common.ensureCategoryNavsRendered(sleeves);
          } catch (_) {}
        }
      });
    }

    main().catch((error) => {
      console.error(error);
      ["marketSnapshotCard", "marketSentimentCard", "marketStatsGrid", "moversTableBody", "priceTableBody", "growthTableBody"].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = `<div class="home-empty">トップページのデータ読み込みに失敗しました。時間をおいて再度お試しください。</div>`;
      });
      initScrollReveal();
    });
  </script>
</body>

</html>
