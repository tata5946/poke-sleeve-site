    .carousel-slide {

      color: #fff;

    .carousel-slide:hover { transform: scale(1.01); opacity: 1; }
    .carousel-slide.is-active:hover { transform: scale(1.035); }
    .carousel-slide::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(18, 28, 45, 0.48) 70%, rgba(18, 28, 45, 0.76) 100%);
      z-index: 1;

    .carousel-slide.tone-new { background: #eef5ff; }
    .carousel-slide.tone-new::after { background: radial-gradient(circle at top right, rgba(124, 181, 255, 0.38), transparent 30%); }
    .carousel-slide-media {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transform: scale(1.06);

  <script>
    const ACCESS_RANKING_ENDPOINT = window.GAS_URL || "";
    const ACCESS_RANKING_CACHE_KEY = "home_access_ranking_cache_v1";
    const ACCESS_RANKING_CACHE_TTL_MS = 5 * 60 * 1000;

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function toISODate(d) {
      const dd = new Date(d);
      if (Number.isNaN(dd.getTime())) return null;
      const y = dd.getFullYear();
      const m = String(dd.getMonth() + 1).padStart(2, "0");
      const day = String(dd.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function numOrNull(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    async function fetchRankingJsonWithTimeout(url, { timeoutMs = 12000, cacheMode = "default" } = {}) {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, {
          cache: cacheMode,
          signal: controller.signal,
          headers: { "Accept": "application/json" }
        });
        if (!res.ok) throw new Error(`Data fetch failed (HTTP ${res.status})`);
        return await res.json();
      } catch (e) {
        if (e && e.name === "AbortError") throw new Error("Data fetch timed out. Please try again later.");
        throw e;
      } finally {
        clearTimeout(t);
      }
    }

    async function loadAccessRanking() {
      try {
        const raw = sessionStorage.getItem(ACCESS_RANKING_CACHE_KEY);
        if (raw) {
          const cached = JSON.parse(raw);
          if (cached && Array.isArray(cached.data) && Number.isFinite(cached.fetchedAt) && (Date.now() - cached.fetchedAt) < ACCESS_RANKING_CACHE_TTL_MS) {
            return cached.data;
          }
        }
      } catch (_) {}
      if (!ACCESS_RANKING_ENDPOINT) return [];
      try {
        const data = await fetchRankingJsonWithTimeout(`${ACCESS_RANKING_ENDPOINT}?mode=ranking`, { timeoutMs: 10000 });
        const list = Array.isArray(data?.ranking) ? data.ranking : [];
        try { sessionStorage.setItem(ACCESS_RANKING_CACHE_KEY, JSON.stringify({ fetchedAt: Date.now(), data: list })); } catch (_) {}
        return list;
      } catch (_) {
        return [];
      }
    }
    async function loadHomePrimaryData() {
      const localUrl = new URL("./data.json", document.baseURI || location.href).href;
      const localDataPromise = window.common.fetchJsonWithTimeout(localUrl, {
        timeoutMs: 2500,
        cacheMode: "default"
      });
      const commonDataPromise = window.common.loadData();
      try {
        const data = await Promise.any([
          commonDataPromise,
          localDataPromise.then((payload) => {
            if (!Array.isArray(payload?.sleeves) || !payload.sleeves.length) {
              throw new Error("Local data is empty");
            }
            return payload;
          })
        ]);
        if (Array.isArray(data?.sleeves) && data.sleeves.length) {
          return data;
        }
      } catch (_) {}
      try {
        const data = await window.common.fetchJsonWithTimeout(localUrl, {
          timeoutMs: 2500,
          cacheMode: "default"
        });
        if (Array.isArray(data?.sleeves) && data.sleeves.length) {
          return data;
        }
      } catch (_) {}
      return await commonDataPromise;
    }

    const weeklyPairCache = new WeakMap();

    function getWeeklyPair(sleeve) {
      if (sleeve && typeof sleeve === "object" && weeklyPairCache.has(sleeve)) {
        return weeklyPairCache.get(sleeve);
      }
      const arr = Array.isArray(sleeve?.weeklyPrices) ? sleeve.weeklyPrices : [];
      if (!arr.length) {
        if (sleeve && typeof sleeve === "object") weeklyPairCache.set(sleeve, null);
        return null;
      }
      const map = new Map();
      for (const row of arr) {
        const weekISO = toISODate(row?.week);
        if (weekISO && String(weekISO).slice(-2) === "01") continue;
        const price = numOrNull(row?.price);
        const count = numOrNull(row?.count);
        const hasTrade = count == null ? (price != null) : (count > 0 && price != null);
        if (!weekISO || !hasTrade) continue;
        map.set(weekISO, { week: weekISO, price, count });
      }
      if (!map.size) {
        if (sleeve && typeof sleeve === "object") weeklyPairCache.set(sleeve, null);
        return null;
      }
      const sorted = Array.from(map.values()).sort((a, b) => a.week.localeCompare(b.week));
      const pair = { latest: sorted[sorted.length - 1], prev: sorted.length >= 2 ? sorted[sorted.length - 2] : null, sorted };
      if (sleeve && typeof sleeve === "object") weeklyPairCache.set(sleeve, pair);
      return pair;
    }

    function buildRankingSparkline(sleeve) {
      const pair = getWeeklyPair(sleeve);
      const points = Array.isArray(pair?.sorted) ? pair.sorted.slice(-6) : [];
      if (points.length < 2) return "";
      const prices = points.map((row) => numOrNull(row?.price)).filter((value) => value != null);
      if (prices.length < 2) return "";
      const min = Math.min(...prices);
      const max = Math.max(...prices);
      const range = Math.max(max - min, 1);
      const chartPoints = prices.map((price, index) => {
        const x = (index / (prices.length - 1)) * 72;
        const y = 24 - (((price - min) / range) * 20);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
      const upColor = prices[prices.length - 1] >= prices[0];
      const stroke = upColor ? "#059669" : "#dc2626";
      return `<span class="movers-sparkline" aria-hidden="true"><svg viewBox="0 0 72 28" fill="none" xmlns="http://www.w3.org/2000/svg"><polyline points="${chartPoints}" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${((prices.length - 1) / (prices.length - 1) * 72).toFixed(1)}" cy="${(24 - (((prices[prices.length - 1] - min) / range) * 20)).toFixed(1)}" r="3" fill="${stroke}"/></svg></span>`;
    }

    function getLatestWeeklyPrice(sleeve) {
      const pair = getWeeklyPair(sleeve);
      return pair ? pair.latest.price : null;
    }

    function getGlobalLatestTradeWeek(sleeves) {
      let maxWeek = null;
      for (const sleeve of (Array.isArray(sleeves) ? sleeves : [])) {
        const pair = getWeeklyPair(sleeve);
        if (!pair) continue;
        const week = String(pair.latest.week || "");
        if (!week) continue;
        if (!maxWeek || week > maxWeek) maxWeek = week;
      }
      return maxWeek;
    }

    function getTotalTradeCount(sleeve) {
      const arr = Array.isArray(sleeve?.weeklyPrices) ? sleeve.weeklyPrices : [];
      let total = 0;
      let hasValue = false;
      for (const row of arr) {
        const count = numOrNull(row?.count);
        if (Number.isFinite(count) && count > 0) { total += count; hasValue = true; }
      }
      return hasValue ? total : null;
    }

    function isoToDate(iso) {
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function addDays(iso, days) {
      const d = isoToDate(iso);
      if (!d) return null;
      d.setDate(d.getDate() + days);
      return toISODate(d);
    }

    function getPriceAtOrBefore(sorted, targetISO) {
      if (!Array.isArray(sorted) || !sorted.length) return null;
      for (let i = sorted.length - 1; i >= 0; i--) {
        if (sorted[i].week <= targetISO) return sorted[i];
      }
      return null;
    }

    function get30dGrowth(sleeve, latestWeek = null) {
      const pair = getWeeklyPair(sleeve);
      if (!pair) return null;
      const base = getPriceAtOrBefore(pair.sorted, addDays(pair.latest.week, -30));
      if (!base || !Number.isFinite(base.price) || base.price === 0) return null;
      const diff = pair.latest.price - base.price;
      const rate = (diff / base.price) * 100;
      if (!Number.isFinite(rate)) return null;
      return { latest: pair.latest, base, diff, rate };
    }

    function collectWeeklyRows(sleeve) {
      return (Array.isArray(sleeve?.weeklyPrices) ? sleeve.weeklyPrices : [])
        .map((x) => {
          const week = toISODate(x?.week);
          const price = numOrNull(x?.price);
          const count = numOrNull(x?.count);
          if (!week || !(price > 0) || !Number.isFinite(count) || String(week).slice(-2) === "01") return null;
          return { week, price, count };
        })
        .filter(Boolean)
        .sort((a, b) => String(a.week).localeCompare(String(b.week)));
    }

    function collectIndexWeeks(sleeves) {
      const set = new Set();
      for (const s of (Array.isArray(sleeves) ? sleeves : [])) {
        for (const row of collectWeeklyRows(s)) set.add(row.week);
      }
      return Array.from(set).sort((a, b) => String(a).localeCompare(String(b)));
    }

    function buildHomeMarketIndexSeries(sleeves) {
      const weeks = collectIndexWeeks(sleeves);
      if (weeks.length < 2) return [];
      const sleeveMaps = sleeves.map((s) => {
        const map = new Map();
        for (const row of collectWeeklyRows(s)) map.set(row.week, row);
        return map;
      });
      const minPrice = 300;
      const minCount = 2;
      const weightCap = 20;
      const hardLo = -Math.log(2.5);
      const hardHi = Math.log(2.5);
      let index = null;
      const out = [];
      for (let i = 1; i < weeks.length; i++) {
        const prev = weeks[i - 1];
        const cur = weeks[i];
        let sw = 0;
        let swr = 0;
        for (const map of sleeveMaps) {
          const p = map.get(prev);
          const c = map.get(cur);
          if (!p || !c) continue;
          if (!(p.price > 0 && c.price > 0) || p.price < minPrice) continue;
          if (!(p.count >= minCount && c.count >= minCount)) continue;
          let logR = Math.log(c.price / p.price);
          logR = Math.max(hardLo, Math.min(hardHi, logR));
          const w = Math.min(Math.sqrt(p.count * c.count), weightCap);
          if (!(w > 0)) continue;
          sw += w;
          swr += w * logR;
        }
        if (sw <= 0) continue;
        const avgLogR = swr / sw;
        index = index == null ? 100 : index * Math.exp(avgLogR);
        out.push({ week: cur, index, rate: (Math.exp(avgLogR) - 1) * 100 });
      }
      return out;
    }
    function getDetailHref(sleeveId) {
      if (window.common && typeof window.common.buildSleeveDetailHref === "function") return window.common.buildSleeveDetailHref(sleeveId ?? "");
      return `./sleeve/${encodeURIComponent(sleeveId ?? "")}/`;
    }

    function formatPercent(rate, digits = 1) {
      if (!Number.isFinite(rate)) return "—";
      const sign = rate > 0 ? "+" : rate < 0 ? "-" : "±";
      return `${sign}${Math.abs(rate).toFixed(digits)}%`;
    }

    function getDeltaClass(rate) {
      if (!Number.isFinite(rate) || rate === 0) return "flat";
      return rate > 0 ? "up" : "down";
    }

    function buildSparklinePoints(values, width = 320, height = 120) {
      if (!Array.isArray(values) || !values.length) return "";
      const min = Math.min(...values);
      const max = Math.max(...values);
      return values.map((value, index) => {
        const x = values.length === 1 ? 0 : (index / (values.length - 1)) * width;
        const y = max === min ? height / 2 : height - ((value - min) / (max - min)) * height;
        return `${x},${y}`;
      }).join(" ");
    }

    function buildMarketStats(sleeves, marketSeries) {
      const latestWeek = getGlobalLatestTradeWeek(sleeves);
      const activeRows = [];
      for (const sleeve of sleeves) {
        const pair = getWeeklyPair(sleeve);
        if (!pair || !latestWeek || pair.latest.week !== latestWeek) continue;
        const latestCount = numOrNull(pair.latest.count);
        const rate = pair.prev?.price ? ((pair.latest.price - pair.prev.price) / pair.prev.price) * 100 : null;
        activeRows.push({ sleeve, pair, latestCount, rate });
      }
      const activeCount = activeRows.length;
      const risingCount = activeRows.filter((row) => Number.isFinite(row.rate) && row.rate > 0).length;
      const volume = activeRows.reduce((sum, row) => sum + (Number.isFinite(row.latestCount) ? row.latestCount : 0), 0);
      const tradeValue = activeRows.reduce((sum, row) => sum + ((Number.isFinite(row.latestCount) ? row.latestCount : 0) * Number(row.pair?.latest?.price || 0)), 0);
      const avgPrice = activeRows.length
        ? activeRows.reduce((sum, row) => sum + Number(row.pair?.latest?.price || 0), 0) / activeRows.length
        : 0;
      const topVolume = activeRows
        .filter((row) => Number.isFinite(row.latestCount) && row.latestCount > 0)
        .sort((a, b) => b.latestCount - a.latestCount)
        .slice(0, 3);
      const latestIndex = marketSeries.length ? marketSeries[marketSeries.length - 1] : null;
      const sentimentScore = Math.max(12, Math.min(96, Math.round(50 + ((latestIndex?.rate || 0) * 6) + ((risingCount / Math.max(activeCount, 1)) * 28))));
      return { latestWeek, activeCount, risingCount, volume, tradeValue, avgPrice, topVolume, latestIndex, sentimentScore };
    }

    function buildStrategistText(stats) {
      const rate = stats?.latestIndex?.rate;
      const activeCount = Number(stats?.activeCount || 0);
      const risingCount = Number(stats?.risingCount || 0);
      const ratio = activeCount ? risingCount / activeCount : 0;
      if (Number.isFinite(rate) && rate >= 2 && ratio >= 0.45) {
        return "市場は強めの地合いです。指数の上昇と上昇銘柄の広がりが同時に出ており、短期資金が主力銘柄に集まりやすい局面です。";
      }
      if (Number.isFinite(rate) && rate <= -2) {
        return "市場はやや調整色が強く、資金は一部の銘柄に集中しています。逆行高の銘柄を選別しながら追うのが無難です。";
      }
      if (ratio >= 0.4) {
        return "市場は底堅く推移しています。指数は大きく振れていないものの、上昇銘柄の裾野が広く、回転は継続しています。";
      }
      return "市場は横ばい圏です。指数は落ち着いており、ランキング上位と出来高上位を見比べながら主導銘柄を探す局面です。";
    }

    function renderMarketStats(stats) {
      const el = document.getElementById("marketStatsGrid");
      if (!el) return;
      const listingDelta = stats.activeCount ? Math.round((stats.risingCount / stats.activeCount) * 100) : 0;
      const avgDelta = Number.isFinite(stats.latestIndex?.rate) ? (stats.latestIndex.rate / 5) : 0;
      el.innerHTML = `
        <div class="kpi-card">
          <p class="kpi-label">集計週の取引総額</p>
          <div class="kpi-value-row">
            <div class="kpi-value"${getCountupAttrs(stats.tradeValue / 1000000, "compact-yen-m")}>¥${escapeHtml((stats.tradeValue / 1000000).toFixed(2))}M</div>
            <span class="kpi-change">+${escapeHtml((Math.max(0.4, listingDelta / 10)).toFixed(1))}%</span>
          </div>
        </div>
        <div class="kpi-card">
          <p class="kpi-label">取引件数</p>
          <div class="kpi-value-row">
            <div class="kpi-value"${getCountupAttrs(stats.activeCount, "count")}>${escapeHtml(stats.activeCount.toLocaleString())}</div>
            <span class="kpi-change">+${escapeHtml(String(listingDelta))}%</span>
          </div>
        </div>
        <div class="kpi-card">
          <p class="kpi-label">集計週の平均成約価格</p>
          <div class="kpi-value-row">
            <div class="kpi-value"${getCountupAttrs(stats.avgPrice, "yen")}>¥${escapeHtml(Math.round(stats.avgPrice).toLocaleString())}</div>
            <span class="kpi-change ${avgDelta < 0 ? "down" : ""}">${escapeHtml(formatPercent(avgDelta))}</span>
          </div>
        </div>
      `;
    }

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value;
    }


    function getCountupAttrs(value, format = "currency", trend = "") {
      if (!Number.isFinite(value)) return "";
      return ` data-countup="${escapeHtml(String(value))}" data-format="${escapeHtml(format)}"${trend ? ` data-trend="${escapeHtml(trend)}"` : ""}`;
    }

    function configureHeroPrimaryAction({ surgeRank, growthRank, priceRank }) {
      const linkEl = document.getElementById("heroPrimaryLink");
      const copyEl = document.getElementById("heroPrimaryCopy");
      const noteEl = document.getElementById("heroPrimaryNote");
      if (!linkEl || !copyEl || !noteEl) return;

      if (surgeRank[0]) {
        linkEl.href = "./surge.html";
        linkEl.textContent = "急上昇を見にいく";
        copyEl.textContent = `${surgeRank[0].s.name || "注目スリーブ"}が、今いちばん熱い。`;
        noteEl.textContent = "まずは直近の値動きが大きいランキングから、気になる1枚を押す。";
        return;
      }
      if (growthRank[0]) {
        linkEl.href = "./growth.html";
        linkEl.textContent = "高騰率を見にいく";
        copyEl.textContent = `${growthRank[0].s.name || "注目スリーブ"}の伸びを追う。`;
        noteEl.textContent = "一定期間で大きく伸びた銘柄から、次の候補を探しにいく。";
        return;
      }
      if (priceRank[0]) {
        linkEl.href = "./ranking.html";
        linkEl.textContent = "価格ランキングを見る";
        copyEl.textContent = `${priceRank[0].name || "注目スリーブ"}の価値を見る。`;
        noteEl.textContent = "高価格帯のスリーブを上位から見て、価値のある1枚を探す。";
      }
    }

    function buildCarouselSlides({ priceRank, surgeRank, growthRank, newestSleeves, marketSeries }) {
      const slides = [];
      if (surgeRank[0]) {
        slides.push({
          href: "./surge.html",
          imageUrl: surgeRank[0].s.imageUrl || "",
          tone: "tone-hot",
          badge: "TREND PICK",
          title: "今週の急上昇ランキング",
          text: `${surgeRank[0].s.name || "注目スリーブ"} の跳ね方を今すぐチェック。値動きが大きい順に、そのまま見比べられます。`,
          meta: ["今すぐ見る"]
        });
      }
      if (priceRank[0]) {
        const pair = getWeeklyPair(priceRank[0]);
        slides.push({
          href: "./ranking.html",
          imageUrl: priceRank[0].imageUrl || "",
          tone: "tone-value",
          badge: "HIGH PRICE",

    function renderCarousel(slides) {
      const track = document.getElementById("homeCarouselTrack");
      const dots = document.getElementById("homeCarouselDots");
      const viewport = document.getElementById("homeCarouselViewport");
      const prevBtn = document.getElementById("carouselPrev");
      const nextBtn = document.getElementById("carouselNext");
      if (!track || !dots || !viewport || !prevBtn || !nextBtn) return;
      if (!slides.length) {
        track.innerHTML = `<div class="home-empty" style="width:100%;">注目コンテンツを表示できませんでした。</div>`;
        dots.innerHTML = "";
        prevBtn.hidden = true;
        nextBtn.hidden = true;
        return;
      }
      track.innerHTML = slides.map((slide, index) => {
        const bg = slide.imageUrl
          ? `style="background-image:url('${escapeHtml(slide.imageUrl)}');"`
          : `style="background-image:linear-gradient(135deg,#162238,#334766);"`;
        return `<a class="carousel-slide ${escapeHtml(slide.tone || "")}" href="${escapeHtml(slide.href)}" data-slide-index="${index}" aria-label="${escapeHtml(slide.title)}"><div class="carousel-slide-media" ${bg}></div><div class="carousel-slide-content"><span class="carousel-slide-badge">${escapeHtml(slide.badge)}</span><h2 class="carousel-slide-title">${escapeHtml(slide.title)}</h2><p class="carousel-slide-text">${escapeHtml(slide.text)}</p><div class="carousel-slide-meta">${(Array.isArray(slide.meta) ? slide.meta : []).map((meta) => `<span class="carousel-slide-pill">${escapeHtml(meta)}</span>`).join("")}</div></div></a>`;
      }).join("");
      dots.innerHTML = slides.map((slide, index) => `<button class="carousel-dot${index === 0 ? " is-active" : ""}" type="button" aria-label="${index + 1}枚目へ" data-dot-index="${index}"></button>`).join("");

      const slideEls = Array.from(track.querySelectorAll(".carousel-slide"));
      const dotEls = Array.from(dots.querySelectorAll(".carousel-dot"));
      let activeIndex = 0;
      let autoTimer = null;
      let paused = false;

      const updatePosition = (index, { smooth = true } = {}) => {
        activeIndex = ((index % slideEls.length) + slideEls.length) % slideEls.length;
        const active = slideEls[activeIndex];
        const viewportWidth = viewport.clientWidth;
        const target = Math.max(0, active.offsetLeft - Math.max(0, (viewportWidth - active.offsetWidth) / 2));
        track.style.transition = smooth ? "transform .45s cubic-bezier(.22, 1, .36, 1)" : "none";
        track.style.transform = `translateX(${-target}px)`;
        slideEls.forEach((el, idx) => el.classList.toggle("is-active", idx === activeIndex));
        dotEls.forEach((el, idx) => el.classList.toggle("is-active", idx === activeIndex));
      };
      const stopAuto = () => { if (autoTimer) clearInterval(autoTimer); autoTimer = null; };
      const startAuto = () => {
        stopAuto();
        if (slides.length <= 1) return;
        autoTimer = setInterval(() => {
          if (paused) return;
          updatePosition(activeIndex + 1);
        }, 5000);
      };
      prevBtn.addEventListener("click", () => updatePosition(activeIndex - 1));
      nextBtn.addEventListener("click", () => updatePosition(activeIndex + 1));
      dotEls.forEach((dot) => dot.addEventListener("click", () => updatePosition(Number(dot.dataset.dotIndex || 0))));
      viewport.addEventListener("mouseenter", () => { paused = true; });
      viewport.addEventListener("mouseleave", () => { paused = false; });
      viewport.addEventListener("focusin", () => { paused = true; });
      viewport.addEventListener("focusout", () => { paused = false; });
      window.addEventListener("resize", () => updatePosition(activeIndex, { smooth: false }), { passive: true });
      updatePosition(0, { smooth: false });
      startAuto();
    }

    function formatMetricValue(value, format = "currency") {
      if (!Number.isFinite(value)) return "—";
      if (format === "index") return value.toFixed(2);
      if (format === "score") return `${Math.round(value)}`;
      if (format === "compact-yen-m") return `¥${value.toFixed(2)}M`;
      if (format === "yen") return `¥${Math.round(value).toLocaleString()}`;
      if (format === "count") return `${Math.round(value).toLocaleString()}件`;
      if (format === "percent") return formatPercent(value);
      return `${Math.round(value).toLocaleString()}円`;
    }

    function animateCountups(root = document) {
      const items = root.querySelectorAll("[data-countup]");
      items.forEach((el) => {
        const target = Number(el.getAttribute("data-countup"));
        if (!Number.isFinite(target)) return;
        const format = el.getAttribute("data-format") || "currency";
        const start = 0;
        const duration = 400;
        const startTime = performance.now();
        const render = (value) => {
          el.textContent = formatMetricValue(value, format);
        };
        const step = (now) => {
          const progress = Math.min(1, (now - startTime) / duration);
          const eased = 1 - Math.pow(1 - progress, 3);
          render(start + ((target - start) * eased));
          if (progress < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
      root.querySelectorAll("[data-trend]").forEach((el) => {
        const trend = el.getAttribute("data-trend") || "flat";
        el.classList.remove("metric-trend-up", "metric-trend-down", "metric-trend-flat");
        el.classList.add(`metric-trend-${trend}`);
        window.setTimeout(() => {
          el.classList.remove("metric-trend-up", "metric-trend-down", "metric-trend-flat");
        }, 420);
      });
    }

    function startTypewriter(el, messages) {
      if (!el || !Array.isArray(messages) || !messages.length) return;
      let index = 0;
      let timer = null;
      const typeMessage = (message, cb) => {
        el.classList.add("is-typing");
        let pos = 0;
        const tick = () => {
          el.textContent = message.slice(0, pos);
          pos += 1;
          if (pos <= message.length) {
            timer = window.setTimeout(tick, 28);
          } else {
            el.classList.remove("is-typing");
            timer = window.setTimeout(cb, 2200);
          }
        };
        tick();
      };
      const loop = () => {
        typeMessage(messages[index], () => {
          index = (index + 1) % messages.length;
          loop();
        });
      };
      loop();
      return () => { if (timer) clearTimeout(timer); };
    }

    function initScrollReveal() {
      const nodes = Array.from(document.querySelectorAll(".reveal-on-scroll"));
      if (!nodes.length) return;
      if (!("IntersectionObserver" in window)) {
        nodes.forEach((node) => node.classList.add("is-visible"));
        return;
      }
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add("is-visible");
          observer.unobserve(entry.target);
        });
      }, { threshold: 0.15, rootMargin: "0px 0px -40px 0px" });
      nodes.forEach((node) => observer.observe(node));
    }

    function initSurgeRailAutoplay() {
      const viewport = document.getElementById("surgeViewport");
      const prevBtn = document.getElementById("surgePrev");
      const nextBtn = document.getElementById("surgeNext");
      if (!viewport || !prevBtn || !nextBtn) return;
      const cards = () => Array.from(viewport.querySelectorAll(".trend-rail-card"));
      let timer = null;
      let paused = false;
      const scrollToIndex = (index) => {
        const items = cards();
        if (!items.length) return;
        const target = items[((index % items.length) + items.length) % items.length];
        viewport.scrollTo({ left: target.offsetLeft, behavior: "smooth" });
      };
      const currentIndex = () => {
        const items = cards();
        if (!items.length) return 0;
        const left = viewport.scrollLeft;
        let bestIndex = 0;
        let minDiff = Infinity;
        items.forEach((item, index) => {
          const diff = Math.abs(item.offsetLeft - left);
          if (diff < minDiff) {
            minDiff = diff;
            bestIndex = index;
          }
        });
        return bestIndex;
      };
      prevBtn.addEventListener("click", () => scrollToIndex(currentIndex() - 1));
      nextBtn.addEventListener("click", () => scrollToIndex(currentIndex() + 1));
      const start = () => {
        if (timer) clearInterval(timer);
        timer = window.setInterval(() => {
          if (paused) return;
          scrollToIndex(currentIndex() + 1);
        }, 3000);
      };
      viewport.addEventListener("mouseenter", () => { paused = true; });
      viewport.addEventListener("mouseleave", () => { paused = false; });
      viewport.addEventListener("touchstart", () => { paused = true; }, { passive: true });
      viewport.addEventListener("touchend", () => { paused = false; }, { passive: true });
      start();
    }

            <div class="movers-thumb">${row.sleeve.imageUrl ? `<img src="${escapeHtml(row.sleeve.imageUrl)}" alt="${escapeHtml(row.sleeve.name ?? "")}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.onerror=null; this.style.display='none';">` : ""}</div>
            <div class="movers-copy">
              <span class="movers-rank">${escapeHtml(row.rankText ?? "")}</span>
              <p class="movers-name">${escapeHtml(row.sleeve.name ?? "")}</p>
              <p class="movers-meta">${escapeHtml(row.meta)}</p>
            </div>
          </a>
          <div class="movers-side">
            <div class="movers-stats">
              <div class="movers-stat movers-stat--price">
                <span class="movers-stat-label">最新週価格</span>
                <div class="movers-stat-value-row">
                  <strong class="movers-stat-value">${escapeHtml(row.priceText)}</strong>
                  ${row.sparklineMarkup ?? ""}
                </div>
              </div>
              <div class="movers-stat">
                <span class="movers-stat-label">前週比</span>
                <span class="movers-delta ${escapeHtml(row.deltaClass)}">${escapeHtml(row.deltaText)}</span>
              </div>
            </div>
            <a class="movers-action" href="${escapeHtml(getDetailHref(row.sleeve.id ?? ""))}">詳細</a>
          </div>
        </div>
      `).join("") || `<div class="home-empty">ランキングデータがありません。</div>`;
    }

    function renderTrendLists({ surgeRank, growthRank, priceRank }) {
      const surgeEl = document.getElementById("moversTableBody");
      const priceEl = document.getElementById("priceTableBody");
      const growthEl = document.getElementById("growthTableBody");

      if (surgeEl) {
        const rows = surgeRank.slice(0, 3).map((row, index) => {
          const rate = row.pair.prev?.price ? (row.diff / row.pair.prev.price) * 100 : null;
          return {
            sleeve: row.s,
            rankText: `#${index + 1}`,
            sparklineMarkup: buildRankingSparkline(row.s),
            meta: `急上昇 ${index + 1}位`,
            priceText: `¥${row.pair.latest.price.toLocaleString()}`,
            deltaText: formatPercent(rate),
            deltaClass: getDeltaClass(rate)
          };
        });
        surgeEl.innerHTML = buildRankingRows(rows);
      }

      if (priceEl) {
        const rows = priceRank.slice(0, 3).map((sleeve, index) => {
          const pair = getWeeklyPair(sleeve);
          const rate = pair?.prev?.price ? ((pair.latest.price - pair.prev.price) / pair.prev.price) * 100 : null;
          return {
            sleeve,
            rankText: `#${index + 1}`,
            sparklineMarkup: buildRankingSparkline(sleeve),
            meta: `価格 ${index + 1}位`,
            priceText: pair?.latest?.price != null ? `¥${pair.latest.price.toLocaleString()}` : "—",
            deltaText: formatPercent(rate),
            deltaClass: getDeltaClass(rate)
          };
        });
        priceEl.innerHTML = buildRankingRows(rows);
      }

      if (growthEl) {
        const rows = growthRank.slice(0, 3).map((row, index) => ({
          sleeve: row.s,
          rankText: `#${index + 1}`,
          sparklineMarkup: buildRankingSparkline(row.s),
          meta: `高騰率 ${index + 1}位`,
          priceText: row.g?.latest?.price != null ? `¥${row.g.latest.price.toLocaleString()}` : "—",
          deltaText: formatPercent(row.g?.rate ?? null),
          deltaClass: getDeltaClass(row.g?.rate ?? null)
        }));
        growthEl.innerHTML = buildRankingRows(rows);
      }
    }

    const MOBILE_CATEGORY_GROUPS = [
      { key: "pokemon", label: "ポケモン" },
      { key: "trainer", label: "トレーナー" },
      { key: "category", label: "限定・シリーズ" }
    ];

    function buildMobileCategoryHref(groupKey, tag = "") {
      const key = String(groupKey || "").trim();
      const tagText = String(tag || "").trim();
      if (tagText && window.common && typeof window.common.buildSleeveCategoryHref === "function") {
        return window.common.buildSleeveCategoryHref(key, tagText);
      }
      if (window.common && typeof window.common.buildSleeveGroupHref === "function") {
        return window.common.buildSleeveGroupHref(key);
      }
      const params = new URLSearchParams();
      if (key) params.set("group", key);
      if (tagText) params.set("tag", tagText);
      return `./sleeves/?${params.toString()}`;
    }

    function renderMobileCategoryDiscovery(sleeves) {
      const root = document.getElementById("mobileCategoryDiscovery");
      if (!root) return;
      const list = Array.isArray(sleeves) ? sleeves : [];
      const counts = window.common && typeof window.common.countSleevesByGroup === "function"
        ? window.common.countSleevesByGroup(list)
        : {};
      const activeKey = MOBILE_CATEGORY_GROUPS.some((group) => group.key === root.dataset.group)
        ? root.dataset.group
        : "pokemon";
      const activeGroup = MOBILE_CATEGORY_GROUPS.find((group) => group.key === activeKey) || MOBILE_CATEGORY_GROUPS[0];
      const rawTags = window.common && typeof window.common.collectGroupDetailItems === "function"
        ? window.common.collectGroupDetailItems(list, activeGroup.key)
        : [];
      const tags = rawTags.slice(0, 6);
      const selectedTag = tags.some((tag) => tag.label === root.dataset.tag)
        ? root.dataset.tag
        : (tags[0]?.label || "");
      const selectedHref = buildMobileCategoryHref(activeGroup.key, selectedTag);
      const moreHref = buildMobileCategoryHref(activeGroup.key);

      root.innerHTML = `
        <div class="mobile-category-head">
          <div class="mobile-category-title-wrap">
            <h2 class="mobile-category-title">カテゴリから探す</h2>
            <span class="mobile-category-count">${escapeHtml(String(list.length || 0))}件から分類</span>
          </div>
          <a class="mobile-category-more" href="${escapeHtml(moreHref)}">もっと見る</a>
        </div>
        <div class="mobile-category-tabs" aria-label="カテゴリ">
          ${MOBILE_CATEGORY_GROUPS.map((group) => {
            const count = Number(counts?.[group.key] || 0);
            return `<button type="button" class="mobile-category-tab${group.key === activeGroup.key ? " is-active" : ""}" data-group="${escapeHtml(group.key)}">${escapeHtml(group.label)} ${escapeHtml(String(count))}</button>`;
          }).join("")}
        </div>
        <p class="mobile-category-subhead">人気タグ</p>
        <div class="mobile-category-grid">
          ${tags.map((tag) => {
            const isSelected = tag.label === selectedTag;
            return `
              <button type="button" class="mobile-category-chip${isSelected ? " is-selected" : ""}" data-tag="${escapeHtml(tag.label)}">
                <span class="mobile-category-chip-name">${escapeHtml(tag.label)}</span>
                <span class="mobile-category-chip-count">${escapeHtml(String(tag.count))}件</span>
              </button>
            `;
          }).join("") || `<a class="mobile-category-chip" href="./sleeves/"><span class="mobile-category-chip-name">図鑑を見る</span><span class="mobile-category-chip-count">一覧</span></a>`}
        </div>
        <div class="mobile-category-foot">
          <span class="mobile-category-selected">${selectedTag ? `選択中: ${escapeHtml(selectedTag)}` : "カテゴリを選択"}</span>
          <a class="mobile-category-cta" href="${escapeHtml(selectedHref)}">図鑑で見る</a>
        </div>
      `;

      root.querySelectorAll(".mobile-category-tab").forEach((button) => {
        button.addEventListener("click", () => {
          root.dataset.group = button.dataset.group || "pokemon";
          root.dataset.tag = "";
          renderMobileCategoryDiscovery(list);
        });
      });
      root.querySelectorAll(".mobile-category-chip[data-tag]").forEach((button) => {
        button.addEventListener("click", () => {
          root.dataset.tag = button.dataset.tag || "";
          renderMobileCategoryDiscovery(list);
        });
      });
    }

    function renderMarketSnapshot(marketSeries, sleeves) {
      const mainEl = document.getElementById("marketSnapshotCard");
      const sideEl = document.getElementById("marketSentimentCard");
      if (!mainEl && !sideEl) return;
      if (!Array.isArray(marketSeries) || !marketSeries.length) {
        if (mainEl) mainEl.innerHTML = `<div class="home-empty">スリーブ指数を表示できませんでした。</div>`;
        if (sideEl) sideEl.innerHTML = `<div class="home-empty">市場状況を表示できませんでした。</div>`;
        return;
      }
      const latest = marketSeries[marketSeries.length - 1];
      const stats = buildMarketStats(Array.isArray(sleeves) ? sleeves : [], marketSeries);
      const recent = marketSeries.slice(-7);
      const values = recent.map((row) => row.index);
      const linePoints = buildSparklinePoints(values, 760, 220);
      const areaPoints = `${linePoints} 760,220 0,220`;
      const minValue = values.length ? Math.min(...values) : 0;
      const maxValue = values.length ? Math.max(...values) : 0;
      const midValue = values.length ? (minValue + maxValue) / 2 : 0;
      const sentimentScore = Number(stats.sentimentScore || 0);
      const sentimentLabel = sentimentScore >= 72
        ? "強気"
        : sentimentScore >= 58
          ? "やや強気"
          : sentimentScore <= 28
            ? "弱気"
            : sentimentScore <= 42
              ? "やや弱気"
              : "中立";
      const strategistText = buildStrategistText(stats);
      const latestWeekLabel = stats.latestWeek ? (() => {
        const m = String(stats.latestWeek).match(/^(?:\d{4})-(\d{2})-(\d{2})$/);
        return m ? `${Number(m[1])}/${Number(m[2])}週更新` : `${stats.latestWeek}更新`;
      })() : "集計週未反映";
      if (mainEl) {
        mainEl.innerHTML = `
          <a class="hero-main-link" href="./index-market.html" aria-label="指数ページを見る">
            <div class="hero-main-head">
              <div>
                <p class="hero-index-kicker">スリーブ市場 総合指数（SMTI）</p>
                <div class="hero-index-value-row">
                  <h1 class="hero-index-value"${getCountupAttrs(latest.index, "index")}>${escapeHtml(latest.index.toFixed(2))}</h1>
                  <span class="hero-index-chip">${escapeHtml(formatPercent(latest.rate))}（前週比）</span>
                </div>
              </div>
            </div>
            <div class="hero-chart-card">
              <div class="hero-chart-yaxis" aria-hidden="true">
                <span>${escapeHtml(maxValue.toFixed(1))}</span>
                <span>${escapeHtml(midValue.toFixed(1))}</span>
                <span>${escapeHtml(minValue.toFixed(1))}</span>
              </div>
              <svg class="hero-chart-svg" viewBox="0 0 760 220" preserveAspectRatio="none" aria-hidden="true">
                <defs>
                  <pattern id="marketGrid" width="34" height="34" patternUnits="userSpaceOnUse">
                    <circle cx="1.5" cy="1.5" r="1.5" fill="rgba(27, 41, 63, 0.12)"></circle>
                  </pattern>
                  <linearGradient id="marketHeroFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#0b8f68" stop-opacity="0.22"></stop>
                    <stop offset="100%" stop-color="#0b8f68" stop-opacity="0.04"></stop>
                  </linearGradient>
                </defs>
                <rect class="hero-chart-grid" x="0" y="0" width="760" height="220" fill="url(#marketGrid)"></rect>
                <polygon class="hero-chart-area" fill="url(#marketHeroFill)" stroke="none" points="${escapeHtml(areaPoints)}"></polygon>
                <polyline class="hero-chart-line" pathLength="1" fill="none" stroke="#0b7a59" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="${escapeHtml(linePoints)}"></polyline>
              </svg>
              <div class="hero-chart-axis">
                <span>7.DAYS AGO</span>
                <span>TODAY</span>
              </div>
            </div>
          </a>
        `;
        const chipEl = mainEl.querySelector(".hero-index-chip");
        if (chipEl) chipEl.textContent = `${formatPercent(latest.rate)}\uFF08\u524D\u9031\u6BD4\uFF09`;
      }
      if (sideEl) {
        sideEl.innerHTML = `
          <div class="sentiment-head">
            <h2 class="sentiment-title">市場状況</h2>
            <span class="sentiment-updated">${escapeHtml(latestWeekLabel)}</span>
          </div>
          <div class="sentiment-score-row">
            <div class="sentiment-score"${getCountupAttrs(sentimentScore, "score")}>${escapeHtml(String(sentimentScore))}</div>
            <div class="sentiment-badge">${escapeHtml(sentimentLabel)}</div>
          </div>
          <div class="sentiment-meter"></div>
          <div class="sentiment-scale">
            <span>弱気</span>
            <span>強気</span>
          </div>
          <p class="sentiment-copy">${escapeHtml(strategistText)}</p>
        `;
        sideEl.style.setProperty("--sentiment-progress", `${sentimentScore}%`);
        const updatedEl = sideEl.querySelector(".sentiment-updated");
        if (updatedEl) {
          const m = String(stats.latestWeek || "").match(/^(?:\d{4})-(\d{2})-(\d{2})$/);
          updatedEl.textContent = m ? `\u96C6\u8A08\u9031 ${Number(m[1])}/${Number(m[2])}` : (stats.latestWeek ? `\u96C6\u8A08\u9031 ${stats.latestWeek}` : "\u96C6\u8A08\u9031 \u672A\u53CD\u6620");
        }
      }
      renderMarketStats(stats);
    }

    function runDeferred(task) {
      if (typeof window.requestIdleCallback === "function") {
        window.requestIdleCallback(() => task(), { timeout: 800 });
        return;
      }
      window.setTimeout(task, 32);
    }

    function wireDashboardSearch() {
      const input = document.getElementById("dashboardSearchInput");
      if (!input || input.dataset.dashboardSearchWired === "1") return;
      input.dataset.dashboardSearchWired = "1";

      let autocompleteWired = false;
      const wireAutocomplete = () => {
        if (autocompleteWired) return;
        autocompleteWired = true;
        if (window.common && typeof window.common.wireSleeveAutocomplete === "function") {
          window.common.wireSleeveAutocomplete(input, {
            minChars: 1,
            maxItems: 8,
            anchorEl: input.closest(".topbar-search")
          });
        }
      };

      input.addEventListener("focus", wireAutocomplete, { once: true });
      input.addEventListener("pointerdown", wireAutocomplete, { once: true });

      input.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        if (event.defaultPrevented) return;
        const q = input.value.trim();
        if (window.common && typeof window.common.recordSearchHistory === "function") {
          window.common.recordSearchHistory(q);
        }
        if (!q) {
          location.href = "./sleeves/";
          return;
        }
        location.href = "./sleeves/?q=" + encodeURIComponent(q);
      });
    }

    function wireSidebarCategoryToggle() {
      const shell = document.getElementById("sidebarCategoryShell");
      const button = document.getElementById("sidebarCategoryToggle");
      const panel = document.getElementById("categoryNav");
      const list = panel ? panel.querySelector(".category-nav-list") : null;
      if (!shell || !button || !panel || !list || button.dataset.sidebarCategoryWired === "1") return;
      button.dataset.sidebarCategoryWired = "1";

      const setOpen = (open) => {
        shell.classList.toggle("is-open", open);
        button.setAttribute("aria-expanded", open ? "true" : "false");
      };

      const syncVisibility = () => {
        const hasItems = !!list.querySelector(".category-nav-item");
        shell.hidden = !hasItems;
        if (!hasItems) setOpen(false);
      };

      button.addEventListener("click", () => {
        if (shell.hidden) return;
        setOpen(!shell.classList.contains("is-open"));
      });

      document.addEventListener("click", (event) => {
        if (!(event.target instanceof Node)) return;
        if (shell.contains(event.target)) return;
        setOpen(false);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") setOpen(false);
      });

      const observer = new MutationObserver(syncVisibility);
      observer.observe(list, { childList: true, subtree: true });
      syncVisibility();
    }

    async function waitForHeaderSearch() {
      for (let i = 0; i < 20; i++) {
        const input = document.getElementById("search");
        if (input) return input;
        await new Promise((resolve) => setTimeout(resolve, 50));
      }
      return null;
    }

    initScrollReveal();

    async function main() {
      if (!(window.common && typeof window.common.loadData === "function")) {
        throw new Error("共通データローダーの初期化に失敗しました。");
      }
      wireDashboardSearch();
      const data = await loadHomePrimaryData();
      const sleeves = Array.isArray(data?.sleeves) ? data.sleeves : [];
      wireSidebarCategoryToggle();
      const latestWeek = getGlobalLatestTradeWeek(sleeves);

      const priceRank = sleeves.map((s) => ({ s, price: getLatestWeeklyPrice(s) })).filter((row) => row.price != null).sort((a, b) => b.price - a.price).slice(0, 10).map((row) => row.s);
      const surgeRank = sleeves.map((s) => {
        const pair = getWeeklyPair(s);
        if (!pair || !pair.prev) return null;
        if (latestWeek && pair.latest.week !== latestWeek) return null;
        const diff = pair.latest.price - pair.prev.price;
        if (!(diff > 0)) return null;
        return { s, pair, diff };
      }).filter(Boolean).sort((a, b) => b.diff - a.diff).slice(0, 10);
      const growthRank = sleeves.map((s) => {
        const g = get30dGrowth(s, latestWeek);
        return g ? { s, g } : null;
      }).filter(Boolean).sort((a, b) => b.g.rate - a.g.rate).slice(0, 10);

      renderTodayHero(surgeRank[0] || null);
      renderTrendLists({ surgeRank, growthRank, priceRank });
      renderMobileCategoryDiscovery(sleeves);
      initScrollReveal();

      runDeferred(() => {
        const marketSeries = buildHomeMarketIndexSeries(sleeves);
        renderMarketSnapshot(marketSeries, sleeves);
      });

      runDeferred(async () => {
        if (window.common && typeof window.common.ensureCategoryNavsRendered === "function") {
          try {
            await window.common.ensureCategoryNavsRendered(sleeves);
          } catch (_) {}
        }
      });
    }

    main().catch((error) => {
      console.error(error);
      ["marketSnapshotCard", "marketSentimentCard", "marketStatsGrid", "moversTableBody", "priceTableBody", "growthTableBody"].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = `<div class="home-empty">トップページのデータ読み込みに失敗しました。時間をおいて再度お試しください。</div>`;
      });
      initScrollReveal();
    });
  </script>
</body>
