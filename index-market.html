    const MARKET_INDEX_BASE_MONTH = "2024-01";
    const MARKET_INDEX_BASE_LABEL = "2024年1月";

    const MARKET_COMMENT_TEMPLATES = Object.freeze({
      strong_up: "スリーブ相場は強い上昇傾向です。全体平均は前回比で大きく伸びており、値上がりしているスリーブも広く見られます。人気どころだけでなく、相場全体で価格の持ち上がりが確認できます。",

      volume_up: "スリーブ相場では相場更新が活発です。全体平均の動きはまだ大きくないものの、価格更新の広がりが見られます。",
      flat: "スリーブ相場は横ばい圏です。全体平均の変動は限られており、全体としては落ち着いた推移です。足元ではスリーブごとの差が出やすい状態です。",
      soft_down: "スリーブ相場はやや軟調です。全体平均は弱含みで推移しており、価格の伸びはやや限定的です。人気スリーブとそれ以外で動きの差が広がりやすい局面です。",
      down: "スリーブ相場は下落基調です。全体平均は前回比で大きく下がっており、全体として慎重な値動きになっています。短期的には様子見が増えやすいタイミングです。"
    });

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "block";
      el.textContent = msg;
    }

    async function loadData() {
      if (window.common && typeof window.common.loadData === "function") {
        return await window.common.loadData();
      }

      const gas = window.GAS_URL || (typeof GAS_URL !== "undefined" ? GAS_URL : "");
      if (!gas) throw new Error("GAS_URL が未設定です（common.js を確認してください）");

      const cacheKey = "market-index:fallback-cache:v1";
      const ttlMs = 5 * 60 * 1000;

      try {
        const raw = sessionStorage.getItem(cacheKey);
        if (raw) {
          const cached = JSON.parse(raw);
          if (
            cached &&
            Number.isFinite(cached.savedAt) &&
            (Date.now() - cached.savedAt) < ttlMs &&
            cached.data
          ) {
            return cached.data;
          }
        }
      } catch (_) { }

      const res = await fetch(gas, { cache: "default" });
      if (!res.ok) throw new Error(`データ取得に失敗しました（HTTP ${res.status}）`);
      const data = await res.json();

      try {
        sessionStorage.setItem(cacheKey, JSON.stringify({
          savedAt: Date.now(),
          data
        }));
      } catch (_) { }

      return data;
    }

    function toISODate(d) {
      const dd = new Date(d);
      if (Number.isNaN(dd.getTime())) return null;
      const y = dd.getFullYear();
      const m = String(dd.getMonth() + 1).padStart(2, "0");
      const day = String(dd.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    // 週/月/不明 を判定（あなたのデータ仕様：day=01 は月次/まとめ）
    function periodKind(iso) {
      const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return "unknown";
      const day = m[3];
      return (day === "01") ? "month" : "week";
    }

    function formatPeriodLabel(iso) {
      const s = String(iso || "").trim();
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return s;
      const y = m[1], mo = m[2], d = m[3];
      return `${y}/${mo}/${d}`;
    }

    function formatMetaDate(iso) {
      const s = String(iso || "").trim();
      const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (!m) return s || "-";
      return `${m[1]}/${Number(m[2])}/${Number(m[3])}`;
    }

    function getMarketSourceBoundary(points, key = "x") {
      const list = Array.isArray(points) ? points : [];
      let leftIdx = -1;
      let rightIdx = -1;
      for (let i = 0; i < list.length; i++) {
        const period = String(list[i]?.[key] ?? "");
        if (/^2024-12(?:-\d{2})?$/.test(period)) leftIdx = i;
        if (leftIdx >= 0 && /^2025-01(?:-\d{2})?$/.test(period)) {
          rightIdx = i;
          break;
        }
      }
      if (leftIdx < 0 || rightIdx < 0 || rightIdx <= leftIdx) return null;
      return {
        leftIdx,
        rightIdx,
        leftLabel: "買取相場ベース",
        rightLabel: "メルカリ実売ベース"
      };
    }

    function getSleeveCategoryValues(sleeve) {
      return [
        ...(Array.isArray(sleeve?.categoryTags) ? sleeve.categoryTags : []),
        ...(Array.isArray(sleeve?.categories) ? sleeve.categories : []),
        sleeve?.category7,
        sleeve?.category8,
        sleeve?.category9
      ]
        .map((value) => String(value || "").trim())
        .filter(Boolean);
    }

    function sleeveHasCategoryTag(sleeve, tagName) {
      return getSleeveCategoryValues(sleeve).some((value) => value === tagName);
    }

    function isMemorialSleeve(sleeve) {
      return sleeveHasCategoryTag(sleeve, "記念デッキシールド");
    }

    function isLimitedSleeve(sleeve) {
      return sleeveHasCategoryTag(sleeve, "限定デッキシールド");
    }

    function filterSleevesByIndexScope(sleeves, scope) {
      const list = Array.isArray(sleeves) ? sleeves : [];
      if (scope === "memorial") return list.filter(isMemorialSleeve);
      if (scope === "limited") return list.filter(isLimitedSleeve);
      return list.slice();
    }

    function getIndexScopeMeta(scope) {
      if (scope === "memorial") {
        return {
          label: "記念デッキシールド",
          shareLabel: "記念デッキシールド指数"
        };
      }
      if (scope === "limited") {
        return {
          label: "限定デッキシールド",
          shareLabel: "限定デッキシールド指数"
        };
      }
      return {
        label: "全体",
        shareLabel: "スリーブ指数"
      };
    }

    // weeklyPrices: [{week, price, count}]
    function normalizeWeekly(arr) {
      return (Array.isArray(arr) ? arr : [])
        .map(x => {
          const week = toISODate(x.week);

          let price = null;
          const priceStr = String(x.price ?? "").trim();
          if (priceStr !== "" && priceStr !== "-" && priceStr !== "—") {
            const n = Number(priceStr);
            if (Number.isFinite(n) && n > 0) price = n;
          }

          let count = null;
          const countStr = String(x.count ?? "").trim();
          if (countStr !== "" && countStr !== "-" && countStr !== "—") {
            const n = Number(countStr);
            if (Number.isFinite(n)) count = n;
          }

          // 取引なし週は price=null 扱い
          const noTrades = (count === 0) || (price === null);

          return { week, price: noTrades ? null : price, count };
        })
        .filter(x => x.week)
        .sort((a, b) => String(a.week).localeCompare(String(b.week))); // asc
    }

    function normalizeMonthlyPrices(arr) {
      return (Array.isArray(arr) ? arr : [])
        .map(x => {
          const week = toISODate(x.month ?? x.week);

          let price = null;
          const priceStr = String(x.price ?? "").trim();
          if (priceStr !== "" && priceStr !== "-" && priceStr !== "—") {
            const n = Number(priceStr);
            if (Number.isFinite(n) && n > 0) price = n;
          }

          let count = null;
          const countStr = String(x.count ?? "").trim();
          if (countStr !== "" && countStr !== "-" && countStr !== "—") {
            const n = Number(countStr);
            if (Number.isFinite(n)) count = n;
          }

          return { week, price: price == null ? null : price, count: count == null ? 1 : count };
        })
        .filter(x => x.week && periodKind(x.week) === "month")
        .sort((a, b) => String(a.week).localeCompare(String(b.week)));
    }

    function buildPeriodEntries(sleeves, kind = "week") {
      return (Array.isArray(sleeves) ? sleeves : []).map((sleeve) => {
        const weekMap = new Map();
        if (kind === "month") {
          for (const row of normalizeMonthlyPrices(sleeve.monthlyPrices)) {
            weekMap.set(row.week, { price: row.price, count: row.count });
          }
        } else {
          for (const row of normalizeWeekly(sleeve.weeklyPrices)) {
            if (periodKind(row.week) !== kind) continue;
            weekMap.set(row.week, { price: row.price, count: row.count });
          }
        }
        return { sleeve, weekMap };
      });
    }

    function buildWeeklyEntries(sleeves) {
      return buildPeriodEntries(sleeves, "week");
    }

    function buildMonthlyEntries(sleeves) {
      return buildPeriodEntries(sleeves, "month");
    }

    // ★期間リスト（週/月ごと）
    function collectWeeks(entries) {
      const set = new Set();
      for (const entry of (Array.isArray(entries) ? entries : [])) {
        for (const week of entry.weekMap.keys()) {
          set.add(week);
        }
      }
      return Array.from(set).sort((a, b) => String(a).localeCompare(String(b)));
    }

    // 週次上昇率（%）を計算、外れ値はクリップ
    function clip(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    // 毎週「12週間前=100」のローリング基準で指数化
    function buildRollingIndexFromRates(rateRows, lookbackWeeks = 12, baseIndex = 100) {
      const factors = rateRows.map(r => {
        if (!Number.isFinite(r?.avgRate)) return null;
        return 1 + (r.avgRate / 100);
      });

      const out = [];
      for (let i = 0; i < rateRows.length; i++) {
        let idx = null;
        if (i >= (lookbackWeeks - 1)) {
          let prod = 1;
          let ok = true;
          for (let j = i - (lookbackWeeks - 1); j <= i; j++) {
            const f = factors[j];
            if (!Number.isFinite(f) || f <= 0) {
              ok = false;
              break;
            }
            prod *= f;
          }
          if (ok) idx = baseIndex * prod;
        }
        out.push({ ...rateRows[i], index: idx });
      }
      return out;
    }

    function latestTwoValid(rows, key) {
      const valid = rows.filter(r => Number.isFinite(r[key]));
      if (!valid.length) return null;
      const latest = valid[valid.length - 1];
      const prev = valid.length >= 2 ? valid[valid.length - 2] : null;
      return { latest, prev };
    }

    function classifyMarketCommentState(stats) {
      const hint = String(stats?.stateHint || "").trim();
      const rate = Number(stats?.latestRate);
      const activeCount = Number(stats?.activeCount || 0);
      const risingCount = Number(stats?.risingCount || 0);
      const ratio = activeCount > 0 ? (risingCount / activeCount) : 0;

      let state = "flat";
      if (Number.isFinite(rate) && rate >= 2.0 && ratio >= 0.55) state = "strong_up";
      else if (Number.isFinite(rate) && rate <= -2.0) state = "down";
      else if (Number.isFinite(rate) && rate >= 0.8 && ratio >= 0.45) state = "up";
      else if (Number.isFinite(rate) && rate <= -0.8) state = "soft_down";
      else if (Number.isFinite(rate) && rate > -0.8 && rate < 0.8 && ratio >= 0.45) state = "volume_up";

      if (hint === "up" && (state === "flat" || state === "volume_up")) return "up";
      if (hint === "down" && state === "flat") return "soft_down";
      return state;
    }

    function buildMarketCommentAddon(stats) {
      const activeCount = Number(stats?.activeCount || 0);
      const risingCount = Number(stats?.risingCount || 0);
      const ratio = activeCount > 0 ? (risingCount / activeCount) : 0;
      const volume = Number(stats?.volume || 0);
      const tradeValue = Number(stats?.tradeValue || 0);
      const avgPrice = Number(stats?.avgPrice || 0);

      if (ratio >= 0.6) return "値上がりしているスリーブの裾野が広く、相場全体に動きが広がっています。";
      if (ratio <= 0.3 && activeCount > 0) return "一部の人気スリーブを除くと、全体にはやや弱さが残っています。";
      if (volume >= 45) return "相場更新数が多く、市場全体の価格見直しが進んでいます。";
      if (tradeValue >= 180000) return "高額帯を含めた価格更新があり、集計額も大きめです。";
      if (avgPrice >= 3500) return "高額帯スリーブの成約が平均価格を押し上げています。";
      return "";
    }

    function buildMarketCommentStats(priceSeries) {
      const rows = Array.isArray(priceSeries) ? priceSeries : [];
      const pair = latestTwoValid(rows, "avgPrice");
      const latest = pair?.latest || null;
      if (!latest?.week) return null;
      const prev = pair?.prev || null;
      const diff = prev && Number.isFinite(prev.avgPrice) ? latest.avgPrice - prev.avgPrice : null;
      const rate = Number.isFinite(diff) && prev.avgPrice > 0 ? (diff / prev.avgPrice) * 100 : null;

      return {
        latestWeek: latest.week,
        latestRate: rate,
        activeCount: Number(latest.targetCount || 0),
        risingCount: null,
        volume: Number(latest.updateCount || 0),
        tradeValue: 0,
        avgPrice: Number(latest.avgPrice || 0),
        stateHint: Number.isFinite(diff) ? getTrendClass(diff) : "flat"
      };
    }

    function buildAiMarketComment(stats) {
      if (!stats) return "コメントを生成できるデータがまだありません。";
      const state = classifyMarketCommentState(stats);
      const base = MARKET_COMMENT_TEMPLATES[state] || MARKET_COMMENT_TEMPLATES.flat;
      const addon = buildMarketCommentAddon(stats);
      return addon ? `${base} ${addon}` : base;
    }

    function renderAiComment(weekIso, stats) {
      const weekEl = document.getElementById("aiCommentWeek");
      const bodyEl = document.getElementById("aiCommentBody");
      if (!weekEl || !bodyEl) return;

      if (!weekIso) {
        weekEl.textContent = "対象週: -";
        bodyEl.textContent = "コメントを生成できるデータがまだありません。";
        return;
      }

      weekEl.textContent = `対象週: ${formatPeriodLabel(weekIso)}`;
      bodyEl.textContent = buildAiMarketComment(stats);
    }

    function renderTableIndex(rows) {
      if (!rows.length) return `<div class="meta">データがまだありません</div>`;
      const valid = rows.filter(r => r.week);
      const html = valid.slice().reverse().map(r => {
        return `<tr>
          <td>${escapeHtml(formatPeriodLabel(r.week))}</td>
          <td>${Number.isFinite(r.avgPrice) ? escapeHtml(formatMarketYen(r.avgPrice)) : "—"}</td>
          <td>${Number(r.targetCount || 0).toLocaleString()}種類</td>
          <td>${Number(r.updateCount || 0).toLocaleString()}種類</td>
        </tr>`;
      }).join("");

      return `
        <div class="table-wrap">
          <table>
            <thead><tr><th>週</th><th>平均相場</th><th>対象</th><th>相場更新数</th></tr></thead>
            <tbody>${html}</tbody>
          </table>
        </div>
      `;
    }

    function renderTableDist(latestRow) {
      if (!latestRow) return `<div class="meta">—</div>`;

      return `
        <div class="table-wrap">
          <table>
            <thead><tr><th>項目</th><th>値</th></tr></thead>
            <tbody>
              <tr><td>平均相場</td><td>${escapeHtml(formatMarketYen(latestRow.avgPrice))}</td></tr>
              <tr><td>計算対象</td><td>${Number(latestRow.targetCount || 0).toLocaleString()}種類</td></tr>
              <tr><td>相場更新数</td><td>${Number(latestRow.updateCount || 0).toLocaleString()}種類</td></tr>
            </tbody>

        </div>
      `;
    }

    // ---------- SVG Line Chart ----------
    function renderLineChart(containerId, title, rows, xKey, yKey, yFmt) {
      const el = document.getElementById(containerId);
      if (!el) return;

      const data = (Array.isArray(rows) ? rows : [])
        .map(r => {
          const x = String(r?.[xKey] ?? "");
          const rawY = r?.[yKey];
          let y = null;
          const n = Number(rawY);
          if (Number.isFinite(n)) y = n;
          return { x, y };
        })
        .filter(p => p.x && Number.isFinite(p.y));

      if (data.length < 2) {
        el.innerHTML = `<div class="chart-wrap">${title ? `<div class="chart-title">${escapeHtml(title)}</div>` : ""}<div class="meta">データが不足しています（週次データが2点以上必要）</div></div>`;
        return;
      }

      const W = 760, H = 240;
      const padL = 60, padR = 20, padT = 20, padB = 40;
      const ticks = 4;

      const ys = data.map(d => d.y);
      let yMin = Math.min(...ys);
      let yMax = Math.max(...ys);

      const margin = (yMax - yMin) * 0.1 || 1;
      yMin -= margin; yMax += margin;

      function niceStep(range, t) {
        const rough = range / t;
        const pow = Math.pow(10, Math.floor(Math.log10(Math.max(rough, 1))));
        const candidates = [1, 2, 5, 10].map(m => m * pow);
        return candidates.reduce((best, v) =>
          Math.abs(v - rough) < Math.abs(best - rough) ? v : best
          , candidates[0]);
      }

      const step = niceStep(yMax - yMin, ticks);
      yMin = Math.floor(yMin / step) * step;
      yMax = Math.ceil(yMax / step) * step;

      const xToPx = (i) => padL + (i / (data.length - 1)) * (W - padL - padR);
      const yToPx = (v) => padT + (1 - (v - yMin) / (yMax - yMin)) * (H - padT - padB);

      const pathD = data.map((p, i) =>
        `${i === 0 ? "M" : "L"} ${xToPx(i)} ${yToPx(p.y)}`
      ).join(" ");

      const tickLines = [];
      const tickLabels = [];
      for (let i = 0; i <= ticks; i++) {
        const v = yMin + (i / ticks) * (yMax - yMin);
        const y = yToPx(v);
        tickLines.push(`<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#e6e8ef"/>`);
        tickLabels.push(
          `<text x="${padL - 12}" y="${y + 4}" text-anchor="end" font-size="12" fill="#111827" font-weight="700">${escapeHtml(yFmt(v))}</text>`
        );
      }

      function formatMonthAxisLabel(value) {
        const matched = String(value || "").match(/^(\d{4})[\/\-](\d{2})/);
        if (matched) return `${String(matched[1]).slice(-2)}/${Number(matched[2])}`;
        return formatPeriodLabel(value);
      }

      const midIdx = Math.floor((data.length - 1) / 2);
      const xGuides = [
        { x: xToPx(0), text: formatMonthAxisLabel(data[0].x), anchor: "start" },
        { x: xToPx(midIdx), text: formatMonthAxisLabel(data[midIdx].x), anchor: "middle" },
        { x: xToPx(data.length - 1), text: formatMonthAxisLabel(data[data.length - 1].x), anchor: "end" }
      ].filter((guide, index, arr) => arr.findIndex((item) => item.text === guide.text) === index || index === arr.length - 1);

      const lastIdx = data.length - 1;
      const lastX = xToPx(lastIdx);
      const lastY = yToPx(data[lastIdx].y);
      const lastLabel = yFmt(data[lastIdx].y);

      el.innerHTML = `
        <div class="chart-wrap">
          ${title ? `<div class="chart-title">${escapeHtml(title)}</div>` : ""}
          <div class="chart-toolbar">
            <button type="button" class="chart-zoom-btn" data-zoom="out">-</button>
            <button type="button" class="chart-zoom-btn" data-zoom="in">+</button>
            <button type="button" class="chart-zoom-btn" data-zoom="reset">リセット</button>
            <span class="chart-zoom-label">100%</span>
          </div>
          <div class="chart-tooltip"></div>
          <div class="chart-viewport">
            <svg class="chart" viewBox="0 0 ${W} ${H}">
              <defs>
                <linearGradient id="bgGrad-${escapeHtml(containerId)}" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#1e5bd7" stop-opacity="0.08"/>
                  <stop offset="100%" stop-color="#1e5bd7" stop-opacity="0"/>
                </linearGradient>
              </defs>

              ${tickLines.join("")}
              ${xGuides.map((guide) => `<line x1="${guide.x}" y1="${padT}" x2="${guide.x}" y2="${H - padB}" stroke="#eef2f7" stroke-dasharray="4 4"></line>`).join("")}
              ${tickLabels.join("")}

              <rect x="${padL}" y="${padT}" width="${W - padL - padR}" height="${H - padT - padB}" fill="url(#bgGrad-${escapeHtml(containerId)})" />

              <path d="${pathD}" fill="none" stroke="#1e5bd7" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>

              <line class="hover-line" y1="${padT}" y2="${H - padB}" stroke="#94a3b8" stroke-width="1" style="display:none;" />
              <circle class="hover-dot" r="5" fill="#1e5bd7" style="display:none;" />

              <rect class="hover-hit" x="${padL}" y="${padT}" width="${W - padL - padR}" height="${H - padT - padB}" fill="transparent"/>

              <circle cx="${lastX}" cy="${lastY}" r="5" fill="#1e5bd7"/>
              <text x="${lastX + 8}" y="${lastY - 8}" font-size="12" font-weight="800" fill="#111">${escapeHtml(lastLabel)}</text>

              ${xGuides.map((guide) => `<text x="${guide.x}" y="${H - 10}" font-size="14" fill="#111827" text-anchor="${guide.anchor}">${escapeHtml(guide.text)}</text>`).join("")}
            </svg>
          </div>
        </div>
      `;

      const wrap = el.querySelector(".chart-wrap");
      const viewport = el.querySelector(".chart-viewport");
      const svg = el.querySelector("svg.chart");
      const tip = el.querySelector(".chart-tooltip");
      const hit = el.querySelector(".hover-hit");
      const hLine = el.querySelector(".hover-line");
      const hDot = el.querySelector(".hover-dot");
      const zoomLabel = el.querySelector(".chart-zoom-label");
      const zoomBtns = Array.from(el.querySelectorAll(".chart-zoom-btn"));

      let zoom = 1;
      const minZoom = 1;
      const maxZoom = 3;
      const stepZoom = 0.25;

      function applyZoom(nextZoom) {
        zoom = Math.max(minZoom, Math.min(maxZoom, nextZoom));
        const pct = Math.round(zoom * 100);
        svg.style.width = `${pct}%`;
        zoomLabel.textContent = `${pct}%`;
        if (zoom === 1) viewport.scrollLeft = 0;
      }

      zoomBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          const mode = btn.getAttribute("data-zoom");
          if (mode === "in") applyZoom(zoom + stepZoom);
          if (mode === "out") applyZoom(zoom - stepZoom);
          if (mode === "reset") applyZoom(1);
        });
      });
      applyZoom(1);

      hit.addEventListener("mousemove", (ev) => {
        const rect = svg.getBoundingClientRect();
        const x = ev.clientX - rect.left;
        const vbX = (x / rect.width) * W;
        const t = (vbX - padL) / (W - padL - padR);
        const idx = Math.round(t * (data.length - 1));
        const safeIdx = Math.max(0, Math.min(data.length - 1, idx));

        const px = xToPx(safeIdx);
        const py = yToPx(data[safeIdx].y);

        hLine.style.display = "block";
        hDot.style.display = "block";
        tip.style.display = "block";

        hLine.setAttribute("x1", px);
        hLine.setAttribute("x2", px);
        hLine.setAttribute("y1", padT);
        hLine.setAttribute("y2", H - padB);
        hDot.setAttribute("cx", px);
        hDot.setAttribute("cy", py);

        tip.textContent = `${formatPeriodLabel(data[safeIdx].x)}：${yFmt(data[safeIdx].y)}`;
        const wrapRect = wrap.getBoundingClientRect();
        tip.style.left = `${Math.min(Math.max(ev.clientX - wrapRect.left, 40), wrapRect.width - 40)}px`;
        tip.style.top = `${Math.max(ev.clientY - wrapRect.top - 12, 8)}px`;
      });

      hit.addEventListener("mouseleave", () => {
        hLine.style.display = "none";
        hDot.style.display = "none";
        tip.style.display = "none";
      });
    }

    function renderLineChartV2(containerId, title, rows, xKey, yKey, yFmt) {
      const el = document.getElementById(containerId);
      if (!el) return;
      const hasValidY = (v) => Number.isFinite(v) && v > 0;
      const isMobile = typeof window !== "undefined" && window.matchMedia("(max-width: 767px)").matches;

      const data = (Array.isArray(rows) ? rows : [])
        .map(r => {
          const x = String(r?.[xKey] ?? "");
          const n = Number(r?.[yKey]);
          return { x, y: hasValidY(n) ? n : null };
        })
        .filter(p => p.x);
      const sourceBoundary = getMarketSourceBoundary(data);

      const validData = data.filter(p => hasValidY(p.y));
      if (data.length < 2 || validData.length < 2) {
        el.innerHTML = `<div class="chart-wrap"><div class="chart-title">${escapeHtml(title)}</div><div class="meta">データが不足しています（週次データが2点以上必要）</div></div>`;
        return;
      }

      if (isMobile) {
        const W = 350;
        const H = 190;
        const padL = 36;
        const padR = 24;
        const padT = 18;
        const padB = 36;
        const chartBottom = H - padB;
        const yValues = validData.map(d => d.y);
        let yMin = Math.min(...yValues);
        let yMax = Math.max(...yValues);
        const span = (yMax - yMin) || 1;
        yMin -= span * 0.12;
        yMax += span * 0.12;
        const yMid = yMin + ((yMax - yMin) / 2);
        const xToPx = (i) => data.length <= 1 ? padL : padL + (i / (data.length - 1)) * (W - padL - padR);
        const yToPx = (v) => padT + (1 - (v - yMin) / (yMax - yMin)) * (chartBottom - padT);
        const mobilePath = (() => {
          let d = "";
          let penDown = false;
          for (let i = 0; i < data.length; i++) {
            if (!hasValidY(data[i].y)) {
              penDown = false;
              continue;
            }
            d += `${penDown ? " L" : " M"} ${xToPx(i)} ${yToPx(data[i].y)}`;
            penDown = true;
          }
          return d.trim();
        })();
        const filledPoints = data
          .map((point, idx) => hasValidY(point?.y) ? `${xToPx(idx)} ${yToPx(point.y)}` : null)
          .filter(Boolean);
        const firstValidIdx = data.findIndex((point) => hasValidY(point?.y));
        const latestIdx = (() => {
          for (let i = data.length - 1; i >= 0; i--) {
            if (hasValidY(data[i]?.y)) return i;
          }
          return data.length - 1;
        })();
        const latest = data[latestIdx];
        const firstFillX = firstValidIdx >= 0 ? xToPx(firstValidIdx) : padL;
        const latestFillX = xToPx(latestIdx);
        const fillD = filledPoints.length >= 2
          ? `M ${firstFillX} ${chartBottom} L ${filledPoints.join(" L ")} L ${latestFillX} ${chartBottom} Z`
          : "";
        const baseDiff = hasValidY(latest?.y) ? latest.y - 100 : null;
        const diffCls = getTrendClass(baseDiff);
        const axisTicks = [
          { value: yMax, y: yToPx(yMax) },
          { value: yMid, y: yToPx(yMid) },
          { value: yMin, y: yToPx(yMin) }
        ];
        const midIdx = Math.floor((data.length - 1) / 2);
        const xLabels = [
          { x: xToPx(0) + 2, text: formatMonthAxisLabel(data[0].x), anchor: "start" },
          { x: xToPx(midIdx), text: formatMonthAxisLabel(data[midIdx].x), anchor: "middle" },
          { x: xToPx(data.length - 1) - 2, text: formatMonthAxisLabel(data[data.length - 1].x), anchor: "end" }
        ].filter((label, index, arr) => arr.findIndex((item) => item.text === label.text) === index || index === arr.length - 1);
        const boundaryX = sourceBoundary ? (xToPx(sourceBoundary.leftIdx) + xToPx(sourceBoundary.rightIdx)) / 2 : null;
        const leftLabelX = sourceBoundary ? Math.max(padL + 8, (padL + boundaryX) / 2) : null;
        const rightLabelX = sourceBoundary ? Math.min(W - padR - 8, (boundaryX + (W - padR)) / 2) : null;

        el.innerHTML = `
          <div class="chart-wrap chart-wrap--mobile">
            <div class="mobile-chart-summary" aria-label="指数サマリー">
              <div class="mobile-chart-stat">
                <span>現在指数</span>
                <strong>${hasValidY(latest?.y) ? escapeHtml(yFmt(latest.y)) : "-"}</strong>
              </div>
              <div class="mobile-chart-stat">
                <span>基準比</span>
                <strong class="${escapeHtml(diffCls)}">${Number.isFinite(baseDiff) ? escapeHtml(formatSignedPercent(baseDiff, 1)) : "-"}</strong>
              </div>
            </div>
            <div class="chart-tooltip"></div>
            <div class="chart-viewport">
              <svg class="chart chart--mobile-index" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="スリーブ指数の全期間推移">
                <defs>
                  <linearGradient id="mobileIndexGrad-${escapeHtml(containerId)}" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#1b3b5f" stop-opacity="0.13" />
                    <stop offset="100%" stop-color="#1b3b5f" stop-opacity="0" />
                  </linearGradient>
                </defs>
                <rect x="${padL}" y="${padT}" width="${W - padL - padR}" height="${chartBottom - padT}" rx="8" fill="#f8fbff"></rect>
                ${axisTicks.map((tick) => `<line x1="${padL}" y1="${tick.y}" x2="${W - padR}" y2="${tick.y}" stroke="#dfe7f3" stroke-width="1"></line><text x="${padL - 8}" y="${tick.y + 4}" text-anchor="end" font-size="9" font-weight="800" fill="#64748b">${escapeHtml(yFmt(tick.value))}</text>`).join("")}
                ${xLabels.map((label) => `<text x="${label.x}" y="${H - 18}" text-anchor="${label.anchor}" font-size="10" font-weight="800" fill="#475467">${escapeHtml(label.text)}</text>`).join("")}
                ${Number.isFinite(boundaryX) ? `<line x1="${boundaryX}" y1="${padT}" x2="${boundaryX}" y2="${chartBottom}" stroke="#1e3a5f" stroke-width="2.5" stroke-dasharray="6 6"></line>` : ""}
                ${Number.isFinite(leftLabelX) ? `<text x="${leftLabelX}" y="${padT + 14}" text-anchor="middle" font-size="8.5" font-weight="900" fill="#475467">${escapeHtml(sourceBoundary.leftLabel)}</text>` : ""}
                ${Number.isFinite(rightLabelX) ? `<text x="${rightLabelX}" y="${padT + 14}" text-anchor="middle" font-size="8.5" font-weight="900" fill="#1e3a5f">${escapeHtml(sourceBoundary.rightLabel)}</text>` : ""}
                <path d="${fillD}" fill="url(#mobileIndexGrad-${escapeHtml(containerId)})"></path>
                <path d="${mobilePath}" fill="none" stroke="#1b3b5f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>
                <circle cx="${latestFillX}" cy="${hasValidY(latest?.y) ? yToPx(latest.y) : chartBottom}" r="5.5" fill="#1b3b5f" stroke="#ffffff" stroke-width="3"></circle>
                <rect class="chart-main-hit" x="${padL}" y="${padT}" width="${W - padL - padR}" height="${chartBottom - padT}" fill="transparent"></rect>
              </svg>
            </div>
            <div class="chart-toolbar chart-toolbar--mobile-static" aria-label="表示期間">
              <span class="chart-zoom-label">全期間</span>
            </div>
          </div>
        `;

        const wrap = el.querySelector(".chart-wrap");
        const svg = el.querySelector("svg.chart");
        const tip = el.querySelector(".chart-tooltip");
        const hit = el.querySelector(".chart-main-hit");
        if (hit && svg && tip) {
          hit.addEventListener("mousemove", (ev) => {
            const rect = svg.getBoundingClientRect();
            const vbX = ((ev.clientX - rect.left) / rect.width) * W;
            const t = (vbX - padL) / (W - padL - padR);
            const idx = Math.max(0, Math.min(data.length - 1, Math.round(t * (data.length - 1))));
            const point = data[idx];
            const hasValue = hasValidY(point?.y);
            tip.style.display = "block";
            tip.textContent = `${formatPeriodLabel(point.x)} / 指数 ${hasValue ? yFmt(point.y) : "-"}`;
            const wrapRect = wrap.getBoundingClientRect();
            tip.style.left = `${Math.min(Math.max(ev.clientX - wrapRect.left, 56), wrapRect.width - 56)}px`;
            tip.style.top = "12px";
          });
          hit.addEventListener("mouseleave", () => {
            tip.style.display = "none";
          });
        }
        return;
      }

      const W = 980;
      const H = 420;
      const padL = 84;
      const padR = 34;
      const mainTop = 24;
      const mainBottom = 288;
      const xLabelY = 318;
      const navTop = 340;
      const navBottom = 392;
      const ticks = 4;
      const minWindow = Math.min(Math.max(2, Math.ceil(data.length * 0.12)), data.length);

      function formatMonthAxisLabel(value) {
        const matched = String(value || "").match(/^(\d{4})[\/\-](\d{2})/);
        if (matched) return `${String(matched[1]).slice(-2)}/${Number(matched[2])}`;
        return formatPeriodLabel(value);
      }

      function niceStep(range, t) {
        const rough = range / t;
        const pow = Math.pow(10, Math.floor(Math.log10(Math.max(rough, 1))));
        const candidates = [1, 2, 5, 10].map(m => m * pow);
        return candidates.reduce((best, v) => Math.abs(v - rough) < Math.abs(best - rough) ? v : best, candidates[0]);
      }

      const xToPxAll = (i) => {
        if (data.length <= 1) return padL;
        return padL + (i / (data.length - 1)) * (W - padL - padR);
      };

      function rangeLabel(start, end) {
        if (start === 0 && end === data.length - 1) return "全期間";
        return `${formatPeriodLabel(data[start].x)} 〜 ${formatPeriodLabel(data[end].x)}`;
      }

      function clampRange(start, end) {
        let s = Math.max(0, Math.min(data.length - 1, Math.round(start)));
        let e = Math.max(0, Math.min(data.length - 1, Math.round(end)));
        if (s > e) [s, e] = [e, s];
        if ((e - s + 1) < minWindow) {
          const need = minWindow - (e - s + 1);
          s -= Math.ceil(need / 2);
          e += Math.floor(need / 2);
          if (s < 0) {
            e += -s;
            s = 0;
          }
          if (e > data.length - 1) {
            const over = e - (data.length - 1);
            s = Math.max(0, s - over);
            e = data.length - 1;
          }
        }
        return [s, e];
      }

      el.innerHTML = `
        <div class="chart-wrap">
          <div class="chart-title">${escapeHtml(title)}</div>
          <div class="chart-toolbar">
            <button type="button" class="chart-zoom-btn" data-zoom="out">-</button>
            <button type="button" class="chart-zoom-btn" data-zoom="in">+</button>
            <button type="button" class="chart-zoom-btn" data-zoom="reset">全期間</button>
            <span class="chart-zoom-label">全期間</span>
          </div>
          <div class="chart-tooltip"></div>
          <div class="chart-viewport">
            <svg class="chart" viewBox="0 0 ${W} ${H}">
              <defs>
                <linearGradient id="bgGrad2-${escapeHtml(containerId)}" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#1e5bd7" stop-opacity="0.11" />
                  <stop offset="100%" stop-color="#1e5bd7" stop-opacity="0" />
                </linearGradient>
              </defs>
              <g class="main-grid"></g>
              <g class="main-labels"></g>
              <g class="main-callouts"></g>
               <path class="main-fill" fill="url(#bgGrad2-${escapeHtml(containerId)})"></path>
               <path class="main-line" fill="none" stroke="#1e5bd7" stroke-width="${isMobile ? 4 : 3}" stroke-linecap="round"></path>
              <line class="hover-line" stroke="#94a3b8" stroke-width="1" style="display:none;"></line>
               <circle class="hover-dot" r="${isMobile ? 6 : 5}" fill="#1e5bd7" style="display:none;"></circle>
              <rect class="chart-main-hit" x="${padL}" y="${mainTop}" width="${W - padL - padR}" height="${mainBottom - mainTop}" fill="transparent"></rect>
              <g class="main-x-labels"></g>
              <path class="nav-line" fill="none" stroke="#8aa1d6" stroke-width="2"></path>
              <rect class="chart-nav-hit" x="${padL}" y="${navTop}" width="${W - padL - padR}" height="${navBottom - navTop}" fill="transparent"></rect>
              <rect class="chart-range" y="${navTop}" height="${navBottom - navTop}"></rect>
              <rect class="chart-handle chart-handle-left" y="${navTop}" width="14" height="${navBottom - navTop}"></rect>
              <rect class="chart-handle chart-handle-right" y="${navTop}" width="14" height="${navBottom - navTop}"></rect>
            </svg>
          </div>
        </div>
      `;

      const wrap = el.querySelector(".chart-wrap");
      const svg = el.querySelector("svg.chart");
      const tip = el.querySelector(".chart-tooltip");
      const hitMain = el.querySelector(".chart-main-hit");
      const hitNav = el.querySelector(".chart-nav-hit");
      const hLine = el.querySelector(".hover-line");
      const hDot = el.querySelector(".hover-dot");
      const mainGrid = el.querySelector(".main-grid");
      const mainLabels = el.querySelector(".main-labels");
      const mainCallouts = el.querySelector(".main-callouts");
      const mainXLabels = el.querySelector(".main-x-labels");
      const mainFill = el.querySelector(".main-fill");
      const mainLine = el.querySelector(".main-line");
      const navLine = el.querySelector(".nav-line");
      const rangeRect = el.querySelector(".chart-range");
      const leftHandle = el.querySelector(".chart-handle-left");
      const rightHandle = el.querySelector(".chart-handle-right");
      const zoomLabel = el.querySelector(".chart-zoom-label");
      const zoomBtns = Array.from(el.querySelectorAll(".chart-zoom-btn"));

      const yAllMin = Math.min(...validData.map(d => d.y));
      const yAllMax = Math.max(...validData.map(d => d.y));
      const yAllSpan = (yAllMax - yAllMin) || 1;
      const yNavMin = yAllMin - yAllSpan * 0.08;
      const yNavMax = yAllMax + yAllSpan * 0.08;

      const yToPxNav = (v) => navTop + (1 - (v - yNavMin) / (yNavMax - yNavMin)) * (navBottom - navTop);
      const navPath = (() => {
        let d = "";
        let penDown = false;
        for (let i = 0; i < data.length; i++) {
          if (!hasValidY(data[i].y)) {
            penDown = false;
            continue;
          }
          d += `${penDown ? " L" : " M"} ${xToPxAll(i)} ${yToPxNav(data[i].y)}`;
          penDown = true;
        }
        return d.trim();
      })();
      navLine.setAttribute("d", navPath);

      let rangeStart = 0;
      let rangeEnd = data.length - 1;
      let activeRange = [0, data.length - 1];
      let dragMode = null;
      let dragAnchor = 0;
      let dragLength = data.length;

      function toSvgX(clientX) {
        const rect = svg.getBoundingClientRect();
        const x = clientX - rect.left;
        return (x / rect.width) * W;
      }

      function idxFromClientX(clientX) {
        const vbX = toSvgX(clientX);
        const t = (vbX - padL) / (W - padL - padR);
        const idx = Math.round(t * (data.length - 1));
        return Math.max(0, Math.min(data.length - 1, idx));
      }

      function renderRange() {
        const [s, e] = activeRange;
        const visible = data.slice(s, e + 1);
        if (!visible.length) return;

        const xToPxMain = (i) => {
          if (visible.length <= 1) return padL;
          return padL + (i / (visible.length - 1)) * (W - padL - padR);
        };

        const ys = visible.map(v => v.y).filter(v => hasValidY(v));
        if (!ys.length) {
          mainLine.setAttribute("d", "");
          mainFill.setAttribute("d", "");
          return;
        }
        let yMin = Math.min(...ys);
        let yMax = Math.max(...ys);
        const margin = (yMax - yMin) * 0.12 || 1;
        yMin -= margin;
        yMax += margin;
        const step = niceStep(yMax - yMin, ticks);
        yMin = Math.floor(yMin / step) * step;
        yMax = Math.ceil(yMax / step) * step;

        const yToPxMain = (v) => mainTop + (1 - (v - yMin) / (yMax - yMin)) * (mainBottom - mainTop);
        let pathD = "";
        let penDown = false;
        for (let i = 0; i < visible.length; i++) {
          const y = visible[i].y;
          if (!hasValidY(y)) {
            penDown = false;
            continue;
          }
          pathD += `${penDown ? " L" : " M"} ${xToPxMain(i)} ${yToPxMain(y)}`;
          penDown = true;
        }
        mainLine.setAttribute("d", pathD);
        const filledPoints = visible
          .map((point, idx) => hasValidY(point?.y) ? `${xToPxMain(idx)} ${yToPxMain(point.y)}` : null)
          .filter(Boolean);
        if (filledPoints.length >= 2) {
          const firstX = xToPxMain(visible.findIndex((point) => hasValidY(point?.y)));
          const lastX = xToPxMain(visible.length - 1 - [...visible].reverse().findIndex((point) => hasValidY(point?.y)));
          mainFill.setAttribute("d", `M ${firstX} ${mainBottom} L ${filledPoints.join(" L ")} L ${lastX} ${mainBottom} Z`);
        } else {
          mainFill.setAttribute("d", "");
        }

        const gridLines = [];
        const yLabels = [];
        for (let i = 0; i <= ticks; i++) {
          const v = yMin + (i / ticks) * (yMax - yMin);
          const y = yToPxMain(v);
          gridLines.push(`<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#e6e8ef"/>`);
            yLabels.push(`<text x="${padL - 12}" y="${y + 6}" text-anchor="end" font-size="${isMobile ? 18 : 15}" fill="#111827" font-weight="800">${escapeHtml(yFmt(v))}</text>`);
        }
        mainGrid.innerHTML = gridLines.join("");
        mainLabels.innerHTML = yLabels.join("");
        mainCallouts.innerHTML = "";

        const midIdx = Math.floor((visible.length - 1) / 2);
        const xLabels = [
          { x: xToPxMain(0), text: formatMonthAxisLabel(visible[0].x), anchor: "start" },
          { x: xToPxMain(midIdx), text: formatMonthAxisLabel(visible[midIdx].x), anchor: "middle" },
          { x: xToPxMain(visible.length - 1), text: formatMonthAxisLabel(visible[visible.length - 1].x), anchor: "end" }
        ].filter((label, index, arr) => arr.findIndex((item) => item.text === label.text) === index || index === arr.length - 1);
        const visibleBoundary = sourceBoundary && sourceBoundary.leftIdx >= s && sourceBoundary.rightIdx <= e
          ? {
            x: (xToPxMain(sourceBoundary.leftIdx - s) + xToPxMain(sourceBoundary.rightIdx - s)) / 2,
            leftLabel: sourceBoundary.leftLabel,
            rightLabel: sourceBoundary.rightLabel
          }
          : null;
        xLabels.forEach((label) => {
          gridLines.push(`<line x1="${label.x}" y1="${mainTop}" x2="${label.x}" y2="${mainBottom}" stroke="#eef2f7" stroke-dasharray="4 4"/>`);
        });
        if (visibleBoundary) {
          gridLines.push(`<line x1="${visibleBoundary.x}" y1="${mainTop}" x2="${visibleBoundary.x}" y2="${mainBottom}" stroke="#1e3a5f" stroke-width="3" stroke-dasharray="8 8"/>`);
        }
        mainGrid.innerHTML = gridLines.join("");
        mainXLabels.innerHTML = xLabels.map(l =>
           `<text x="${l.x}" y="${xLabelY}" font-size="${isMobile ? 19 : 16}" font-weight="800" fill="#111827" text-anchor="${l.anchor}">${escapeHtml(l.text)}</text>`
        ).join("");

        const firstPointIdx = visible.findIndex((point) => hasValidY(point?.y));
        const latestPointIdx = (() => {
          for (let i = visible.length - 1; i >= 0; i--) {
            if (hasValidY(visible[i]?.y)) return i;
          }
          return -1;
        })();
        if (firstPointIdx >= 0 && latestPointIdx >= 0) {
          const firstPoint = visible[firstPointIdx];
          const latestPoint = visible[latestPointIdx];
          const firstX = xToPxMain(firstPointIdx);
          const firstY = yToPxMain(firstPoint.y);
          const latestX = xToPxMain(latestPointIdx);
          const latestY = yToPxMain(latestPoint.y);
          const baseDiff = Number.isFinite(latestPoint.y) ? latestPoint.y - 100 : null;
          const basePct = Number.isFinite(baseDiff) ? baseDiff : null;
          const diffCls = getTrendClass(basePct);
          const startAnchor = firstX < (padL + 90) ? "start" : "end";
          const startLabelX = startAnchor === "start" ? firstX + 10 : firstX - 10;
          const latestInfoX = W - (isMobile ? 156 : 176);
          const latestInfoY = xLabelY + (isMobile ? 42 : 32);
          const latestInfoLine2Y = latestInfoY + (isMobile ? 28 : 22);
          const latestLeaderEndX = latestInfoX - (isMobile ? 12 : 14);
          const latestLeaderBottomY = latestInfoY - (isMobile ? 22 : 18);
          const latestMarkerRadius = isMobile ? 10 : 8;
          const latestLeaderStartX = latestX + latestMarkerRadius + 2;

           mainGrid.innerHTML += `<line x1="${padL}" y1="${latestY}" x2="${W - padR}" y2="${latestY}" stroke="#9bb4ea" stroke-dasharray="6 6"/>`;
            mainCallouts.innerHTML = `
              ${visibleBoundary ? `<text x="${Math.max(padL + 12, (padL + visibleBoundary.x) / 2)}" y="${mainTop + 18}" text-anchor="middle" font-size="14" font-weight="900" fill="#475467">${escapeHtml(visibleBoundary.leftLabel)}</text>` : ""}
              ${visibleBoundary ? `<text x="${Math.min(W - padR - 12, (visibleBoundary.x + (W - padR)) / 2)}" y="${mainTop + 18}" text-anchor="middle" font-size="14" font-weight="900" fill="#1e3a5f">${escapeHtml(visibleBoundary.rightLabel)}</text>` : ""}
              <circle cx="${firstX}" cy="${firstY}" r="${isMobile ? 6 : 5}" fill="#ffffff" stroke="#1e5bd7" stroke-width="3"></circle>
              <text x="${startLabelX}" y="${Math.max(mainTop + 18, firstY - (isMobile ? 22 : 18))}" text-anchor="${startAnchor}" class="chart-callout-label">開始 ${escapeHtml(yFmt(firstPoint.y))}</text>
              <circle cx="${latestX}" cy="${latestY}" r="${isMobile ? 8 : 7}" fill="#1e5bd7" stroke="#ffffff" stroke-width="4"></circle>
              <path d="M ${latestLeaderStartX} ${latestY} L ${latestLeaderEndX} ${latestY} L ${latestLeaderEndX} ${latestLeaderBottomY}" fill="none" stroke="#1e3a5f" stroke-width="${isMobile ? 2.2 : 2}" stroke-linecap="round" stroke-linejoin="round"></path>
              <text x="${latestInfoX}" y="${latestInfoY}" text-anchor="start" class="chart-callout-label">現在指数 ${escapeHtml(yFmt(latestPoint.y))}</text>
              <text x="${latestInfoX}" y="${latestInfoLine2Y}" text-anchor="start" class="chart-callout-sub ${escapeHtml(diffCls)}">${escapeHtml(formatSignedPercent(basePct, 1))}</text>
            `;
          }

        const rangeX1 = xToPxAll(s);
        const rangeX2 = xToPxAll(e);
        rangeRect.setAttribute("x", rangeX1);
        rangeRect.setAttribute("width", Math.max(2, rangeX2 - rangeX1));
        leftHandle.setAttribute("x", rangeX1 - 7);
        rightHandle.setAttribute("x", rangeX2 - 7);
        zoomLabel.textContent = rangeLabel(s, e);

        hitMain.onmousemove = (ev) => {
          const vbX = toSvgX(ev.clientX);
          const t = (vbX - padL) / (W - padL - padR);
          const visIdx = Math.max(0, Math.min(visible.length - 1, Math.round(t * (visible.length - 1))));
          const point = visible[visIdx];
          const px = xToPxMain(visIdx);
          const hasValue = hasValidY(point?.y);
          const py = hasValue ? yToPxMain(point.y) : null;

          hLine.style.display = "block";
          hDot.style.display = hasValue ? "block" : "none";
          tip.style.display = "block";
          hLine.setAttribute("x1", px);
          hLine.setAttribute("x2", px);
          hLine.setAttribute("y1", mainTop);
          hLine.setAttribute("y2", mainBottom);
          if (hasValue) {
            hDot.setAttribute("cx", px);
            hDot.setAttribute("cy", py);
          }

          const basePct = hasValue ? (point.y - 100) : null;
          tip.textContent = `${formatPeriodLabel(point.x)} / 指数 ${hasValue ? yFmt(point.y) : "-"} / 基準比 ${hasValue ? formatSignedPercent(basePct, 1) : "-"}`;
          const wrapRect = wrap.getBoundingClientRect();
          tip.style.left = `${Math.min(Math.max(ev.clientX - wrapRect.left, 56), wrapRect.width - 56)}px`;
          const tipY = Math.max(ev.clientY - wrapRect.top - tip.offsetHeight - 12, 8);
          tip.style.top = `${tipY}px`;
        };
      }

      function updateRange(start, end) {
        const [s, e] = clampRange(start, end);
        activeRange = [s, e];
        rangeStart = s;
        rangeEnd = e;
        renderRange();
      }

      function hideHover() {
        hLine.style.display = "none";
        hDot.style.display = "none";
        tip.style.display = "none";
      }

      hitMain.addEventListener("mouseleave", hideHover);

      hitNav.addEventListener("pointerdown", (ev) => {
        const idx = idxFromClientX(ev.clientX);
        const leftX = xToPxAll(rangeStart);
        const rightX = xToPxAll(rangeEnd);
        const downX = toSvgX(ev.clientX);
        const nearLeft = Math.abs(downX - leftX) <= 20;
        const nearRight = Math.abs(downX - rightX) <= 20;

        if (nearLeft) dragMode = "left";
        else if (nearRight) dragMode = "right";
        else if (idx >= rangeStart && idx <= rangeEnd) {
          dragMode = "move";
          dragAnchor = idx - rangeStart;
          dragLength = rangeEnd - rangeStart + 1;
        } else {
          dragMode = null;
          const span = rangeEnd - rangeStart;
          const nextStart = Math.max(0, Math.min(data.length - 1 - span, idx - Math.floor(span / 2)));
          updateRange(nextStart, nextStart + span);
        }
        hitNav.setPointerCapture(ev.pointerId);
      });

      hitNav.addEventListener("pointermove", (ev) => {
        if (!dragMode) return;
        const idx = idxFromClientX(ev.clientX);
        if (dragMode === "left") updateRange(idx, rangeEnd);
        if (dragMode === "right") updateRange(rangeStart, idx);
        if (dragMode === "move") {
          let nextStart = idx - dragAnchor;
          nextStart = Math.max(0, Math.min(data.length - dragLength, nextStart));
          updateRange(nextStart, nextStart + dragLength - 1);
        }
      });

      hitNav.addEventListener("pointerup", (ev) => {
        dragMode = null;
        if (hitNav.hasPointerCapture(ev.pointerId)) hitNav.releasePointerCapture(ev.pointerId);
      });

      hitNav.addEventListener("pointercancel", (ev) => {
        dragMode = null;
        if (hitNav.hasPointerCapture(ev.pointerId)) hitNav.releasePointerCapture(ev.pointerId);
      });

      zoomBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          const mode = btn.getAttribute("data-zoom");
          const span = rangeEnd - rangeStart + 1;
          const center = Math.round((rangeStart + rangeEnd) / 2);
          if (mode === "in") {
            const nextSpan = Math.max(minWindow, Math.floor(span * 0.75));
            const half = Math.floor(nextSpan / 2);
            updateRange(center - half, center - half + nextSpan - 1);
          }
          if (mode === "out") {
            const nextSpan = Math.min(data.length, Math.ceil(span * 1.3));
            const half = Math.floor(nextSpan / 2);
            updateRange(center - half, center - half + nextSpan - 1);
          }
          if (mode === "reset") updateRange(0, data.length - 1);
        });
      });

      updateRange(0, data.length - 1);
    }

    // ---- v2: market index logic (overrides legacy implementations) ----
    function percentileV2(sorted, p) {
      if (!Array.isArray(sorted) || !sorted.length) return null;
      const idx = Math.max(0, Math.min(sorted.length - 1, Math.floor((sorted.length - 1) * p)));
      return sorted[idx];
    }

    function buildWeeklyMarketSeries(entries, weeks, opts) {
      const periodType = opts?.periodType || "week";
      const minPrice = opts?.minPrice ?? 300;
      const weightCap = opts?.weightCap ?? 20;
      const maxRatio = opts?.maxRatio ?? 2.5;
      const hardLo = -Math.log(maxRatio);
      const hardHi = Math.log(maxRatio);
      const hasValidPrice = (v) => Number.isFinite(v) && v > 0;
      const maps = (Array.isArray(entries) ? entries : []).map((entry) => entry.weekMap);

      const rows = [];
      for (let i = 1; i < weeks.length; i++) {
        const cur = weeks[i];
        const prev = weeks[i - 1];
        if (periodKind(cur) !== periodType || periodKind(prev) !== periodType) continue;

        const items = [];
        let up = 0, down = 0, flat = 0;

        for (const mp of maps) {
          const p = mp.get(prev);
          const c = mp.get(cur);
          if (!p || !c) continue;
          if (!hasValidPrice(p.price) || !hasValidPrice(c.price)) continue;
          if (p.price < minPrice) continue;

          const c0 = Number.isFinite(Number(p.count)) && Number(p.count) > 0 ? Number(p.count) : 1;
          const c1 = Number.isFinite(Number(c.count)) && Number(c.count) > 0 ? Number(c.count) : 1;

          let logR = Math.log(c.price / p.price);
          logR = clip(logR, hardLo, hardHi);
          const w = Math.min(Math.sqrt(c0 * c1), weightCap);
          if (!(w > 0)) continue;

          items.push({ logR, w });
          if (logR > 0) up++;
          else if (logR < 0) down++;
          else flat++;
        }

        if (!items.length) {
          rows.push({ week: cur, avgLogReturn: null, avgRate: null, sample: 0, up: 0, down: 0, flat: 0, confidence: "low" });
          continue;
        }

        let lo = -Infinity;
        let hi = Infinity;
        if (items.length >= 20) {
          const sorted = items.map((x) => x.logR).sort((a, b) => a - b);
          lo = percentileV2(sorted, 0.05);
          hi = percentileV2(sorted, 0.95);
        }

        let sw = 0;
        let swr = 0;
        for (const it of items) {
          const rr = clip(it.logR, lo, hi);
          sw += it.w;
          swr += it.w * rr;
        }
        const avgLogReturn = sw > 0 ? (swr / sw) : null;
        const avgRate = Number.isFinite(avgLogReturn) ? ((Math.exp(avgLogReturn) - 1) * 100) : null;
        rows.push({
          week: cur,
          avgLogReturn,
          avgRate,
          sample: items.length,
          up, down, flat,
          confidence: items.length < 10 ? "low" : "normal"
        });
      }
      return rows;
    }

    function buildCumulativeIndexFromRates(rateRows, baseIndex = 100, opts = {}) {
      const baseMonth = String(opts.baseMonth || MARKET_INDEX_BASE_MONTH || "").trim();
      const baseLabel = String(opts.baseLabel || MARKET_INDEX_BASE_LABEL || baseMonth || "基準月").trim();
      const validBaseIndexes = (Array.isArray(rateRows) ? rateRows : [])
        .map((row, index) => ({ row, index }))
        .filter(({ row }) => Number.isFinite(row?.avgLogReturn));
      const targetBase = baseMonth
        ? validBaseIndexes.find(({ row }) => String(row?.week || "").slice(0, 7) >= baseMonth)
        : validBaseIndexes[0];
      const fallbackBase = targetBase || validBaseIndexes[0] || null;
      const baseIndexPosition = fallbackBase ? fallbackBase.index : -1;
      const baseWeek = fallbackBase?.row?.week || null;
      let indexVal = null;
      const out = [];
      for (let i = 0; i < rateRows.length; i++) {
        const row = rateRows[i];
        const hasRate = Number.isFinite(row?.avgLogReturn);
        if (baseIndexPosition < 0 || i < baseIndexPosition) {
          out.push({ ...row, index: null, baseWeek, baseMonth, baseLabel });
          continue;
        }
        if (!hasRate) {
          out.push({ ...row, index: indexVal, baseWeek, baseMonth, baseLabel });
          continue;
        }
        if (indexVal == null) {
          indexVal = baseIndex;
          out.push({ ...row, index: indexVal, baseWeek, baseMonth, baseLabel });
          continue;
        }
        indexVal = indexVal * Math.exp(row.avgLogReturn);
        out.push({ ...row, index: indexVal, baseWeek, baseMonth, baseLabel });
      }
      return out;
    }

    function buildLatestContributors(entries, weeks, opts) {
      const minPrice = opts?.minPrice ?? 300;
      const weightCap = opts?.weightCap ?? 20;
      const maxRatio = opts?.maxRatio ?? 2.5;
      const hardLo = -Math.log(maxRatio);
      const hardHi = Math.log(maxRatio);
      const hasValidPrice = (v) => Number.isFinite(v) && v > 0;
      const percentile = (sorted, p) => {
        if (!sorted.length) return null;
        const idx = Math.max(0, Math.min(sorted.length - 1, Math.floor((sorted.length - 1) * p)));
        return sorted[idx];
      };

      if (!Array.isArray(weeks) || weeks.length < 2) {
        return { prevWeek: null, curWeek: null, up: [], down: [] };
      }
      const curWeek = weeks[weeks.length - 1];
      const prevWeek = weeks[weeks.length - 2];

      const items = [];
      for (const entry of (Array.isArray(entries) ? entries : [])) {
        const s = entry.sleeve;
        const map = entry.weekMap;
        const p = map.get(prevWeek);
        const c = map.get(curWeek);
        if (!p || !c) continue;
        if (!hasValidPrice(p.price) || !hasValidPrice(c.price)) continue;
        if (p.price < minPrice) continue;

        const c0 = Number.isFinite(Number(p.count)) && Number(p.count) > 0 ? Number(p.count) : 1;
        const c1 = Number.isFinite(Number(c.count)) && Number(c.count) > 0 ? Number(c.count) : 1;

        let logR = Math.log(c.price / p.price);
        logR = clip(logR, hardLo, hardHi);
        const w = Math.min(Math.sqrt(c0 * c1), weightCap);
        if (!(w > 0)) continue;

        items.push({
          id: s.id ?? "",
          name: String(s.name ?? "Sleeve"),
          logR,
          w
        });
      }

      if (!items.length) return { prevWeek, curWeek, up: [], down: [] };

      let lo = -Infinity;
      let hi = Infinity;
      if (items.length >= 20) {
        const sorted = items.map((x) => x.logR).sort((a, b) => a - b);
        lo = percentile(sorted, 0.05);
        hi = percentile(sorted, 0.95);
      }

      const enriched = items.map((x) => {
        const logR = clip(x.logR, lo, hi);
        const rate = (Math.exp(logR) - 1) * 100;
        const contrib = x.w * logR;
        return { id: x.id, name: x.name, rate, contrib };
      });

      const up = enriched
        .filter((x) => x.contrib > 0)
        .sort((a, b) => b.contrib - a.contrib)
        .slice(0, 8);
      const down = enriched
        .filter((x) => x.contrib < 0)
        .sort((a, b) => a.contrib - b.contrib)
        .slice(0, 8);

      return { prevWeek, curWeek, up, down };
    }

    function formatSignedPercent(value, digits = 1) {
      if (!Number.isFinite(value)) return "—";

    function getTrendClass(value) {

    function describeMarketState(series, latestRow) {
      const valid = (Array.isArray(series) ? series : []).filter((row) => Number.isFinite(row?.index));
      const last = latestRow && Number.isFinite(latestRow.avgRate) ? latestRow : valid[valid.length - 1];
      if (!last || !valid.length) {
        return { label: "判定できません", note: "指数データが不足しています。", cls: "flat" };
      }

      const recent = valid.slice(-4);
      const slope = recent.length >= 2 ? recent[recent.length - 1].index - recent[0].index : 0;
      const weeklyRate = Number.isFinite(last.avgRate) ? last.avgRate : 0;
      const strength = slope + (weeklyRate * 0.8);

      if (strength >= 2.5 || weeklyRate >= 1.2) {
        return { label: "上昇中", note: "指数は持ち直しつつあり、市場全体に買いが広がっています。", cls: "up" };
      }
      if (strength <= -2.5 || weeklyRate <= -1.2) {
        return { label: "下落", note: "指数は弱含みで、全体としてやや慎重な値動きです。", cls: "down" };
      }
      return { label: "横ばい", note: "大きな方向感はまだ薄く、相場はもみ合いに近い状態です。", cls: "flat" };

    function formatMarketYen(value) {
      if (!Number.isFinite(value)) return "--";

    function formatMarketCompactYen(value) {
      if (!Number.isFinite(value)) return "--";

      if (abs >= 10000) {
        const man = value / 10000;
        return `${Number.isInteger(man) ? man.toFixed(0) : man.toFixed(1)}万`;

    function formatMarketSignedYen(value) {

    }

    function findNearestPriorPoint(points, latestIndex, minDaysAgo) {
      const latest = points[latestIndex];
      if (!latest?.date) return null;
      const cutoff = latest.date.getTime() - minDaysAgo * 86400000;
      for (let i = latestIndex - 1; i >= 0; i--) {
        const point = points[i];
        if (point?.date && point.date.getTime() <= cutoff && Number.isFinite(point.avgPrice)) return point;
      }
      return null;
    }

    function buildAveragePriceSeries(entries, periods, periodType) {
      const hasValidPrice = (v) => Number.isFinite(v) && v > 0;
      const parsePrice = (value) => {
        const price = Number(String(value ?? "").replace(/,/g, ""));
        return hasValidPrice(price) ? price : null;
      };
      const buildTimeline = (sleeve) => {
        const source = periodType === "month" ? sleeve?.monthlyPrices : sleeve?.weeklyPrices;
        return (Array.isArray(source) ? source : [])
          .map((row) => {
            const period = toISODate(periodType === "month" ? (row.month ?? row.week) : row.week);
            const price = parsePrice(row.price);
            if (!period || periodKind(period) !== periodType || !hasValidPrice(price)) return null;
            return {
              period,
              time: new Date(period).getTime(),
              price
            };
          })
          .filter(Boolean)
          .sort((a, b) => a.time - b.time);
      };
      const timelines = (Array.isArray(entries) ? entries : [])
        .map((entry) => buildTimeline(entry.sleeve))
        .filter((timeline) => timeline.length);
      const cursors = timelines.map(() => -1);

      return (Array.isArray(periods) ? periods : [])
        .filter((period) => periodKind(period) === periodType)
        .sort((a, b) => String(a).localeCompare(String(b)))
        .map((period) => {
          const periodDate = new Date(period);
          const periodTime = periodDate.getTime();
          let totalPrice = 0;
          let targetCount = 0;
          let updateCount = 0;

          timelines.forEach((timeline, index) => {
            let updatedThisPeriod = false;
            while (cursors[index] + 1 < timeline.length && timeline[cursors[index] + 1].time <= periodTime) {
              cursors[index]++;
              if (timeline[cursors[index]].period === period) updatedThisPeriod = true;
            }
            const latest = timeline[cursors[index]];
            if (latest && hasValidPrice(latest.price)) {
              totalPrice += latest.price;
              targetCount++;
            }
            if (updatedThisPeriod) updateCount++;
          });

          const avgPrice = targetCount > 0 ? totalPrice / targetCount : null;
          return {
            week: period,
            x: period,
            date: periodDate,
            avgPrice,
            totalPrice,
            targetCount,
            updateCount
          };
        })
        .filter((row) => row.date && !Number.isNaN(row.date.getTime()))
        .sort((a, b) => a.date - b.date);
    }

    function addMovingAverage(points, windowSize = 20) {
      const list = (Array.isArray(points) ? points : []).map((point) => ({ ...point }));
      for (let i = 0; i < list.length; i++) {
        const window = list
          .slice(Math.max(0, i - windowSize + 1), i + 1)
          .map((point) => point.avgPrice)
          .filter((value) => Number.isFinite(value));
        if (!window.length) continue;
        const mean = window.reduce((sum, value) => sum + value, 0) / window.length;
        list[i].ma20 = mean;
      }
      return list;
    }

    function updatePriceSummaryCards(priceSeries) {
      const valid = (Array.isArray(priceSeries) ? priceSeries : []).filter((point) => Number.isFinite(point.avgPrice));
      const latest = valid[valid.length - 1] || null;
      const prev = valid.length >= 2 ? valid[valid.length - 2] : null;
      const monthBase = latest ? findNearestPriorPoint(valid, valid.length - 1, 28) : null;
      const yearBase = latest ? findNearestPriorPoint(valid, valid.length - 1, 365) : null;
      const setText = (id, text) => {

        if (!latestPoint || !basePoint || !Number.isFinite(basePoint.avgPrice) || basePoint.avgPrice <= 0) {
          valueEl.textContent = "--";

          valueEl.className = "metric-value flat";
          pctEl.className = "metric-foot flat";
          return;
        }
        const diff = latestPoint.avgPrice - basePoint.avgPrice;
        const pct = (diff / basePoint.avgPrice) * 100;
        const cls = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
        valueEl.className = `metric-value ${cls}`;
        pctEl.className = `metric-foot ${cls}`;
        valueEl.textContent = formatMarketSignedYen(diff);
        pctEl.textContent = `${diff > 0 ? "+" : ""}${pct.toFixed(1)}%`;
      };

      setText("kpiLatestPrice", latest ? formatMarketYen(latest.avgPrice) : "--");
      setHtml("kpiLatestMeta", latest
        ? `${escapeHtml(formatMetaDate(latest.week))}<br>対象：${Number(latest.targetCount || 0).toLocaleString()}種類<br>今週更新：${Number(latest.updateCount || 0).toLocaleString()}種類`
        : "集計中");
      setChange("kpiPrevChange", "kpiPrevPct", latest, prev);
      setChange("kpiMonthChange", "kpiMonthPct", latest, monthBase);
      setChange("kpiYearChange", "kpiYearPct", latest, yearBase);
    }

        const chartData = addMovingAverage(rawChartData);
        const W = 1200;

        const priceValues = chartData.flatMap((row) => [row.avgPrice, row.ma20].filter(Number.isFinite));
        let yMin = Math.min(...priceValues);
        let yMax = Math.max(...priceValues);
        const ySpan = yMax - yMin || 1;
        yMin = Math.max(0, Math.floor((yMin - ySpan * 0.12) / 100) * 100);
        yMax = Math.ceil((yMax + ySpan * 0.12) / 100) * 100;
        if (yMax <= yMin) yMax = yMin + 100;
        const maxCount = Math.max(1, ...chartData.map((row) => Number(row.updateCount) || 0));
        const firstTime = chartData[0].date.getTime();
        const lastTime = chartData[chartData.length - 1].date.getTime();
        const timeSpan = lastTime - firstTime || 1;
        const xToPx = (date) => padL + ((date.getTime() - firstTime) / timeSpan) * chartW;
        const yToPx = (value) => padT + (1 - (value - yMin) / (yMax - yMin)) * chartH;
        const countToY = (count) => chartBottom - ((Number(count) || 0) / maxCount) * chartH * 0.38;
        const linePath = (key) => {
          let d = "";
          let pen = false;
          for (const row of chartData) {
            const value = row[key];
            if (!Number.isFinite(value)) {
              pen = false;
              continue;
            }
            d += `${pen ? " L" : " M"} ${xToPx(row.date).toFixed(2)} ${yToPx(value).toFixed(2)}`;
            pen = true;
          }
          return d.trim();
        };
        const areaPath = (() => {
          const pts = chartData.filter((row) => Number.isFinite(row.avgPrice));
          if (pts.length < 2) return "";
          const top = pts.map((row) => `${xToPx(row.date).toFixed(2)} ${yToPx(row.avgPrice).toFixed(2)}`).join(" L ");
          const last = pts[pts.length - 1];
          const first = pts[0];
          return `M ${top} L ${xToPx(last.date).toFixed(2)} ${chartBottom} L ${xToPx(first.date).toFixed(2)} ${chartBottom} Z`;
        })();
        const yTicks = Array.from({ length: 6 }, (_, i) => yMin + ((yMax - yMin) / 5) * i);
        const countTicks = Array.from({ length: 5 }, (_, i) => (maxCount / 4) * i);
        const monthTicks = [];
        const firstMonth = new Date(chartData[0].date.getFullYear(), chartData[0].date.getMonth(), 1);
        for (let date = firstMonth; date <= chartData[chartData.length - 1].date; date = new Date(date.getFullYear(), date.getMonth() + 1, 1)) {
          if (date >= chartData[0].date) monthTicks.push(new Date(date));
        }
        if (monthTicks.length > 9) {
          const step = Math.ceil(monthTicks.length / 9);
          for (let i = monthTicks.length - 1; i >= 0; i--) {
            if (i % step !== 0) monthTicks.splice(i, 1);
          }
        }
        const lastPoint = chartData[chartData.length - 1];
        const barWidth = Math.max(3, Math.min(9, chartW / Math.max(chartData.length, 1) * 0.45));

        canvas.innerHTML = `
          <svg class="price-index-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="全スリーブ平均相場">
            <defs>
              <linearGradient id="avgPriceFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#2563eb" stop-opacity=".22"></stop>
                <stop offset="100%" stop-color="#2563eb" stop-opacity=".04"></stop>
              </linearGradient>
            </defs>
            <text x="${padL - 62}" y="${padT - 22}" font-size="15" font-weight="800" fill="#334155">平均相場（円）</text>
            <text x="${W - padR - 6}" y="${padT - 22}" text-anchor="end" font-size="15" font-weight="800" fill="#334155">更新数（件）</text>
            ${yTicks.map((value) => {
              const y = yToPx(value);
              return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#d8e1ec" stroke-width="1" stroke-dasharray="4 4"></line><text x="${padL - 12}" y="${y + 5}" text-anchor="end" font-size="16" fill="#334155">${escapeHtml(formatMarketYen(value))}</text>`;
            }).join("")}
            ${countTicks.map((value) => {
              const y = chartBottom - (value / maxCount) * chartH;
              return `<text x="${W - padR + 12}" y="${y + 5}" font-size="16" fill="#334155">${Math.round(value).toLocaleString()}件</text>`;
            }).join("")}
            ${monthTicks.map((date) => {
              const x = xToPx(date);
              const label = date.getMonth() === 0 ? `${date.getFullYear()}年1月` : `${date.getFullYear()}年${date.getMonth() + 1}月`;
              return `<line x1="${x}" y1="${padT}" x2="${x}" y2="${chartBottom}" stroke="#e6edf5" stroke-width="1"></line><text x="${x}" y="${H - 22}" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">${escapeHtml(label)}</text>`;
            }).join("")}
            ${chartData.map((row) => {
              const x = xToPx(row.date);
              const y = countToY(row.updateCount);
              return `<rect x="${(x - barWidth / 2).toFixed(2)}" y="${y.toFixed(2)}" width="${barWidth.toFixed(2)}" height="${(chartBottom - y).toFixed(2)}" rx="2" fill="#c9d9ee" opacity=".82"></rect>`;
            }).join("")}
            ${areaPath ? `<path d="${areaPath}" fill="url(#avgPriceFill)"></path>` : ""}
            <path d="${linePath("avgPrice")}" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="${linePath("ma20")}" fill="none" stroke="#ff7a00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
            <circle cx="${xToPx(lastPoint.date)}" cy="${yToPx(lastPoint.avgPrice)}" r="6" fill="#2563eb" stroke="#fff" stroke-width="3"></circle>
            <rect class="price-chart-hit" x="${padL}" y="${padT}" width="${chartW}" height="${chartH}" fill="transparent"></rect>
          </svg>
        `;

        const hit = canvas.querySelector(".price-chart-hit");
        const svg = canvas.querySelector("svg");
        if (hit && svg && tooltip) {
          const nearestFromClientX = (clientX) => {
            const rect = svg.getBoundingClientRect();
            const x = ((clientX - rect.left) / rect.width) * W;
            const ratio = Math.max(0, Math.min(1, (x - padL) / chartW));
            const target = firstTime + ratio * timeSpan;
            let best = chartData[0];
            let bestDiff = Infinity;
            chartData.forEach((row) => {
              const diff = Math.abs(row.date.getTime() - target);
              if (diff < bestDiff) {
                best = row;
                bestDiff = diff;
              }
            });
            return best;
          };
          hit.addEventListener("mousemove", (ev) => {
            const row = nearestFromClientX(ev.clientX);
            tooltip.hidden = false;
            tooltip.innerHTML = `
              <strong>${escapeHtml(formatMetaDate(row.week))}</strong>
              <span><b class="dot blue"></b>平均相場 <em>${escapeHtml(formatMarketYen(row.avgPrice))}</em></span>
              <span><b class="dot orange"></b>20週平均 <em>${escapeHtml(formatMarketYen(row.ma20))}</em></span>
              <span><b class="dot bar"></b>更新 <em>${Number(row.updateCount || 0).toLocaleString()}種類</em></span>
            `;
            const wrapRect = el.querySelector(".price-index-chart-wrap").getBoundingClientRect();
            tooltip.style.left = `${Math.min(wrapRect.width - 180, Math.max(12, ev.clientX - wrapRect.left + 14))}px`;
            tooltip.style.top = `${Math.max(14, ev.clientY - wrapRect.top - 26)}px`;
          });
          hit.addEventListener("mouseleave", () => {
            tooltip.hidden = true;
          });
        }
      };

      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          activeRange = btn.dataset.range || "1y";
          buttons.forEach((item) => item.classList.toggle("is-active", item === btn));
          draw();
        });
      });
      draw();
    }

    function renderMarketIndexView(view, sleeves, scopeMeta) {
      const { entries, periods, periodType, series, periodLabel, mode } = view;
      if (!periods.length || periods.length < 2) {
        showError(`${periodLabel}データが不足しています（2点以上必要）`);
        return;
      }

      const subtitle = document.getElementById("subtitle");
      if (subtitle) {
        const scopeText = scopeMeta?.label && scopeMeta.label !== "全体" ? ` / 条件：${scopeMeta.label}` : "";
        subtitle.textContent = `登録：${sleeves.length}件${scopeText} / ${periodLabel}期間：${formatPeriodLabel(periods[0])}〜${formatPeriodLabel(periods[periods.length - 1])}`;
      }

      const priceSeries = buildAveragePriceSeries(entries, periods, periodType);
      updatePriceSummaryCards(priceSeries);
      const validPriceSeries = priceSeries.filter((point) => Number.isFinite(point.avgPrice));
      const latestPricePoint = validPriceSeries[validPriceSeries.length - 1] || null;

      const updatedAt = document.getElementById("updatedAt");
      const countInfo = document.getElementById("countInfo");
      if (updatedAt) updatedAt.textContent = latestPricePoint?.week ? formatMetaDate(latestPricePoint.week) : "-";
      if (countInfo) {
        countInfo.textContent = latestPricePoint
          ? `対象 ${Number(latestPricePoint.targetCount || 0).toLocaleString()}種類 / 更新 ${Number(latestPricePoint.updateCount || 0).toLocaleString()}種類`
          : `${sleeves.length.toLocaleString()}件`;
      }

      const pairPrice = latestTwoValid(priceSeries, "avgPrice");
      const lastPrice = pairPrice?.latest || null;
      const prevPrice = pairPrice?.prev || null;
      const priceDiff = lastPrice && prevPrice ? lastPrice.avgPrice - prevPrice.avgPrice : null;
      const marketState = {
        label: Number.isFinite(priceDiff) ? (priceDiff > 0 ? "上昇中" : priceDiff < 0 ? "下落" : "横ばい") : "判定できません",
        note: Number.isFinite(priceDiff)
          ? `全スリーブ平均相場は前回比で${formatMarketSignedYen(priceDiff)}です。`
          : "平均相場データが不足しています。",
        cls: Number.isFinite(priceDiff) ? getTrendClass(priceDiff) : "flat"
      };
      const marketStateValue = document.getElementById("marketStateValue");
      const marketStateNote = document.getElementById("marketStateNote");
      const indexChartNote = document.getElementById("indexChartNote");
      if (marketStateValue) {
        marketStateValue.className = `market-state-value ${marketState.cls}`;
        marketStateValue.textContent = marketState.label;
      }
      if (marketStateNote) {
        marketStateNote.textContent = marketState.note;
      }
      const shareXBtn = document.getElementById("shareXBtn");
      if (shareXBtn) shareXBtn.dataset.scopeLabel = scopeMeta?.shareLabel || "スリーブ指数";
      setupMarketShare(latestPricePoint || null, latestPricePoint?.avgPrice ?? null, periodLabel);

      const indexSeries = series.filter((row) => Number.isFinite(row?.index));
      const hasSourceBoundary = !!getMarketSourceBoundary(indexSeries, "week");
      if (indexChartNote) {
        indexChartNote.hidden = !hasSourceBoundary;
        indexChartNote.textContent = hasSourceBoundary
          ? "25/1以降はメルカリの売却データを参照。買取価格（業者卸値）から実売価格（エンドユーザー価格）への切り替えに伴い、指数に不連続な上昇が含まれています。"
          : "";
      }
      renderMarketPriceChart("indexChart", priceSeries);

      const contributors = buildLatestContributors(entries, periods, {
        minPrice: 300,
        minCount: periodType === "month" ? 1 : 2,
        weightCap: 20,
        maxRatio: 2.5
      });
      const contribUpList = document.getElementById("contribUpList");
      const contribDownList = document.getElementById("contribDownList");
      if (contribUpList) contribUpList.innerHTML = renderContribList(contributors.up, "up");
      if (contribDownList) contribDownList.innerHTML = renderContribList(contributors.down, "down");

      const indexTable = document.getElementById("indexTable");
      const distTable = document.getElementById("distTable");
      if (indexTable) indexTable.innerHTML = renderTableIndex(priceSeries);
      if (distTable) distTable.innerHTML = renderTableDist(latestPricePoint);

      runDeferred(() => {
        const commentStats = buildMarketCommentStats(priceSeries);
        renderAiComment(latestPricePoint?.week || null, commentStats);
      });
    }

    async function main() {
      await window.common.setupDashboardChrome({ sidebarActive: "market", topbarActive: "market" });

      let data;
      try { data = await loadData(); }
      catch (e) { showError(e.message); return; }

      const sleeves = Array.isArray(data.sleeves) ? data.sleeves : [];
      if (!sleeves.length) { showError("スリーブデータがありません"); return; }
      const preferredMode = "week";
      const initialMode = document.querySelector(`.market-chart-switch-btn[data-index-mode="${preferredMode}"]`)
        ? preferredMode
        : "week";
      let currentMode = initialMode;
      let currentScope = "all";

      const renderCurrent = () => {
        document.getElementById("error").style.display = "none";
        const scopedSleeves = filterSleevesByIndexScope(sleeves, currentScope);
        if (!scopedSleeves.length) {
          showError("条件に合うスリーブがありません");
          return;
        }
        setIndexModeButtons(currentMode);
        setIndexScopeButton(currentScope);
        renderMarketIndexView(
          buildMarketIndexView(scopedSleeves, currentMode),
          scopedSleeves,
          getIndexScopeMeta(currentScope)
        );
      };

      document.querySelectorAll(".market-chart-switch-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentMode = btn.dataset.indexMode || "week";
          renderCurrent();
        });
      });

      document.querySelectorAll(".market-index-scope-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentScope = btn.dataset.indexScope || "all";
          renderCurrent();
        });
      });

      renderCurrent();
    }

    main();
  </script>
</body>
