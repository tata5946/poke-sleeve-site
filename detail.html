<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>スリーブ相場 - ポケスリ相場ナビ</title>
  <meta name="description" content="ポケカスリーブの週次価格推移を確認できる詳細ページです。" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./assets/site.css" />

  <style>
    .detail-wrap {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
    }

    .detail-left,
    .detail-right {
      min-width: 0;
    }

    .detail-right {
      display: none;
    }

    .usage-panel {
      margin-top: 14px;
    }

    .detail-price-grid {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
    }

    .detail-hero {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 14px;
      align-items: start;
    }

    .detail-hero .thumb {
      height: 240px;
      border: 1px solid var(--border);
    }

    .name {
      font-size: 18px;
      font-weight: 900;
      margin: 0 0 6px;
      line-height: 1.25;
    }

    .meta-line {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    .kpi {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .box {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: linear-gradient(180deg, #fff 0%, #fbfcff 100%);
      box-shadow: 0 6px 16px rgba(16, 24, 40, .06);
      padding: 12px;
    }

    .box .label {
      font-size: 12px;
      font-weight: 900;
      color: var(--muted);
    }

    .box .value {
      margin-top: 6px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: .2px;
    }

    .chart-wrap {
      position: relative;
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 6px 16px rgba(16, 24, 40, .06);
      padding: 10px;
      overflow: hidden;
    }

    .chart-title {
      font-size: 13px;
      font-weight: 900;
      margin: 2px 0 8px;
    }

    .chart-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin: 0 0 8px;
    }

    .chart-zoom-btn {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 900;
      padding: 4px 8px;
      cursor: pointer;
      color: #111;
    }

    .chart-zoom-label {
      font-size: 12px;
      font-weight: 900;
      color: var(--muted);
      min-width: 44px;
      text-align: right;
    }

    .chart-viewport {
      width: 100%;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
    }

    svg.chart {
      width: 100%;
      height: auto;
      display: block;
    }

    .chart-tooltip {
      position: absolute;
      left: 50%;
      top: 8px;
      transform: translateX(-50%);
      background: rgba(17, 17, 17, .92);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      padding: 6px 10px;
      border-radius: 999px;
      display: none;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 10px 24px rgba(16, 24, 40, .24);
    }

    .table-wrap {
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 6px 16px rgba(16, 24, 40, .06);
    }

    .table-wrap table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12px;
    }

    .table-wrap th,
    .table-wrap td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }

    .table-wrap thead th {
      font-weight: 900;
      background: #fbfcff;
    }

    .table-wrap tr:last-child td {
      border-bottom: 0;
    }

    .btn-row {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn.primary {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .btn.primary:hover {
      opacity: .92;
    }

    @media (max-width: 900px) {
      .detail-wrap {
        grid-template-columns: 1fr;
      }

      .detail-price-grid {
        grid-template-columns: 1fr;
      }

      .detail-hero {
        grid-template-columns: 1fr;
      }

      .detail-hero .thumb {
        height: 220px;
      }
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <div class="container">
    <div id="error" class="error"></div>

    <div class="panel usage-panel">
      <h3 style="margin:0 0 8px;">このページの使い方</h3>
      <div class="meta">
        週次価格のチャートとテーブルで、価格推移を確認できます。<br>
        一覧に戻って検索するときは、ヘッダーの検索欄で Enter を押してください。
      </div>
    </div>

    <div class="detail-wrap">
      <div class="detail-left">
        <div class="panel">
          <div class="detail-hero">
            <img id="img" class="thumb" alt="" />

            <div>
              <h2 id="name" class="name">読み込み中...</h2>
              <div id="meta" class="meta-line"></div>
              <div id="badges" class="badges" style="margin-top:8px;"></div>

              <div class="kpi">
                <div class="box">
                  <div class="label">最新週次価格</div>
                  <div id="latestWeekly" class="value">-</div>
                  <div id="weeklyDelta" class="delta" style="margin-top:6px;"></div>
                  <div id="weeklyCount" class="meta" style="margin-top:6px;">取引件数: -</div>
                </div>
              </div>

              <div class="btn-row">
                <a class="btn primary" id="backLink" href="./index.html">← 一覧へ戻る</a>
              </div>
            </div>
          </div>
        </div>

        <div class="detail-price-grid">
          <div class="panel">
            <h3 style="margin:0;">週次価格（weekly）</h3>
            <div id="weeklyChart"></div>
            <div id="weeklyTable"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="site-footer"></div>
  </div>

  <script src="./assets/common.js"></script>

  <script>
    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "block";
      el.textContent = msg;
    }

    function getParam(name) {
      const u = new URL(location.href);
      return u.searchParams.get(name);
    }

    async function loadData() {
      const url = window.GAS_URL;
      if (!url) throw new Error("GAS_URL が未設定です。assets/common.js を確認してください。");
      const res = await fetch(url + "?v=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(`データ取得に失敗しました（HTTP ${res.status}）`);
      return await res.json();
    }

    function toISODate(d) {
      const dd = new Date(d);
      if (Number.isNaN(dd.getTime())) return null;
      const y = dd.getFullYear();
      const m = String(dd.getMonth() + 1).padStart(2, "0");
      const day = String(dd.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function formatPeriodLabel(iso) {
      const s = String(iso || "").trim();
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return s;
      return `${m[1]}/${m[2]}/${m[3]}`;
    }

    function normalizeWeekly(arr) {
      return (Array.isArray(arr) ? arr : [])
        .map(x => {
          const week = toISODate(x.week);
          const toNum = (v) => {
            if (v == null) return null;
            if (typeof v === "number") return Number.isFinite(v) ? v : null;
            const s = String(v).trim();
            if (!s || s === "-") return null;
            const cleaned = s.replace(/[^\d.\-]/g, "");
            if (!cleaned) return null;
            const n = Number(cleaned);
            return Number.isFinite(n) ? n : null;
          };

          const price = toNum(x.price);
          const count = toNum(x.count);
          const hasTrade = (count == null) ? (price != null) : (count > 0 && price != null);

          return { week, price: hasTrade ? price : null, count: count == null ? null : count };
        })
        .filter(x => x.week)
        .sort((a, b) => String(a.week).localeCompare(String(b.week)));
    }

    function latestTwoTradedWeeks(rows) {
      const traded = (Array.isArray(rows) ? rows : []).filter(r => Number.isFinite(r.price));
      if (traded.length === 0) return null;

      const uniq = [];
      const seen = new Set();
      for (let i = traded.length - 1; i >= 0; i--) {
        if (seen.has(traded[i].week)) continue;
        seen.add(traded[i].week);
        uniq.push(traded[i]);
        if (uniq.length === 2) break;
      }
      return { latest: uniq[0], prev: uniq[1] || null };
    }

    function renderTableWeekly(rows) {
      if (!rows.length) return `<div class="meta">週次データがまだありません</div>`;

      const hasCount = rows.some(r => Number.isFinite(r.count));
      const html = rows.slice().reverse().map(r => {
        const priceCell = Number.isFinite(r.price) ? `${Number(r.price).toLocaleString()}円` : "-";
        const countCell = hasCount ? `<td>${Number.isFinite(r.count) ? `${r.count}件` : "-"}</td>` : "";
        return `<tr><td>${escapeHtml(formatPeriodLabel(r.week))}</td><td>${priceCell}</td>${countCell}</tr>`;
      }).join("");

      const headCount = hasCount ? `<th>件数</th>` : "";

      return `
        <div class="table-wrap">
          <table>
            <thead><tr><th>期間</th><th>価格</th>${headCount}</tr></thead>
            <tbody>${html}</tbody>
          </table>
        </div>
      `;
    }

    function setWeeklyKpi(weeklyRows) {
      const latestEl = document.getElementById("latestWeekly");
      const deltaEl = document.getElementById("weeklyDelta");
      const countEl = document.getElementById("weeklyCount");

      const pair = latestTwoTradedWeeks(weeklyRows);

      if (!pair) {
        latestEl.textContent = "-";
        deltaEl.textContent = "比較できるデータがありません";
        deltaEl.className = "delta flat";
        countEl.textContent = "取引件数: -";
        return;
      }

      latestEl.textContent = `${pair.latest.price.toLocaleString()}円`;

      const cnt = Number.isFinite(pair.latest.count) ? pair.latest.count : null;
      countEl.textContent = `取引件数: ${cnt != null ? `${cnt}件` : "-"}`;

      if (!pair.prev) {
        deltaEl.textContent = "比較できる前週データがありません";
        deltaEl.className = "delta flat";
        return;
      }

      const diff = pair.latest.price - pair.prev.price;
      const abs = Math.abs(diff);
      let cls = "flat";
      let arrow = "→";
      let sign = "±";
      if (diff > 0) { cls = "up"; arrow = "↑"; sign = "+"; }
      if (diff < 0) { cls = "down"; arrow = "↓"; sign = "-"; }

      let pct = "";
      if (pair.prev.price !== 0) {
        const rate = (diff / pair.prev.price) * 100;
        if (Number.isFinite(rate)) {
          pct = `（${diff > 0 ? "+" : diff < 0 ? "-" : ""}${Math.abs(rate).toFixed(1)}%）`;
        }
      }

      deltaEl.className = "delta " + cls;
      deltaEl.textContent = `${arrow} 前週比 ${sign}${abs.toLocaleString()}円 ${pct}`;
    }

    function renderLineChart(containerId, title, rows, xKey, yKey) {
      const el = document.getElementById(containerId);
      if (!el) return;

      const data = (Array.isArray(rows) ? rows : [])
        .map(r => {
          const x = String(r?.[xKey] ?? "");
          const rawY = r?.[yKey];
          const n = Number(rawY);
          return { x, y: Number.isFinite(n) ? n : null };
        })
        .filter(p => p.x && Number.isFinite(p.y));

      if (data.length < 2) {
        el.innerHTML = `
          <div class="chart-wrap">
            <div class="chart-title">${escapeHtml(title)}</div>
            <div class="meta">データが不足しています</div>
          </div>`;
        return;
      }

      const W = 1200, H = 420;
      const padL = 80, padR = 30, padT = 26, padB = 58;
      const ticks = 4;

      const ys = data.map(d => d.y);
      let yMin = Math.min(...ys);
      let yMax = Math.max(...ys);

      const margin = (yMax - yMin) * 0.1 || 1;
      yMin -= margin;
      yMax += margin;

      function niceStep(range, t) {
        const rough = range / t;
        const pow = Math.pow(10, Math.floor(Math.log10(Math.max(rough, 1))));
        const candidates = [1, 2, 5, 10].map(m => m * pow);
        return candidates.reduce((best, v) => Math.abs(v - rough) < Math.abs(best - rough) ? v : best, candidates[0]);
      }

      const step = niceStep(yMax - yMin, ticks);
      yMin = Math.floor(yMin / step) * step;
      yMax = Math.ceil(yMax / step) * step;

      const xToPx = (i) => padL + (i / (data.length - 1)) * (W - padL - padR);
      const yToPx = (v) => padT + (1 - (v - yMin) / (yMax - yMin)) * (H - padT - padB);

      const pathD = data.map((p, i) => `${i === 0 ? "M" : "L"} ${xToPx(i)} ${yToPx(p.y)}`).join(" ");

      const tickLines = [];
      const tickLabels = [];
      for (let i = 0; i <= ticks; i++) {
        const v = yMin + (i / ticks) * (yMax - yMin);
        const y = yToPx(v);
        tickLines.push(`<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#e6e8ef"/>`);
        tickLabels.push(`<text x="${padL - 12}" y="${y + 4}" text-anchor="end" font-size="12" fill="#475467" font-weight="700">${Math.round(v).toLocaleString()}</text>`);
      }

      const xFirst = formatPeriodLabel(data[0].x);
      const xLast = formatPeriodLabel(data[data.length - 1].x);
      const lastIdx = data.length - 1;
      const lastX = xToPx(lastIdx);
      const lastY = yToPx(data[lastIdx].y);
      const lastLabel = `${data[lastIdx].y.toLocaleString()}円`;

      el.innerHTML = `
        <div class="chart-wrap">
          <div class="chart-title">${escapeHtml(title)}</div>
          <div class="chart-toolbar">
            <button type="button" class="chart-zoom-btn" data-zoom="out">-</button>
            <button type="button" class="chart-zoom-btn" data-zoom="in">+</button>
            <button type="button" class="chart-zoom-btn" data-zoom="reset">リセット</button>
            <span class="chart-zoom-label">100%</span>
          </div>
          <div class="chart-tooltip"></div>
          <div class="chart-viewport">
            <svg class="chart" viewBox="0 0 ${W} ${H}">
              <defs>
                <linearGradient id="bgGrad-${escapeHtml(containerId)}" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#1e5bd7" stop-opacity="0.08"/>
                  <stop offset="100%" stop-color="#1e5bd7" stop-opacity="0"/>
                </linearGradient>
              </defs>

              ${tickLines.join("")}
              ${tickLabels.join("")}

              <rect x="${padL}" y="${padT}" width="${W - padL - padR}" height="${H - padT - padB}" fill="url(#bgGrad-${escapeHtml(containerId)})" />
              <path d="${pathD}" fill="none" stroke="#1e5bd7" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>

              <line class="hover-line" y1="${padT}" y2="${H - padB}" stroke="#94a3b8" stroke-width="1" style="display:none;" />
              <circle class="hover-dot" r="5" fill="#1e5bd7" style="display:none;" />
              <rect class="hover-hit" x="${padL}" y="${padT}" width="${W - padL - padR}" height="${H - padT - padB}" fill="transparent"/>

              <circle cx="${lastX}" cy="${lastY}" r="5" fill="#1e5bd7"/>
              <text x="${lastX + 8}" y="${lastY - 8}" font-size="12" font-weight="800" fill="#111">${escapeHtml(lastLabel)}</text>

              <text x="${padL}" y="${H - 10}" font-size="14" fill="#667085">${escapeHtml(xFirst)}</text>
              <text x="${W - padR}" y="${H - 10}" font-size="14" fill="#667085" text-anchor="end">${escapeHtml(xLast)}</text>
            </svg>
          </div>
        </div>
      `;

      const wrap = el.querySelector(".chart-wrap");
      const viewport = el.querySelector(".chart-viewport");
      const svg = el.querySelector("svg.chart");
      const tip = el.querySelector(".chart-tooltip");
      const hit = el.querySelector(".hover-hit");
      const hLine = el.querySelector(".hover-line");
      const hDot = el.querySelector(".hover-dot");
      const zoomLabel = el.querySelector(".chart-zoom-label");
      const zoomBtns = Array.from(el.querySelectorAll(".chart-zoom-btn"));

      let zoom = 1;
      const minZoom = 1;
      const maxZoom = 3;
      const stepZoom = 0.25;

      function applyZoom(nextZoom) {
        zoom = Math.max(minZoom, Math.min(maxZoom, nextZoom));
        const pct = Math.round(zoom * 100);
        svg.style.width = `${pct}%`;
        zoomLabel.textContent = `${pct}%`;
        if (zoom === 1) viewport.scrollLeft = 0;
      }

      zoomBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          const mode = btn.getAttribute("data-zoom");
          if (mode === "in") applyZoom(zoom + stepZoom);
          if (mode === "out") applyZoom(zoom - stepZoom);
          if (mode === "reset") applyZoom(1);
        });
      });
      applyZoom(1);

      hit.addEventListener("mousemove", (ev) => {
        const rect = svg.getBoundingClientRect();
        const x = ev.clientX - rect.left;
        const vbX = (x / rect.width) * W;
        const t = (vbX - padL) / (W - padL - padR);
        const idx = Math.round(t * (data.length - 1));
        const safeIdx = Math.max(0, Math.min(data.length - 1, idx));

        const px = xToPx(safeIdx);
        const py = yToPx(data[safeIdx].y);

        hLine.style.display = "block";
        hDot.style.display = "block";
        tip.style.display = "block";

        hLine.setAttribute("x1", px);
        hLine.setAttribute("x2", px);
        hLine.setAttribute("y1", padT);
        hLine.setAttribute("y2", H - padB);
        hDot.setAttribute("cx", px);
        hDot.setAttribute("cy", py);

        tip.textContent = `${formatPeriodLabel(data[safeIdx].x)} / ${data[safeIdx].y.toLocaleString()}円`;
        const wrapRect = wrap.getBoundingClientRect();
        tip.style.left = `${Math.min(Math.max(ev.clientX - wrapRect.left, 40), wrapRect.width - 40)}px`;
        tip.style.top = `${Math.max(ev.clientY - wrapRect.top - 12, 8)}px`;
      });

      hit.addEventListener("mouseleave", () => {
        hLine.style.display = "none";
        hDot.style.display = "none";
        tip.style.display = "none";
      });
    }

    async function main() {
      const applySearchBehavior = () => {
        const search = document.getElementById("search");
        if (!search) return false;
        search.placeholder = "一覧へ戻って検索...";
        search.addEventListener("keydown", (e) => {
          if (e.key !== "Enter") return;
          const q = search.value.trim();
          if (!q) {
            location.href = "./index.html";
            return;
          }
          location.href = "./index.html?q=" + encodeURIComponent(q);
        });
        return true;
      };
      if (!applySearchBehavior()) setTimeout(applySearchBehavior, 200);

      const id = getParam("id");
      if (!id) {
        showError("id が指定されていません。一覧ページから開いてください。");
        return;
      }

      let data;
      try {
        data = await loadData();
      } catch (e) {
        showError(e.message || "データ読み込みに失敗しました");
        return;
      }

      const sleeves = Array.isArray(data.sleeves) ? data.sleeves : [];
      const s = sleeves.find(x => String(x.id) === String(id));
      if (!s) {
        showError("指定されたスリーブが見つかりませんでした。");
        return;
      }

      document.title = `${s.name || "スリーブ相場"} - ポケスリ相場ナビ`;

      const img = document.getElementById("img");
      img.referrerPolicy = "no-referrer";
      img.src = String(s.imageUrl || "").trim();
      img.alt = s.name || "";

      document.getElementById("name").textContent = s.name || "";
      document.getElementById("meta").innerHTML =
        `発売年: ${escapeHtml(s.releaseYear)} / シリーズ: ${escapeHtml(s.series)} / 状態: ${escapeHtml(s.condition)}`;

      document.getElementById("badges").innerHTML = `
        <span class="badge">発売年: ${escapeHtml(s.releaseYear)}</span>
        <span class="badge">${escapeHtml(s.condition)}</span>
        <span class="badge">${escapeHtml(s.series)}</span>
      `;

      document.getElementById("backLink").href = "./index.html";

      const weeklyRows = normalizeWeekly(s.weeklyPrices);
      renderLineChart("weeklyChart", "週次価格 推移", weeklyRows, "week", "price");
      document.getElementById("weeklyTable").innerHTML = renderTableWeekly(weeklyRows);
      setWeeklyKpi(weeklyRows);
    }

    document.addEventListener("DOMContentLoaded", () => main());
  </script>
</body>

</html>
