  <style>
    .article-list-wrap {
      display: grid;
      gap: 16px;
      margin-top: 14px;
    }

    .article-hero {
      padding: 26px;
      border: 1px solid #d7e1f0;
      border-radius: 22px;
      background:
        radial-gradient(circle at right top, rgba(255, 205, 72, .18), transparent 34%),
        linear-gradient(180deg, #fff 0%, #f8fbff 100%);
      box-shadow: 0 14px 30px rgba(15, 23, 42, .05);
    }

    .article-kicker {
      margin: 0 0 8px;
      color: #1e5bd7;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .12em;
    }

    .article-title {
      margin: 0;
      color: #111827;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.08;
      font-weight: 900;
    }

    .article-desc {
      max-width: 720px;
      margin: 12px 0 0;
      color: #667085;
      font-size: 14px;
      line-height: 1.8;
    }

    .article-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .article-card {
      display: grid;
      overflow: hidden;
      border: 1px solid #d7e1f0;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 10px 24px rgba(15, 23, 42, .05);
      color: #111827;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .article-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px rgba(15, 23, 42, .08);
      text-decoration: none;
    }

    .article-thumb {
      aspect-ratio: 16 / 9;
      background:
        radial-gradient(circle at 20% 18%, rgba(255, 204, 0, .34), transparent 30%),
        radial-gradient(circle at 82% 16%, rgba(30, 91, 215, .2), transparent 28%),
        linear-gradient(135deg, #f8fbff, #edf4ff);
      object-fit: cover;
      width: 100%;
      min-height: 0;
    }

    .article-card-body {
      display: grid;
      gap: 8px;
      padding: 16px;
    }

    .article-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      color: #667085;
      font-size: 12px;
      font-weight: 800;
    }

    .article-card-title {
      margin: 0;
      color: #111827;
      font-size: 19px;
      line-height: 1.35;
      font-weight: 900;
    }

    .article-excerpt {
      margin: 0;
      color: #667085;
      font-size: 13px;
      line-height: 1.75;
    }

    .article-empty {
      padding: 22px;
      border: 1px dashed #bccbe1;
      border-radius: 18px;
      background: rgba(255,255,255,.72);
      color: #667085;
      font-weight: 800;
      text-align: center;
    }

    @media (max-width: 700px) {
      body.page-content-focus {
        background: #fff;
      }

      .dashboard-content {
        padding: 0;
        background: #fff;
      }

      .page-shell--content {
        padding: 0 18px 28px;
      }

      .breadcrumb {
        display: none;
      }

      .article-list-wrap {
        gap: 0;
        margin-top: 0;
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }

      .article-hero {
        padding: 22px 0 18px;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .article-kicker {
        margin-bottom: 6px;
        color: #6b7280;
        font-size: 11px;
        letter-spacing: .08em;
      }

      .article-title {
        font-size: 24px;
        line-height: 1.35;
        font-weight: 800;
        letter-spacing: 0;
      }

      .article-desc {
        margin-top: 8px;
        color: #5f6368;
        font-size: 13px;
        line-height: 1.85;
      }

      .article-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        border-top: 1px solid #edf0f3;
      }

      .article-card {
        grid-template-columns: 92px minmax(0, 1fr);
        gap: 14px;
        align-items: center;
        padding: 16px 0;
        border: 0;
        border-bottom: 1px solid #edf0f3;
        border-radius: 0;
        box-shadow: none;
        max-width: 100%;
        min-width: 0;
      }

      .article-card:hover {
        transform: none;
        box-shadow: none;
      }

      .article-thumb {
        width: 92px;
        aspect-ratio: 1 / 1;
        border-radius: 8px;
      }

      .article-card-body {
        gap: 6px;
        padding: 0;
        min-width: 0;
      }

      .article-meta {
        gap: 8px;
        color: #6b7280;
        font-size: 11px;
        font-weight: 600;
      }

      .article-meta span:first-child {
        display: none;
      }

      .article-card-title {
        font-size: 16px;
        line-height: 1.55;
        font-weight: 800;
        overflow-wrap: anywhere;
      }

      .article-excerpt {
        display: -webkit-box;
        overflow: hidden;
        color: #6b7280;
        font-size: 12px;
        line-height: 1.7;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .article-empty {
        margin-top: 18px;
        border-radius: 12px;
      }
    }
  </style>

<body class="page-content-focus" data-hide-global-header="1">
  <div id="site-header"></div>

  <div class="dashboard-shell">
    <aside class="dashboard-sidebar" aria-label="サイドバー">
      <div id="dashboardSidebarSlot" data-dashboard-sidebar-active="articles"></div>
    </aside>
    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div id="dashboardTopbarSlot" data-dashboard-topbar-active="articles"></div>
      </header>
      <div class="dashboard-content">
        <div class="container page-shell page-shell--content">
          <nav class="breadcrumb" aria-label="パンくず">
            <a href="./">ホーム</a>
            <span class="breadcrumb-sep" aria-hidden="true">></span>
            <span class="breadcrumb-current" aria-current="page">記事</span>
          </nav>

          <div class="article-list-wrap">
            <section class="article-hero">
              <p class="article-kicker">ARTICLES</p>
              <h1 class="article-title">記事</h1>
              <p class="article-desc">ポケカスリーブ相場の変化、ランキングの見方、注目スリーブの読み物をまとめます。</p>
            </section>

            <section id="articleGrid" class="article-grid" aria-label="記事一覧">
              <div class="article-empty">記事を読み込み中です。</div>
            </section>

          <div id="site-footer"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="./assets/common.js?v=20260806a"></script>
  <script>
    window.common.setupDashboardChrome({ sidebarActive: "articles", topbarActive: "articles" });
  </script>
  <script>
    const ARTICLE_LOCAL_KEY = "pokeSleeve:articles:local:v1";

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(value) {
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return "";
      return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
    }

    function normalizeArticle(article) {
      if (!article || typeof article !== "object") return null;
      const slug = String(article.slug || article.id || "").trim();
      const title = String(article.title || "").trim();
      if (!slug || !title) return null;
      return {
        id: String(article.id || slug),
        slug,
        title,
        excerpt: String(article.excerpt || "").trim(),
        category: String(article.category || "相場コラム").trim(),
        coverImage: String(article.coverImage || "").trim(),
        publishedAt: String(article.publishedAt || article.updatedAt || "").trim(),
        status: String(article.status || "published").trim(),
        linkUrl: String(article.linkUrl || "").trim(),
        html: String(article.html || "")
      };
    }

    async function loadArticles() {
      let fileArticles = [];
      try {
        const res = await fetch("./articles.json", { cache: "reload", headers: { "Accept": "application/json" } });
        if (res.ok) {
          const data = await res.json();
          fileArticles = Array.isArray(data?.articles) ? data.articles : [];
        }
      } catch (_) {}

      let localArticles = [];
      try {
        if (window.common?.readLocalArticles) {
          localArticles = await window.common.readLocalArticles(ARTICLE_LOCAL_KEY);
        } else {
          const raw = localStorage.getItem(ARTICLE_LOCAL_KEY);
          const data = raw ? JSON.parse(raw) : [];
          localArticles = Array.isArray(data) ? data : [];
        }
      } catch (_) {}

      const map = new Map();
      [...fileArticles, ...localArticles].forEach((item) => {
        const article = normalizeArticle(item);
        if (article && article.status !== "draft") map.set(article.slug, article);
      });
      return Array.from(map.values()).sort((a, b) => String(b.publishedAt).localeCompare(String(a.publishedAt)));
    }

    function renderArticles(articles) {
      const grid = document.getElementById("articleGrid");
      if (!grid) return;
      if (!articles.length) {
        if (window.common && typeof window.common.updateItemListStructuredData === "function") {
          window.common.updateItemListStructuredData("articlesItemListStructuredData", [], {
            name: "ポケスリ相場ナビ 記事一覧"
          });
        }
        grid.innerHTML = `<div class="article-empty">公開中の記事はまだありません。</div>`;
        return;
      }
      grid.innerHTML = articles.map((article) => {
        const href = article.linkUrl || `./article.html?id=${encodeURIComponent(article.slug)}`;
        const image = article.coverImage
          ? `<img class="article-thumb" src="${escapeHtml(article.coverImage)}" alt="">`
          : `<div class="article-thumb" aria-hidden="true"></div>`;
        return `
          <a class="article-card" href="${href}">
            ${image}
            <div class="article-card-body">
              <div class="article-meta">
                <span>${escapeHtml(article.category || "記事")}</span>
                <span>${escapeHtml(formatDate(article.publishedAt))}</span>
              </div>
              <h2 class="article-card-title">${escapeHtml(article.title)}</h2>
              <p class="article-excerpt">${escapeHtml(article.excerpt || "記事を読む")}</p>
            </div>
          </a>
        `;
      }).join("");
      if (window.common && typeof window.common.updateItemListStructuredData === "function") {
        window.common.updateItemListStructuredData("articlesItemListStructuredData", articles.map((article) => ({
          ...article,
          href: article.linkUrl || `./article.html?id=${encodeURIComponent(article.slug)}`
        })), {
          name: "ポケスリ相場ナビ 記事一覧",
          description: "ポケカスリーブ相場の記事一覧です。"
        });
      }
    }

    loadArticles().then(renderArticles).catch(() => {
      renderArticles([]);
    });
  </script>
