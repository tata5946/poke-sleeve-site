<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ニンジャスピナー発売関連デッキシールド | ポケスリ相場ナビ</title>
  <meta name="description" content="ニンジャスピナー発売関連のデッキシールドをまとめて確認できます。" />
  <meta property="og:title" content="ニンジャスピナー発売関連デッキシールド | ポケスリ相場ナビ" />
  <meta property="og:description" content="ニンジャスピナー発売関連のデッキシールドをまとめて確認できます。" />
  <meta property="og:image" content="https://pokesuri-navi.com/assets/ninzyasupina---banner.png" />

  <style>
    .abyss-page {
      display: grid;
      gap: 24px;
    }
    .abyss-hero {
      display: grid;
      gap: 18px;
    }
    .abyss-hero-image {
      display: block;
      width: 100%;
      max-height: 330px;
      object-fit: cover;
      border-radius: 8px;
      background: #0f172a;
      box-shadow: 0 22px 48px rgba(15, 23, 42, 0.16);
    }
    .abyss-kicker {
      margin: 0 0 8px;
      color: #7c3aed;
      font-family: "Inter", "Noto Sans JP", sans-serif;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0;
    }
    .abyss-title {
      margin: 0;
      color: #0f172a;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.12;
      font-weight: 900;
    }
    .abyss-copy {
      max-width: 760px;
      margin: 10px 0 0;
      color: #475569;
      font-size: 15px;
      line-height: 1.8;
      font-weight: 700;
    }
    .abyss-section {
      display: grid;
      gap: 14px;
    }
    .abyss-section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }
    .abyss-section-title {
      margin: 0;
      color: #0f172a;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 900;
    }
    .abyss-section-count {
      color: #64748b;
      font-size: 13px;
      font-weight: 900;
    }
    .abyss-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }
    .abyss-card {
      min-width: 0;
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 8px;
      background: rgba(255,255,255,.96);
      color: #0f172a;
      text-decoration: none;
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.07);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .abyss-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 38px rgba(15, 23, 42, 0.12);
      text-decoration: none;
    }
    .abyss-thumb {
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 8px;
      background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
    }
    .abyss-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 8px;
    }
    .abyss-name {
      min-height: 42px;
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 900;
    }
    .abyss-meta {
      margin: 0;
      color: #64748b;
      font-size: 12px;
      line-height: 1.45;
      font-weight: 700;
    }
    .abyss-price {
      color: #0f766e;
      font-family: "Inter", "Noto Sans JP", sans-serif;
      font-weight: 900;
    }
    .abyss-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      min-height: 24px;
    }
    .abyss-tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      max-width: 100%;
      padding: 0 7px;
      border-radius: 6px;
      background: #eef2ff;
      color: #334155;
      font-size: 11px;
      line-height: 1;
      font-weight: 900;
    }
    .abyss-mini-chart {
      position: relative;
      min-height: 86px;
      overflow: hidden;
      border-radius: 8px;
      background:
        radial-gradient(circle at 14px 12px, rgba(15, 118, 110, 0.10), transparent 26px),
        linear-gradient(180deg, #f8fafc 0%, #eef5f4 100%);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }
    .abyss-mini-chart svg {
      display: block;
      width: 100%;
      height: 86px;
    }
    .abyss-mini-chart-empty {
      min-height: 86px;
      display: grid;
      place-items: center;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 900;
    }
    .abyss-mini-chart-label {
      position: absolute;
      left: 8px;
      color: #64748b;
      font-family: "Inter", "Noto Sans JP", sans-serif;
      font-size: 10px;
      line-height: 1;
      font-weight: 900;
      pointer-events: none;
    }
    .abyss-mini-chart-label--max {
      top: 8px;
    }
    .abyss-mini-chart-label--min {
      bottom: 8px;
    }
    .abyss-empty {
      padding: 18px;
      border-radius: 8px;
      background: rgba(255,255,255,.9);
      color: #64748b;
      font-weight: 800;
    }
    @media (max-width: 1100px) {
      .abyss-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
    @media (max-width: 700px) {
      .abyss-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .abyss-hero-image {
        max-height: 220px;
      }
    }
  </style>
</head>

<body class="page-content-focus" data-hide-global-header="1">
  <div id="site-header"></div>
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar" aria-label="&#12469;&#12452;&#12489;&#12496;&#12540;">
      <div id="dashboardSidebarSlot" data-dashboard-sidebar-active="zukan"></div>
    </aside>
    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div id="dashboardTopbarSlot" data-dashboard-topbar-active="zukan"></div>
      </header>
      <div class="dashboard-content">
        <div class="container page-shell page-shell--content">
          <nav class="breadcrumb" aria-label="&#12497;&#12531;&#12367;&#12378;">
            <a href="./index.html">&#12507;&#12540;&#12512;</a>
            <span class="breadcrumb-sep" aria-hidden="true">&gt;</span>
            <span class="breadcrumb-current" aria-current="page">ニンジャスピナー発売関連デッキシールド</span>
          </nav>

          <main class="abyss-page">
            <section class="abyss-hero" aria-label="ニンジャスピナー発売関連デッキシールド">
              <img class="abyss-hero-image" src="./assets/ninzyasupina---banner.png" alt="ニンジャスピナー発売関連デッキシールド" decoding="async">
              <div>
                <p class="abyss-kicker">FEATURE</p>
                <h1 class="abyss-title">ニンジャスピナー発売関連デッキシールド</h1>
                <p class="abyss-copy">ニンジャスピナー発売にあわせて注目したい関連スリーブをまとめました。各カードから個別ページで相場推移を確認できます。</p>
              </div>
            </section>

            <section class="abyss-section" aria-labelledby="featureSleevesTitle">
              <div class="abyss-section-head">
                <h2 id="featureSleevesTitle" class="abyss-section-title">対象スリーブ</h2>
                <span class="abyss-section-count">7件</span>
              </div>
              <div id="featureSleeveGrid" class="abyss-grid">
                <div class="abyss-empty">&#35501;&#12415;&#36796;&#12415;&#20013;&#12391;&#12377;&#12290;</div>
              </div>
            </section>
          </main>

          <div id="site-footer"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="./assets/common.js?v=20260518b"></script>
  <script>
    window.common.setupDashboardChrome({ sidebarActive: "zukan", topbarActive: "zukan" });

    const FEATURE_SLEEVE_ITEMS = [
      ["462240", "チラーミィ&チラチーノ"],
      ["462318", "ヌメラ&ヌメイル"],
      ["462332", "ミネズミ"],
      ["462301", "ホミカ&クロバット"],
      ["463674", "メガゲッコウガ"],
      ["462288", "メガフラエッテ"],
      ["432762", "メガゲンガー"]
    ];

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function loadFeatureData() {
      if (window.common && typeof window.common.loadData === "function") return await window.common.loadData();
      const res = await fetch("./data.json", { cache: "reload" });
      return await res.json();
    }

    function buildSleeveMap(sleeves) {
      const map = new Map();
      for (const sleeve of Array.isArray(sleeves) ? sleeves : []) {
        const id = String(sleeve?.id || "").trim();
        if (id) map.set(id, sleeve);
      }
      return map;
    }

    function getDetailHref(id) {
      if (window.common && typeof window.common.buildSleeveDetailHref === "function") {
        return window.common.buildSleeveDetailHref(id);
      }
      return `./sleeve/${encodeURIComponent(id)}/`;
    }

    function getLatestPrice(sleeve) {
      const rows = Array.isArray(sleeve?.weeklyPrices) ? sleeve.weeklyPrices : [];
      for (let i = rows.length - 1; i >= 0; i--) {
        const price = Number(rows[i]?.price);
        if (Number.isFinite(price) && price > 0) return price;
      }
      return null;
    }

    function getMiniChartPoints(sleeve) {
      const rows = Array.isArray(sleeve?.weeklyPrices) ? sleeve.weeklyPrices : [];
      return rows
        .map((row) => {
          const week = String(row?.week || "").trim();
          const price = Number(row?.price);
          if (!week || !Number.isFinite(price) || price <= 0) return null;
          return { week, price };
        })
        .filter(Boolean)
        .slice(-14);
    }

    function formatMiniYen(value) {
      if (!Number.isFinite(value)) return "";
      if (Math.abs(value) >= 10000) return `\u00a5${(value / 10000).toFixed(1)}\u4e07`;
      return `\u00a5${Math.round(value).toLocaleString()}`;
    }

    function buildMiniPriceChart(sleeve) {
      const points = getMiniChartPoints(sleeve);
      if (points.length < 2) {
        return `<div class="abyss-mini-chart abyss-mini-chart-empty">\u4fa1\u683c\u63a8\u79fb\u3092\u89b3\u6e2c\u4e2d</div>`;
      }
      const W = 260;
      const H = 86;
      const padX = 12;
      const padT = 10;
      const padB = 12;
      const prices = points.map((point) => point.price);
      const min = Math.min(...prices);
      const max = Math.max(...prices);
      const range = Math.max(1, max - min);
      const x = (index) => padX + (points.length === 1 ? 0 : (index / (points.length - 1)) * (W - padX * 2));
      const y = (price) => padT + ((max - price) / range) * (H - padT - padB);
      const line = points.map((point, index) => `${x(index).toFixed(1)},${y(point.price).toFixed(1)}`).join(" ");
      const area = `${line} ${x(points.length - 1).toFixed(1)},${H - padB} ${padX},${H - padB}`;
      const latest = points[points.length - 1];
      const latestX = x(points.length - 1);
      const latestY = y(latest.price);
      const midY = padT + (H - padT - padB) / 2;
      return `
        <div class="abyss-mini-chart" aria-label="\u4fa1\u683c\u63a8\u79fb\u30b0\u30e9\u30d5">
          <span class="abyss-mini-chart-label abyss-mini-chart-label--max">${escapeHtml(formatMiniYen(max))}</span>
          <span class="abyss-mini-chart-label abyss-mini-chart-label--min">${escapeHtml(formatMiniYen(min))}</span>
          <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
            <defs>
              <linearGradient id="abyssMiniGrad-${escapeHtml(String(sleeve?.id || ""))}" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#0f766e" stop-opacity="0.20"></stop>
                <stop offset="100%" stop-color="#0f766e" stop-opacity="0.02"></stop>
              </linearGradient>
            </defs>
            <line x1="${padX}" y1="${padT}" x2="${W - padX}" y2="${padT}" stroke="rgba(100,116,139,0.16)" stroke-width="1"></line>
            <line x1="${padX}" y1="${midY.toFixed(1)}" x2="${W - padX}" y2="${midY.toFixed(1)}" stroke="rgba(100,116,139,0.12)" stroke-width="1"></line>
            <line x1="${padX}" y1="${H - padB}" x2="${W - padX}" y2="${H - padB}" stroke="rgba(100,116,139,0.16)" stroke-width="1"></line>
            <polygon points="${escapeHtml(area)}" fill="url(#abyssMiniGrad-${escapeHtml(String(sleeve?.id || ""))})"></polygon>
            <polyline points="${escapeHtml(line)}" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline>
            <circle cx="${latestX.toFixed(1)}" cy="${latestY.toFixed(1)}" r="4" fill="#ffffff" stroke="#0f766e" stroke-width="2"></circle>
          </svg>
        </div>
      `;
    }

    function formatReleaseDate(value) {
      const text = String(value || "").trim();
      if (!text) return "\u767a\u58f2\u65e5\u672a\u767b\u9332";
      const d = new Date(text);
      if (Number.isNaN(d.getTime())) return text;
      return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}\u767a\u58f2`;
    }

    function getCategoryLabels(sleeve) {
      const values = [];
      const push = (value) => {
        const text = String(value || "").trim();
        if (text && !values.includes(text)) values.push(text);
      };
      if (window.common && typeof window.common.getSleeveCategoryValues === "function") {
        window.common.getSleeveCategoryValues(sleeve, [
          "category1", "category2", "category3",
          "category4", "category5", "category6",
          "category7", "category8", "category9"
        ]).forEach(push);
      } else {
        ["category1", "category2", "category3", "category4", "category5", "category6", "category7", "category8", "category9"].forEach((key) => push(sleeve?.[key]));
      }
      if (Array.isArray(sleeve?.categoryTags)) sleeve.categoryTags.forEach(push);
      if (Array.isArray(sleeve?.categories)) sleeve.categories.forEach(push);
      return values.slice(0, 4);
    }

    function renderItems(targetId, items, sleeveMap) {
      const root = document.getElementById(targetId);
      if (!root) return;
      root.innerHTML = items.map(([id, fallbackName]) => {
        const sleeve = sleeveMap.get(id) || {};
        const name = String(sleeve.name || fallbackName || id);
        const price = getLatestPrice(sleeve);
        const imageUrl = String(sleeve.imageUrl || "").trim();
        const tags = getCategoryLabels(sleeve);
        return `
          <a class="abyss-card" href="${escapeHtml(getDetailHref(id))}">
            <div class="abyss-thumb">${imageUrl ? `<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(name)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.onerror=null; this.style.display='none';">` : ""}</div>
            <p class="abyss-name">${escapeHtml(name)}</p>
            <div class="abyss-tags">${tags.map((tag) => `<span class="abyss-tag">${escapeHtml(tag)}</span>`).join("")}</div>
            <p class="abyss-meta">${escapeHtml(formatReleaseDate(sleeve.releaseDate))}</p>
            <p class="abyss-meta abyss-price">${price != null ? `\u6700\u65b0 \u00a5${Math.round(price).toLocaleString()}` : "\u76f8\u5834\u89b3\u6e2c\u4e2d"}</p>
            ${buildMiniPriceChart(sleeve)}
          </a>
        `;
      }).join("");
    }

    async function main() {
      const data = await loadFeatureData();
      const sleeveMap = buildSleeveMap(data?.sleeves);
      renderItems("featureSleeveGrid", FEATURE_SLEEVE_ITEMS, sleeveMap);
    }

    main().catch((error) => {
      console.error(error);
      ["featureSleeveGrid"].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = `<div class="abyss-empty">\u30c7\u30fc\u30bf\u306e\u8aad\u307f\u8fbc\u307f\u306b\u5931\u6557\u3057\u307e\u3057\u305f\u3002</div>`;
      });
    });
  </script>
</body>

</html>
