  <script src="./assets/common.js?v=20260713b"></script>
  <script>
    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "block";
      el.textContent = msg;
    }

    function hideError() {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "none";
      el.textContent = "";
    }

    function uniq(arr) {
      const s = new Set();
      for (const v of arr) {
        const t = (v == null) ? "" : String(v).trim();
        if (t) s.add(t);
      }
      return Array.from(s);
    }

    function parseBand(v) {
      if (!v) return null;
      const [a, b] = v.split("-").map(Number);
      if (!Number.isFinite(a) || !Number.isFinite(b)) return null;
      return { min: a, max: b };
    }

    function toISODate(d) {
      const dd = new Date(d);
      if (Number.isNaN(dd.getTime())) return null;
      const y = dd.getFullYear();
      const m = String(dd.getMonth() + 1).padStart(2, "0");
      const day = String(dd.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function numOrNull(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function getWeeklyPair(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      if (!arr.length) return null;

      const map = new Map();
      for (const x of arr) {
        const weekISO = toISODate(x.week);
        if (!weekISO) continue;

        const rawPrice = numOrNull(x.price);
        const price = (Number.isFinite(rawPrice) && rawPrice > 0) ? rawPrice : null;
        const count = numOrNull(x.count);

        const hasTrade = (count == null) ? (price != null) : (count > 0 && price != null);
        if (!hasTrade) continue;

        map.set(weekISO, { week: weekISO, price, count: count == null ? null : count });
      }

      if (!map.size) return null;

      const sorted = Array.from(map.values()).sort((a, b) => a.week.localeCompare(b.week));
      const latest = sorted[sorted.length - 1];
      const prev = sorted.length >= 2 ? sorted[sorted.length - 2] : null;
      return { latest, prev, sorted };
    }

    function getLatestWeeklyPrice(s) {
      const pair = getWeeklyPair(s);
      return pair ? pair.latest.price : null;
    }

    function getTotalTradeCount(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      let total = 0;
      let hasAny = false;
      for (const x of arr) {
        const c = numOrNull(x.count);
        if (Number.isFinite(c) && c > 0) {
          total += c;
          hasAny = true;
        }
      }
      return hasAny ? total : null;
    }

    function getDeltaDisplay(pair) {
      if (!pair || !pair.latest || !pair.prev) {
        return { className: "flat", text: "前週比 -", shortText: "比較なし" };
      }

      const diff = pair.latest.price - pair.prev.price;
      const cls = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
      const sign = diff > 0 ? "+" : diff < 0 ? "-" : "±";
      return {
        className: cls,
        text: `前週比 ${sign}${Math.abs(diff).toLocaleString()}円`,
        shortText: `${sign}${Math.abs(diff).toLocaleString()}円`
      };
    }

    function buildZukanSparkline(sleeve) {
      const pair = getWeeklyPair(sleeve);
      const rows = Array.isArray(pair?.sorted) ? pair.sorted.slice(-8) : [];
      const prices = rows
        .map((row) => numOrNull(row?.price))
        .filter((value) => Number.isFinite(value) && value > 0);

      if (prices.length < 2) {
        return `<span class="zukan-sparkline zukan-sparkline--empty" aria-label="価格推移データなし"><span class="zukan-sparkline-empty">推移なし</span></span>`;
      }

      const first = prices[0];
      const last = prices[prices.length - 1];
      const trendClass = last > first ? "up" : last < first ? "down" : "flat";
      const width = 86;
      const height = 36;
      const padX = 5;
      const padY = 5;
      const min = Math.min(...prices);
      const max = Math.max(...prices);
      const range = Math.max(max - min, 1);
      const step = (width - padX * 2) / Math.max(1, prices.length - 1);
      const points = prices.map((price, index) => {
        const x = padX + (step * index);
        const y = height - padY - (((price - min) / range) * (height - padY * 2));
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
      const firstX = padX.toFixed(1);
      const lastX = (padX + (step * (prices.length - 1))).toFixed(1);
      const areaPoints = `${firstX},${height - padY} ${points} ${lastX},${height - padY}`;

      return `<span class="zukan-sparkline zukan-sparkline--${trendClass}" aria-label="直近${prices.length}週の価格推移"><svg viewBox="0 0 ${width} ${height}" focusable="false" aria-hidden="true" preserveAspectRatio="none"><line class="zukan-sparkline-grid" x1="${padX}" y1="${height - padY}" x2="${width - padX}" y2="${height - padY}"></line><polygon class="zukan-sparkline-area" points="${areaPoints}"></polygon><polyline class="zukan-sparkline-line" points="${points}"></polyline></svg></span>`;
    }

    function getCardTags(sleeve, maxItems = 2) {
      const candidates = [];
      if (sleeve.series) candidates.push(sleeve.series);
      if (sleeve.condition) candidates.push(sleeve.condition);
      if (Array.isArray(sleeve.tags)) candidates.push(...sleeve.tags);
      if (typeof sleeve.tag === "string") candidates.push(sleeve.tag);
      if (typeof sleeve.badge === "string") candidates.push(sleeve.badge);

      const result = [];
      const seen = new Set();
      for (const raw of candidates) {
        const text = String(raw || "").trim();
        if (!text || seen.has(text)) continue;
        seen.add(text);
        result.push(text);
        if (result.length >= maxItems) break;
      }
      return result;
    }

    async function waitForSearch(maxWaitMs = 2000) {
      const start = Date.now();
      while (Date.now() - start <= maxWaitMs) {
        const el = document.getElementById("search");
        if (el) return el;
        await new Promise(r => setTimeout(r, 80));
      }
      return document.getElementById("search");
    }

    async function main() {
      if (window.common && typeof window.common.setupDashboardChrome === "function") {
        await window.common.setupDashboardChrome({ sidebarActive: "zukan" });
      }
      const headerSearchInput = await waitForSearch();
      const dashboardSearchInput = document.getElementById("dashboardSearchInput");
      const searchInput = dashboardSearchInput || headerSearchInput;
      if (!searchInput) {
        showError("検索欄の初期化に失敗しました");
        return;
      }

      const releaseYearSel = document.getElementById("releaseYear");
      const seriesSel = document.getElementById("series");
      const priceBandSel = document.getElementById("priceBand");
      const sortOrderSel = document.getElementById("sortOrder");
      const clearBtn = document.getElementById("clear");
      const pageSearchInput = document.getElementById("zukanPageSearch");
      const list = document.getElementById("list");
      const activeSummary = document.getElementById("activeSummary");
      const updatedChip = document.getElementById("updatedChip");
      const countChip = document.getElementById("countChip");

      const url = new URL(location.href);
      const qParam = (url.searchParams.get("q") || "").trim();
      let currentGroupParam = (url.searchParams.get("group") || "").trim();
      let currentTagParam = (url.searchParams.get("tag") || "").trim();
      let currentTypeParam = (url.searchParams.get("type") || "").trim();
      if (qParam) {
        if (pageSearchInput) pageSearchInput.value = qParam;
        if (dashboardSearchInput) dashboardSearchInput.value = qParam;
        if (headerSearchInput) headerSearchInput.value = qParam;
      }

      function setLoadingState() {
        [updatedChip, countChip].forEach(el => {
          if (!el) return;
          el.classList.add("is-loading", "skeleton-shimmer");
        });
        if (activeSummary) activeSummary.innerHTML = "";
        list.innerHTML = Array.from({ length: 12 }, () => `
          <div class="zukan-card is-skeleton">
            <div class="zukan-card-media skeleton-shimmer"></div>
            <div class="zukan-card-body">
              <div class="zukan-card-badges">
                <span class="zukan-badge skeleton-shimmer"></span>
                <span class="zukan-badge skeleton-shimmer"></span>
              </div>
              <div class="zukan-card-title skeleton-shimmer"></div>
              <div class="zukan-card-price skeleton-shimmer"></div>
              <div class="zukan-card-meta">
                <span class="zukan-card-spec skeleton-shimmer"></span>
                <span class="zukan-card-spec skeleton-shimmer"></span>
              </div>
            </div>
          </div>
        `).join("");
      }

      function clearLoadingState() {
        [updatedChip, countChip].forEach(el => {
          if (!el) return;
          el.classList.remove("is-loading", "skeleton-shimmer");
        });
      }

      setLoadingState();

      let data;
      try {
        data = await window.common.loadData();
      } catch (e) {
        clearLoadingState();
        showError(e.message || "データ読み込みに失敗しました");
        return;
      }
      clearLoadingState();
      hideError();

      const sleeves = Array.isArray(data.sleeves) ? data.sleeves : [];

      let maxWeek = null;
      for (const s of sleeves) {
        const p = getWeeklyPair(s);
        if (!p) continue;
        const w = p.latest.week;
        if (!maxWeek || w > maxWeek) maxWeek = w;
      }
      if (maxWeek) {
        const u = document.getElementById("updatedAt");
        if (u) {
          u.textContent = `${maxWeek}`;
        }
      }

      const releaseYears = uniq(sleeves.map(s => s.releaseYear)).map(Number).filter(Number.isFinite).sort((a, b) => a - b);
      const seriesList = uniq(sleeves.map(s => s.series)).sort();

      for (const y of releaseYears) {
        const opt = document.createElement("option");
        opt.value = String(y);
        opt.textContent = String(y);
        releaseYearSel.appendChild(opt);
      }
      for (const ser of seriesList) {
        const opt = document.createElement("option");
        opt.value = ser;
        opt.textContent = ser;
        seriesSel.appendChild(opt);
      }

      function getCardPrice(s) {
        return getLatestWeeklyPrice(s);
      }

      function getSleeveSearchText(sleeve) {
        return [
          sleeve?.name,
          sleeve?.series,
          sleeve?.releaseYear,
          sleeve?.type,
          sleeve?.category1,
          sleeve?.category2,
          sleeve?.category3,
          sleeve?.category4,
          sleeve?.category5,
          sleeve?.category6,
          sleeve?.category7,
          sleeve?.category8,
          sleeve?.category9
        ].map((value) => String(value ?? "").toLowerCase()).join(" ");
      }

      function renderActiveSummary({ kw, releaseYear, series, band, sortOrder, total, group, tag, type }) {
        if (!activeSummary) return;
        const chips = [];
        if (kw) chips.push(`<span class="zukan-active-chip">検索 <strong>${escapeHtml(kw)}</strong></span>`);
        if (group) chips.push(`<span class="zukan-active-chip">カテゴリ <strong>${escapeHtml(group)}</strong></span>`);
        if (tag) chips.push(`<span class="zukan-active-chip">タグ <strong>${escapeHtml(tag)}</strong></span>`);
        if (type) chips.push(`<span class="zukan-active-chip">種別 <strong>${escapeHtml(type)}</strong></span>`);
        if (releaseYear) chips.push(`<span class="zukan-active-chip">発売年 <strong>${escapeHtml(releaseYear)}</strong></span>`);
        if (series) chips.push(`<span class="zukan-active-chip">シリーズ <strong>${escapeHtml(series)}</strong></span>`);
        if (band) chips.push(`<span class="zukan-active-chip">価格帯 <strong>${escapeHtml(priceBandSel.options[priceBandSel.selectedIndex]?.textContent || "")}</strong></span>`);
        if (sortOrder) chips.push(`<span class="zukan-active-chip">並び替え <strong>${escapeHtml(sortOrderSel.options[sortOrderSel.selectedIndex]?.textContent || "")}</strong></span>`);
        if (!chips.length) {
          chips.push(`<span class="zukan-active-chip">全件 <strong>${total.toLocaleString()}件</strong></span>`);
        }
        activeSummary.innerHTML = chips.join("");
      }

      function render() {
        const rawKeyword = (pageSearchInput ? pageSearchInput.value : searchInput.value).trim();
        const kw = rawKeyword.toLowerCase();
        const releaseYear = releaseYearSel.value;
        const series = seriesSel.value;
        const band = parseBand(priceBandSel.value);
        const sortOrder = sortOrderSel.value;
        const normalizedGroup = window.common && typeof window.common.normalizeSleeveTextValue === "function"
          ? window.common.normalizeSleeveTextValue(currentGroupParam).toLowerCase()
          : String(currentGroupParam || "").trim().toLowerCase();
        const normalizedTag = window.common && typeof window.common.normalizeSleeveTextValue === "function"
          ? window.common.normalizeSleeveTextValue(currentTagParam)
          : String(currentTagParam || "").trim();
        const normalizedType = window.common && typeof window.common.normalizeSleeveTextValue === "function"
          ? window.common.normalizeSleeveTextValue(currentTypeParam)
          : String(currentTypeParam || "").trim();

        list.innerHTML = "";

        const filtered = [];
        for (const s of sleeves) {
          if (kw && !getSleeveSearchText(s).includes(kw)) continue;
          if (normalizedGroup && (!window.common || typeof window.common.sleeveMatchesGroup !== "function" || !window.common.sleeveMatchesGroup(s, normalizedGroup))) continue;
          if (normalizedTag && (!window.common || typeof window.common.sleeveMatchesDetailTag !== "function" || !window.common.sleeveMatchesDetailTag(s, normalizedTag))) continue;
          if (normalizedType && (!window.common || typeof window.common.sleeveMatchesType !== "function" || !window.common.sleeveMatchesType(s, normalizedType))) continue;
          if (releaseYear && String(s.releaseYear ?? "") !== releaseYear) continue;
          if (series && String(s.series || "") !== series) continue;

          if (band) {
            const p = getCardPrice(s);
            if (p == null) continue;
            if (p < band.min || p > band.max) continue;
          }
          filtered.push(s);
        }

        filtered.sort((a, b) => {
          const pa = getCardPrice(a) ?? -1;
          const pb = getCardPrice(b) ?? -1;
          const ta = getTotalTradeCount(a) ?? 0;
          const tb = getTotalTradeCount(b) ?? 0;

          switch (sortOrder) {
            case "priceAsc": return pa - pb;
            case "tradeCountDesc": return (tb - ta) || (pb - pa);
            case "nameAsc": return String(a.name ?? "").localeCompare(String(b.name ?? ""));
            case "releaseDesc": return (Number(b.releaseYear) || 0) - (Number(a.releaseYear) || 0);
            default: return pb - pa;
          }
        });

        if (!filtered.length) {
          const c = document.getElementById("countInfo");
          if (c) c.textContent = "0件";
          const badge = document.getElementById("resultCountBadge");
          if (badge) badge.textContent = "0";
          renderActiveSummary({ kw: rawKeyword, releaseYear, series, band, sortOrder, total: 0, group: normalizedGroup, tag: normalizedTag, type: normalizedType });
          if (window.common && typeof window.common.updateItemListStructuredData === "function") {
            window.common.updateItemListStructuredData("sleevesItemListStructuredData", [], {
              name: "ポケカスリーブ図鑑"
            });
          }
          list.innerHTML = '<div class="zukan-empty">条件に一致するスリーブがありません。キーワードや価格帯をゆるめて、もう一度探してみてください。</div>';
          return;
        }

        const c = document.getElementById("countInfo");
        if (c) c.textContent = `${filtered.length.toLocaleString()}件`;
        const badge = document.getElementById("resultCountBadge");
        if (badge) badge.textContent = `${filtered.length.toLocaleString()}`;
        renderActiveSummary({ kw: rawKeyword, releaseYear, series, band, sortOrder, total: filtered.length, group: normalizedGroup, tag: normalizedTag, type: normalizedType });
        if (window.common && typeof window.common.updateItemListStructuredData === "function") {
          window.common.updateItemListStructuredData("sleevesItemListStructuredData", filtered, {
            name: "ポケカスリーブ図鑑",
            description: "ポケカスリーブの図鑑一覧です。"
          });
        }

        const frag = document.createDocumentFragment();

        filtered.forEach((s) => {
          const p = getCardPrice(s);
          const priceText = (p == null) ? "-" : `${p.toLocaleString()}円`;

          const weeklyPair = getWeeklyPair(s);
          const delta = getDeltaDisplay(weeklyPair);
          const sparklineHtml = buildZukanSparkline(s);
          const tags = getCardTags(s, 2);
          const tagsHtml = tags.map(tag => `<span class="zukan-badge">${escapeHtml(tag)}</span>`).join("");
          const specHtml = [
            s.releaseYear ? `<span class="zukan-card-spec">YEAR ${escapeHtml(s.releaseYear)}</span>` : "",
            s.series ? `<span class="zukan-card-spec">${escapeHtml(s.series)}</span>` : ""
          ].filter(Boolean).join("");

          const imgSrc = String(s.imageUrl || "").trim();
          const detailHref = (window.common && typeof window.common.buildSleeveDetailHref === "function")
            ? window.common.buildSleeveDetailHref(s.id ?? "")
            : `./sleeve/${encodeURIComponent(s.id ?? "")}/`;

          const card = document.createElement("a");
          card.className = "zukan-card";
          card.href = detailHref;
          card.setAttribute("data-sleeve-link", "1");
          card.setAttribute("aria-label", `${String(s.name ?? "")}の詳細を見る`);
          const deltaBadge = `<span class="zukan-badge zukan-badge--delta ${delta.className}">${escapeHtml(delta.shortText)}</span>`;
          card.innerHTML = `
            <div class="zukan-card-media">
              ${imgSrc
                ? `<img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(s.name ?? "")}" loading="lazy" referrerpolicy="no-referrer"
                    onerror="this.onerror=null; this.style.display='none';">`
                : ""}
            </div>
            <div class="zukan-card-body">
              <h2 class="zukan-card-title">${escapeHtml(s.name ?? "")}</h2>
              <div class="zukan-card-price-wrap zukan-price-panel">
                <div class="zukan-price-copy">
                  <p class="zukan-card-price">${escapeHtml(priceText)}</p>
                  <div class="zukan-card-badges">${deltaBadge}</div>
                </div>
                ${sparklineHtml}
              </div>
              <div class="zukan-card-meta">
                ${specHtml}
                ${window.common && typeof window.common.buildFlowBadgeHtml === "function" ? window.common.buildFlowBadgeHtml(s, { includeTrend: true }) : ""}
                ${tagsHtml}
              </div>
            </div>
          `;
          frag.appendChild(card);
        });

        list.appendChild(frag);
      }

      let t = null;
      const queueRender = () => {
        clearTimeout(t);
        t = setTimeout(render, 80);
      };
      const syncInputs = (value, source = null) => {
        const targets = [pageSearchInput, headerSearchInput, dashboardSearchInput];
        for (const input of targets) {
          if (!input || input === source) continue;
          input.value = value;
        }
      };
      const attachSearchSync = input => {
        if (!input) return;
        input.addEventListener("input", () => {
          syncInputs(input.value, input);
          queueRender();
        });
      };
      attachSearchSync(pageSearchInput);
      attachSearchSync(headerSearchInput);
      attachSearchSync(dashboardSearchInput);

      releaseYearSel.addEventListener("change", render);
      seriesSel.addEventListener("change", render);
      priceBandSel.addEventListener("change", render);
      sortOrderSel.addEventListener("change", render);

      clearBtn.addEventListener("click", () => {
        if (pageSearchInput) pageSearchInput.value = "";
        searchInput.value = "";
        syncInputs("", searchInput);
        currentGroupParam = "";
        currentTagParam = "";
        currentTypeParam = "";
        try {
          const nextUrl = new URL(location.href);
          nextUrl.searchParams.delete("q");
          nextUrl.searchParams.delete("group");
          nextUrl.searchParams.delete("tag");
          nextUrl.searchParams.delete("type");
          history.replaceState({}, "", nextUrl.toString());
        } catch (_) { }
        releaseYearSel.value = "";
        seriesSel.value = "";
        priceBandSel.value = "";
        sortOrderSel.value = "priceDesc";
        render();
      });

      render();
    }

    main();
  </script>
</body>

</html>
