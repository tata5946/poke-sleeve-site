  <script>
    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "block";
      el.textContent = msg;
    }

    function hideError() {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "none";
      el.textContent = "";
    }

    function uniq(arr) {
      const s = new Set();
      for (const v of arr) {
        const t = (v == null) ? "" : String(v).trim();
        if (t) s.add(t);
      }
      return Array.from(s);
    }

    function parseBand(v) {
      if (!v) return null;
      const [a, b] = v.split("-").map(Number);
      if (!Number.isFinite(a) || !Number.isFinite(b)) return null;
      return { min: a, max: b };
    }

    function toISODate(d) {
      const dd = new Date(d);
      if (Number.isNaN(dd.getTime())) return null;
      const y = dd.getFullYear();
      const m = String(dd.getMonth() + 1).padStart(2, "0");
      const day = String(dd.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function numOrNull(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function getWeeklyPair(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      if (!arr.length) return null;

      const map = new Map();
      for (const x of arr) {
        const weekISO = toISODate(x.week);
        if (!weekISO) continue;

        const rawPrice = numOrNull(x.price);
        const price = (Number.isFinite(rawPrice) && rawPrice > 0) ? rawPrice : null;
        const count = numOrNull(x.count);

        const hasTrade = (count == null) ? (price != null) : (count > 0 && price != null);
        if (!hasTrade) continue;

        map.set(weekISO, { week: weekISO, price, count: count == null ? null : count });
      }

      if (!map.size) return null;

      const sorted = Array.from(map.values()).sort((a, b) => a.week.localeCompare(b.week));
      const latest = sorted[sorted.length - 1];
      const prev = sorted.length >= 2 ? sorted[sorted.length - 2] : null;
      return { latest, prev, sorted };
    }

    function getLatestWeeklyPrice(s) {
      const pair = getWeeklyPair(s);
      return pair ? pair.latest.price : null;
    }

    function getTotalTradeCount(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      let total = 0;
      let hasAny = false;
      for (const x of arr) {
        const c = numOrNull(x.count);
        if (Number.isFinite(c) && c > 0) {
          total += c;
          hasAny = true;
        }
      }
      return hasAny ? total : null;
    }

    function isDisplayableSleeve(sleeve) {
      if (!sleeve || typeof sleeve !== "object") return false;
      const id = String(sleeve.id ?? "").trim();
      const name = String(sleeve.name ?? "").trim();
      if (!id || !name) return false;
      if (name === "-" || name === "—") return false;
      return true;
    }

      function getCompactDeltaDisplay(pair) {
        if (!pair || !pair.prev) {
          return { className: "flat", text: "比較なし" };
        }
        const diff = Number(pair.latest.price) - Number(pair.prev.price);
        if (!Number.isFinite(diff)) {
          return { className: "flat", text: "比較なし" };
        }
        const sign = diff > 0 ? "+" : diff < 0 ? "-" : "±";
        const className = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
        return { className, text: `${sign}${Math.abs(diff).toLocaleString()}円` };
      }

      function getCompactTagLabels(sleeve, maxItems = 2) {
        const candidates = [];
        if (sleeve.series) candidates.push(sleeve.series);
        if (sleeve.condition) candidates.push(sleeve.condition);
        if (Array.isArray(sleeve.tags)) candidates.push(...sleeve.tags);
        if (typeof sleeve.tag === "string") candidates.push(sleeve.tag);
        if (typeof sleeve.badge === "string") candidates.push(sleeve.badge);

        const seen = new Set();
        const result = [];
        for (const raw of candidates) {
          const text = String(raw || "").trim().replace(/^#/, "");
          if (!text || seen.has(text)) continue;
          seen.add(text);
          result.push(text);
          if (result.length >= maxItems) break;
        }
        return result;
      }

    async function waitForSearch(maxWaitMs = 2000) {
      const start = Date.now();
      while (Date.now() - start <= maxWaitMs) {
        const el = document.getElementById("search");
        if (el) return el;
        await new Promise(r => setTimeout(r, 80));
      }
      return document.getElementById("search");
    }

      async function main() {
      const searchInput = await waitForSearch();
      if (!searchInput) {
        showError("検索欄の初期化に失敗しました（headerが読み込めていません）");
        return;
      }

      const releaseYearSel = document.getElementById("releaseYear");
      const seriesSel = document.getElementById("series");
      const priceBandSel = document.getElementById("priceBand");
      const sortOrderSel = document.getElementById("sortOrder");
      const sortOrderMobileSel = document.getElementById("sortOrderMobile");
        const clearBtn = document.getElementById("clear");
        const activeFilters = document.getElementById("activeFilters");
        const list = document.getElementById("list");
        const sortTabs = document.getElementById("sortTabs");
        const sortChips = document.getElementById("sortChips");
      const sortChipNote = document.getElementById("sortChipNote");
      const resultsMeta = document.getElementById("resultsMeta");
      const resultsSubcopy = document.getElementById("resultsSubcopy");

      const url = new URL(location.href);
      const qParam = (url.searchParams.get("q") || "").trim();
      const rawGroupParam = String(url.searchParams.get("group") || "").trim().toLowerCase();
      const rawTagParam = String(url.searchParams.get("tag") || "").trim();
      const rawTypeParam = String(url.searchParams.get("type") || "").trim();
      const GROUP_CONFIG = {
        pokemon: {
          label: "ポケモン",
          description: "category1〜3 に値があるスリーブを表示しています。"
        },
        character: {
          label: "キャラクター",
          description: "category4〜5 に値があるスリーブを表示しています。"
        },
        other: {
          label: "その他",
          description: "category6〜9 に値があるスリーブを表示しています。"
        }
      };
      let activeGroup = GROUP_CONFIG[rawGroupParam] ? rawGroupParam : "";
      let activeTag = rawTagParam;
      let activeType = rawTypeParam;
      if (qParam) searchInput.value = qParam;

      let data;
      try {
        data = await window.common.loadData();
      } catch (e) {
        showError(e.message || "データ読み込みに失敗しました");
        return;
      }
      hideError();

      const sleeves = (Array.isArray(data.sleeves) ? data.sleeves : []).filter(isDisplayableSleeve);
      function sleeveMatchesGroupFilter(sleeve) {
        if (!activeGroup) return true;
        if (window.common && typeof window.common.sleeveMatchesGroup === "function") {
          return window.common.sleeveMatchesGroup(sleeve, activeGroup);
        }
        const fallbackGroups = {
          pokemon: ["category1", "category2", "category3"],
          character: ["category4", "category5"],
          other: ["category6", "category7", "category8", "category9"]
        };
        const keys = fallbackGroups[activeGroup] || [];
        return keys.some((key) => String(sleeve?.[key] ?? "").trim());
      }

      function sleeveMatchesTagFilter(sleeve) {
        if (!activeTag) return true;
        if (window.common && typeof window.common.sleeveMatchesDetailTag === "function") {
          return window.common.sleeveMatchesDetailTag(sleeve, activeTag);
        }
        const keys = ["category1", "category2", "category3", "category4", "category5", "category6", "category7", "category8", "category9"];
        return keys.some((key) => String(sleeve?.[key] ?? "").trim() === activeTag);
      }

      function sleeveMatchesTypeFilter(sleeve) {
        if (!activeType) return true;
        if (window.common && typeof window.common.sleeveMatchesType === "function") {
          return window.common.sleeveMatchesType(sleeve, activeType);
        }
        return String(sleeve?.type ?? "").trim() === activeType;
      }

      let maxWeek = null;
      for (const s of sleeves) {
        const p = getWeeklyPair(s);
        if (!p) continue;
        const w = p.latest.week;
        if (!maxWeek || w > maxWeek) maxWeek = w;
      }
      if (maxWeek) {
        const u = document.getElementById("updatedAt");
        if (u) {
          u.textContent = `最終更新: ${maxWeek}（週次）`;
          u.style.display = "block";
        }
      }

      const releaseYears = uniq(sleeves.map(s => s.releaseYear)).map(Number).filter(Number.isFinite).sort((a, b) => a - b);
      const seriesList = uniq(sleeves.map(s => s.series)).sort();

      for (const y of releaseYears) {
        const opt = document.createElement("option");
        opt.value = String(y);
        opt.textContent = String(y);
        releaseYearSel.appendChild(opt);
      }
      for (const ser of seriesList) {
        const opt = document.createElement("option");
        opt.value = ser;
        opt.textContent = ser;
        seriesSel.appendChild(opt);
      }

      function renderActiveFilters() {
        if (!activeFilters) return;
        const chips = [];
        if (releaseYearSel.value) chips.push({ key: "releaseYear", text: `発売年: ${releaseYearSel.value}` });
        if (seriesSel.value) chips.push({ key: "series", text: `シリーズ: ${seriesSel.value}` });
        if (priceBandSel.value) {
          const selected = priceBandSel.options[priceBandSel.selectedIndex];
          const label = selected ? selected.textContent.trim() : "";
          if (label) chips.push({ key: "priceBand", text: `価格帯: ${label}` });
        }

        activeFilters.innerHTML = chips.map((chip) =>
          `<button class="catalog-filter-chip" type="button" data-filter-key="${escapeHtml(chip.key)}" aria-label="${escapeHtml(chip.text)} を解除">
            <span>${escapeHtml(chip.text)}</span>
            <span class="catalog-filter-chip-remove" aria-hidden="true">×</span>
          </button>`
        ).join("");
        activeFilters.classList.toggle("is-visible", chips.length > 0);
      }

      function getCardPrice(s) {
        return getLatestWeeklyPrice(s);
      }

      const SORT_UI_CONFIG = {
        recommended: {
          primary: "recommended",
          label: "おすすめ",
          accent: "迷ったらここから",
          helper: "新作・価格あり・取引件数をバランスよく見せます。"
        },
        popular: {
          primary: "popular",
          label: "人気",
          accent: "いま見られていそう",
          helper: "人気スコアの実データがないため、現在は新作寄りの並びで代用しています。",
          fallback: true
        },
        releaseDesc: {
          primary: "release",
          label: "新作",
          accent: "最近出た順",
          helper: "発売日の新しいスリーブからチェックできます。"
        },
        releaseAsc: {
          primary: "release",
          label: "年代",
          accent: "古い順も見られる",
          helper: "年代でたどりたいときに使いやすい並びです。"
        },
        priceDesc: {
          primary: "price",
          label: "高額",
          accent: "コレクター向け",
          helper: "高額帯のスリーブを先に見られます。"
        },
        priceAsc: {
          primary: "price",
          label: "価格で探す",
          accent: "手に取りやすい順",
          helper: "価格不明は末尾に回したうえで安い順にしています。"
        },
        nameAsc: {
          primary: "kana",
          label: "あいうえお",
          accent: "名前から探す",
          helper: "日本語の並びを自然に寄せた五十音順です。"
        },
        tradeDesc: {
          primary: "popular",
          label: "取引多い順",
          accent: "動きの多い順",
          helper: "取引件数の合計が多いスリーブを先頭にしています。"
        }
      };

      const PRIMARY_TAB_CONFIG = [
        {
          key: "recommended",
          label: "おすすめ",
          accent: "発見しやすい順",
          defaultSort: "recommended",
          chips: []
        },
        {
          key: "popular",
          label: "人気",
          accent: "いま見たい",
          defaultSort: "tradeDesc",
          chips: [
            { key: "tradeDesc", label: "取引多い順" },
            { key: "popular", label: "注目順" }
          ],
          note: "人気スコアの実データがないため、取引件数ベースと新作寄り表示を使っています。"
        },
        {
          key: "release",
          label: "年代",
          accent: "新旧で見る",
          defaultSort: "releaseDesc",
          chips: [
            { key: "releaseDesc", label: "新しい順" },
            { key: "releaseAsc", label: "古い順" }
          ]
        },
        {
          key: "price",
          label: "高額",
          accent: "価格で発見",
          defaultSort: "priceDesc",
          chips: [
            { key: "priceDesc", label: "高い順" },
            { key: "priceAsc", label: "安い順" }
          ]
        },
        {
          key: "kana",
          label: "あいうえお",
          accent: "名前から探す",
          defaultSort: "nameAsc",
          chips: []
        }
      ];

      let currentPrimaryTab = "recommended";
      let renderToken = 0;

      function isMissingValue(value) {
        return value == null || value === "" || (typeof value === "number" && !Number.isFinite(value));
      }

      function compareNullableNumbers(a, b, dir = "asc") {
        const aValid = Number.isFinite(a);
        const bValid = Number.isFinite(b);
        if (aValid && !bValid) return -1;
        if (!aValid && bValid) return 1;
        if (!aValid && !bValid) return 0;
        return dir === "desc" ? b - a : a - b;
      }

      function toHiragana(value) {
        return String(value || "").replace(/[ァ-ヶ]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0x60));
      }

      function normalizeSortName(sleeve) {
        const raw = String(sleeve?.kana || sleeve?.name || "").normalize("NFKC");
        return toHiragana(raw)
          .replace(/^[\s"'`~!！?？#＃$＄%％&＆*＊+＋,，.。\/／:：;<=>＞@＠[\]「」『』()（）{}｛｝|｜^＾_-]+/, "")
          .trim()
          .toLowerCase();
      }

      function compareByNameJa(a, b) {
        const an = normalizeSortName(a);
        const bn = normalizeSortName(b);
        return an.localeCompare(bn, "ja", { sensitivity: "base", numeric: true });
      }

      function parseReleaseSortValue(sleeve) {
        const candidates = [
          sleeve?.releaseDate,
          sleeve?.release_date,
          sleeve?.releaseAt,
          sleeve?.releasedAt,
          sleeve?.releasedDate,
          sleeve?.released_date,
          sleeve?.["発売日"],
          sleeve?.["発売年月日"]
        ];

        for (const raw of candidates) {
          const iso = toISODate(raw);
          if (iso) return iso;
          const text = String(raw ?? "").trim();
          const ymd = text.match(/^(\d{4})[\/\-\.年](\d{1,2})[\/\-\.月](\d{1,2})(?:日)?$/);
          if (ymd) {
            return `${ymd[1]}-${String(Number(ymd[2])).padStart(2, "0")}-${String(Number(ymd[3])).padStart(2, "0")}`;
          }
        }

        const y = Number(sleeve?.releaseYear);
        if (Number.isFinite(y) && y > 1900) {
          return `${String(y).padStart(4, "0")}-01-01`;
        }
        return null;
      }

      function getTradeCountForSort(sleeve) {
        return getTotalTradeCount(sleeve);
      }

      function getReleaseTimestamp(sleeve) {
        const value = parseReleaseSortValue(sleeve);
        if (!value) return null;
        const ts = Date.parse(value);
        return Number.isFinite(ts) ? ts : null;
      }

      function getPopularityScore(sleeve) {
        // TODO: PV や人気スコアがデータに追加されたらここで優先利用する
        return getTradeCountForSort(sleeve);
      }

      function getRecommendedScore(sleeve) {
        const releaseTs = getReleaseTimestamp(sleeve);
        const latestPrice = getCardPrice(sleeve);
        const tradeCount = getTradeCountForSort(sleeve);
        let score = 0;
        if (Number.isFinite(releaseTs)) score += releaseTs / 100000000;
        if (Number.isFinite(tradeCount)) score += tradeCount * 1000;
        if (Number.isFinite(latestPrice)) score += 10000000;
        return score;
      }

      function compareWithTieBreakers(a, b, primaryResult, indexedA, indexedB) {
        if (primaryResult !== 0) return primaryResult;

        const tradeCmp = compareNullableNumbers(getTradeCountForSort(a), getTradeCountForSort(b), "desc");
        if (tradeCmp !== 0) return tradeCmp;

        const nameCmp = compareByNameJa(a, b);
        if (nameCmp !== 0) return nameCmp;

        const idCmp = String(a.id ?? "").localeCompare(String(b.id ?? ""));
        if (idCmp !== 0) return idCmp;

        return indexedA.__index - indexedB.__index;
      }

      function sortSleeves(items, sortOrder) {
        const indexed = items.map((item, index) => ({ item, __index: index }));

        indexed.sort((left, right) => {
          const a = left.item;
          const b = right.item;

          switch (sortOrder) {
            case "priceAsc": {
              const priceCmp = compareNullableNumbers(getCardPrice(a), getCardPrice(b), "asc");
              return compareWithTieBreakers(a, b, priceCmp, left, right);
            }
            case "priceDesc": {
              const priceCmp = compareNullableNumbers(getCardPrice(a), getCardPrice(b), "desc");
              return compareWithTieBreakers(a, b, priceCmp, left, right);
            }
            case "releaseAsc": {
              const releaseCmp = compareNullableNumbers(
                getReleaseTimestamp(a),
                getReleaseTimestamp(b),
                "asc"
              );
              return compareWithTieBreakers(a, b, releaseCmp, left, right);
            }
            case "releaseDesc": {
              const releaseCmp = compareNullableNumbers(
                getReleaseTimestamp(a),
                getReleaseTimestamp(b),
                "desc"
              );
              return compareWithTieBreakers(a, b, releaseCmp, left, right);
            }
            case "nameAsc": {
              const nameCmp = compareByNameJa(a, b);
              return compareWithTieBreakers(a, b, nameCmp, left, right);
            }
            case "tradeDesc": {
              const tradeCmp = compareNullableNumbers(getTradeCountForSort(a), getTradeCountForSort(b), "desc");
              return compareWithTieBreakers(a, b, tradeCmp, left, right);
            }
            case "popular": {
              // TODO: PV/人気スコア等の実データが入ったら getPopularityScore() を差し替える
              const popCmp = compareNullableNumbers(
                getPopularityScore(a),
                getPopularityScore(b),
                "desc"
              );
              if (popCmp !== 0) return compareWithTieBreakers(a, b, popCmp, left, right);
              const releaseCmp = compareNullableNumbers(getReleaseTimestamp(a), getReleaseTimestamp(b), "desc");
              return compareWithTieBreakers(a, b, releaseCmp, left, right);
            }
            case "recommended":
            default: {
              const scoreCmp = compareNullableNumbers(
                getRecommendedScore(a),
                getRecommendedScore(b),
                "desc"
              );
              return compareWithTieBreakers(a, b, scoreCmp, left, right);
            }
          }
        });

        return indexed.map((entry) => entry.item);
      }

      function getSortLabelConfig(sortOrder) {
        return SORT_UI_CONFIG[sortOrder] || SORT_UI_CONFIG.recommended;
      }

      function syncSortFallbackSelect() {
        if (!sortOrderMobileSel) return;
        sortOrderMobileSel.innerHTML = sortOrderSel.innerHTML;
        sortOrderMobileSel.value = sortOrderSel.value;
      }

      function renderSortTabs() {
        if (!sortTabs) return;
        sortTabs.innerHTML = PRIMARY_TAB_CONFIG.map((tab) => `
          <button type="button" class="sort-tab${tab.key === currentPrimaryTab ? " is-active" : ""}" data-primary-tab="${escapeHtml(tab.key)}" role="tab" aria-selected="${tab.key === currentPrimaryTab ? "true" : "false"}">
            ${escapeHtml(tab.label)}
            <span class="sort-tab-accent">${escapeHtml(tab.accent)}</span>
          </button>
        `).join("");
      }

      function renderSortChips() {
        const primary = PRIMARY_TAB_CONFIG.find((tab) => tab.key === currentPrimaryTab) || PRIMARY_TAB_CONFIG[0];
        const currentSort = sortOrderSel.value;
        const chips = Array.isArray(primary.chips) ? primary.chips : [];
        if (!sortChips) return;

        sortChips.style.display = chips.length ? "flex" : "none";
        sortChips.innerHTML = chips.map((chip) => `
          <button type="button" class="sort-chip${chip.key === currentSort ? " is-active" : ""}" data-sort-chip="${escapeHtml(chip.key)}">
            ${escapeHtml(chip.label)}
          </button>
        `).join("");

        const currentConfig = getSortLabelConfig(currentSort);
        if (sortChipNote) sortChipNote.textContent = currentConfig.helper || primary.note || "";
        if (sortChipNote) sortChipNote.classList.toggle("is-fallback", Boolean(currentConfig.fallback));
      }

      function updateSortExplorerCopy(sortOrder) {
        const config = getSortLabelConfig(sortOrder);
        const prefixes = [];
        if (activeGroup && GROUP_CONFIG[activeGroup]) prefixes.push(`${GROUP_CONFIG[activeGroup].label}に該当するスリーブを表示中。`);
        if (activeTag) prefixes.push(`「${activeTag}」でさらに絞り込み中。`);
        if (activeType) prefixes.push(`種類「${activeType}」で絞り込み中。`);
        const prefixText = prefixes.length ? `${prefixes.join(" ")} ` : "";
        if (resultsSubcopy) resultsSubcopy.textContent = `${prefixText}${config.helper || "気になるスリーブを見つけやすい順で並び替えています。"}`;
      }

      function applyPrimaryTab(primaryKey) {
        const primary = PRIMARY_TAB_CONFIG.find((tab) => tab.key === primaryKey) || PRIMARY_TAB_CONFIG[0];
        currentPrimaryTab = primary.key;
        const currentSort = sortOrderSel.value;
        const chipKeys = (primary.chips || []).map((chip) => chip.key);
        if (primary.defaultSort && !chipKeys.includes(currentSort) && primary.key !== "popular" && primary.key !== "recommended" && primary.key !== "kana") {
          sortOrderSel.value = primary.defaultSort;
        } else if (primary.key === "kana") {
          sortOrderSel.value = "nameAsc";
        } else if (primary.key === "recommended") {
          sortOrderSel.value = "recommended";
        } else if (primary.key === "popular" && !chipKeys.includes(currentSort)) {
          sortOrderSel.value = primary.defaultSort;
        }
        if (sortOrderMobileSel) sortOrderMobileSel.value = sortOrderSel.value;
        renderSortTabs();
        renderSortChips();
      }

      function getCardBadges(sleeve) {
        const badges = [];
        const releaseTs = getReleaseTimestamp(sleeve);
        const price = getCardPrice(sleeve);
        const trades = getTradeCountForSort(sleeve);
        const now = Date.now();
        const oneYearMs = 365 * 24 * 60 * 60 * 1000;

        if (Number.isFinite(releaseTs) && (now - releaseTs) <= oneYearMs * 1.3) {
          badges.push({ label: "NEW", className: "new" });
        }
        if (Number.isFinite(price) && price >= 3000) {
          badges.push({ label: "高額", className: "price" });
        }
        if (Number.isFinite(trades) && trades >= 20) {
          badges.push({ label: "人気", className: "hot" });
        }
        if (getRecommendedScore(sleeve) > 10000000) {
          badges.push({ label: "注目", className: "pick" });
        }
        return badges.slice(0, 3);
      }

      async function applySortWithAnimation(callback) {
        renderToken += 1;
        const token = renderToken;
        list.classList.remove("is-visible");
        list.classList.add("is-animating");
        await new Promise((resolve) => setTimeout(resolve, 120));
        if (token !== renderToken) return;
        callback();
        requestAnimationFrame(() => {
          list.classList.remove("is-animating");
          list.classList.add("is-visible");
        });
      }

      function buildCardMarkup(s, activeSort) {
        const p = getCardPrice(s);
        const weeklyPair = getWeeklyPair(s);
        const delta = getCompactDeltaDisplay(weeklyPair);
        const priceText = (p == null) ? "-" : `${p.toLocaleString()}円`;
        const tags = getCompactTagLabels(s, 2);
        const tagsHtml = tags.map((tag) => `<span class="compact-tag">${escapeHtml(tag)}</span>`).join("");
        const imgSrc = String(s.imageUrl || "").trim();
        const detailHref = (window.common && typeof window.common.buildSleeveDetailHref === "function")
          ? window.common.buildSleeveDetailHref(s.id ?? "")
          : `./sleeve/${encodeURIComponent(s.id ?? "")}/`;

        return `
          <span class="compact-thumb-wrap">
            ${imgSrc
              ? `<img class="compact-thumb" src="${escapeHtml(imgSrc)}" alt="${escapeHtml(s.name ?? "")}" loading="lazy" referrerpolicy="no-referrer"
                  onerror="this.onerror=null; this.style.display='none';">`
              : ""}
          </span>
          <h3 class="compact-card-title">${escapeHtml(s.name ?? "")}</h3>
          <div class="compact-price-row">
            <div class="compact-price">${escapeHtml(priceText)}</div>
            <div class="compact-delta ${delta.className}">${escapeHtml(delta.text)}</div>
          </div>
          ${tagsHtml ? `<div class="compact-tags">${tagsHtml}</div>` : ""}
        `;
      }

      function renderResults() {
        const kw = searchInput.value.trim().toLowerCase();
        const releaseYear = releaseYearSel.value;
        const series = seriesSel.value;
        const band = parseBand(priceBandSel.value);
        const sortOrder = sortOrderSel.value;

        list.innerHTML = "";
        renderActiveFilters();

        const filtered = [];
        for (const s of sleeves) {
          if (kw && !String(s.name || "").toLowerCase().includes(kw)) continue;
          if (!sleeveMatchesGroupFilter(s)) continue;
          if (!sleeveMatchesTagFilter(s)) continue;
          if (!sleeveMatchesTypeFilter(s)) continue;
          if (releaseYear && String(s.releaseYear ?? "") !== releaseYear) continue;
          if (series && String(s.series || "") !== series) continue;

          if (band) {
            const p = getCardPrice(s);
            if (p == null) continue;
            if (p < band.min || p > band.max) continue;
          }
          filtered.push(s);
        }

        const sorted = sortSleeves(filtered, sortOrder);
        updateSortExplorerCopy(sortOrder);
        if (resultsMeta) resultsMeta.textContent = `表示件数: ${sorted.length.toLocaleString()}件`;

        if (!sorted.length) {
          list.innerHTML = '<div class="card"><div class="title">該当なし</div><div class="meta">条件に一致するスリーブがありません</div></div>';
          return;
        }

        const frag = document.createDocumentFragment();

        for (const s of sorted) {
          const card = document.createElement("a");
          const detailHref = (window.common && typeof window.common.buildSleeveDetailHref === "function")
            ? window.common.buildSleeveDetailHref(s.id ?? "")
            : `./sleeve/${encodeURIComponent(s.id ?? "")}/`;
          card.className = "compact-card";
          card.href = detailHref;
          card.setAttribute("data-sleeve-link", "1");
          card.setAttribute("aria-label", `${String(s.name ?? "")}の詳細を見る`);
          card.innerHTML = buildCardMarkup(s, sortOrder);
          frag.appendChild(card);
        }

        list.appendChild(frag);
      }

      function render() {
        applySortWithAnimation(renderResults);
      }

      let t = null;
      searchInput.addEventListener("input", () => {
        clearTimeout(t);
        t = setTimeout(render, 80);
      });

      releaseYearSel.addEventListener("change", render);
      seriesSel.addEventListener("change", render);
      priceBandSel.addEventListener("change", render);
      sortOrderSel.addEventListener("change", () => {
        const currentConfig = getSortLabelConfig(sortOrderSel.value);
        currentPrimaryTab = currentConfig.primary || "recommended";
        if (sortOrderMobileSel) sortOrderMobileSel.value = sortOrderSel.value;
        renderSortTabs();
        renderSortChips();
        render();
      });

      if (sortOrderMobileSel) {
        syncSortFallbackSelect();
        sortOrderMobileSel.addEventListener("change", () => {
          sortOrderSel.value = sortOrderMobileSel.value;
          sortOrderSel.dispatchEvent(new Event("change"));
        });
      }

      if (sortTabs) {
        sortTabs.addEventListener("click", (event) => {
          const button = event.target.closest("[data-primary-tab]");
          if (!button) return;
          applyPrimaryTab(button.getAttribute("data-primary-tab") || "");
          render();
        });
      }

      if (sortChips) {
        sortChips.addEventListener("click", (event) => {
          const button = event.target.closest("[data-sort-chip]");
          if (!button) return;
          sortOrderSel.value = button.getAttribute("data-sort-chip") || "recommended";
          if (sortOrderMobileSel) sortOrderMobileSel.value = sortOrderSel.value;
          renderSortTabs();
          renderSortChips();
          render();
        });
      }

      if (activeFilters) {
        activeFilters.addEventListener("click", (event) => {
          const button = event.target.closest("[data-filter-key]");
          if (!button) return;
          const key = button.getAttribute("data-filter-key");
          if (key === "releaseYear") releaseYearSel.value = "";
          if (key === "series") seriesSel.value = "";
          if (key === "priceBand") priceBandSel.value = "";
          render();
        });
      }

      clearBtn.addEventListener("click", () => {
        searchInput.value = "";
        releaseYearSel.value = "";
        seriesSel.value = "";
        priceBandSel.value = "";
        sortOrderSel.value = "recommended";
        if (sortOrderMobileSel) sortOrderMobileSel.value = "recommended";
        activeGroup = "";
        activeTag = "";
        activeType = "";
        url.searchParams.delete("group");
        url.searchParams.delete("tag");
        url.searchParams.delete("type");
        history.replaceState({}, "", url.pathname + (url.searchParams.toString() ? `?${url.searchParams.toString()}` : ""));
        applyPrimaryTab("recommended");
        render();
      });

      applyPrimaryTab("recommended");
      syncSortFallbackSelect();
      renderResults();
      requestAnimationFrame(() => list.classList.add("is-visible"));
    }

    main();
  </script>
