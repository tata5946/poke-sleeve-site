<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>急上昇ランキング｜ポケスリ相場ナビ</title>
  <meta name="description" content="ポケカスリーブの急上昇ランキング（直近取引週比）を掲載。上昇額・上昇率で並び替え、検索・絞り込みで相場を比較できます。">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f5f9ff;
      --card:#ffffff;
      --text:#111;
      --muted:#667085;
      --border:#e6e8ef;
      --shadow: 0 6px 18px rgba(16,24,40,.06);
      --radius:14px;
      --accent:#1e5bd7;
      --accent2:#ffcc00;
    }

    *{ box-sizing:border-box; }
    body{
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin:0;
      background:var(--bg);
      color:var(--text);
    }
    a{ color:var(--accent); text-decoration:none; }
    a:hover{ text-decoration:underline; }

    .container{ max-width:1100px; margin:0 auto; padding:20px; }

    /* “ボール風”ロゴ */
    .logo{
      width:38px; height:38px; border-radius:999px;
      background: linear-gradient(#e53935 0 50%, #ffffff 50% 100%);
      border: 2px solid #111;
      position: relative;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
      flex: 0 0 auto;
    }
    .logo::before{
      content:"";
      position:absolute;
      left:0; right:0; top:50%;
      height:3px;
      background:#111;
      transform: translateY(-50%);
    }
    .logo::after{
      content:"";
      position:absolute;
      left:50%; top:50%;
      width:12px; height:12px;
      border-radius:999px;
      background:#fff;
      border:2px solid #111;
      transform: translate(-50%,-50%);
    }
    .accent{ color: var(--accent2); }

    /* ===== PB風 2段ヘッダー ===== */
    .header{
      position: sticky;
      top:0;
      z-index:50;
      background:#fff;
      border-bottom:1px solid var(--border);
    }

    .header-top{
      max-width:1100px;
      margin:0 auto;
      padding:10px 20px;
      display:flex;
      align-items:center;
      gap:14px;
    }

    .brand{
      display:flex;
      gap:10px;
      align-items:center;
      min-width:0;
      text-decoration:none;
      color:inherit;
    }
    .brand:hover{ text-decoration:none; }

    .main-title{
      font-size:22px;
      font-weight:900;
      margin:0;
      line-height:1.1;
      color:#111;
      white-space:nowrap;
      font-family: "M PLUS Rounded 1c", system-ui, -apple-system, "Segoe UI", sans-serif;
      text-shadow:none;
    }

    .header-search{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .header-search .search-wrap{
      width:min(520px, 100%);
      display:flex;
      align-items:center;
      gap:10px;
      padding:8px 12px;
      border:1px solid var(--border);
      border-radius:999px;
      background:#fff;
      box-shadow: 0 2px 10px rgba(16,24,40,.05);
    }
    .header-search .search-ico{
      font-weight:900;
      color:#667085;
    }
    .header-search input{
      width:100%;
      border:0;
      outline:0;
      font-size:14px;
      background:transparent;
    }

    .header-right{
      display:flex;
      gap:10px;
      align-items:center;
    }
    .header-right a{
      font-weight:800;
      font-size:13px;
      color:#111;
    }

    .header-bottom{
      background:#111;
      border-top:1px solid rgba(255,255,255,.08);
    }
    .header-bottom-inner{
      max-width:1100px;
      margin:0 auto;
      padding:8px 20px;
      display:flex;
      align-items:center;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
    }
    .header-bottom-inner::-webkit-scrollbar{ height:8px; }
    .header-bottom-inner::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.18); border-radius:999px; }
    .header-bottom-inner::-webkit-scrollbar-track{ background:transparent; }

    .nav{
      display:flex;
      gap:10px;
    }
    .nav a{
      border:0;
      background:transparent;
      color:#fff;
      padding:8px 10px;
      border-radius:10px;
      font-size:13px;
      font-weight:900;
      white-space:nowrap;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .nav a:hover{
      background:rgba(255,255,255,.12);
      text-decoration:none;
    }
    .nav .ico{
      width:18px; height:18px;
      display:inline-flex; align-items:center; justify-content:center;
      opacity:.92;
    }
    .nav .ico svg{ width:18px; height:18px; display:block; }
    .nav a.is-active{
      background:rgba(255,255,255,.20);
      box-shadow: 0 6px 18px rgba(0,0,0,.18) inset;
    }

    /* hero */
    .hero{ margin-top:18px; }
    .hero-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:16px;
      box-shadow: var(--shadow);
      display:flex;
      gap:14px;
      align-items:flex-start;
      justify-content:space-between;
      flex-wrap:wrap;
    }
    .hero-title{ font-size:18px; font-weight:900; margin:0; }
    .hero-desc{
      margin:6px 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.6;
    }
    .data-note{
      margin-top:8px;
      font-size:12px;
      color:var(--muted);
    }

    /* layout */
    .main{
      display:grid;
      grid-template-columns: 300px 1fr;
      gap:14px;
      margin-top:14px;
    }

    /* sidebar */
    .panel{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:14px;
      box-shadow: var(--shadow);
    }
    .panel h2{ font-size:14px; margin:0 0 10px; }
    .small{ font-size:12px; color:var(--muted); margin:0 0 12px; }

    .controls{ display:flex; flex-direction:column; gap:10px; }
    .controls label{
      font-size:12px;
      color:#1f2a37;
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .controls select, .controls button{
      padding:10px 10px;
      border:1px solid var(--border);
      border-radius:12px;
      background:#fff;
      font-size:14px;
    }
    .controls button{
      background:#111;
      color:#fff;
      border-color:#111;
      cursor:pointer;
      font-weight:900;
    }
    .controls button:hover{ opacity:.92; }

    /* error */
    .error{
      background:#fff3f3;
      border:1px solid #ffcccc;
      padding:12px;
      border-radius:12px;
      color:#b00020;
      margin-bottom:12px;
      display:none;
    }

    /* grid cards */
    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
      padding:0;
    }
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:10px;
      box-shadow: var(--shadow);
      position: relative;
    }
    .thumb{
      width:100%;
      height:160px;
      object-fit: cover;
      border-radius:14px;
      box-shadow: 0 6px 14px rgba(0,0,0,.08);
      transition: transform .2s ease;
      background: #f2f4f7;
    }
    .card:hover .thumb{ transform: scale(1.02); }

    .title{ font-weight:900; font-size:14px; margin:10px 0 6px; }
    .meta{ font-size:12px; color:var(--muted); line-height:1.45; }

    .price{ margin-top:8px; font-size:16px; font-weight:900; }

    /* rank badge */
    .rank-row{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:10px;
    }
    .rank-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:34px;
      height:26px;
      padding:0 10px;
      border-radius:999px;
      background:#111;
      color:#fff;
      font-weight:900;
      font-size:12px;
      white-space:nowrap;
    }

    .delta {
      margin-top: 6px;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .chip{
      font-size:12px;
      padding:3px 8px;
      border-radius:999px;
      border:1px solid var(--border);
      background:#f6f8ff;
      color:#111;
      font-weight:800;
      white-space:nowrap;
    }
    .delta .delta-main{
      font-size: 13px;
      font-weight: 900;
    }
    .up{ color:#d32f2f; }
    .down{ color:#1976d2; }
    .flat{ color:#667085; }

    .badges{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
    .badge{
      font-size:11px;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid #ffe082;
      background:#fff8cc;
      color:#5c4b00;
      font-weight:700;
    }

    .btn{
      display:inline-block;
      margin-top:8px;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid var(--border);
      background:#fff;
      color:#111;
      font-weight:900;
      font-size:12px;
    }
    .btn:hover{
      background:#f2f4f7;
      text-decoration:none;
    }

    footer.site-footer{
      margin-top:40px;
      padding:20px 0;
      text-align:center;
      font-size:12px;
      color:#667085;
      border-top:1px solid var(--border);
    }
    footer.site-footer a{ color:var(--accent); font-weight:800; }

    /* ===== Responsive ===== */
    @media (max-width: 900px){
      .main{ grid-template-columns: 1fr; }
    }

    @media (max-width: 700px){
      .header-top{
        padding:10px 14px;
        gap:10px;
        flex-wrap:wrap;
      }
      .logo{ width:32px; height:32px; }
      .main-title{ font-size:18px; }
      .header-right{ display:none; }
      .header-bottom-inner{ padding:8px 14px; }

      .header-search{
        flex: 1 1 100%;
        justify-content:flex-start;
      }
      .header-search .search-wrap{
        width:100%;
      }
    }

    @media (max-width: 600px){
      .container{ padding:14px; }
      .hero-card{ padding:12px; }

      .grid{
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap:10px;
      }
      .thumb{ height:130px; }
      .title{ font-size:13px; }

      .panel{ padding:12px; }
      .controls select, .controls button{ padding:9px 10px; }
    }
  </style>
</head>

<body>

    <div class="header-top">

  <script>
    // ★ index と同じ Apps Script WebアプリURL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyl-TAhWBEVIgilTDv7lwS14T3_i9z57dUX4fqUVBS9gyr1EO7SaYy3aqP0V1gZtt6z/exec";

    // ===== Active Tab Auto Detect =====
    function setActiveNav() {
      const path = (location.pathname.split("/").pop() || "").toLowerCase();

      let key = "index";
      if (path.includes("ranking")) key = "ranking";
      else if (path.includes("growth")) key = "growth";
      else if (path.includes("surge")) key = "surge";
      else if (path.includes("market")) key = "market";     // ★追加
      else if (path.includes("detail")) key = "index";
      else if (path === "" || path === "index.html") key = "index";

      const links = document.querySelectorAll(".nav a[data-nav]");
      for (const a of links) {
        a.classList.toggle("is-active", a.getAttribute("data-nav") === key);
      }
    }

    // -----------------------------
    // utils
    // -----------------------------
    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "block";
      el.textContent = msg;
    }

    function hideError() {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "none";
      el.textContent = "";
    }

    function uniq(arr) {
      const s = new Set();
      for (const v of arr) {
        const t = (v == null) ? "" : String(v).trim();
        if (t) s.add(t);
      }
      return Array.from(s);
    }

    function toISODate(d) {
      const dd = new Date(d);
      if (Number.isNaN(dd.getTime())) return null;
      const y = dd.getFullYear();
      const m = String(dd.getMonth() + 1).padStart(2, "0");
      const day = String(dd.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function numOrNull(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    async function fetchJsonWithTimeout(url, { timeoutMs = 12000 } = {}) {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const res = await fetch(url, {
          cache: "no-store",
          signal: controller.signal,
          headers: { "Accept": "application/json" }
        });
        if (!res.ok) throw new Error(`データ取得に失敗しました（HTTP ${res.status}）`);
        return await res.json();
      } catch (e) {
        if (e && e.name === "AbortError") {
          throw new Error("データ取得がタイムアウトしました。時間をおいて再度お試しください。");
        }
        throw e;
      } finally {
        clearTimeout(t);
      }
    }

    async function loadData() {
      if (!GAS_URL || GAS_URL.includes("PASTE_YOUR_WEB_APP_URL_HERE")) {
        throw new Error("GAS_URL が未設定です。surge.html の GAS_URL に WebアプリURL を貼ってください。");
      }
      const url = GAS_URL + "?v=" + Date.now();
      return await fetchJsonWithTimeout(url, { timeoutMs: 12000 });
    }

    // -----------------------------
    // weekly logic (indexと同じ思想)
    // -----------------------------
    /**
     * 週次データから「直近の取引週」「その1つ前の取引週」を返す
     * - 取引なし週は除外（count=0 または price非数）
     * - week は ISO (YYYY-MM-DD) に正規化
     * - 同一 week が複数ある場合は最後の1つを採用（データが後勝ち）
     */
    function getWeeklyPair(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      if (arr.length === 0) return null;

      const map = new Map();
      for (const x of arr) {
        const weekISO = toISODate(x.week);
        if (!weekISO) continue;

        const price = numOrNull(x.price);
        const count = numOrNull(x.count);

        const hasTrade = (count == null) ? (price != null) : (count > 0 && price != null);
        if (!hasTrade) continue;

        map.set(weekISO, { week: weekISO, price, count: count == null ? null : count });
      }
      if (map.size === 0) return null;

      const sorted = Array.from(map.values()).sort((a, b) => a.week.localeCompare(b.week));
      const latest = sorted[sorted.length - 1];
      const prev = sorted.length >= 2 ? sorted[sorted.length - 2] : null;

      return { latest, prev };
    }

    function getTotalTradeCount(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      let sum = 0;
      let hasAny = false;

      for (const x of arr) {
        const c = numOrNull(x.count);
        if (Number.isFinite(c) && c > 0) {
          sum += c;
          hasAny = true;
        }
      }
      return hasAny ? sum : null;
    }

    function computeSurge(sleeve) {
      const pair = getWeeklyPair(sleeve);
      if (!pair || !pair.prev) return null;

      const diff = pair.latest.price - pair.prev.price;
      if (!(diff > 0)) return null; // 上昇だけ

      let rate = null;
      if (pair.prev.price !== 0) {
        const r = (diff / pair.prev.price) * 100;
        rate = Number.isFinite(r) ? r : null;
      }

      return { pair, diff, rate };
    }

    function formatSurgeDelta(pair) {
      if (!pair) return `<div class="delta"><span class="flat">直近の取引なし</span></div>`;
      const { latest, prev } = pair;
      if (!prev) {
        const cntText = Number.isFinite(latest.count) ? ` / ${latest.count}件` : "";
        return `
          <div class="delta">
            <span class="flat">比較できる前回データなし</span>
            <span class="chip">直近 ${latest.price.toLocaleString()}円${cntText}</span>
          </div>
        `;
      }

      const diff = latest.price - prev.price;
      const cls = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
      const arrow = diff > 0 ? "↑" : diff < 0 ? "↓" : "→";
      const sign = diff > 0 ? "+" : diff < 0 ? "−" : "±";
      const abs = Math.abs(diff);

      let pctText = "";
      if (prev.price !== 0) {
        const rate = (diff / prev.price) * 100;
        if (Number.isFinite(rate)) pctText = `（${rate.toFixed(1)}%）`;
      }

      const prevCnt = Number.isFinite(prev.count) ? `${prev.count}件` : "—";
      const latestCnt = Number.isFinite(latest.count) ? `${latest.count}件` : "—";

      return `
        <div class="delta">
          <span class="delta-main ${cls}">${arrow} 前回取引週比 ${sign}${abs.toLocaleString()}円 ${escapeHtml(pctText)}</span>
          <span class="chip">前回 ${prev.price.toLocaleString()}円 / ${prevCnt}</span>
          <span class="chip">直近 ${latest.price.toLocaleString()}円 / ${latestCnt}</span>
        </div>
      `;
    }

    // -----------------------------
    // main
    // -----------------------------
    async function main() {
      setActiveNav();

      const list = document.getElementById("list");
      const searchInput = document.getElementById("search");

      const metricSel = document.getElementById("metric");
      const releaseYearSel = document.getElementById("releaseYear");
      const seriesSel = document.getElementById("series");
      const minDiffSel = document.getElementById("minDiff");
      const clearBtn = document.getElementById("clear");

      let data;
      try {
        data = await loadData();
      } catch (e) {
        showError(e.message || "不明なエラーが発生しました");
        return;
      }
      hideError();

      const sleeves = Array.isArray(data.sleeves) ? data.sleeves : [];

      // 最終更新（直近取引週の最大日付）
      try {
        let maxWeek = null;
        for (const s of sleeves) {
          const p = getWeeklyPair(s);
          if (!p) continue;
          const w = p.latest.week;
          if (!maxWeek || w > maxWeek) maxWeek = w;
        }
        if (maxWeek) {
          const u = document.getElementById("updatedAt");
          u.textContent = `最終更新：${maxWeek}（週次）`;
          u.style.display = "block";
        }
      } catch(_) {}

      // セレクト初期化
      const releaseYears = uniq(sleeves.map(s => s.releaseYear)).map(Number).filter(Number.isFinite).sort((a, b) => a - b);
      const seriesList = uniq(sleeves.map(s => s.series)).sort();

      for (const y of releaseYears) {
        const opt = document.createElement("option");
        opt.value = String(y);
        opt.textContent = String(y);
        releaseYearSel.appendChild(opt);
      }
      for (const ser of seriesList) {
        const opt = document.createElement("option");
        opt.value = ser;
        opt.textContent = ser;
        seriesSel.appendChild(opt);
      }

      function render() {
        const kw = searchInput.value.trim().toLowerCase();
        const metric = metricSel.value;
        const releaseYear = releaseYearSel.value;
        const series = seriesSel.value;
        const minDiff = Number(minDiffSel.value || "0");

        list.innerHTML = "";

        // surge抽出（全件）
        const rows = [];
        for (const s of sleeves) {
          if (kw && !String(s.name || "").toLowerCase().includes(kw)) continue;
          if (releaseYear && String(s.releaseYear ?? "") !== releaseYear) continue;
          if (series && String(s.series || "") !== series) continue;

          const surge = computeSurge(s);
          if (!surge) continue;
          if (surge.diff < minDiff) continue;

          rows.push({ s, ...surge });
        }

        // sort
        rows.sort((a, b) => {
          if (metric === "rateDesc") {
            const ra = a.rate ?? -Infinity;
            const rb = b.rate ?? -Infinity;
            if (rb !== ra) return rb - ra;
            return b.diff - a.diff;
          }
          // diffDesc
          if (b.diff !== a.diff) return b.diff - a.diff;
          return (b.rate ?? -Infinity) - (a.rate ?? -Infinity);
        });

        // 件数表示
        const c = document.getElementById("countInfo");
        c.textContent = `表示件数：${rows.length.toLocaleString()}件（上昇のみ）`;
        c.style.display = "block";

        if (rows.length === 0) {
          list.innerHTML = `<div class="card"><div class="title">該当なし</div><div class="meta">条件に一致する急上昇スリーブがありません</div></div>`;
          return;
        }

        const frag = document.createDocumentFragment();

        for (let i = 0; i < rows.length; i++) {
          const row = rows[i];
          const rank = i + 1;
          const s = row.s;
          const pair = row.pair;

          const latestPrice = pair.latest.price;
          const priceText = `${latestPrice.toLocaleString()}円`;

          const weeklyHtml = formatSurgeDelta(pair);

          const totalTrades = getTotalTradeCount(s);
          const totalTradesText = (totalTrades == null) ? "—" : `${totalTrades.toLocaleString()}件`;

          const imgSrc = String(s.imageUrl || "").trim();
          const imgHtml = imgSrc
            ? `<img class="thumb" src="${escapeHtml(imgSrc)}" alt="${escapeHtml(s.name ?? "")}" loading="lazy" referrerpolicy="no-referrer"
                 onerror="this.onerror=null; this.style.display='none';">`
            : "";

          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
            ${imgHtml}

            <div class="rank-row">
              <span class="rank-badge">${rank}位</span>
              <div class="title" style="margin:0;">${escapeHtml(s.name ?? "")}</div>
            </div>

            <div class="price">${escapeHtml(priceText)} <span class="meta">（直近取引週）</span></div>

            ${weeklyHtml}

            <div class="badges">
              <span class="badge">総取引：${escapeHtml(totalTradesText)}</span>
              <span class="badge">発売年：${escapeHtml(s.releaseYear ?? "")}</span>
              <span class="badge">${escapeHtml(s.condition ?? "")}</span>
              <span class="badge">${escapeHtml(s.series ?? "")}</span>
            </div>

            <a class="btn" href="./detail.html?id=${encodeURIComponent(s.id ?? "")}">価格推移を見る →</a>
          `;
          frag.appendChild(div);
        }

        list.appendChild(frag);
      }

      // events
      let t = null;
      searchInput.addEventListener("input", () => {
        clearTimeout(t);
        t = setTimeout(render, 80);
      });

      metricSel.addEventListener("change", render);
      releaseYearSel.addEventListener("change", render);
      seriesSel.addEventListener("change", render);
      minDiffSel.addEventListener("change", render);

      clearBtn.addEventListener("click", () => {
        searchInput.value = "";
        metricSel.value = "diffDesc";
        releaseYearSel.value = "";
        seriesSel.value = "";
        minDiffSel.value = "0";
        render();
      });

      render();
    }

    main();
  </script>
</body>
</html>
