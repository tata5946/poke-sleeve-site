  <script>
    // -----------------------------
    // utils
    // -----------------------------
    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "block";
      el.textContent = msg;
    }

    function hideError() {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "none";
      el.textContent = "";
    }

    function uniq(arr) {
      const s = new Set();
      for (const v of arr) {
        const t = (v == null) ? "" : String(v).trim();
        if (t) s.add(t);
      }
      return Array.from(s);
    }

    function getCompactTagLabels(sleeve, maxItems = 2) {
      const candidates = [];
      if (typeof sleeve.series === "string") candidates.push(sleeve.series);
      if (typeof sleeve.condition === "string") candidates.push(sleeve.condition);
      if (Array.isArray(sleeve.tags)) candidates.push(...sleeve.tags);
      if (typeof sleeve.tag === "string") candidates.push(sleeve.tag);
      if (typeof sleeve.badge === "string") candidates.push(sleeve.badge);
      const seen = new Set();
      const result = [];
      for (const raw of candidates) {
        const text = String(raw || "").trim().replace(/^#/, "");
        if (!text || seen.has(text)) continue;
        seen.add(text);
        result.push(text);
        if (result.length >= maxItems) break;
      }
      return result;
    }

    function toISODate(d) {
      const dd = new Date(d);
      if (Number.isNaN(dd.getTime())) return null;
      const y = dd.getFullYear();
      const m = String(dd.getMonth() + 1).padStart(2, "0");
      const day = String(dd.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function isLegacyMonthlyRow(weekISO) {
      return String(weekISO || "").slice(-2) === "01" && String(weekISO || "") < "2026-01-01";
    }

    function numOrNull(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    async function fetchJsonWithTimeout(url, { timeoutMs = 12000 } = {}) {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const res = await fetch(url, {
          cache: "no-store",
          signal: controller.signal,
          headers: { "Accept": "application/json" }
        });
        if (!res.ok) throw new Error(`データ取得に失敗しました（HTTP ${res.status}）`);
        return await res.json();
      } catch (e) {
        if (e && e.name === "AbortError") {
          throw new Error("データ取得がタイムアウトしました。時間をおいて再度お試しください。");
        }
        throw e;
      } finally {
        clearTimeout(t);
      }
    }

    async function loadData() {
      if (window.common && typeof window.common.loadData === "function") {
        return await window.common.loadData();
      }
      const url = window.GAS_URL;
      if (!url) throw new Error("GAS_URL が未設定です（common.js を確認してください）");
      const res = await fetch(url, { cache: "default" });
      if (!res.ok) throw new Error(`データ取得に失敗しました（HTTP ${res.status}）`);
      return await res.json();
    }

    // -----------------------------
    // weekly logic
    // -----------------------------
    /**
     * 週次データから「直近の取引週」「その1つ前の取引週」を返す
     * - 取引なし週は除外（count=0 または price非数）
     * - week は ISO (YYYY-MM-DD) に正規化
     * - 同一 week が複数ある場合は最後の1つを採用（データが後勝ち）
     */
    function getWeeklyPair(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      if (arr.length === 0) return null;

      const map = new Map();
      for (const x of arr) {
        const weekISO = toISODate(x.week);
        if (!weekISO) continue;
        if (isLegacyMonthlyRow(weekISO)) continue;

        const price = numOrNull(x.price);
        const count = numOrNull(x.count);

        const hasTrade = price != null && price > 0;
        if (!hasTrade) continue;

        map.set(weekISO, { week: weekISO, price, count: count == null ? null : count });
      }
      if (map.size === 0) return null;

      const sorted = Array.from(map.values()).sort((a, b) => a.week.localeCompare(b.week));
      const latest = sorted[sorted.length - 1];
      const prev = sorted.length >= 2 ? sorted[sorted.length - 2] : null;

      return { latest, prev };
    }

    function getSparklinePoints(sleeve, maxItems = 12) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      const map = new Map();

      for (const x of arr) {
        const weekISO = toISODate(x.week);
        if (!weekISO) continue;
        if (isLegacyMonthlyRow(weekISO)) continue;

        const price = numOrNull(x.price);
        const count = numOrNull(x.count);
        const hasTrade = price != null && price > 0;
        if (!hasTrade || !(price > 0)) continue;

        map.set(weekISO, { week: weekISO, price });
      }

      return Array.from(map.values())
        .sort((a, b) => a.week.localeCompare(b.week))
        .slice(-maxItems)
        .map((x) => x.price);
    }

    function buildSparklineSvg(sleeve) {
      const prices = getSparklinePoints(sleeve);
      if (prices.length < 2) {
        return `<div class="sleeve-sparkline sleeve-sparkline--empty" aria-label="価格推移データなし"><span class="sleeve-sparkline-empty">推移なし</span></div>`;
      }

      const width = 86;
      const height = 36;
      const padX = 5;
      const padY = 5;
      const min = Math.min(...prices);
      const max = Math.max(...prices);
      const range = max - min;
      const step = (width - padX * 2) / Math.max(1, prices.length - 1);
      const points = prices.map((price, index) => {
        const x = padX + step * index;
        const y = range === 0
          ? height / 2
          : height - padY - ((price - min) / range) * (height - padY * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      const linePoints = points.join(" ");
      const firstX = padX.toFixed(1);
      const lastX = (padX + step * (prices.length - 1)).toFixed(1);
      const areaPoints = `${firstX},${height - padY} ${linePoints} ${lastX},${height - padY}`;
      const lastPrice = prices[prices.length - 1];
      const lastY = range === 0
        ? height / 2
        : height - padY - ((lastPrice - min) / range) * (height - padY * 2);
      const compactLabel = (value) => {
        const rounded = Math.round(Number(value) || 0);
        if (rounded >= 10000) return `${Math.round(rounded / 1000) / 10}\u4e07`;
        return rounded.toLocaleString();
      };
      const firstPrice = prices[0];
      const trendClass = lastPrice > prices[0] ? "up" : lastPrice < prices[0] ? "down" : "flat";

      return `
        <div class="sleeve-sparkline sleeve-sparkline--${trendClass}" aria-label="直近${prices.length}週の価格推移">
          <svg viewBox="0 0 ${width} ${height}" focusable="false" aria-hidden="true">
            <line class="sleeve-sparkline-axis" x1="22" y1="7" x2="22" y2="${height - padY}"></line>
            <line class="sleeve-sparkline-grid" x1="5" y1="${height - padY}" x2="${width - padX}" y2="${height - padY}"></line>
            <polygon class="sleeve-sparkline-area" points="${areaPoints}"></polygon>
            <polyline class="sleeve-sparkline-line" points="${linePoints}"></polyline>
            <circle class="sleeve-sparkline-dot" cx="${lastX}" cy="${lastY.toFixed(1)}" r="2"></circle>
          </svg>
          <div class="sleeve-sparkline-foot" aria-hidden="true">
            <span><small>12週前</small><b>${compactLabel(firstPrice)}円</b></span>
            <span><small>現在</small><b>${compactLabel(lastPrice)}円</b></span>
          </div>
        </div>
      `;
    }

    function getTotalTradeCount(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      let sum = 0;
      let hasAny = false;

      for (const x of arr) {
        const c = numOrNull(x.count);
        if (Number.isFinite(c) && c > 0) {
          sum += c;
          hasAny = true;
        }
      }
      return hasAny ? sum : null;
    }

    function getMarketRange(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      const prices = arr.map((x) => numOrNull(x && x.price)).filter((v) => Number.isFinite(v) && v > 0);
      if (!prices.length) return { min: null, max: null };
      return { min: Math.min(...prices), max: Math.max(...prices) };
    }

    function getTagLabels(sleeve, maxItems = 3) {
      const candidates = [];
      if (Array.isArray(sleeve.tags)) candidates.push(...sleeve.tags);
      if (typeof sleeve.tag === "string") candidates.push(sleeve.tag);
      if (typeof sleeve.badge === "string") candidates.push(sleeve.badge);
      if (typeof sleeve.series === "string") candidates.push(sleeve.series);
      if (typeof sleeve.condition === "string") candidates.push(sleeve.condition);
      if (typeof sleeve.releaseYear === "number" || typeof sleeve.releaseYear === "string") candidates.push(`${sleeve.releaseYear}`);
      const seen = new Set();
      const result = [];
      for (const raw of candidates) {
        const tag = String(raw || "").trim();
        if (!tag) continue;
        const normalized = tag.startsWith("#") ? tag : `#${tag}`;
        if (seen.has(normalized)) continue;
        seen.add(normalized);
        result.push(normalized);
        if (result.length >= maxItems) break;
      }
      return result.length ? result : ["#注目"];
    }

    function getPodiumBadge(rank) {
      return String(rank).padStart(2, "0");
    }

    function buildPodiumCard(row, rank) {
      const s = row.s;
      const pair = row.pair;
      const imgSrc = String(s.imageUrl || "").trim();
      const rate = row.rate;
      const rateClass = (rate ?? 0) > 0 ? "up" : (rate ?? 0) < 0 ? "down" : "flat";
      const diffText = `+${row.diff.toLocaleString()}円`;
      const rateText = rate == null ? "—" : `${rate > 0 ? "+" : ""}${rate.toFixed(1)}%`;
      const sparklineHtml = buildSparklineSvg(s);
      const metaItems = [
        s.releaseYear ? `YEAR ${escapeHtml(s.releaseYear)}` : "",
        s.series ? escapeHtml(s.series) : ""
      ].filter(Boolean);
      const metaHtml = metaItems.map((item) => `<span class="podium-chip">${item}</span>`).join("");
      return `
        <a class="podium-card ranking-card ranking-card--featured podium-card--rank${rank}" data-sleeve-link="1" href="${row.detailHref}" aria-label="${escapeHtml(String(s.name ?? ""))}の詳細を見る">
          <div class="podium-badge">${getPodiumBadge(rank)}</div>
          <div class="podium-media">
            <img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(s.name ?? "")}" loading="${rank === 1 ? "eager" : "lazy"}" referrerpolicy="no-referrer"
              onerror="this.onerror=null; this.style.display='none';">
          </div>
          <div class="podium-content">
            <div class="podium-kicker">PRICE UP RANKING</div>
            <h${rank === 1 ? "2" : "3"} class="podium-title">${escapeHtml(s.name ?? "")}</h${rank === 1 ? "2" : "3"}>
            <div class="podium-metrics">
              <div class="podium-metric">
                <span class="podium-metric-label">現在価格</span>
                <div class="podium-price">${pair.latest.price.toLocaleString()}円</div>
              </div>
              <div class="podium-metric">
                <span class="podium-metric-label">前週比</span>
                <div class="podium-diff">${escapeHtml(diffText)}</div>
                <div class="podium-rate ${rateClass}">${escapeHtml(rateText)}</div>
              </div>
            </div>
            <div class="podium-market-row">
              ${sparklineHtml}
            </div>
            <div class="podium-meta">
              <div class="podium-chip-group">${metaHtml}</div>
            </div>
          </div>
        </a>
      `;
    }

    function getGlobalLatestTradeWeek(sleeves) {
      let maxWeek = null;
      for (const s of (Array.isArray(sleeves) ? sleeves : [])) {
        const pair = getWeeklyPair(s);
        if (!pair) continue;
        const w = String(pair.latest.week || "");
        if (!w) continue;
        if (!maxWeek || w > maxWeek) maxWeek = w;
      }
      return maxWeek;
    }

    function formatMetaDate(value) {
      const text = String(value ?? "").trim();
      const match = text.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
      if (!match) return text || "-";
      return `${match[1]}/${Number(match[2])}/${Number(match[3])}`;
    }

    function computeSurge(sleeve, latestWeek) {
      const pair = getWeeklyPair(sleeve);
      if (!pair || !pair.prev) return null;
      if (latestWeek && pair.latest.week !== latestWeek) return null;

      const diff = pair.latest.price - pair.prev.price;
      if (!(diff > 0)) return null; // 上昇だけ

      let rate = null;
      if (pair.prev.price !== 0) {
        const r = (diff / pair.prev.price) * 100;
        rate = Number.isFinite(r) ? r : null;
      }

      return { pair, diff, rate };
    }

    function formatSurgeDelta(pair) {
      if (!pair) return `<div class="delta"><span class="flat">直近の取引なし</span></div>`;

      const { latest, prev } = pair;

      if (!prev) {
        const cntText = Number.isFinite(latest.count) ? ` / ${latest.count}件` : "";
        return `
          <div class="delta">
            <span class="flat">比較できる前回データなし</span>
            <span class="chip">直近 ${latest.price.toLocaleString()}円${cntText}</span>
          </div>
        `;
      }

      const diff = latest.price - prev.price;
      const cls = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
      const arrow = diff > 0 ? "↑" : diff < 0 ? "↓" : "→";
      const sign = diff > 0 ? "+" : diff < 0 ? "−" : "±";
      const abs = Math.abs(diff);

      let pctText = "";
      if (prev.price !== 0) {
        const rate = (diff / prev.price) * 100;
        if (Number.isFinite(rate)) pctText = `（${rate.toFixed(1)}%）`;
      }

      const prevCnt = Number.isFinite(prev.count) ? `${prev.count}件` : "—";
      const latestCnt = Number.isFinite(latest.count) ? `${latest.count}件` : "—";

      return `
        <div class="delta">
          <span class="delta-main ${cls}">${arrow} 前回取引週比 ${sign}${abs.toLocaleString()}円 ${escapeHtml(pctText)}</span>
          <span class="chip">前回 ${prev.price.toLocaleString()}円 / ${prevCnt}</span>
          <span class="chip">直近 ${latest.price.toLocaleString()}円 / ${latestCnt}</span>
        </div>
      `;
    }

    function renderActiveFilters(metricSel, releaseYearSel, seriesSel, minDiffSel) {
      const activeFilters = document.getElementById("activeFilters");
      if (!activeFilters) return;
      const chips = [];
      if (metricSel.value === "rateDesc") chips.push({ key: "metric", text: "指標: 上昇率（%）" });
      if (releaseYearSel.value) chips.push({ key: "releaseYear", text: `発売年: ${releaseYearSel.value}` });
      if (seriesSel.value) chips.push({ key: "series", text: `シリーズ: ${seriesSel.value}` });
      if (minDiffSel.value && minDiffSel.value !== "0") {
        const selected = minDiffSel.options[minDiffSel.selectedIndex];
        const label = selected ? selected.textContent.trim() : "";
        if (label) chips.push({ key: "minDiff", text: label });
      }
      activeFilters.innerHTML = chips.map((chip) =>
        `<button class="ranking-filter-chip" type="button" data-filter-key="${escapeHtml(chip.key)}" aria-label="${escapeHtml(chip.text)} を解除">
          <span>${escapeHtml(chip.text)}</span>
          <span class="ranking-filter-chip-remove" aria-hidden="true">×</span>
        </button>`
      ).join("");
      activeFilters.classList.toggle("is-visible", chips.length > 0);
    }

    function buildStandardCard(row, rank) {
      const s = row.s;
      const deltaClass = row.diff > 0 ? "up" : row.diff < 0 ? "down" : "flat";
      const deltaText = `${row.diff > 0 ? "+" : row.diff < 0 ? "-" : "±"}${Math.abs(row.diff).toLocaleString()}円`;
      const rateText = row.rate == null ? "—" : `${row.rate > 0 ? "+" : ""}${row.rate.toFixed(1)}%`;
      const sparklineHtml = buildSparklineSvg(s);
      const metaItems = [
        s.releaseYear ? `YEAR ${escapeHtml(s.releaseYear)}` : "",
        s.series ? escapeHtml(s.series) : ""
      ].filter(Boolean);
      const metaHtml = metaItems.length
        ? `<div class="compact-meta">${metaItems.map((item) => `<span class="compact-meta-item">${item}</span>`).join("")}</div>`
        : "";
      return `
        <span class="compact-rank-badge">${rank}位</span>
        <span class="compact-thumb-wrap ranking-card-frameless-thumb">
          ${s.imageUrl
            ? `<img class="compact-thumb ranking-card-frameless-img" src="${escapeHtml(s.imageUrl)}" alt="${escapeHtml(s.name ?? "")}" loading="lazy" referrerpolicy="no-referrer"
                onerror="this.onerror=null; this.style.display='none';">`
            : ""}
        </span>
        <h3 class="compact-card-title">${escapeHtml(s.name ?? "")}</h3>
        <div class="compact-market-row">
          <div class="compact-price-row">
            <div class="compact-price">${row.pair.latest.price.toLocaleString()}円</div>
            <div class="compact-delta ${deltaClass}">${escapeHtml(deltaText)}</div>
            <div class="compact-rate ${deltaClass}">${escapeHtml(rateText)}</div>
          </div>
          ${sparklineHtml}
        </div>
        ${metaHtml}
      `;
    }

    // -----------------------------
    // main
    // -----------------------------
    async function main() {
      await window.common.setupDashboardChrome({ sidebarActive: "surge", topbarActive: "market" });
      const list = document.getElementById("list");
      const top3 = document.getElementById("top3");
      const top1 = document.getElementById("top1");
      const top2 = document.getElementById("top2");
      const top3Card = document.getElementById("top3Card");
      const restSection = document.getElementById("restSection");
      const metricSel = document.getElementById("metric");
      const releaseYearSel = document.getElementById("releaseYear");
      const seriesSel = document.getElementById("series");
      const minDiffSel = document.getElementById("minDiff");
      const clearBtn = document.getElementById("clear");
      const activeFilters = document.getElementById("activeFilters");

      let data;
      try {
        data = await loadData();
      } catch (e) {
        showError(e.message || "不明なエラーが発生しました");
        return;
      }
      hideError();

      const sleeves = Array.isArray(data.sleeves) ? data.sleeves : [];
      const latestWeek = getGlobalLatestTradeWeek(sleeves);

      // 最終更新（直近取引週の最大日付）
      try {
        if (latestWeek) {
          const u = document.getElementById("updatedAt");
          if (u) u.textContent = formatMetaDate(latestWeek);
        }
      } catch (_) { }

      // セレクト初期化
      const releaseYears = uniq(sleeves.map(s => s.releaseYear)).map(Number).filter(Number.isFinite).sort((a, b) => a - b);
      const seriesList = uniq(sleeves.map(s => s.series)).sort();

      for (const y of releaseYears) {
        const opt = document.createElement("option");
        opt.value = String(y);
        opt.textContent = String(y);
        releaseYearSel.appendChild(opt);
      }
      for (const ser of seriesList) {
        const opt = document.createElement("option");
        opt.value = ser;
        opt.textContent = ser;
        seriesSel.appendChild(opt);
      }

      function render() {
        const metric = metricSel.value;
        const releaseYear = releaseYearSel.value;
        const series = seriesSel.value;
        const minDiff = Number(minDiffSel.value || "0");

        list.innerHTML = "";
        top1.innerHTML = "";
        top2.innerHTML = "";
        top3Card.innerHTML = "";
        top3.hidden = true;
        restSection.hidden = false;
        renderActiveFilters(metricSel, releaseYearSel, seriesSel, minDiffSel);

        const rows = [];
        for (const s of sleeves) {
          if (releaseYear && String(s.releaseYear ?? "") !== releaseYear) continue;
          if (series && String(s.series || "") !== series) continue;

          const surge = computeSurge(s, latestWeek);
          if (!surge) continue;
          if (surge.diff < minDiff) continue;

          const detailHref = (window.common && typeof window.common.buildSleeveDetailHref === "function")
            ? window.common.buildSleeveDetailHref(s.id ?? "")
            : `./sleeve/${encodeURIComponent(s.id ?? "")}/`;
          rows.push({ s, ...surge, detailHref, marketRange: getMarketRange(s) });
        }

        rows.sort((a, b) => {
          if (metric === "rateDesc") {
            const ra = a.rate ?? -Infinity;
            const rb = b.rate ?? -Infinity;
            if (rb !== ra) return rb - ra;
            return b.diff - a.diff;
          }
          if (b.diff !== a.diff) return b.diff - a.diff;
          return (b.rate ?? -Infinity) - (a.rate ?? -Infinity);
        });

        const c = document.getElementById("countInfo");
        if (c) c.textContent = `${rows.length.toLocaleString()}件`;
        if (window.common && typeof window.common.updateItemListStructuredData === "function") {
          window.common.updateItemListStructuredData("surgeItemListStructuredData", rows, {
            name: "ポケカスリーブ急上昇ランキング",
            description: "ポケカスリーブの急上昇ランキング一覧です。"
          });
        }

        if (rows.length === 0) {
          list.innerHTML = `<div class="card"><div class="title">該当なし</div><div class="meta">条件に一致する急上昇スリーブがありません</div></div>`;
          return;
        }

        const topRows = rows.slice(0, 3);
        if (topRows.length) {
          top3.hidden = false;
          top1.innerHTML = buildPodiumCard(topRows[0], 1);
          if (topRows[1]) top2.innerHTML = buildPodiumCard(topRows[1], 2);
          if (topRows[2]) top3Card.innerHTML = buildPodiumCard(topRows[2], 3);
        }

        const normalRows = rows.slice(3);
        restSection.hidden = normalRows.length === 0;

        const frag = document.createDocumentFragment();

        for (let i = 0; i < normalRows.length; i++) {
          const row = normalRows[i];
          const rank = i + 4;
          const card = document.createElement("a");
          card.className = "compact-card ranking-card ranking-card--compact ranking-card-frameless";
          card.style.border = "0";
          card.style.borderRadius = "0";
          card.style.background = "transparent";
          card.style.boxShadow = "none";
          card.href = row.detailHref;
          card.setAttribute("data-sleeve-link", "1");
          card.setAttribute("aria-label", `${String(row.s.name ?? "")}の詳細を見る`);
          card.innerHTML = buildStandardCard(row, rank);
          frag.appendChild(card);
        }

        list.appendChild(frag);
      }

      // events
      metricSel.addEventListener("change", render);
      releaseYearSel.addEventListener("change", render);
      seriesSel.addEventListener("change", render);
      minDiffSel.addEventListener("change", render);

      clearBtn.addEventListener("click", () => {
        metricSel.value = "diffDesc";
        releaseYearSel.value = "";
        seriesSel.value = "";
        minDiffSel.value = "0";
        render();
      });

      if (activeFilters) {
        activeFilters.addEventListener("click", (event) => {
          const button = event.target.closest("[data-filter-key]");
          if (!button) return;
          const key = button.getAttribute("data-filter-key");
          if (key === "metric") metricSel.value = "diffDesc";
          if (key === "releaseYear") releaseYearSel.value = "";
          if (key === "series") seriesSel.value = "";
          if (key === "minDiff") minDiffSel.value = "0";
          render();
        });
      }

      render();
    }
  document.addEventListener("site:injected", () => {
    main();
  });
  </script>
