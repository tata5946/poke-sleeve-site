<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>急上昇ランキング｜ポケスリ相場ナビ</title>
  
  <meta property="og:title" content="急上昇ランキング｜ポケスリ相場ナビ" />
  <meta property="og:description" content="ポケカスリーブの急上昇ランキング（前週比）を掲載。検索・絞り込みで相場を比較できます。" />
  <meta property="og:image" content="https://pokesuri-navi.com/assets/favicon.svg" />
  <meta property="og:url" content="https://pokesuri-navi.com/surge.html" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">

  <!-- 共通CSS -->
  <link rel="stylesheet" href="./assets/site.css" />
  <style>
    body {
      background: #f5f7fb;
    }

    .ranking-page-top {
      display: grid;
      gap: 16px;
      margin-bottom: 20px;
    }

    .ranking-header-card,
    .ranking-filter-card {
      background: #fff;
      border: 1px solid #e6eaf2;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .06);
    }

    .ranking-header-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 24px;
    }

    .ranking-page-title {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -.02em;
      color: #0f172a;
      font-weight: 900;
    }

    .ranking-page-desc {
      margin: 10px 0 0;
      font-size: 14px;
      line-height: 1.6;
      color: #475467;
      font-weight: 700;
    }

    .ranking-status {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .ranking-status-card {
      min-width: 144px;
      padding: 12px 14px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid #e7ebf3;
    }

    .ranking-status-label {
      display: block;
      font-size: 11px;
      line-height: 1.3;
      color: #667085;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .ranking-status-value {
      display: block;
      font-size: 15px;
      line-height: 1.35;
      color: #101828;
      font-weight: 900;
    }

    .ranking-filter-card {
      padding: 18px 20px 20px;
    }

    .ranking-filter-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .ranking-filter-title {
      margin: 0;
      font-size: 13px;
      color: #344054;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .ranking-filter-sub {
      margin: 0;
      font-size: 12px;
      color: #98a2b3;
      font-weight: 700;
    }

    .ranking-filter-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr)) auto;
      gap: 12px;
      align-items: end;
    }

    .ranking-filter-field {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .ranking-filter-label {
      font-size: 12px;
      color: #475467;
      font-weight: 800;
      line-height: 1.3;
    }

    .ranking-filter-field select,
    .ranking-filter-actions button {
      width: 100%;
      height: 50px;
      border-radius: 16px;
      border: 1px solid #d7deea;
      background: #fff;
      color: #101828;
      font-size: 14px;
      font-weight: 700;
      padding: 0 16px;
      transition: border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
    }

    .ranking-filter-field select:hover,
    .ranking-filter-actions button:hover {
      border-color: #b9c5d9;
      background: #fbfcfe;
    }

    .ranking-filter-field select:focus,
    .ranking-filter-actions button:focus {
      outline: none;
      border-color: #9db5ff;
      box-shadow: 0 0 0 4px rgba(71, 122, 255, .12);
    }

    .ranking-filter-actions {
      min-width: 132px;
    }

    .ranking-filter-actions button {
      background: #f8fafc;
      color: #344054;
      cursor: pointer;
    }

    .ranking-error {
      margin-bottom: 0;
      margin-top: 12px;
    }

    .ranking-main {
      display: grid;
      gap: 18px;
    }

    .ranking-top3 {
      display: grid;
      gap: 14px;
      grid-template-columns: minmax(0, 1.7fr) minmax(240px, .85fr) minmax(240px, .85fr);
      align-items: stretch;
    }

    .ranking-top3 > div {
      display: flex;
    }

    .ranking-top3 > div > .podium-card {
      width: 100%;
    }

    .ranking-top3[hidden],
    .ranking-rest-section[hidden] {
      display: none;
    }

    .ranking-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .ranking-section-title {
      margin: 0;
      font-size: 15px;
      font-weight: 900;
      color: #101828;
    }

    .ranking-section-note {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .podium-card {
      display: grid;
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid #f0dca7;
      box-shadow: 0 12px 28px rgba(15, 23, 42, .10);
      background: linear-gradient(180deg, #fff7de 0%, #fffdf8 100%);
      padding: 12px;
      height: 100%;
    }

    .podium-card--rank1 {
      display: grid;
      grid-template-columns: minmax(220px, 360px) minmax(0, 1fr);
      align-items: center;
      gap: 14px;
      padding: 14px;
      background:
        radial-gradient(circle at top right, rgba(255, 214, 102, .28), transparent 32%),
        linear-gradient(145deg, #fff4cd 0%, #fff9ea 44%, #fffdf8 100%);
    }

    .podium-card--rank2 { background: linear-gradient(180deg, #f8fbff 0%, #ffffff 100%); }
    .podium-card--rank3 { background: linear-gradient(180deg, #fffaf5 0%, #ffffff 100%); }

    .podium-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(17, 24, 39, .84);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
    }

    .podium-media {
      display: block;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255, 255, 255, .84);
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, .04);
      padding: 10px;
    }

    .podium-media img {
      width: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      background: #f4f6fa;
    }

    .podium-card--rank1 .podium-media img { height: 280px; }
    .podium-card:not(.podium-card--rank1) .podium-media img { height: 150px; }

    .podium-content { display: grid; gap: 8px; margin-top: 10px; }
    .podium-card--rank1 .podium-content { margin-top: 0; }

    .podium-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .05em;
      color: #7a5b00;
      text-transform: uppercase;
    }

    .podium-card:not(.podium-card--rank1) .podium-kicker { color: #52606d; }
    .podium-title { margin: 0; font-size: 20px; line-height: 1.3; font-weight: 900; color: #101828; }
    .podium-card:not(.podium-card--rank1) .podium-title { font-size: 16px; }

    .podium-metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .podium-metric { padding: 10px; border-radius: 14px; background: rgba(255,255,255,.78); border: 1px solid rgba(255,255,255,.72); }
    .podium-metric-label { display:block; font-size:11px; color:#667085; font-weight:800; margin-bottom:4px; }
    .podium-price { font-size:24px; font-weight:900; line-height:1.1; color:#111827; }
    .podium-card:not(.podium-card--rank1) .podium-price { font-size:18px; }
    .podium-rate { font-size:20px; font-weight:900; line-height:1.1; }
    .podium-card:not(.podium-card--rank1) .podium-rate { font-size:16px; }
    .podium-meta { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .podium-chip-group { display:flex; flex-wrap:wrap; gap:6px; }
    .podium-chip { display:inline-flex; align-items:center; min-height:24px; padding:0 8px; border-radius:999px; font-size:10px; font-weight:900; background:rgba(255,255,255,.82); border:1px solid rgba(16,24,40,.08); color:#344054; }
    .podium-actions { display:flex; align-items:center; justify-content:flex-start; }
    .podium-actions .btn { margin-top:0; }

    @media (max-width: 900px) {
      .ranking-header-card {
        grid-template-columns: 1fr;
        padding: 20px;
      }

      .ranking-status {
        justify-content: flex-start;
      }

      .ranking-status-card {
        min-width: 0;
        flex: 1 1 140px;
      }

      .ranking-filter-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .ranking-filter-actions {
        min-width: 0;
      }

      .ranking-top3 { grid-template-columns: 1fr; }
      .podium-card--rank1 { grid-template-columns: 1fr; }
    }

    @media (max-width: 700px) {
      .ranking-filter-card {
        padding: 16px;
      }

      .ranking-filter-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .ranking-filter-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <!-- 共通ヘッダー差し込み -->
  <div id="site-header"></div>

  <div class="container">
    <nav class="breadcrumb" aria-label="パンくず">
      <a href="./index.html">ホーム</a>
      <span class="breadcrumb-sep" aria-hidden="true">></span>
      <span class="breadcrumb-current" aria-current="page">急上昇ランキング</span>
    </nav>
    <div class="ranking-page-top">
      <section class="ranking-header-card" aria-label="ページヘッダー">
        <div>
          <h1 class="ranking-page-title">急上昇ランキング</h1>
          <p class="ranking-page-desc">直近の週次データをもとに、上昇額や上昇率が大きいスリーブをすばやく把握できます。</p>
        </div>
        <div class="ranking-status" aria-label="集計状況">

            <span id="updatedAt" class="ranking-status-value">読み込み中</span>

          <div class="ranking-status-card">
            <span class="ranking-status-label">表示件数</span>

      </section>

      <section class="ranking-filter-card" aria-label="フィルタバー">
        <div class="ranking-filter-head">

            <h2 class="ranking-filter-title">絞り込み</h2>
            <p class="ranking-filter-sub">条件を変えるとランキングをすぐに更新できます</p>
          </div>

        <div class="ranking-filter-grid">

          <label class="ranking-filter-field">

              <option value="">全部</option>

          <label class="ranking-filter-field">
            <span class="ranking-filter-label">最低上昇額（円）</span>
            <select id="minDiff">
              <option value="0">指定なし</option>
              <option value="100">+100円以上</option>
              <option value="300">+300円以上</option>
              <option value="500">+500円以上</option>
              <option value="1000">+1,000円以上</option>

          <div class="ranking-filter-actions">

    <main class="ranking-main">
      <section id="top3" class="ranking-top3" aria-label="ランキング上位3件" hidden>
        <div id="top1"></div>

        <div id="top3Card"></div>
      </section>
      <section id="restSection" class="ranking-rest-section">
        <div class="ranking-section-head">
          <h2 class="ranking-section-title">4位以降のランキング</h2>
          <p class="ranking-section-note">条件に一致したスリーブを一覧表示</p>
        </div>
        <div id="list" class="grid"></div>
      </section>

    <!-- 共通フッター差し込み -->
    <div id="site-footer"></div>

  <script>
    // -----------------------------
    // utils
    // -----------------------------
    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "block";
      el.textContent = msg;
    }

    function hideError() {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "none";
      el.textContent = "";
    }

    function uniq(arr) {
      const s = new Set();
      for (const v of arr) {
        const t = (v == null) ? "" : String(v).trim();
        if (t) s.add(t);
      }
      return Array.from(s);
    }

    function toISODate(d) {
      const dd = new Date(d);
      if (Number.isNaN(dd.getTime())) return null;
      const y = dd.getFullYear();
      const m = String(dd.getMonth() + 1).padStart(2, "0");
      const day = String(dd.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function numOrNull(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    async function fetchJsonWithTimeout(url, { timeoutMs = 12000 } = {}) {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const res = await fetch(url, {
          cache: "no-store",
          signal: controller.signal,
          headers: { "Accept": "application/json" }
        });
        if (!res.ok) throw new Error(`データ取得に失敗しました（HTTP ${res.status}）`);
        return await res.json();
      } catch (e) {
        if (e && e.name === "AbortError") {
          throw new Error("データ取得がタイムアウトしました。時間をおいて再度お試しください。");
        }
        throw e;
      } finally {
        clearTimeout(t);
      }
    }

    async function loadData() {
      if (window.common && typeof window.common.loadData === "function") {
        return await window.common.loadData();
      }
      const url = window.GAS_URL;
      if (!url) throw new Error("GAS_URL が未設定です（common.js を確認してください）");
      const res = await fetch(url, { cache: "default" });
      if (!res.ok) throw new Error(`データ取得に失敗しました（HTTP ${res.status}）`);
      return await res.json();
    }

    // -----------------------------
    // weekly logic
    // -----------------------------
    /**
     * 週次データから「直近の取引週」「その1つ前の取引週」を返す
     * - 取引なし週は除外（count=0 または price非数）
     * - week は ISO (YYYY-MM-DD) に正規化
     * - 同一 week が複数ある場合は最後の1つを採用（データが後勝ち）
     */
    function getWeeklyPair(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      if (arr.length === 0) return null;

      const map = new Map();
      for (const x of arr) {
        const weekISO = toISODate(x.week);
        if (!weekISO) continue;

        const price = numOrNull(x.price);
        const count = numOrNull(x.count);

        const hasTrade = (count == null) ? (price != null) : (count > 0 && price != null);
        if (!hasTrade) continue;

        map.set(weekISO, { week: weekISO, price, count: count == null ? null : count });
      }
      if (map.size === 0) return null;

      const sorted = Array.from(map.values()).sort((a, b) => a.week.localeCompare(b.week));
      const latest = sorted[sorted.length - 1];
      const prev = sorted.length >= 2 ? sorted[sorted.length - 2] : null;

      return { latest, prev };
    }

    function getTotalTradeCount(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      let sum = 0;
      let hasAny = false;

      for (const x of arr) {
        const c = numOrNull(x.count);
        if (Number.isFinite(c) && c > 0) {
          sum += c;
          hasAny = true;
        }
      }
      return hasAny ? sum : null;
    }

    function getMarketRange(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      const prices = arr.map((x) => numOrNull(x && x.price)).filter((v) => Number.isFinite(v) && v > 0);
      if (!prices.length) return { min: null, max: null };
      return { min: Math.min(...prices), max: Math.max(...prices) };
    }

    function getTagLabels(sleeve, maxItems = 3) {
      const candidates = [];
      if (Array.isArray(sleeve.tags)) candidates.push(...sleeve.tags);
      if (typeof sleeve.tag === "string") candidates.push(sleeve.tag);
      if (typeof sleeve.badge === "string") candidates.push(sleeve.badge);
      if (typeof sleeve.series === "string") candidates.push(sleeve.series);
      if (typeof sleeve.condition === "string") candidates.push(sleeve.condition);
      if (typeof sleeve.releaseYear === "number" || typeof sleeve.releaseYear === "string") candidates.push(`${sleeve.releaseYear}`);
      const seen = new Set();
      const result = [];
      for (const raw of candidates) {
        const tag = String(raw || "").trim();
        if (!tag) continue;
        const normalized = tag.startsWith("#") ? tag : `#${tag}`;
        if (seen.has(normalized)) continue;
        seen.add(normalized);
        result.push(normalized);
        if (result.length >= maxItems) break;
      }
      return result.length ? result : ["#注目"];
    }

    function getPodiumBadge(rank) {
      if (rank === 1) return "🥇 1位";
      if (rank === 2) return "🥈 2位";
      return "🥉 3位";
    }

    function buildPodiumCard(row, rank) {
      const s = row.s;
      const pair = row.pair;
      const range = row.marketRange || { min: null, max: null };
      const imgSrc = String(s.imageUrl || "").trim();
      const tagHtml = getTagLabels(s).map((tag) => `<span class="podium-chip">${escapeHtml(tag)}</span>`).join("");
      const minText = range.min == null ? "—" : `${Number(range.min).toLocaleString()}円`;
      const maxText = range.max == null ? "—" : `${Number(range.max).toLocaleString()}円`;
      const rate = row.rate;
      const rateClass = (rate ?? 0) > 0 ? "up" : (rate ?? 0) < 0 ? "down" : "flat";
      return `
        <article class="podium-card podium-card--rank${rank}">
          <div class="podium-badge">${getPodiumBadge(rank)}</div>
          <a class="podium-media" data-sleeve-link="1" href="${row.detailHref}">
            <img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(s.name ?? "")}" loading="${rank === 1 ? "eager" : "lazy"}" referrerpolicy="no-referrer"
              onerror="this.onerror=null; this.style.display='none';">
          </a>
          <div class="podium-content">
            <div class="podium-kicker">TOP ${rank} SLEEVE</div>
            <h${rank === 1 ? "2" : "3"} class="podium-title">${escapeHtml(s.name ?? "")}</h${rank === 1 ? "2" : "3"}>
            <div class="podium-metrics">
              <div class="podium-metric">
                <span class="podium-metric-label">最新価格</span>
                <div class="podium-price">${pair.latest.price.toLocaleString()}円</div>
              </div>
              <div class="podium-metric">
                <span class="podium-metric-label">前週比</span>
                <div class="podium-rate ${rateClass}">${rate == null ? "—" : `${rate > 0 ? "+" : ""}${rate.toFixed(1)}%`}</div>
              </div>
              <div class="podium-metric">
                <span class="podium-metric-label">最安値</span>
                <div class="podium-rate">${minText}</div>
              </div>
              <div class="podium-metric">
                <span class="podium-metric-label">最高値</span>
                <div class="podium-rate">${maxText}</div>
              </div>
            </div>
            <div class="podium-meta">
              <div class="podium-chip-group">${tagHtml}</div>
              <span class="podium-chip">対象週 ${escapeHtml(pair.latest.week)}</span>
            </div>
            <div class="podium-actions">
              <a class="btn" data-sleeve-link="1" href="${row.detailHref}">価格推移を見る →</a>
            </div>
          </div>
        </article>
      `;
    }

    function getGlobalLatestTradeWeek(sleeves) {
      let maxWeek = null;
      for (const s of (Array.isArray(sleeves) ? sleeves : [])) {
        const pair = getWeeklyPair(s);
        if (!pair) continue;
        const w = String(pair.latest.week || "");
        if (!w) continue;
        if (!maxWeek || w > maxWeek) maxWeek = w;
      }
      return maxWeek;
    }

    function computeSurge(sleeve, latestWeek) {
      const pair = getWeeklyPair(sleeve);
      if (!pair || !pair.prev) return null;
      if (latestWeek && pair.latest.week !== latestWeek) return null;

      const diff = pair.latest.price - pair.prev.price;
      if (!(diff > 0)) return null; // 上昇だけ

      let rate = null;
      if (pair.prev.price !== 0) {
        const r = (diff / pair.prev.price) * 100;
        rate = Number.isFinite(r) ? r : null;
      }

      return { pair, diff, rate };
    }

    function formatSurgeDelta(pair) {
      if (!pair) return `<div class="delta"><span class="flat">直近の取引なし</span></div>`;

      const { latest, prev } = pair;

      if (!prev) {
        const cntText = Number.isFinite(latest.count) ? ` / ${latest.count}件` : "";
        return `
          <div class="delta">
            <span class="flat">比較できる前回データなし</span>
            <span class="chip">直近 ${latest.price.toLocaleString()}円${cntText}</span>
          </div>
        `;
      }

      const diff = latest.price - prev.price;
      const cls = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
      const arrow = diff > 0 ? "↑" : diff < 0 ? "↓" : "→";
      const sign = diff > 0 ? "+" : diff < 0 ? "−" : "±";
      const abs = Math.abs(diff);

      let pctText = "";
      if (prev.price !== 0) {
        const rate = (diff / prev.price) * 100;
        if (Number.isFinite(rate)) pctText = `（${rate.toFixed(1)}%）`;
      }

      const prevCnt = Number.isFinite(prev.count) ? `${prev.count}件` : "—";
      const latestCnt = Number.isFinite(latest.count) ? `${latest.count}件` : "—";

      return `
        <div class="delta">
          <span class="delta-main ${cls}">${arrow} 前回取引週比 ${sign}${abs.toLocaleString()}円 ${escapeHtml(pctText)}</span>
          <span class="chip">前回 ${prev.price.toLocaleString()}円 / ${prevCnt}</span>
          <span class="chip">直近 ${latest.price.toLocaleString()}円 / ${latestCnt}</span>
        </div>
      `;
    }

    // -----------------------------
    // main
    // -----------------------------
    async function main() {
      const list = document.getElementById("list");
      const top3 = document.getElementById("top3");
      const top1 = document.getElementById("top1");
      const top2 = document.getElementById("top2");
      const top3Card = document.getElementById("top3Card");
      const restSection = document.getElementById("restSection");
      const searchInput = document.getElementById("search"); // header側にある想定

      const metricSel = document.getElementById("metric");
      const releaseYearSel = document.getElementById("releaseYear");
      const seriesSel = document.getElementById("series");
      const minDiffSel = document.getElementById("minDiff");
      const clearBtn = document.getElementById("clear");

      let data;
      try {
        data = await loadData();
      } catch (e) {
        showError(e.message || "不明なエラーが発生しました");
        return;
      }
      hideError();

      const sleeves = Array.isArray(data.sleeves) ? data.sleeves : [];
      const latestWeek = getGlobalLatestTradeWeek(sleeves);

      // 最終更新（直近取引週の最大日付）
      try {
        if (latestWeek) {
          const u = document.getElementById("updatedAt");
          u.textContent = `${latestWeek}（週次）`;
        }
      } catch (_) { }

      // セレクト初期化
      const releaseYears = uniq(sleeves.map(s => s.releaseYear)).map(Number).filter(Number.isFinite).sort((a, b) => a - b);
      const seriesList = uniq(sleeves.map(s => s.series)).sort();

      for (const y of releaseYears) {
        const opt = document.createElement("option");
        opt.value = String(y);
        opt.textContent = String(y);
        releaseYearSel.appendChild(opt);
      }
      for (const ser of seriesList) {
        const opt = document.createElement("option");
        opt.value = ser;
        opt.textContent = ser;
        seriesSel.appendChild(opt);
      }

      function render() {
        const kw = (searchInput ? searchInput.value : "").trim().toLowerCase();
        const metric = metricSel.value;
        const releaseYear = releaseYearSel.value;
        const series = seriesSel.value;
        const minDiff = Number(minDiffSel.value || "0");

        list.innerHTML = "";
        top1.innerHTML = "";
        top2.innerHTML = "";
        top3Card.innerHTML = "";
        top3.hidden = true;
        restSection.hidden = false;

        const rows = [];
        for (const s of sleeves) {
          if (kw && !String(s.name || "").toLowerCase().includes(kw)) continue;
          if (releaseYear && String(s.releaseYear ?? "") !== releaseYear) continue;
          if (series && String(s.series || "") !== series) continue;

          const surge = computeSurge(s, latestWeek);
          if (!surge) continue;
          if (surge.diff < minDiff) continue;

          const detailHref = (window.common && typeof window.common.buildSleeveDetailHref === "function")
            ? window.common.buildSleeveDetailHref(s.id ?? "")
            : `./sleeve/${encodeURIComponent(s.id ?? "")}/`;
          rows.push({ s, ...surge, detailHref, marketRange: getMarketRange(s) });
        }

        rows.sort((a, b) => {
          if (metric === "rateDesc") {
            const ra = a.rate ?? -Infinity;
            const rb = b.rate ?? -Infinity;
            if (rb !== ra) return rb - ra;
            return b.diff - a.diff;
          }
          if (b.diff !== a.diff) return b.diff - a.diff;
          return (b.rate ?? -Infinity) - (a.rate ?? -Infinity);
        });

        const c = document.getElementById("countInfo");
        c.textContent = `${rows.length.toLocaleString()}件（上昇のみ）`;

        if (rows.length === 0) {
          list.innerHTML = `<div class="card"><div class="title">該当なし</div><div class="meta">条件に一致する急上昇スリーブがありません</div></div>`;
          return;
        }

        const topRows = rows.slice(0, 3);
        if (topRows.length) {
          top3.hidden = false;
          top1.innerHTML = buildPodiumCard(topRows[0], 1);
          if (topRows[1]) top2.innerHTML = buildPodiumCard(topRows[1], 2);
          if (topRows[2]) top3Card.innerHTML = buildPodiumCard(topRows[2], 3);
        }

        const normalRows = rows.slice(3);
        restSection.hidden = normalRows.length === 0;

        const frag = document.createDocumentFragment();

        for (let i = 0; i < normalRows.length; i++) {
          const row = normalRows[i];
          const rank = i + 4;

          const s = row.s;
          const pair = row.pair;

          const latestPrice = pair.latest.price;
          const priceText = `${latestPrice.toLocaleString()}円`;

          const weeklyHtml = formatSurgeDelta(pair);

          const totalTrades = getTotalTradeCount(s);
          const totalTradesText = (totalTrades == null) ? "—" : `${totalTrades.toLocaleString()}件`;

          const detailHref = row.detailHref;
          const imgSrc = String(s.imageUrl || "").trim();
          const imgHtml = imgSrc
            ? `<a class="thumb-link" href="${detailHref}">
                 <img class="thumb" src="${escapeHtml(imgSrc)}" alt="${escapeHtml(s.name ?? "")}" loading="lazy" referrerpolicy="no-referrer"
                   onerror="this.onerror=null; this.style.display='none';">
               </a>`
            : "";

          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
            ${imgHtml}

            <div class="rank-row">
              <span class="rank-badge">${rank}位</span>
              <div class="title" style="margin:0;">${escapeHtml(s.name ?? "")}</div>
            </div>

            <div class="price">${escapeHtml(priceText)} <span class="meta">（直近取引週）</span></div>

            ${weeklyHtml}

            <div class="badges">
              <span class="badge">総取引：${escapeHtml(totalTradesText)}</span>
              <span class="badge">発売年：${escapeHtml(s.releaseYear ?? "")}</span>
              <span class="badge">${escapeHtml(s.condition ?? "")}</span>
              <span class="badge">${escapeHtml(s.series ?? "")}</span>
            </div>

            <a class="btn" data-sleeve-link="1" href="${detailHref}">価格推移を見る →</a>
          `;
          frag.appendChild(div);
        }

        list.appendChild(frag);
      }

      // events
      let t = null;
      if (searchInput) {
        searchInput.addEventListener("input", () => {
          clearTimeout(t);
          t = setTimeout(render, 80);
        });
      }

      metricSel.addEventListener("change", render);
      releaseYearSel.addEventListener("change", render);
      seriesSel.addEventListener("change", render);
      minDiffSel.addEventListener("change", render);

      clearBtn.addEventListener("click", () => {
        if (searchInput) searchInput.value = "";
        metricSel.value = "diffDesc";
        releaseYearSel.value = "";
        seriesSel.value = "";
        minDiffSel.value = "0";
        render();
      });

      render();
    }
  document.addEventListener("site:injected", () => {
    main();
  });
  </script>

  <!-- 共通JS（ヘッダー/フッター注入 + Active Nav） -->
  <script src="./assets/common.js"></script>
</body>

</html>
