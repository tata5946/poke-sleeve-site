<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>諤･荳頑・繝ｩ繝ｳ繧ｭ繝ｳ繧ｰ・懊・繧ｱ繧ｹ繝ｪ逶ｸ蝣ｴ繝翫ン</title>
  <meta name="description" content="繝昴こ繧ｫ繧ｹ繝ｪ繝ｼ繝悶・諤･荳頑・繝ｩ繝ｳ繧ｭ繝ｳ繧ｰ・育峩霑大叙蠑暮ｱ豈費ｼ峨ｒ謗ｲ霈峨ゆｸ頑・鬘阪・荳頑・邇・〒荳ｦ縺ｳ譖ｿ縺医∵､懃ｴ｢繝ｻ邨槭ｊ霎ｼ縺ｿ縺ｧ逶ｸ蝣ｴ繧呈ｯ碑ｼ・〒縺阪∪縺吶・>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">

  <!-- 蜈ｱ騾咾SS -->
  <link rel="stylesheet" href="./assets/site.css" />
</head>

<body>
  <!-- 蜈ｱ騾壹・繝・ム繝ｼ蟾ｮ縺苓ｾｼ縺ｿ -->
  <div id="site-header"></div>

  <div class="container">
    <!-- HERO -->
    <div class="hero">
      <div class="hero-card">
        <div>
          <p class="hero-title">諤･荳頑・繝ｩ繝ｳ繧ｭ繝ｳ繧ｰ</p>
          <p class="hero-desc">逶ｴ霑代・蜿門ｼ暮ｱ縺ｨ縺昴・1縺､蜑阪・蜿門ｼ暮ｱ繧呈ｯ碑ｼ・＠縺ｦ縲∽ｸ頑・縺励◆繧ｹ繝ｪ繝ｼ繝悶ｒ繝ｩ繝ｳ繧ｭ繝ｳ繧ｰ陦ｨ遉ｺ縺励∪縺吶・/p>
          <p class="data-note">窶ｻ萓｡譬ｼ縺ｯ繝輔Μ繝槭い繝励Μ遲峨・螢ｲ蜊ｴ螻･豁ｴ繧偵ｂ縺ｨ縺ｫ迢ｬ閾ｪ髮・ｨ医＠縺ｦ縺・∪縺吶・/p>
          <p id="updatedAt" class="data-note" style="display:none;"></p>
          <p id="countInfo" class="data-note" style="display:none;"></p>
        </div>
      </div>
    </div>

    <div class="main">
      <!-- 邨槭ｊ霎ｼ縺ｿ -->
      <aside class="panel">
        <h2>邨槭ｊ霎ｼ縺ｿ</h2>
        <p class="small">譚｡莉ｶ繧貞､画峩縺吶ｋ縺ｨ繝ｩ繝ｳ繧ｭ繝ｳ繧ｰ縺梧峩譁ｰ縺輔ｌ縺ｾ縺吶・/p>

        <div id="error" class="error"></div>

        <div class="controls">
          <label>謖・ｨ・
            <select id="metric">
              <option value="diffDesc">荳頑・鬘搾ｼ亥・・・/option>
              <option value="rateDesc">荳頑・邇・ｼ・・・/option>
            </select>
          </label>

          <label>逋ｺ螢ｲ蟷ｴ
            <select id="releaseYear">
              <option value="">蜈ｨ驛ｨ</option>
            </select>
          </label>

          <label>繧ｷ繝ｪ繝ｼ繧ｺ
            <select id="series">
              <option value="">蜈ｨ驛ｨ</option>
            </select>
          </label>

          <label>譛菴惹ｸ頑・鬘搾ｼ亥・・・
            <select id="minDiff">
              <option value="0">謖・ｮ壹↑縺・/option>
              <option value="100">+100蜀・ｻ･荳・/option>
              <option value="300">+300蜀・ｻ･荳・/option>
              <option value="500">+500蜀・ｻ･荳・/option>
              <option value="1000">+1,000蜀・ｻ･荳・/option>
              <option value="2000">+2,000蜀・ｻ･荳・/option>
              <option value="5000">+5,000蜀・ｻ･荳・/option>
            </select>
          </label>

          <button id="clear" type="button">繧ｯ繝ｪ繧｢</button>
        </div>
      </aside>

      <!-- 荳隕ｧ -->
      <main>
        <div id="list" class="grid"></div>
      </main>
    </div>

    <!-- 蜈ｱ騾壹ヵ繝・ち繝ｼ蟾ｮ縺苓ｾｼ縺ｿ -->
    <div id="site-footer"></div>
  </div>

  <script>
    // -----------------------------
    // utils
    // -----------------------------
    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "block";
      el.textContent = msg;
    }

    function hideError() {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "none";
      el.textContent = "";
    }

    function uniq(arr) {
      const s = new Set();
      for (const v of arr) {
        const t = (v == null) ? "" : String(v).trim();
        if (t) s.add(t);
      }
      return Array.from(s);
    }

    function toISODate(d) {
      const dd = new Date(d);
      if (Number.isNaN(dd.getTime())) return null;
      const y = dd.getFullYear();
      const m = String(dd.getMonth() + 1).padStart(2, "0");
      const day = String(dd.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function numOrNull(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    async function fetchJsonWithTimeout(url, { timeoutMs = 12000 } = {}) {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const res = await fetch(url, {
          cache: "no-store",
          signal: controller.signal,
          headers: { "Accept": "application/json" }
        });
        if (!res.ok) throw new Error(`繝・・繧ｿ蜿門ｾ励↓螟ｱ謨励＠縺ｾ縺励◆・・TTP ${res.status}・荏);
        return await res.json();
      } catch (e) {
        if (e && e.name === "AbortError") {
          throw new Error("繝・・繧ｿ蜿門ｾ励′繧ｿ繧､繝繧｢繧ｦ繝医＠縺ｾ縺励◆縲よ凾髢薙ｒ縺翫＞縺ｦ蜀榊ｺｦ縺願ｩｦ縺励￥縺縺輔＞縲・);
        }
        throw e;
      } finally {
        clearTimeout(t);
      }
    }

    async function loadData() {
      if (!window.common || typeof window.common.loadData !== "function") {
        throw new Error("共通データローダーの初期化に失敗しました（assets/common.js）");
      }
      return await window.common.loadData();
    }

    // -----------------------------
    // weekly logic
    // -----------------------------
    /**
     * 騾ｱ谺｡繝・・繧ｿ縺九ｉ縲檎峩霑代・蜿門ｼ暮ｱ縲阪後◎縺ｮ1縺､蜑阪・蜿門ｼ暮ｱ縲阪ｒ霑斐☆
     * - 蜿門ｼ輔↑縺鈴ｱ縺ｯ髯､螟厄ｼ・ount=0 縺ｾ縺溘・ price髱樊焚・・
     * - week 縺ｯ ISO (YYYY-MM-DD) 縺ｫ豁｣隕丞喧
     * - 蜷御ｸ week 縺瑚､・焚縺ゅｋ蝣ｴ蜷医・譛蠕後・1縺､繧呈治逕ｨ・医ョ繝ｼ繧ｿ縺悟ｾ悟享縺｡・・
     */
    function getWeeklyPair(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      if (arr.length === 0) return null;

      const map = new Map();
      for (const x of arr) {
        const weekISO = toISODate(x.week);
        if (!weekISO) continue;

        const price = numOrNull(x.price);
        const count = numOrNull(x.count);

        const hasTrade = (count == null) ? (price != null) : (count > 0 && price != null);
        if (!hasTrade) continue;

        map.set(weekISO, { week: weekISO, price, count: count == null ? null : count });
      }
      if (map.size === 0) return null;

      const sorted = Array.from(map.values()).sort((a, b) => a.week.localeCompare(b.week));
      const latest = sorted[sorted.length - 1];
      const prev = sorted.length >= 2 ? sorted[sorted.length - 2] : null;

      return { latest, prev };
    }

    function getTotalTradeCount(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      let sum = 0;
      let hasAny = false;

      for (const x of arr) {
        const c = numOrNull(x.count);
        if (Number.isFinite(c) && c > 0) {
          sum += c;
          hasAny = true;
        }
      }
      return hasAny ? sum : null;
    }

    function computeSurge(sleeve) {
      const pair = getWeeklyPair(sleeve);
      if (!pair || !pair.prev) return null;

      const diff = pair.latest.price - pair.prev.price;
      if (!(diff > 0)) return null; // 荳頑・縺縺・

      let rate = null;
      if (pair.prev.price !== 0) {
        const r = (diff / pair.prev.price) * 100;
        rate = Number.isFinite(r) ? r : null;
      }

      return { pair, diff, rate };
    }

    function formatSurgeDelta(pair) {
      if (!pair) return `<div class="delta"><span class="flat">逶ｴ霑代・蜿門ｼ輔↑縺・/span></div>`;

      const { latest, prev } = pair;

      if (!prev) {
        const cntText = Number.isFinite(latest.count) ? ` / ${latest.count}莉ｶ` : "";
        return `
          <div class="delta">
            <span class="flat">豈碑ｼ・〒縺阪ｋ蜑榊屓繝・・繧ｿ縺ｪ縺・/span>
            <span class="chip">逶ｴ霑・${latest.price.toLocaleString()}蜀・{cntText}</span>
          </div>
        `;
      }

      const diff = latest.price - prev.price;
      const cls = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
      const arrow = diff > 0 ? "竊・ : diff < 0 ? "竊・ : "竊・;
      const sign = diff > 0 ? "+" : diff < 0 ? "竏・ : "ﾂｱ";
      const abs = Math.abs(diff);

      let pctText = "";
      if (prev.price !== 0) {
        const rate = (diff / prev.price) * 100;
        if (Number.isFinite(rate)) pctText = `・・{rate.toFixed(1)}%・荏;
      }

      const prevCnt = Number.isFinite(prev.count) ? `${prev.count}莉ｶ` : "窶・;
      const latestCnt = Number.isFinite(latest.count) ? `${latest.count}莉ｶ` : "窶・;

      return `
        <div class="delta">
          <span class="delta-main ${cls}">${arrow} 蜑榊屓蜿門ｼ暮ｱ豈・${sign}${abs.toLocaleString()}蜀・${escapeHtml(pctText)}</span>
          <span class="chip">蜑榊屓 ${prev.price.toLocaleString()}蜀・/ ${prevCnt}</span>
          <span class="chip">逶ｴ霑・${latest.price.toLocaleString()}蜀・/ ${latestCnt}</span>
        </div>
      `;
    }

    // -----------------------------
    // main
    // -----------------------------
    async function main() {
      const list = document.getElementById("list");
      const searchInput = document.getElementById("search"); // header蛛ｴ縺ｫ縺ゅｋ諠ｳ螳・

      const metricSel = document.getElementById("metric");
      const releaseYearSel = document.getElementById("releaseYear");
      const seriesSel = document.getElementById("series");
      const minDiffSel = document.getElementById("minDiff");
      const clearBtn = document.getElementById("clear");

      let data;
      try {
        data = await loadData();
      } catch (e) {
        showError(e.message || "荳肴・縺ｪ繧ｨ繝ｩ繝ｼ縺檎匱逕溘＠縺ｾ縺励◆");
        return;
      }
      hideError();

      const sleeves = Array.isArray(data.sleeves) ? data.sleeves : [];

      // 譛邨よ峩譁ｰ・育峩霑大叙蠑暮ｱ縺ｮ譛螟ｧ譌･莉假ｼ・
      try {
        let maxWeek = null;
        for (const s of sleeves) {
          const p = getWeeklyPair(s);
          if (!p) continue;
          const w = p.latest.week;
          if (!maxWeek || w > maxWeek) maxWeek = w;
        }
        if (maxWeek) {
          const u = document.getElementById("updatedAt");
          u.textContent = `譛邨よ峩譁ｰ・・{maxWeek}・磯ｱ谺｡・荏;
          u.style.display = "block";
        }
      } catch (_) { }

      // 繧ｻ繝ｬ繧ｯ繝亥・譛溷喧
      const releaseYears = uniq(sleeves.map(s => s.releaseYear)).map(Number).filter(Number.isFinite).sort((a, b) => a - b);
      const seriesList = uniq(sleeves.map(s => s.series)).sort();

      for (const y of releaseYears) {
        const opt = document.createElement("option");
        opt.value = String(y);
        opt.textContent = String(y);
        releaseYearSel.appendChild(opt);
      }
      for (const ser of seriesList) {
        const opt = document.createElement("option");
        opt.value = ser;
        opt.textContent = ser;
        seriesSel.appendChild(opt);
      }

      function render() {
        const kw = (searchInput ? searchInput.value : "").trim().toLowerCase();
        const metric = metricSel.value;
        const releaseYear = releaseYearSel.value;
        const series = seriesSel.value;
        const minDiff = Number(minDiffSel.value || "0");

        list.innerHTML = "";

        const rows = [];
        for (const s of sleeves) {
          if (kw && !String(s.name || "").toLowerCase().includes(kw)) continue;
          if (releaseYear && String(s.releaseYear ?? "") !== releaseYear) continue;
          if (series && String(s.series || "") !== series) continue;

          const surge = computeSurge(s);
          if (!surge) continue;
          if (surge.diff < minDiff) continue;

          rows.push({ s, ...surge });
        }

        rows.sort((a, b) => {
          if (metric === "rateDesc") {
            const ra = a.rate ?? -Infinity;
            const rb = b.rate ?? -Infinity;
            if (rb !== ra) return rb - ra;
            return b.diff - a.diff;
          }
          if (b.diff !== a.diff) return b.diff - a.diff;
          return (b.rate ?? -Infinity) - (a.rate ?? -Infinity);
        });

        const c = document.getElementById("countInfo");
        c.textContent = `陦ｨ遉ｺ莉ｶ謨ｰ・・{rows.length.toLocaleString()}莉ｶ・井ｸ頑・縺ｮ縺ｿ・荏;
        c.style.display = "block";

        if (rows.length === 0) {
          list.innerHTML = `<div class="card"><div class="title">隧ｲ蠖薙↑縺・/div><div class="meta">譚｡莉ｶ縺ｫ荳閾ｴ縺吶ｋ諤･荳頑・繧ｹ繝ｪ繝ｼ繝悶′縺ゅｊ縺ｾ縺帙ｓ</div></div>`;
          return;
        }

        const frag = document.createDocumentFragment();

        for (let i = 0; i < rows.length; i++) {
          const row = rows[i];
          const rank = i + 1;

          const s = row.s;
          const pair = row.pair;

          const latestPrice = pair.latest.price;
          const priceText = `${latestPrice.toLocaleString()}蜀・;

          const weeklyHtml = formatSurgeDelta(pair);

          const totalTrades = getTotalTradeCount(s);
          const totalTradesText = (totalTrades == null) ? "窶・ : `${totalTrades.toLocaleString()}莉ｶ`;

          const imgSrc = String(s.imageUrl || "").trim();
          const imgHtml = imgSrc
            ? `<img class="thumb" src="${escapeHtml(imgSrc)}" alt="${escapeHtml(s.name ?? "")}" loading="lazy" referrerpolicy="no-referrer"
                 onerror="this.onerror=null; this.style.display='none';">`
            : "";

          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
            ${imgHtml}

            <div class="rank-row">
              <span class="rank-badge">${rank}菴・/span>
              <div class="title" style="margin:0;">${escapeHtml(s.name ?? "")}</div>
            </div>

            <div class="price">${escapeHtml(priceText)} <span class="meta">・育峩霑大叙蠑暮ｱ・・/span></div>

            ${weeklyHtml}

            <div class="badges">
              <span class="badge">邱丞叙蠑包ｼ・{escapeHtml(totalTradesText)}</span>
              <span class="badge">逋ｺ螢ｲ蟷ｴ・・{escapeHtml(s.releaseYear ?? "")}</span>
              <span class="badge">${escapeHtml(s.condition ?? "")}</span>
              <span class="badge">${escapeHtml(s.series ?? "")}</span>
            </div>

            <a class="btn" href="./detail.html?id=${encodeURIComponent(s.id ?? "")}">萓｡譬ｼ謗ｨ遘ｻ繧定ｦ九ｋ 竊・/a>
          `;
          frag.appendChild(div);
        }

        list.appendChild(frag);
      }

      // events
      let t = null;
      if (searchInput) {
        searchInput.addEventListener("input", () => {
          clearTimeout(t);
          t = setTimeout(render, 80);
        });
      }

      metricSel.addEventListener("change", render);
      releaseYearSel.addEventListener("change", render);
      seriesSel.addEventListener("change", render);
      minDiffSel.addEventListener("change", render);

      clearBtn.addEventListener("click", () => {
        if (searchInput) searchInput.value = "";
        metricSel.value = "diffDesc";
        releaseYearSel.value = "";
        seriesSel.value = "";
        minDiffSel.value = "0";
        render();
      });

      render();
    }
  document.addEventListener("site:injected", () => {
    main();
  });
  </script>

  <!-- 蜈ｱ騾哽S・医・繝・ム繝ｼ/繝輔ャ繧ｿ繝ｼ豕ｨ蜈･ + Active Nav・・-->

</body>
