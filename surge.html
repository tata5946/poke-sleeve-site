<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>急上昇ランキング｜ポケスリ相場ナビ</title>
  <meta name="description" content="ポケカスリーブの急上昇ランキング（直近取引週比）を掲載。上昇額・上昇率で並び替え、検索・絞り込みで相場を比較できます。">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">

  <!-- 共通CSS -->
  <link rel="stylesheet" href="./assets/site.css" />
</head>

<body>
  <!-- 共通ヘッダー差し込み -->
  <div id="site-header"></div>

  <div class="container">
    <!-- HERO -->
    <div class="hero">
      <div class="hero-card">
        <div>
          <p class="hero-title">急上昇ランキング</p>
          <p class="hero-desc">直近の取引週とその1つ前の取引週を比較して、上昇したスリーブをランキング表示します。</p>
          <p class="data-note">※価格はフリマアプリ等の売却履歴をもとに独自集計しています。</p>
          <p id="updatedAt" class="data-note" style="display:none;"></p>
          <p id="countInfo" class="data-note" style="display:none;"></p>
        </div>
      </div>
    </div>

    <div class="main">
      <!-- 絞り込み -->
      <aside class="panel">
        <h2>絞り込み</h2>
        <p class="small">条件を変更するとランキングが更新されます。</p>

        <div id="error" class="error"></div>

        <div class="controls">
          <label>指標
            <select id="metric">
              <option value="diffDesc">上昇額（円）</option>
              <option value="rateDesc">上昇率（%）</option>
            </select>
          </label>

          <label>発売年
            <select id="releaseYear">
              <option value="">全部</option>
            </select>
          </label>

          <label>シリーズ
            <select id="series">
              <option value="">全部</option>
            </select>
          </label>

          <label>最低上昇額（円）
            <select id="minDiff">
              <option value="0">指定なし</option>
              <option value="100">+100円以上</option>
              <option value="300">+300円以上</option>
              <option value="500">+500円以上</option>
              <option value="1000">+1,000円以上</option>
              <option value="2000">+2,000円以上</option>
              <option value="5000">+5,000円以上</option>
            </select>
          </label>

          <button id="clear" type="button">クリア</button>
        </div>
      </aside>

      <!-- 一覧 -->
      <main>
        <div id="list" class="grid"></div>
      </main>
    </div>

    <!-- 共通フッター差し込み -->
    <div id="site-footer"></div>
  </div>

  <script>
    // -----------------------------
    // utils
    // -----------------------------
    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "block";
      el.textContent = msg;
    }

    function hideError() {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "none";
      el.textContent = "";
    }

    function uniq(arr) {
      const s = new Set();
      for (const v of arr) {
        const t = (v == null) ? "" : String(v).trim();
        if (t) s.add(t);
      }
      return Array.from(s);
    }

    function toISODate(d) {
      const dd = new Date(d);
      if (Number.isNaN(dd.getTime())) return null;
      const y = dd.getFullYear();
      const m = String(dd.getMonth() + 1).padStart(2, "0");
      const day = String(dd.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function numOrNull(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    async function fetchJsonWithTimeout(url, { timeoutMs = 12000 } = {}) {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const res = await fetch(url, {
          cache: "no-store",
          signal: controller.signal,
          headers: { "Accept": "application/json" }
        });
        if (!res.ok) throw new Error(`データ取得に失敗しました（HTTP ${res.status}）`);
        return await res.json();
      } catch (e) {
        if (e && e.name === "AbortError") {
          throw new Error("データ取得がタイムアウトしました。時間をおいて再度お試しください。");
        }
        throw e;
      } finally {
        clearTimeout(t);
      }
    }

    async function loadData() {
      const url = window.GAS_URL;  // common.jsが同期読み込み済みなので確実に存在
      if (!url) throw new Error("GAS_URL が未設定です（common.js を確認してください）");
      const res = await fetch(url + "?v=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(`データ取得に失敗しました（HTTP ${res.status}）`);
      return await res.json();
    }

    // -----------------------------
    // weekly logic
    // -----------------------------
    /**
     * 週次データから「直近の取引週」「その1つ前の取引週」を返す
     * - 取引なし週は除外（count=0 または price非数）
     * - week は ISO (YYYY-MM-DD) に正規化
     * - 同一 week が複数ある場合は最後の1つを採用（データが後勝ち）
     */
    function getWeeklyPair(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      if (arr.length === 0) return null;

      const map = new Map();
      for (const x of arr) {
        const weekISO = toISODate(x.week);
        if (!weekISO) continue;

        const price = numOrNull(x.price);
        const count = numOrNull(x.count);

        const hasTrade = (count == null) ? (price != null) : (count > 0 && price != null);
        if (!hasTrade) continue;

        map.set(weekISO, { week: weekISO, price, count: count == null ? null : count });
      }
      if (map.size === 0) return null;

      const sorted = Array.from(map.values()).sort((a, b) => a.week.localeCompare(b.week));
      const latest = sorted[sorted.length - 1];
      const prev = sorted.length >= 2 ? sorted[sorted.length - 2] : null;

      return { latest, prev };
    }

    function getTotalTradeCount(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      let sum = 0;
      let hasAny = false;

      for (const x of arr) {
        const c = numOrNull(x.count);
        if (Number.isFinite(c) && c > 0) {
          sum += c;
          hasAny = true;
        }
      }
      return hasAny ? sum : null;
    }

    function computeSurge(sleeve) {
      const pair = getWeeklyPair(sleeve);
      if (!pair || !pair.prev) return null;

      const diff = pair.latest.price - pair.prev.price;
      if (!(diff > 0)) return null; // 上昇だけ

      let rate = null;
      if (pair.prev.price !== 0) {
        const r = (diff / pair.prev.price) * 100;
        rate = Number.isFinite(r) ? r : null;
      }

      return { pair, diff, rate };
    }

    function formatSurgeDelta(pair) {
      if (!pair) return `<div class="delta"><span class="flat">直近の取引なし</span></div>`;

      const { latest, prev } = pair;

      if (!prev) {
        const cntText = Number.isFinite(latest.count) ? ` / ${latest.count}件` : "";
        return `
          <div class="delta">
            <span class="flat">比較できる前回データなし</span>
            <span class="chip">直近 ${latest.price.toLocaleString()}円${cntText}</span>
          </div>
        `;
      }

      const diff = latest.price - prev.price;
      const cls = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
      const arrow = diff > 0 ? "↑" : diff < 0 ? "↓" : "→";
      const sign = diff > 0 ? "+" : diff < 0 ? "−" : "±";
      const abs = Math.abs(diff);

      let pctText = "";
      if (prev.price !== 0) {
        const rate = (diff / prev.price) * 100;
        if (Number.isFinite(rate)) pctText = `（${rate.toFixed(1)}%）`;
      }

      const prevCnt = Number.isFinite(prev.count) ? `${prev.count}件` : "—";
      const latestCnt = Number.isFinite(latest.count) ? `${latest.count}件` : "—";

      return `
        <div class="delta">
          <span class="delta-main ${cls}">${arrow} 前回取引週比 ${sign}${abs.toLocaleString()}円 ${escapeHtml(pctText)}</span>
          <span class="chip">前回 ${prev.price.toLocaleString()}円 / ${prevCnt}</span>
          <span class="chip">直近 ${latest.price.toLocaleString()}円 / ${latestCnt}</span>
        </div>
      `;
    }

    // -----------------------------
    // main
    // -----------------------------
    async function main() {
      const list = document.getElementById("list");
      const searchInput = document.getElementById("search"); // header側にある想定

      const metricSel = document.getElementById("metric");
      const releaseYearSel = document.getElementById("releaseYear");
      const seriesSel = document.getElementById("series");
      const minDiffSel = document.getElementById("minDiff");
      const clearBtn = document.getElementById("clear");

      let data;
      try {
        data = await loadData();
      } catch (e) {
        showError(e.message || "不明なエラーが発生しました");
        return;
      }
      hideError();

      const sleeves = Array.isArray(data.sleeves) ? data.sleeves : [];

      // 最終更新（直近取引週の最大日付）
      try {
        let maxWeek = null;
        for (const s of sleeves) {
          const p = getWeeklyPair(s);
          if (!p) continue;
          const w = p.latest.week;
          if (!maxWeek || w > maxWeek) maxWeek = w;
        }
        if (maxWeek) {
          const u = document.getElementById("updatedAt");
          u.textContent = `最終更新：${maxWeek}（週次）`;
          u.style.display = "block";
        }
      } catch (_) { }

      // セレクト初期化
      const releaseYears = uniq(sleeves.map(s => s.releaseYear)).map(Number).filter(Number.isFinite).sort((a, b) => a - b);
      const seriesList = uniq(sleeves.map(s => s.series)).sort();

      for (const y of releaseYears) {
        const opt = document.createElement("option");
        opt.value = String(y);
        opt.textContent = String(y);
        releaseYearSel.appendChild(opt);
      }
      for (const ser of seriesList) {
        const opt = document.createElement("option");
        opt.value = ser;
        opt.textContent = ser;
        seriesSel.appendChild(opt);
      }

      function render() {
        const kw = (searchInput ? searchInput.value : "").trim().toLowerCase();
        const metric = metricSel.value;
        const releaseYear = releaseYearSel.value;
        const series = seriesSel.value;
        const minDiff = Number(minDiffSel.value || "0");

        list.innerHTML = "";

        const rows = [];
        for (const s of sleeves) {
          if (kw && !String(s.name || "").toLowerCase().includes(kw)) continue;
          if (releaseYear && String(s.releaseYear ?? "") !== releaseYear) continue;
          if (series && String(s.series || "") !== series) continue;

          const surge = computeSurge(s);
          if (!surge) continue;
          if (surge.diff < minDiff) continue;

          rows.push({ s, ...surge });
        }

        rows.sort((a, b) => {
          if (metric === "rateDesc") {
            const ra = a.rate ?? -Infinity;
            const rb = b.rate ?? -Infinity;
            if (rb !== ra) return rb - ra;
            return b.diff - a.diff;
          }
          if (b.diff !== a.diff) return b.diff - a.diff;
          return (b.rate ?? -Infinity) - (a.rate ?? -Infinity);
        });

        const c = document.getElementById("countInfo");
        c.textContent = `表示件数：${rows.length.toLocaleString()}件（上昇のみ）`;
        c.style.display = "block";

        if (rows.length === 0) {
          list.innerHTML = `<div class="card"><div class="title">該当なし</div><div class="meta">条件に一致する急上昇スリーブがありません</div></div>`;
          return;
        }

        const frag = document.createDocumentFragment();

        for (let i = 0; i < rows.length; i++) {
          const row = rows[i];
          const rank = i + 1;

          const s = row.s;
          const pair = row.pair;

          const latestPrice = pair.latest.price;
          const priceText = `${latestPrice.toLocaleString()}円`;

          const weeklyHtml = formatSurgeDelta(pair);

          const totalTrades = getTotalTradeCount(s);
          const totalTradesText = (totalTrades == null) ? "—" : `${totalTrades.toLocaleString()}件`;

          const imgSrc = String(s.imageUrl || "").trim();
          const imgHtml = imgSrc
            ? `<img class="thumb" src="${escapeHtml(imgSrc)}" alt="${escapeHtml(s.name ?? "")}" loading="lazy" referrerpolicy="no-referrer"
                 onerror="this.onerror=null; this.style.display='none';">`
            : "";

          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
            ${imgHtml}

            <div class="rank-row">
              <span class="rank-badge">${rank}位</span>
              <div class="title" style="margin:0;">${escapeHtml(s.name ?? "")}</div>
            </div>

            <div class="price">${escapeHtml(priceText)} <span class="meta">（直近取引週）</span></div>

            ${weeklyHtml}

            <div class="badges">
              <span class="badge">総取引：${escapeHtml(totalTradesText)}</span>
              <span class="badge">発売年：${escapeHtml(s.releaseYear ?? "")}</span>
              <span class="badge">${escapeHtml(s.condition ?? "")}</span>
              <span class="badge">${escapeHtml(s.series ?? "")}</span>
            </div>

            <a class="btn" href="./detail.html?id=${encodeURIComponent(s.id ?? "")}">価格推移を見る →</a>
          `;
          frag.appendChild(div);
        }

        list.appendChild(frag);
      }

      // events
      let t = null;
      if (searchInput) {
        searchInput.addEventListener("input", () => {
          clearTimeout(t);
          t = setTimeout(render, 80);
        });
      }

      metricSel.addEventListener("change", render);
      releaseYearSel.addEventListener("change", render);
      seriesSel.addEventListener("change", render);
      minDiffSel.addEventListener("change", render);

      clearBtn.addEventListener("click", () => {
        if (searchInput) searchInput.value = "";
        metricSel.value = "diffDesc";
        releaseYearSel.value = "";
        seriesSel.value = "";
        minDiffSel.value = "0";
        render();
      });

      render();
    }

    main();
  </script>

  <!-- 共通JS（ヘッダー/フッター注入 + Active Nav） -->
  <script src="./assets/common.js"></script>
</body>

</html>
