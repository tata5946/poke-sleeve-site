<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>人気スリーブランキング｜ポケスリ相場ナビ</title>
  <meta name="description" content="アクセス数ベースで人気スリーブをランキング表示します。" />
  <meta property="og:title" content="人気スリーブランキング｜ポケスリ相場ナビ" />
  <meta property="og:description" content="アクセス数ベースで人気スリーブをランキング表示します。" />
  <meta property="og:image" content="https://pokesuri-navi.com/assets/favicon.svg" />
  <meta property="og:url" content="https://pokesuri-navi.com/access-ranking.html" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/site.css" />
  <style>
    body {
      background: #f5f7fb;
    }

    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin: 0 0 12px;
      font-size: 12px;
      color: var(--muted);
    }

    .breadcrumb a {
      color: #1e5bd7;
      text-decoration: none;
      font-weight: 800;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .breadcrumb-sep {
      color: #98a2b3;
    }

    .breadcrumb-current {
      color: #344054;
      font-weight: 800;
    }

    .ranking-page-top {
      display: grid;
      gap: 16px;
      margin-bottom: 20px;
    }

    .ranking-header-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 24px;
      background: #fff;
      border: 1px solid #e6eaf2;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .06);
    }

    .ranking-page-title {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -.02em;
      color: #0f172a;
      font-weight: 900;
    }

    .ranking-page-desc {
      margin: 10px 0 0;
      font-size: 14px;
      line-height: 1.6;
      color: #475467;
      font-weight: 700;
    }

    .ranking-status {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .ranking-status-card {
      min-width: 144px;
      padding: 12px 14px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid #e7ebf3;
    }

    .ranking-status-label {
      display: block;
      font-size: 11px;
      line-height: 1.3;
      color: #667085;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .ranking-status-value {
      display: block;
      font-size: 15px;
      line-height: 1.35;
      color: #101828;
      font-weight: 900;
    }

    .ranking-list {
      display: grid;
      gap: 12px;
    }

    .ranking-top3 {
      display: grid;
      gap: 14px;
      grid-template-columns: minmax(0, 1.7fr) minmax(240px, .85fr) minmax(240px, .85fr);
      align-items: stretch;
      margin-bottom: 18px;
    }

    .ranking-top3 > div {
      display: flex;
    }

    .ranking-top3 > div > .podium-card {
      width: 100%;
    }

    .ranking-top3[hidden] {
      display: none;
    }

    .podium-card {
      display: grid;
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid #f0dca7;
      box-shadow: 0 12px 28px rgba(15, 23, 42, .10);
      background: linear-gradient(180deg, #fff7de 0%, #fffdf8 100%);
      padding: 12px;
      height: 100%;
    }

    .podium-card--rank1 {
      display: grid;
      grid-template-columns: minmax(220px, 360px) minmax(0, 1fr);
      align-items: center;
      gap: 14px;
      padding: 14px;
      background:
        radial-gradient(circle at top right, rgba(255, 214, 102, .28), transparent 32%),
        linear-gradient(145deg, #fff4cd 0%, #fff9ea 44%, #fffdf8 100%);
    }

    .podium-card--rank2 { background: linear-gradient(180deg, #f8fbff 0%, #ffffff 100%); }
    .podium-card--rank3 { background: linear-gradient(180deg, #fffaf5 0%, #ffffff 100%); }
    .podium-badge { position:absolute; top:12px; left:12px; z-index:2; display:inline-flex; align-items:center; gap:6px; padding:8px 10px; border-radius:999px; background:rgba(17,24,39,.84); color:#fff; font-size:12px; font-weight:900; }
    .podium-media { display:block; border-radius:16px; overflow:hidden; background:rgba(255,255,255,.84); box-shadow: inset 0 0 0 1px rgba(15,23,42,.04); padding:10px; }
    .podium-media img { width:100%; object-fit:contain; object-position:center; display:block; background:#f4f6fa; }
    .podium-card--rank1 .podium-media img { height:280px; }
    .podium-card:not(.podium-card--rank1) .podium-media img { height:150px; }
    .podium-content { display:grid; gap:8px; margin-top:10px; }
    .podium-card--rank1 .podium-content { margin-top:0; }
    .podium-kicker { display:inline-flex; align-items:center; gap:8px; font-size:11px; font-weight:900; letter-spacing:.05em; color:#7a5b00; text-transform:uppercase; }
    .podium-card:not(.podium-card--rank1) .podium-kicker { color:#52606d; }
    .podium-title { margin:0; font-size:20px; line-height:1.3; font-weight:900; color:#101828; }
    .podium-card:not(.podium-card--rank1) .podium-title { font-size:16px; }
    .podium-metrics { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .podium-metric { padding:10px; border-radius:14px; background:rgba(255,255,255,.78); border:1px solid rgba(255,255,255,.72); }
    .podium-metric-label { display:block; font-size:11px; color:#667085; font-weight:800; margin-bottom:4px; }
    .podium-price { font-size:24px; font-weight:900; line-height:1.1; color:#111827; }
    .podium-card:not(.podium-card--rank1) .podium-price { font-size:18px; }
    .podium-meta { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .podium-chip-group { display:flex; flex-wrap:wrap; gap:6px; }
    .podium-chip { display:inline-flex; align-items:center; min-height:24px; padding:0 8px; border-radius:999px; font-size:10px; font-weight:900; background:rgba(255,255,255,.82); border:1px solid rgba(16,24,40,.08); color:#344054; }
    .podium-actions { display:flex; align-items:center; justify-content:flex-start; }
    .podium-actions .btn { margin-top:0; }

    .ranking-item {
      display: grid;
      grid-template-columns: 72px 140px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
    }

    .ranking-item .thumb-link {
      width: 140px;
    }

    .ranking-item .thumb {
      height: 96px;
      width: 140px;
    }

    .rank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 60px;
      padding: 10px 12px;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
    }

    .count {
      font-size: 16px;
      font-weight: 900;
      color: #111;
      white-space: nowrap;
    }

    .ranking-main {
      display: grid;
      gap: 12px;
    }

    @media (max-width: 760px) {
      .ranking-header-card {
        grid-template-columns: 1fr;
        padding: 20px;
      }

      .ranking-status {
        justify-content: flex-start;
      }

      .ranking-status-card {
        min-width: 0;
        flex: 1 1 140px;
      }

      .ranking-top3 { grid-template-columns: 1fr; }
      .podium-card--rank1 { grid-template-columns: 1fr; }

      .ranking-item {
        grid-template-columns: 64px 1fr;
      }

      .ranking-item .thumb-link,
      .ranking-item .thumb {
        width: 100%;
      }

      .ranking-item .thumb {
        height: 180px;
      }

      .count {
        grid-column: 2;
      }
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <div class="container">
    <nav class="breadcrumb" aria-label="パンくず">
      <a href="./index.html">ホーム</a>
      <span class="breadcrumb-sep" aria-hidden="true">></span>
      <span class="breadcrumb-current" aria-current="page">人気スリーブランキング</span>
    </nav>
    <div class="ranking-page-top">
      <section class="ranking-header-card" aria-label="ページヘッダー">
        <div>
          <h1 class="ranking-page-title">人気スリーブランキング</h1>
          <p class="ranking-page-desc">アクセスログをもとに、今よく見られているスリーブを一覧で確認できます。</p>
        </div>
        <div class="ranking-status" aria-label="集計状況">
          <div class="ranking-status-card">
            <span class="ranking-status-label">集計方式</span>
            <span class="ranking-status-value">アクセスログ</span>
          </div>
          <div class="ranking-status-card">
            <span class="ranking-status-label">表示件数</span>
            <span id="countInfo" class="ranking-status-value">集計中</span>
          </div>
        </div>
      </section>
    </div>

    <div class="ranking-main">
      <div id="error" class="error"></div>
      <section id="top3" class="ranking-top3" aria-label="ランキング上位3件" hidden>
        <div id="top1"></div>
        <div id="top2"></div>
        <div id="top3Card"></div>
      </section>
      <div id="list" class="ranking-list"></div>
    </div>

    <div id="site-footer"></div>
  </div>

  <script src="./assets/common.js"></script>
  <script>
    const ACCESS_RANKING_CACHE_KEY = "access-ranking-cache-v1";
    const ACCESS_RANKING_CACHE_TTL_MS = 5 * 60 * 1000;

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "block";
      el.textContent = msg;
    }

    function hideError() {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "none";
      el.textContent = "";
    }

    async function fetchRanking() {
      const baseUrl = (window.common && window.common.GAS_URL) || window.GAS_URL || "";
      if (!baseUrl) throw new Error("GAS_URL が未設定です。assets/common.js を確認してください。");

      try {
        const raw = sessionStorage.getItem(ACCESS_RANKING_CACHE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Number.isFinite(parsed.cachedAt) && (Date.now() - parsed.cachedAt) <= ACCESS_RANKING_CACHE_TTL_MS) {
            return parsed.data;
          }
        }
      } catch (_) { }

      const url = baseUrl + "?mode=ranking";
      const res = await fetch(url, {
        cache: "default",
        headers: { "Accept": "application/json" }
      });
      if (!res.ok) throw new Error(`ランキング取得に失敗しました（HTTP ${res.status}）`);
      const data = await res.json();

      try {
        sessionStorage.setItem(ACCESS_RANKING_CACHE_KEY, JSON.stringify({
          cachedAt: Date.now(),
          data
        }));
      } catch (_) { }

      return data;
    }

    function buildSleeveMap(data) {
      const sleeves = Array.isArray(data && data.sleeves) ? data.sleeves : [];
      return new Map(sleeves.map((s) => [String(s.id || ""), s]));
    }

    function toISODate(d) {
      const dd = new Date(d);
      if (Number.isNaN(dd.getTime())) return null;
      const y = dd.getFullYear();
      const m = String(dd.getMonth() + 1).padStart(2, "0");
      const day = String(dd.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function numOrNull(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function getWeeklyPair(sleeve) {
      const arr = Array.isArray(sleeve && sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      if (!arr.length) return null;
      const map = new Map();
      for (const x of arr) {
        const week = toISODate(x.week);
        const price = numOrNull(x.price);
        const count = numOrNull(x.count);
        if (!week || !(price > 0)) continue;
        if (count != null && count <= 0) continue;
        map.set(week, { week, price, count });
      }
      if (!map.size) return null;
      const sorted = Array.from(map.values()).sort((a,b) => a.week.localeCompare(b.week));
      return { latest: sorted[sorted.length - 1] };
    }

    function getMarketRange(sleeve) {
      const arr = Array.isArray(sleeve && sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      const prices = arr.map((x) => numOrNull(x && x.price)).filter((v) => Number.isFinite(v) && v > 0);
      if (!prices.length) return { min: null, max: null };
      return { min: Math.min(...prices), max: Math.max(...prices) };
    }

    function getTagLabels(sleeve) {
      const candidates = [];
      if (typeof sleeve?.series === "string") candidates.push(sleeve.series);
      if (typeof sleeve?.condition === "string") candidates.push(sleeve.condition);
      if (typeof sleeve?.releaseYear === "number" || typeof sleeve?.releaseYear === "string") candidates.push(`${sleeve.releaseYear}`);
      return candidates.filter(Boolean).slice(0, 3).map((tag) => tag.startsWith("#") ? tag : `#${tag}`);
    }

    function getPodiumBadge(rank) {
      if (rank === 1) return "🥇 1位";
      if (rank === 2) return "🥈 2位";
      return "🥉 3位";
    }

    function buildPodiumCard(row, rank) {
      const accessText = `${row.access.toLocaleString()}アクセス`;
      const latestPriceText = row.latestPrice == null ? "—" : `${row.latestPrice.toLocaleString()}円`;
      const minText = row.range.min == null ? "—" : `${row.range.min.toLocaleString()}円`;
      const maxText = row.range.max == null ? "—" : `${row.range.max.toLocaleString()}円`;
      const tagHtml = row.tags.map((tag) => `<span class="podium-chip">${escapeHtml(tag)}</span>`).join("");
      return `
        <article class="podium-card podium-card--rank${rank}">
          <div class="podium-badge">${getPodiumBadge(rank)}</div>
          <a class="podium-media" data-sleeve-link="1" href="${row.detailHref}">
            <img src="${escapeHtml(row.imageUrl)}" alt="${escapeHtml(row.name)}" loading="${rank === 1 ? "eager" : "lazy"}" referrerpolicy="no-referrer"
              onerror="this.onerror=null; this.style.display='none';">
          </a>
          <div class="podium-content">
            <div class="podium-kicker">TOP ${rank} SLEEVE</div>
            <h${rank === 1 ? "2" : "3"} class="podium-title">${escapeHtml(row.name)}</h${rank === 1 ? "2" : "3"}>
            <div class="podium-metrics">
              <div class="podium-metric">
                <span class="podium-metric-label">アクセス数</span>
                <div class="podium-price">${accessText}</div>
              </div>
              <div class="podium-metric">
                <span class="podium-metric-label">最新価格</span>
                <div class="podium-price">${latestPriceText}</div>
              </div>
              <div class="podium-metric">
                <span class="podium-metric-label">最安値</span>
                <div class="podium-price">${minText}</div>
              </div>
              <div class="podium-metric">
                <span class="podium-metric-label">最高値</span>
                <div class="podium-price">${maxText}</div>
              </div>
            </div>
            <div class="podium-meta">
              <div class="podium-chip-group">${tagHtml}</div>
              <span class="podium-chip">ID ${escapeHtml(row.id)}</span>
            </div>
            <div class="podium-actions">
              <a class="btn" data-sleeve-link="1" href="${row.detailHref}">価格推移を見る →</a>
            </div>
          </div>
        </article>
      `;
    }

    function renderRanking(list, sleeveMap) {
      const root = document.getElementById("list");
      const top3 = document.getElementById("top3");
      const top1 = document.getElementById("top1");
      const top2 = document.getElementById("top2");
      const top3Card = document.getElementById("top3Card");
      if (!root) return;

      if (!list.length) {
        root.innerHTML = '<div class="card"><div class="title">データなし</div><div class="meta">ランキングデータがありません。</div></div>';
        return;
      }

      root.innerHTML = "";
      if (top1) top1.innerHTML = "";
      if (top2) top2.innerHTML = "";
      if (top3Card) top3Card.innerHTML = "";
      if (top3) top3.hidden = true;

      const rows = [];
      list.forEach((item, index) => {
        const id = String(item && item.id || "");
        const access = Number(item && item.access);
        const sleeve = sleeveMap.get(id);
        const name = sleeve && sleeve.name ? sleeve.name : `ID: ${id}`;
        const imageUrl = sleeve && sleeve.imageUrl ? String(sleeve.imageUrl) : "";
        const detailHref = (window.common && typeof window.common.buildSleeveDetailHref === "function")
          ? window.common.buildSleeveDetailHref(id)
          : `./sleeve/${encodeURIComponent(id)}/`;
        const pair = getWeeklyPair(sleeve || {});
        const latestPrice = pair && pair.latest ? pair.latest.price : null;
        const range = getMarketRange(sleeve || {});
        const tags = getTagLabels(sleeve || {});

        rows.push({ id, access: Number.isFinite(access) ? access : 0, name, imageUrl, detailHref, latestPrice, range, tags });

        if (index < 3) return;
        const div = document.createElement("div");
        div.className = "card ranking-item";
        div.innerHTML = `
          <div class="rank">${index + 1}位</div>
          ${imageUrl
            ? `<a class="thumb-link" data-sleeve-link="1" href="${detailHref}" aria-label="${escapeHtml(name)}の詳細を見る">
                 <img class="thumb" src="${escapeHtml(imageUrl)}" alt="${escapeHtml(name)}" loading="lazy" referrerpolicy="no-referrer"
                   onerror="this.onerror=null; this.style.display='none';">
               </a>`
            : `<a class="thumb-link" data-sleeve-link="1" href="${detailHref}" aria-label="${escapeHtml(name)}の詳細を見る"><div class="thumb"></div></a>`}
          <div>
            <div class="title"><a data-sleeve-link="1" href="${detailHref}">${escapeHtml(name)}</a></div>
            <div class="meta">スリーブID: ${escapeHtml(id)}</div>
          </div>
          <div class="count">${Number.isFinite(access) ? access.toLocaleString() : 0}アクセス</div>
        `;
        root.appendChild(div);
      });

      if (rows.length && top3) {
        top3.hidden = false;
        if (rows[0]) top1.innerHTML = buildPodiumCard(rows[0], 1);
        if (rows[1]) top2.innerHTML = buildPodiumCard(rows[1], 2);
        if (rows[2]) top3Card.innerHTML = buildPodiumCard(rows[2], 3);
      }
    }

    async function main() {
      try {
        const [rankingData, masterData] = await Promise.all([
          fetchRanking(),
          window.common.loadData()
        ]);

        const ranking = Array.isArray(rankingData && rankingData.ranking) ? rankingData.ranking : [];
        const sleeveMap = buildSleeveMap(masterData);
        renderRanking(ranking, sleeveMap);

        const countInfo = document.getElementById("countInfo");
        if (countInfo) {
          countInfo.textContent = `${ranking.length}件`;
        }

        hideError();
      } catch (err) {
        showError(err && err.message ? err.message : "ランキングの読み込みに失敗しました。");
      }
    }

    main();
  </script>
</body>

</html>
