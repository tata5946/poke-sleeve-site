<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>人気スリーブランキング｜ポケスリ相場ナビ</title>
  <meta name="description" content="アクセス数ベースで人気スリーブをランキング表示します。" />
  <meta property="og:title" content="人気スリーブランキング｜ポケスリ相場ナビ" />
  <meta property="og:description" content="アクセス数ベースで人気スリーブをランキング表示します。" />
  <meta property="og:image" content="https://pokesuri-navi.com/assets/favicon.svg" />
  <meta property="og:url" content="https://pokesuri-navi.com/access-ranking.html" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/site.css" />
  <style>
    body {
      background: #f5f7fb;
    }

    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin: 0 0 12px;
      font-size: 12px;
      color: var(--muted);
    }

    .breadcrumb a {
      color: #1e5bd7;
      text-decoration: none;
      font-weight: 800;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .breadcrumb-sep {
      color: #98a2b3;
    }

    .breadcrumb-current {
      color: #344054;
      font-weight: 800;
    }

    .ranking-page-top {
      display: grid;
      gap: 16px;
      margin-bottom: 20px;
    }

    .ranking-header-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 24px;
      background: #fff;
      border: 1px solid #e6eaf2;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .06);
    }

    .ranking-page-title {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -.02em;
      color: #0f172a;
      font-weight: 900;
    }

    .ranking-page-desc {
      margin: 10px 0 0;
      font-size: 14px;
      line-height: 1.6;
      color: #475467;
      font-weight: 700;
    }

    .ranking-status {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .ranking-status-card {
      min-width: 144px;
      padding: 12px 14px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid #e7ebf3;
    }

    .ranking-status-label {
      display: block;
      font-size: 11px;
      line-height: 1.3;
      color: #667085;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .ranking-status-value {
      display: block;
      font-size: 15px;
      line-height: 1.35;
      color: #101828;
      font-weight: 900;
    }

    .ranking-list {
      display: grid;
      gap: 12px;
    }

    .ranking-item {
      display: grid;
      grid-template-columns: 72px 140px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
    }

    .ranking-item .thumb-link {
      width: 140px;
    }

    .ranking-item .thumb {
      height: 96px;
      width: 140px;
    }

    .rank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 60px;
      padding: 10px 12px;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
    }

    .count {
      font-size: 16px;
      font-weight: 900;
      color: #111;
      white-space: nowrap;
    }

    .ranking-main {
      display: grid;
      gap: 12px;
    }

    @media (max-width: 760px) {
      .ranking-header-card {
        grid-template-columns: 1fr;
        padding: 20px;
      }

      .ranking-status {
        justify-content: flex-start;
      }

      .ranking-status-card {
        min-width: 0;
        flex: 1 1 140px;
      }

      .ranking-item {
        grid-template-columns: 64px 1fr;
      }

      .ranking-item .thumb-link,
      .ranking-item .thumb {
        width: 100%;
      }

      .ranking-item .thumb {
        height: 180px;
      }

      .count {
        grid-column: 2;
      }
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <div class="container">
    <nav class="breadcrumb" aria-label="パンくず">
      <a href="./index.html">ホーム</a>
      <span class="breadcrumb-sep" aria-hidden="true">></span>
      <span class="breadcrumb-current" aria-current="page">人気スリーブランキング</span>
    </nav>
    <div class="ranking-page-top">
      <section class="ranking-header-card" aria-label="ページヘッダー">
        <div>
          <h1 class="ranking-page-title">人気スリーブランキング</h1>
          <p class="ranking-page-desc">アクセスログをもとに、今よく見られているスリーブを一覧で確認できます。</p>
        </div>
        <div class="ranking-status" aria-label="集計状況">
          <div class="ranking-status-card">
            <span class="ranking-status-label">集計方式</span>
            <span class="ranking-status-value">アクセスログ</span>
          </div>
          <div class="ranking-status-card">
            <span class="ranking-status-label">表示件数</span>
            <span id="countInfo" class="ranking-status-value">集計中</span>
          </div>
        </div>
      </section>
    </div>

    <div class="ranking-main">
      <div id="error" class="error"></div>
      <div id="list" class="ranking-list"></div>
    </div>

    <div id="site-footer"></div>
  </div>

  <script src="./assets/common.js"></script>
  <script>
    const ACCESS_RANKING_CACHE_KEY = "access-ranking-cache-v1";
    const ACCESS_RANKING_CACHE_TTL_MS = 5 * 60 * 1000;

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "block";
      el.textContent = msg;
    }

    function hideError() {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "none";
      el.textContent = "";
    }

    async function fetchRanking() {
      const baseUrl = (window.common && window.common.GAS_URL) || window.GAS_URL || "";
      if (!baseUrl) throw new Error("GAS_URL が未設定です。assets/common.js を確認してください。");

      try {
        const raw = sessionStorage.getItem(ACCESS_RANKING_CACHE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Number.isFinite(parsed.cachedAt) && (Date.now() - parsed.cachedAt) <= ACCESS_RANKING_CACHE_TTL_MS) {
            return parsed.data;
          }
        }
      } catch (_) { }

      const url = baseUrl + "?mode=ranking";
      const res = await fetch(url, {
        cache: "default",
        headers: { "Accept": "application/json" }
      });
      if (!res.ok) throw new Error(`ランキング取得に失敗しました（HTTP ${res.status}）`);
      const data = await res.json();

      try {
        sessionStorage.setItem(ACCESS_RANKING_CACHE_KEY, JSON.stringify({
          cachedAt: Date.now(),
          data
        }));
      } catch (_) { }

      return data;
    }

    function buildSleeveMap(data) {
      const sleeves = Array.isArray(data && data.sleeves) ? data.sleeves : [];
      return new Map(sleeves.map((s) => [String(s.id || ""), s]));
    }

    function renderRanking(list, sleeveMap) {
      const root = document.getElementById("list");
      if (!root) return;

      if (!list.length) {
        root.innerHTML = '<div class="card"><div class="title">データなし</div><div class="meta">ランキングデータがありません。</div></div>';
        return;
      }

      root.innerHTML = "";
      list.forEach((item, index) => {
        const id = String(item && item.id || "");
        const access = Number(item && item.access);
        const sleeve = sleeveMap.get(id);
        const name = sleeve && sleeve.name ? sleeve.name : `ID: ${id}`;
        const imageUrl = sleeve && sleeve.imageUrl ? String(sleeve.imageUrl) : "";
        const detailHref = (window.common && typeof window.common.buildSleeveDetailHref === "function")
          ? window.common.buildSleeveDetailHref(id)
          : `./sleeve/${encodeURIComponent(id)}/`;

        const div = document.createElement("div");
        div.className = "card ranking-item";
        div.innerHTML = `
          <div class="rank">${index + 1}位</div>
          ${imageUrl
            ? `<a class="thumb-link" data-sleeve-link="1" href="${detailHref}" aria-label="${escapeHtml(name)}の詳細を見る">
                 <img class="thumb" src="${escapeHtml(imageUrl)}" alt="${escapeHtml(name)}" loading="lazy" referrerpolicy="no-referrer"
                   onerror="this.onerror=null; this.style.display='none';">
               </a>`
            : `<a class="thumb-link" data-sleeve-link="1" href="${detailHref}" aria-label="${escapeHtml(name)}の詳細を見る"><div class="thumb"></div></a>`}
          <div>
            <div class="title"><a data-sleeve-link="1" href="${detailHref}">${escapeHtml(name)}</a></div>
            <div class="meta">スリーブID: ${escapeHtml(id)}</div>
          </div>
          <div class="count">${Number.isFinite(access) ? access.toLocaleString() : 0}アクセス</div>
        `;
        root.appendChild(div);
      });
    }

    async function main() {
      try {
        const [rankingData, masterData] = await Promise.all([
          fetchRanking(),
          window.common.loadData()
        ]);

        const ranking = Array.isArray(rankingData && rankingData.ranking) ? rankingData.ranking : [];
        const sleeveMap = buildSleeveMap(masterData);
        renderRanking(ranking, sleeveMap);

        const countInfo = document.getElementById("countInfo");
        if (countInfo) {
          countInfo.textContent = `${ranking.length}件`;
        }

        hideError();
      } catch (err) {
        showError(err && err.message ? err.message : "ランキングの読み込みに失敗しました。");
      }
    }

    main();
  </script>
</body>

</html>
