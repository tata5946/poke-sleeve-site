  <script>
    const ACCESS_RANKING_CACHE_KEY = "access-ranking-cache-v2";
    const ACCESS_RANKING_CACHE_TTL_MS = 5 * 60 * 1000;

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "block";
      el.textContent = msg;
    }

    function hideError() {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "none";
      el.textContent = "";
    }

    function uniq(arr) {
      const set = new Set();
      for (const value of arr) {
        const text = value == null ? "" : String(value).trim();
        if (text) set.add(text);
      }
      return Array.from(set);
    }

    function parseBand(v) {
      if (!v) return null;
      const [a, b] = v.split("-").map(Number);
      if (!Number.isFinite(a) || !Number.isFinite(b)) return null;
      return { min: a, max: b };
    }

    function normalizeSleeveDataId(id) {
      const sleeveId = String(id || "").trim();
      if (/^4521329\d{6,7}$/.test(sleeveId)) return sleeveId.slice(7);
      return sleeveId;
    }

    function getSleeveIdFromRankingItem(item) {
      const direct = item?.sleeveId ?? item?.sleeve_id ?? item?.id ?? item?.itemId ?? item?.item_id;
      const directId = normalizeSleeveDataId(direct);
      if (directId) return directId;

      const source = String(item?.page || item?.url || item?.path || item?.href || "").trim();
      if (!source) return "";
      try {
        const url = source.startsWith("http") ? new URL(source) : new URL(source, location.origin);
        const segments = url.pathname.split("/").filter(Boolean);
        const sleeveIndex = segments.findIndex((segment) => segment === "sleeve");
        if (sleeveIndex >= 0 && sleeveIndex < segments.length - 1) {
          return normalizeSleeveDataId(decodeURIComponent(segments[sleeveIndex + 1] || ""));
        }
        const queryId = url.searchParams.get("id") || url.searchParams.get("sleeveId");
        return normalizeSleeveDataId(queryId);
      } catch (_) {
        const match = source.match(/(?:^|\/)sleeve\/([^/?#]+)/);
        return match ? normalizeSleeveDataId(decodeURIComponent(match[1])) : "";
      }
    }

    function getAccessCountFromRankingItem(item) {
      const value = item?.access ?? item?.count ?? item?.views ?? item?.pv ?? item?.pageviews ?? item?.accessCount ?? item?.access_count;
      const n = Number(value);
      return Number.isFinite(n) && n > 0 ? n : 0;
    }

    function normalizeAccessRankingResponse(data) {
      const source = Array.isArray(data?.ranking)
        ? data.ranking
        : Array.isArray(data?.rows)
          ? data.rows
          : Array.isArray(data?.items)
            ? data.items
            : Array.isArray(data)
              ? data
              : [];
      const byId = new Map();
      for (const item of source) {
        const id = getSleeveIdFromRankingItem(item);
        if (!id) continue;
        const access = getAccessCountFromRankingItem(item);
        if (access <= 0) continue;
        const prev = byId.get(id) || 0;
        byId.set(id, prev + access);
      }
      return Array.from(byId.entries()).map(([id, access]) => ({ id, access }));
    }

    async function fetchRanking() {
      const baseUrl = (window.common && window.common.GAS_URL) || window.GAS_URL || "";
      if (!baseUrl) throw new Error("GAS_URL が未設定です。assets/common.js を確認してください。");

      try {
        const raw = sessionStorage.getItem(ACCESS_RANKING_CACHE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Number.isFinite(parsed.cachedAt) && (Date.now() - parsed.cachedAt) <= ACCESS_RANKING_CACHE_TTL_MS) {
            return normalizeAccessRankingResponse(parsed.data);
          }
        }
      } catch (_) { }

      const url = baseUrl + "?mode=ranking";
      const res = await fetch(url, {
        cache: "no-store",
        headers: { "Accept": "application/json" }
      });
      if (!res.ok) throw new Error(`ランキング取得に失敗しました（HTTP ${res.status}）`);
      const data = await res.json();

      try {
        sessionStorage.setItem(ACCESS_RANKING_CACHE_KEY, JSON.stringify({
          cachedAt: Date.now(),
          data
        }));
      } catch (_) { }

      return normalizeAccessRankingResponse(data);
    }

    function buildSleeveMap(data) {
      const sleeves = Array.isArray(data && data.sleeves) ? data.sleeves : [];
      return new Map(sleeves.map((s) => [String(s.id || ""), s]));
    }

    function toISODate(d) {
      const dd = new Date(d);
      if (Number.isNaN(dd.getTime())) return null;
      const y = dd.getFullYear();
      const m = String(dd.getMonth() + 1).padStart(2, "0");
      const day = String(dd.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function numOrNull(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function getWeeklyPair(sleeve) {
      const arr = Array.isArray(sleeve && sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      if (!arr.length) return null;
      const map = new Map();
      for (const x of arr) {
        const week = toISODate(x.week);
        const price = numOrNull(x.price);
        const count = numOrNull(x.count);
        if (!week || !(price > 0)) continue;
        if (count != null && count <= 0) continue;
        map.set(week, { week, price, count });
      }
      if (!map.size) return null;
      const sorted = Array.from(map.values()).sort((a,b) => a.week.localeCompare(b.week));
      return { latest: sorted[sorted.length - 1] };
    }

    function getSparklinePoints(sleeve, maxItems = 8) {
      const arr = Array.isArray(sleeve && sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      const map = new Map();
      for (const x of arr) {
        const week = toISODate(x.week);
        const price = numOrNull(x.price);
        const count = numOrNull(x.count);
        if (!week || !(price > 0)) continue;
        if (count != null && count <= 0) continue;
        map.set(week, { week, price });
      }
      return Array.from(map.values())
        .sort((a, b) => a.week.localeCompare(b.week))
        .slice(-maxItems)
        .map((x) => x.price);
    }

    function buildSparklineSvg(sleeve) {
      const prices = getSparklinePoints(sleeve);
      if (prices.length < 2) {
        return `<div class="sleeve-sparkline sleeve-sparkline--empty" aria-label="価格推移データなし"><span class="sleeve-sparkline-empty">推移なし</span></div>`;
      }

      const width = 86;
      const height = 36;
      const padX = 5;
      const padY = 5;
      const min = Math.min(...prices);
      const max = Math.max(...prices);
      const range = max - min;
      const step = (width - padX * 2) / Math.max(1, prices.length - 1);
      const points = prices.map((price, index) => {
        const x = padX + step * index;
        const y = range === 0
          ? height / 2
          : height - padY - ((price - min) / range) * (height - padY * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      const linePoints = points.join(" ");
      const firstX = padX.toFixed(1);
      const lastX = (padX + step * (prices.length - 1)).toFixed(1);
      const areaPoints = `${firstX},${height - padY} ${linePoints} ${lastX},${height - padY}`;

      return `
        <div class="sleeve-sparkline" aria-label="直近${prices.length}週の価格推移">
          <svg viewBox="0 0 ${width} ${height}" focusable="false" aria-hidden="true" preserveAspectRatio="none">
            <line class="sleeve-sparkline-grid" x1="5" y1="${height - padY}" x2="${width - padX}" y2="${height - padY}"></line>
            <polygon class="sleeve-sparkline-area" points="${areaPoints}"></polygon>
            <polyline class="sleeve-sparkline-line" points="${linePoints}"></polyline>
          </svg>
        </div>
      `;
    }

    function getMarketRange(sleeve) {
      const arr = Array.isArray(sleeve && sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      const prices = arr.map((x) => numOrNull(x && x.price)).filter((v) => Number.isFinite(v) && v > 0);
      if (!prices.length) return { min: null, max: null };
      return { min: Math.min(...prices), max: Math.max(...prices) };
    }

    function getTagLabels(sleeve) {
      const candidates = [];
      if (typeof sleeve?.series === "string") candidates.push(sleeve.series);
      if (typeof sleeve?.condition === "string") candidates.push(sleeve.condition);
      return candidates.filter(Boolean).slice(0, 2).map((tag) => tag.startsWith("#") ? tag : `#${tag}`);
    }

    function getPodiumBadge(rank) {
      if (rank === 1) return "🥇 1位";
      if (rank === 2) return "🥈 2位";
      return "🥉 3位";
    }

    function buildPodiumCard(row, rank) {
      const latestPriceText = row.latestPrice == null ? "—" : `${row.latestPrice.toLocaleString()}円`;
      const minText = row.range.min == null ? "—" : `${row.range.min.toLocaleString()}円`;
      const maxText = row.range.max == null ? "—" : `${row.range.max.toLocaleString()}円`;
      const tagHtml = row.tags.map((tag) => `<span class="podium-chip">${escapeHtml(tag)}</span>`).join("");
      const sparklineHtml = buildSparklineSvg(row.sleeve || {});
      return `
        <a class="podium-card podium-card--rank${rank}" data-sleeve-link="1" href="${row.detailHref}" aria-label="${escapeHtml(String(row.name ?? ""))}の詳細を見る">
          <div class="podium-badge">${getPodiumBadge(rank)}</div>
          <div class="podium-media">
            <img src="${escapeHtml(row.imageUrl)}" alt="${escapeHtml(row.name)}" loading="${rank === 1 ? "eager" : "lazy"}" referrerpolicy="no-referrer"
              onerror="this.onerror=null; this.style.display='none';">
          </div>
          <div class="podium-content">
            <div class="podium-kicker">TOP ${rank} SLEEVE</div>
            <h${rank === 1 ? "2" : "3"} class="podium-title">${escapeHtml(row.name)}</h${rank === 1 ? "2" : "3"}>
            <div class="podium-metrics">
              <div class="podium-metric">
                <span class="podium-metric-label">最新価格</span>
                <div class="podium-price">${latestPriceText}</div>
              </div>
              <div class="podium-metric">
                <span class="podium-metric-label">最安値</span>
                <div class="podium-price">${minText}</div>
              </div>
              <div class="podium-metric">
                <span class="podium-metric-label">最高値</span>
                <div class="podium-price">${maxText}</div>
              </div>
            </div>
            <div class="podium-market-row">
              ${sparklineHtml}
            </div>
            <div class="podium-meta">
              <div class="podium-chip-group">${tagHtml}</div>
              <span class="podium-chip">ID ${escapeHtml(row.id)}</span>
            </div>
            <div class="podium-actions">
              <span class="btn">価格推移を見る →</span>
            </div>
          </div>
        </a>
      `;
    }

    function renderActiveFilters(releaseYearSel, seriesSel, priceBandSel) {
      const activeFilters = document.getElementById("activeFilters");
      if (!activeFilters) return;
      const chips = [];
      if (releaseYearSel.value) chips.push({ key: "releaseYear", text: `発売年: ${releaseYearSel.value}` });
      if (seriesSel.value) chips.push({ key: "series", text: `シリーズ: ${seriesSel.value}` });
      if (priceBandSel.value) {
        const selected = priceBandSel.options[priceBandSel.selectedIndex];
        const label = selected ? selected.textContent.trim() : "";
        if (label) chips.push({ key: "priceBand", text: `価格帯: ${label}` });
      }
      activeFilters.innerHTML = chips.map((chip) =>
        `<button class="ranking-filter-chip" type="button" data-filter-key="${escapeHtml(chip.key)}" aria-label="${escapeHtml(chip.text)} を解除">
          <span>${escapeHtml(chip.text)}</span>
          <span class="ranking-filter-chip-remove" aria-hidden="true">×</span>
        </button>`
      ).join("");
      activeFilters.classList.toggle("is-visible", chips.length > 0);
    }

    function buildStandardCard(row, rank) {
      const tagsHtml = row.tags.map((tag) => `<span class="compact-tag">${escapeHtml(tag.replace(/^#/, ""))}</span>`).join("");
      const sparklineHtml = buildSparklineSvg(row.sleeve || {});
      return `
        <span class="compact-rank-badge">${rank}位</span>
        <span class="compact-thumb-wrap">
          ${row.imageUrl
            ? `<img class="compact-thumb" src="${escapeHtml(row.imageUrl)}" alt="${escapeHtml(row.name)}" loading="lazy" referrerpolicy="no-referrer"
                onerror="this.onerror=null; this.style.display='none';">`
            : ""}
        </span>
        <h3 class="compact-card-title">${escapeHtml(row.name)}</h3>
        <div class="compact-market-row">
          <div class="compact-price-row">
            <div class="compact-price">${row.latestPrice == null ? "価格なし" : `${row.latestPrice.toLocaleString()}円`}</div>
            <div class="compact-delta flat">最新価格</div>
          </div>
          ${sparklineHtml}
        </div>
        ${tagsHtml ? `<div class="compact-tags">${tagsHtml}</div>` : ""}
      `;
    }

    function renderRanking(list, sleeveMap, filters) {
      const root = document.getElementById("list");
      const top3 = document.getElementById("top3");
      const top1 = document.getElementById("top1");
      const top2 = document.getElementById("top2");
      const top3Card = document.getElementById("top3Card");
      const restSection = document.getElementById("restSection");
      const countInfo = document.getElementById("countInfo");
      if (!root) return;

      const releaseYear = filters.releaseYearSel.value;
      const series = filters.seriesSel.value;
      const band = parseBand(filters.priceBandSel.value);

      const rows = [];
      list.forEach((item) => {
        const id = String(item && item.id || "");
        const access = Number(item && item.access);
        const sleeve = sleeveMap.get(id);
        const name = sleeve && sleeve.name ? sleeve.name : `ID: ${id}`;
        const imageUrl = sleeve && sleeve.imageUrl ? String(sleeve.imageUrl) : "";
        const detailHref = (window.common && typeof window.common.buildSleeveDetailHref === "function")
          ? window.common.buildSleeveDetailHref(id)
          : `./sleeve/${encodeURIComponent(id)}/`;
        const pair = getWeeklyPair(sleeve || {});
        const latestPrice = pair && pair.latest ? pair.latest.price : null;
        const range = getMarketRange(sleeve || {});
        const tags = getTagLabels(sleeve || {});

        if (releaseYear && String(sleeve?.releaseYear ?? "") !== releaseYear) return;
        if (series && String(sleeve?.series ?? "") !== series) return;
        if (band) {
          if (latestPrice == null) return;
          if (latestPrice < band.min || latestPrice > band.max) return;
        }

        rows.push({ id, access: Number.isFinite(access) ? access : 0, name, imageUrl, detailHref, latestPrice, range, tags, sleeve: sleeve || {} });
      });

      rows.sort((a, b) => b.access - a.access || String(a.name).localeCompare(String(b.name)));

      renderActiveFilters(filters.releaseYearSel, filters.seriesSel, filters.priceBandSel);
      if (countInfo) countInfo.textContent = `${rows.length}件`;
      if (window.common && typeof window.common.updateItemListStructuredData === "function") {
        window.common.updateItemListStructuredData("accessRankingItemListStructuredData", rows, {
          name: "ポケカスリーブアクセスランキング",
          description: "ポケカスリーブのアクセスランキング一覧です。"
        });
      }

      if (!rows.length) {
        root.innerHTML = '<div class="card"><div class="title">データなし</div><div class="meta">ランキングデータがありません。</div></div>';
        if (top1) top1.innerHTML = "";
        if (top2) top2.innerHTML = "";
        if (top3Card) top3Card.innerHTML = "";
        if (top3) top3.hidden = true;
        if (restSection) restSection.hidden = false;
        return;
      }

      root.innerHTML = "";
      if (top1) top1.innerHTML = "";
      if (top2) top2.innerHTML = "";
      if (top3Card) top3Card.innerHTML = "";
      if (top3) top3.hidden = true;
      if (restSection) restSection.hidden = rows.length <= 3;

      rows.forEach((row, index) => {
        if (index < 3) return;
        const card = document.createElement("a");
        card.className = "compact-card";
        card.href = row.detailHref;
        card.setAttribute("data-sleeve-link", "1");
        card.setAttribute("aria-label", `${String(row.name ?? "")}の詳細を見る`);
        card.innerHTML = buildStandardCard(row, index + 1);
        root.appendChild(card);
      });

      if (rows.length && top3) {
        top3.hidden = false;
        if (rows[0]) top1.innerHTML = buildPodiumCard(rows[0], 1);
        if (rows[1]) top2.innerHTML = buildPodiumCard(rows[1], 2);
        if (rows[2]) top3Card.innerHTML = buildPodiumCard(rows[2], 3);
      }
    }

    async function main() {
      await window.common.setupDashboardChrome({ sidebarActive: "access-ranking", topbarActive: "market" });
      try {
        const releaseYearSel = document.getElementById("releaseYear");
        const seriesSel = document.getElementById("series");
        const priceBandSel = document.getElementById("priceBand");
        const clearBtn = document.getElementById("clear");
        const activeFilters = document.getElementById("activeFilters");
        const [rankingData, masterData] = await Promise.all([
          fetchRanking(),
          window.common.loadData()
        ]);

        const ranking = Array.isArray(rankingData) ? rankingData : normalizeAccessRankingResponse(rankingData);
        const sleeveMap = buildSleeveMap(masterData);
        const sleeves = Array.isArray(masterData && masterData.sleeves) ? masterData.sleeves : [];
        const releaseYears = uniq(sleeves.map((s) => s.releaseYear)).map(Number).filter(Number.isFinite).sort((a, b) => a - b);
        const seriesList = uniq(sleeves.map((s) => s.series)).sort();

        for (const y of releaseYears) {
          const opt = document.createElement("option");
          opt.value = String(y);
          opt.textContent = String(y);
          releaseYearSel.appendChild(opt);
        }
        for (const series of seriesList) {
          const opt = document.createElement("option");
          opt.value = series;
          opt.textContent = series;
          seriesSel.appendChild(opt);
        }

        const render = () => renderRanking(ranking, sleeveMap, { releaseYearSel, seriesSel, priceBandSel });
        render();

        releaseYearSel.addEventListener("change", render);
        seriesSel.addEventListener("change", render);
        priceBandSel.addEventListener("change", render);
        clearBtn.addEventListener("click", () => {
          releaseYearSel.value = "";
          seriesSel.value = "";
          priceBandSel.value = "";
          render();
        });
        if (activeFilters) {
          activeFilters.addEventListener("click", (event) => {
            const button = event.target.closest("[data-filter-key]");
            if (!button) return;
            const key = button.getAttribute("data-filter-key");
            if (key === "releaseYear") releaseYearSel.value = "";
            if (key === "series") seriesSel.value = "";
            if (key === "priceBand") priceBandSel.value = "";
            render();
          });
        }

        hideError();
      } catch (err) {
        showError(err && err.message ? err.message : "ランキングの読み込みに失敗しました。");
      }
    }

    main();
  </script>
</body>

</html>
