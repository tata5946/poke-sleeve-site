<!DOCTYPE html>
<html lang="ja">

<head>

  <meta property="og:title" content="ポケカスリーブ図鑑一覧 | ポケスリ相場ナビ" />
  <meta property="og:description" content="ポケカスリーブの図鑑ページ。検索・絞り込みでスリーブを一覧比較できます。" />

  <style>
    body {
      background: #f5f7fb;
    }

    .ranking-page-top {
      display: grid;
      gap: 16px;
      margin-bottom: 20px;
    }

    .ranking-header-card,
    .ranking-filter-card {
      background: #fff;
      border: 1px solid #e6eaf2;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .06);
    }

    .ranking-header-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 24px;
    }

    .ranking-page-title {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -.02em;
      color: #0f172a;
      font-weight: 900;
    }

    .ranking-page-desc {
      margin: 10px 0 0;
      font-size: 14px;
      line-height: 1.6;
      color: #475467;
      font-weight: 700;
    }

    .ranking-status {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .ranking-status-card {
      min-width: 144px;
      padding: 12px 14px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid #e7ebf3;
    }

    .ranking-status-label {
      display: block;
      font-size: 11px;
      line-height: 1.3;
      color: #667085;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .ranking-status-value {
      display: block;
      font-size: 15px;
      line-height: 1.35;
      color: #101828;
      font-weight: 900;
    }

    .ranking-filter-card {
      padding: 18px 20px 20px;
    }

    .ranking-filter-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .ranking-filter-title {
      margin: 0;
      font-size: 13px;
      color: #344054;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .ranking-filter-sub {
      margin: 0;
      font-size: 12px;
      color: #98a2b3;
      font-weight: 700;
    }

    .ranking-filter-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr)) auto;
      gap: 12px;
      align-items: end;
    }

    .ranking-filter-field {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .ranking-filter-label {
      font-size: 12px;
      color: #475467;
      font-weight: 800;
      line-height: 1.3;
    }

    .ranking-filter-field select,
    .ranking-filter-actions button {
      width: 100%;
      height: 50px;
      border-radius: 16px;
      border: 1px solid #d7deea;
      background: #fff;
      color: #101828;
      font-size: 14px;
      font-weight: 700;
      padding: 0 16px;
      transition: border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
    }

    .ranking-filter-field select:hover,
    .ranking-filter-actions button:hover {
      border-color: #b9c5d9;
      background: #fbfcfe;
    }

    .ranking-filter-field select:focus,
    .ranking-filter-actions button:focus {
      outline: none;
      border-color: #9db5ff;
      box-shadow: 0 0 0 4px rgba(71, 122, 255, .12);
    }

    .ranking-filter-actions {
      min-width: 132px;
    }

    .ranking-filter-actions button {
      background: #f8fafc;
      color: #344054;
      cursor: pointer;
    }

    .ranking-error {
      margin-top: 12px;
      margin-bottom: 0;
    }

    @media (max-width: 900px) {
      .ranking-header-card {
        grid-template-columns: 1fr;
        padding: 20px;
      }

      .ranking-status {
        justify-content: flex-start;
      }

      .ranking-status-card {
        min-width: 0;
        flex: 1 1 140px;
      }

      .ranking-filter-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .ranking-filter-actions {
        min-width: 0;
      }
    }

    @media (max-width: 700px) {
      .ranking-filter-card {
        padding: 16px;
      }

      .ranking-filter-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .ranking-filter-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <div class="container">
    <nav class="breadcrumb" aria-label="パンくず">
      <a href="./index.html">ホーム</a>
      <span class="breadcrumb-sep" aria-hidden="true">></span>
      <span class="breadcrumb-current" aria-current="page">ポケモンカード スリーブ図鑑</span>
    </nav>
    <div class="ranking-page-top">
      <section class="ranking-header-card" aria-label="ページヘッダー">
        <div>
          <h1 class="ranking-page-title">ポケモンカード スリーブ図鑑</h1>
          <p class="ranking-page-desc">検索と絞り込みで目的のスリーブを見つけて、価格推移や相場感を一覧で比較できます。</p>
        </div>
        <div class="ranking-status" aria-label="集計状況">
          <div class="ranking-status-card">
            <span class="ranking-status-label">最終更新</span>
            <span id="updatedAt" class="ranking-status-value">読み込み中</span>
          </div>
          <div class="ranking-status-card">
            <span class="ranking-status-label">表示件数</span>
            <span id="countInfo" class="ranking-status-value">集計中</span>
          </div>
        </div>
      </section>

      <section class="ranking-filter-card" aria-label="フィルタバー">
        <div class="ranking-filter-head">
          <div>
            <h2 class="ranking-filter-title">絞り込み</h2>
            <p class="ranking-filter-sub">条件や並び替えを変えると図鑑一覧をすぐに更新できます</p>
          </div>
        </div>

        <div class="ranking-filter-grid">
          <label class="ranking-filter-field">
            <span class="ranking-filter-label">発売年</span>
            <select id="releaseYear">
              <option value="">全部</option>
            </select>
          </label>

          <label class="ranking-filter-field">
            <span class="ranking-filter-label">シリーズ</span>
            <select id="series">
              <option value="">全部</option>
            </select>
          </label>

          <label class="ranking-filter-field">
            <span class="ranking-filter-label">価格帯</span>
            <select id="priceBand">
              <option value="">全部</option>
              <option value="0-999">〜999円</option>
              <option value="1000-1999">1,000〜1,999円</option>
              <option value="2000-2999">2,000〜2,999円</option>
              <option value="3000-4999">3,000〜4,999円</option>
              <option value="5000-99999999">5,000円〜</option>
            </select>
          </label>

          <label class="ranking-filter-field">
            <span class="ranking-filter-label">並び替え</span>
            <select id="sortOrder">
              <option value="priceDesc">価格が高い順</option>
              <option value="priceAsc">価格が安い順</option>
              <option value="nameAsc">名前順</option>
              <option value="releaseDesc">発売年が新しい順</option>
            </select>
          </label>

          <div class="ranking-filter-actions">
            <button id="clear" type="button">条件をクリア</button>
          </div>
        </div>

        <div id="error" class="error ranking-error"></div>
      </section>
    </div>

    <main>
      <div id="list" class="grid compact-grid"></div>
    </main>

    <div id="site-footer"></div>
  </div>

  <script src="./assets/common.js"></script>
  <script>
    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "block";
      el.textContent = msg;
    }

    function hideError() {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "none";
      el.textContent = "";
    }

    function uniq(arr) {
      const s = new Set();
      for (const v of arr) {
        const t = (v == null) ? "" : String(v).trim();
        if (t) s.add(t);
      }
      return Array.from(s);
    }

    function parseBand(v) {
      if (!v) return null;
      const [a, b] = v.split("-").map(Number);
      if (!Number.isFinite(a) || !Number.isFinite(b)) return null;
      return { min: a, max: b };
    }

    function toISODate(d) {
      const dd = new Date(d);
      if (Number.isNaN(dd.getTime())) return null;
      const y = dd.getFullYear();
      const m = String(dd.getMonth() + 1).padStart(2, "0");
      const day = String(dd.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function numOrNull(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function getWeeklyPair(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      if (!arr.length) return null;

      const map = new Map();
      for (const x of arr) {
        const weekISO = toISODate(x.week);
        if (!weekISO) continue;

        const rawPrice = numOrNull(x.price);
        const price = (Number.isFinite(rawPrice) && rawPrice > 0) ? rawPrice : null;
        const count = numOrNull(x.count);

        const hasTrade = (count == null) ? (price != null) : (count > 0 && price != null);
        if (!hasTrade) continue;

        map.set(weekISO, { week: weekISO, price, count: count == null ? null : count });
      }

      if (!map.size) return null;

      const sorted = Array.from(map.values()).sort((a, b) => a.week.localeCompare(b.week));
      const latest = sorted[sorted.length - 1];
      const prev = sorted.length >= 2 ? sorted[sorted.length - 2] : null;
      return { latest, prev, sorted };
    }

    function getLatestWeeklyPrice(s) {
      const pair = getWeeklyPair(s);
      return pair ? pair.latest.price : null;
    }

    function getTotalTradeCount(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      let total = 0;
      let hasAny = false;
      for (const x of arr) {
        const c = numOrNull(x.count);
        if (Number.isFinite(c) && c > 0) {
          total += c;
          hasAny = true;
        }
      }
      return hasAny ? total : null;
    }

    function getDeltaDisplay(pair) {
      if (!pair || !pair.latest || !pair.prev) {
        return { className: "flat", text: "前週比 -", shortText: "比較なし" };
      }

      const diff = pair.latest.price - pair.prev.price;
      const cls = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
      const sign = diff > 0 ? "+" : diff < 0 ? "-" : "±";
      return {
        className: cls,
        text: `前週比 ${sign}${Math.abs(diff).toLocaleString()}円`,
        shortText: `${sign}${Math.abs(diff).toLocaleString()}円`
      };
    }

    function getCardTags(sleeve, maxItems = 2) {
      const candidates = [];
      if (sleeve.series) candidates.push(sleeve.series);
      if (sleeve.condition) candidates.push(sleeve.condition);
      if (Array.isArray(sleeve.tags)) candidates.push(...sleeve.tags);
      if (typeof sleeve.tag === "string") candidates.push(sleeve.tag);
      if (typeof sleeve.badge === "string") candidates.push(sleeve.badge);

      const result = [];
      const seen = new Set();
      for (const raw of candidates) {
        const text = String(raw || "").trim();
        if (!text || seen.has(text)) continue;
        seen.add(text);
        result.push(text);
        if (result.length >= maxItems) break;
      }
      return result;
    }

    async function waitForSearch(maxWaitMs = 2000) {
      const start = Date.now();
      while (Date.now() - start <= maxWaitMs) {
        const el = document.getElementById("search");
        if (el) return el;
        await new Promise(r => setTimeout(r, 80));
      }
      return document.getElementById("search");
    }

    async function main() {
      const searchInput = await waitForSearch();
      if (!searchInput) {
        showError("検索欄の初期化に失敗しました（headerが読み込めていません）");
        return;
      }

      const releaseYearSel = document.getElementById("releaseYear");
      const seriesSel = document.getElementById("series");
      const priceBandSel = document.getElementById("priceBand");
      const sortOrderSel = document.getElementById("sortOrder");
      const clearBtn = document.getElementById("clear");
      const list = document.getElementById("list");

      const url = new URL(location.href);
      const qParam = (url.searchParams.get("q") || "").trim();
      if (qParam) searchInput.value = qParam;

      let data;
      try {
        data = await window.common.loadData();
      } catch (e) {
        showError(e.message || "データ読み込みに失敗しました");
        return;
      }
      hideError();

      const sleeves = Array.isArray(data.sleeves) ? data.sleeves : [];

      let maxWeek = null;
      for (const s of sleeves) {
        const p = getWeeklyPair(s);
        if (!p) continue;
        const w = p.latest.week;
        if (!maxWeek || w > maxWeek) maxWeek = w;
      }
      if (maxWeek) {
        const u = document.getElementById("updatedAt");
        if (u) {
          u.textContent = `${maxWeek}（週次）`;
        }
      }

      const releaseYears = uniq(sleeves.map(s => s.releaseYear)).map(Number).filter(Number.isFinite).sort((a, b) => a - b);
      const seriesList = uniq(sleeves.map(s => s.series)).sort();

      for (const y of releaseYears) {
        const opt = document.createElement("option");
        opt.value = String(y);
        opt.textContent = String(y);
        releaseYearSel.appendChild(opt);
      }
      for (const ser of seriesList) {
        const opt = document.createElement("option");
        opt.value = ser;
        opt.textContent = ser;
        seriesSel.appendChild(opt);
      }

      function getCardPrice(s) {
        return getLatestWeeklyPrice(s);
      }

      function render() {
        const kw = searchInput.value.trim().toLowerCase();
        const releaseYear = releaseYearSel.value;
        const series = seriesSel.value;
        const band = parseBand(priceBandSel.value);
        const sortOrder = sortOrderSel.value;

        list.innerHTML = "";

        const filtered = [];
        for (const s of sleeves) {
          if (kw && !String(s.name || "").toLowerCase().includes(kw)) continue;
          if (releaseYear && String(s.releaseYear ?? "") !== releaseYear) continue;
          if (series && String(s.series || "") !== series) continue;

          if (band) {
            const p = getCardPrice(s);
            if (p == null) continue;
            if (p < band.min || p > band.max) continue;
          }
          filtered.push(s);
        }

        filtered.sort((a, b) => {
          const pa = getCardPrice(a) ?? -1;
          const pb = getCardPrice(b) ?? -1;

          switch (sortOrder) {
            case "priceAsc": return pa - pb;
            case "nameAsc": return String(a.name ?? "").localeCompare(String(b.name ?? ""));
            case "releaseDesc": return (Number(b.releaseYear) || 0) - (Number(a.releaseYear) || 0);
            default: return pb - pa;
          }
        });

        if (!filtered.length) {
          const c = document.getElementById("countInfo");
          if (c) c.textContent = "0件";
          list.innerHTML = '<div class="card"><div class="title">該当なし</div><div class="meta">条件に一致するスリーブがありません</div></div>';
          return;
        }

        const c = document.getElementById("countInfo");
        if (c) c.textContent = `${filtered.length.toLocaleString()}件`;

        const frag = document.createDocumentFragment();

        for (const s of filtered) {
          const p = getCardPrice(s);
          const priceText = (p == null) ? "-" : `${p.toLocaleString()}円`;

          const weeklyPair = getWeeklyPair(s);
          const delta = getDeltaDisplay(weeklyPair);
          const tags = getCardTags(s, 2);
          const tagsHtml = tags.map(tag => `<span class="compact-tag">${escapeHtml(tag)}</span>`).join("");

          const imgSrc = String(s.imageUrl || "").trim();
          const detailHref = (window.common && typeof window.common.buildSleeveDetailHref === "function")
            ? window.common.buildSleeveDetailHref(s.id ?? "")
            : `./sleeve/${encodeURIComponent(s.id ?? "")}/`;

          const card = document.createElement("a");
          card.className = "compact-card";
          card.href = detailHref;
          card.setAttribute("data-sleeve-link", "1");
          card.setAttribute("aria-label", `${String(s.name ?? "")}の詳細を見る`);
          card.innerHTML = `
            <span class="compact-thumb-wrap">
              ${imgSrc
                ? `<img class="compact-thumb" src="${escapeHtml(imgSrc)}" alt="${escapeHtml(s.name ?? "")}" loading="lazy" referrerpolicy="no-referrer"
                    onerror="this.onerror=null; this.style.display='none';">`
                : ""}
            </span>
            <h2 class="compact-card-title">${escapeHtml(s.name ?? "")}</h2>
            <div class="compact-price-row">
              <div class="compact-price">${escapeHtml(priceText)}</div>
              <div class="compact-delta ${delta.className}">${escapeHtml(delta.shortText)}</div>
            </div>
            ${tagsHtml ? `<div class="compact-tags">${tagsHtml}</div>` : ""}
          `;
          frag.appendChild(card);
        }

        list.appendChild(frag);
      }

      let t = null;
      searchInput.addEventListener("input", () => {
        clearTimeout(t);
        t = setTimeout(render, 80);
      });

      releaseYearSel.addEventListener("change", render);
      seriesSel.addEventListener("change", render);
      priceBandSel.addEventListener("change", render);
      sortOrderSel.addEventListener("change", render);

      clearBtn.addEventListener("click", () => {
        searchInput.value = "";
        releaseYearSel.value = "";
        seriesSel.value = "";
        priceBandSel.value = "";
        sortOrderSel.value = "priceDesc";
        render();
      });

      render();
    }

    main();
  </script>
</body>
