<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>高騰率ランキング｜ポケスリ相場ナビ</title>
  <meta name="description" content="ポケカスリーブの高騰率ランキング（30日）を掲載。検索・絞り込みで相場を比較できます。">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">

  <!-- 共通CSS -->
  <link rel="stylesheet" href="./assets/site.css" />
</head>

<body>
  <!-- 共通ヘッダー差し込み -->
  <div id="site-header"></div>

  <div class="container">
    <div class="hero">
      <div class="hero-card">
        <div>
          <p class="hero-title">高騰率ランキング</p>
          <p class="hero-desc">直近の取引週から30日前時点の価格と比較し、上昇率が高い順にランキング表示します。</p>
          <p class="data-note">※価格はフリマアプリ等の売却履歴をもとに独自集計しています。</p>
          <p id="updatedAt" class="data-note" style="display:none;"></p>
          <p id="countInfo" class="data-note" style="display:none;"></p>
        </div>
      </div>
    </div>

    <div class="main">
      <aside class="panel">
        <h2>絞り込み</h2>
        <p class="small">条件を変更するとランキングが更新されます。</p>

        <div id="error" class="error"></div>

        <div class="controls">
          <label>指標
            <select id="metric">
              <option value="rateDesc">上昇率（%）</option>
              <option value="diffDesc">上昇額（円）</option>
            </select>
          </label>

          <label>期間
            <select id="days">
              <option value="30">30日</option>
              <option value="14">14日</option>
              <option value="60">60日</option>
              <option value="90">90日</option>
            </select>
          </label>

          <label>発売年
            <select id="releaseYear">
              <option value="">全部</option>
            </select>
          </label>

          <label>シリーズ
            <select id="series">
              <option value="">全部</option>
            </select>
          </label>

          <label>最低上昇率（%）
            <select id="minRate">
              <option value="-999">指定なし</option>
              <option value="0">0%以上</option>
              <option value="10">+10%以上</option>
              <option value="20">+20%以上</option>
              <option value="30">+30%以上</option>
              <option value="50">+50%以上</option>
              <option value="100">+100%以上</option>
            </select>
          </label>

          <button id="clear" type="button">クリア</button>
        </div>
      </aside>

      <main>
        <div id="list" class="grid"></div>
      </main>
    </div>

    <!-- 共通フッター差し込み -->
    <div id="site-footer"></div>
  </div>

  <!-- 共通JS（header/footer差し込み & nav active 等） -->
  <script src="./assets/common.js"></script>

  <script>

    // -----------------------------
    // utils
    // -----------------------------
    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "block";
      el.textContent = msg;
    }

    function hideError() {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "none";
      el.textContent = "";
    }

    function uniq(arr) {
      const s = new Set();
      for (const v of arr) {
        const t = (v == null) ? "" : String(v).trim();
        if (t) s.add(t);
      }
      return Array.from(s);
    }

    function toISODate(d) {
      const dd = new Date(d);
      if (Number.isNaN(dd.getTime())) return null;
      const y = dd.getFullYear();
      const m = String(dd.getMonth() + 1).padStart(2, "0");
      const day = String(dd.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function numOrNull(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    async function fetchJsonWithTimeout(url, { timeoutMs = 12000 } = {}) {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const res = await fetch(url, {
          cache: "no-store",
          signal: controller.signal,
          headers: { "Accept": "application/json" }
        });
        if (!res.ok) throw new Error(`データ取得に失敗しました（HTTP ${res.status}）`);
        return await res.json();
      } catch (e) {
        if (e && e.name === "AbortError") {
          throw new Error("データ取得がタイムアウトしました。時間をおいて再度お試しください。");
        }
        throw e;
      } finally {
        clearTimeout(t);
      }
    }

    async function loadData() {
      const url = window.GAS_URL;  // common.jsが同期読み込み済みなので確実に存在
      if (!url) throw new Error("GAS_URL が未設定です（common.js を確認してください）");
      const res = await fetch(url + "?v=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(`データ取得に失敗しました（HTTP ${res.status}）`);
      return await res.json();
    }

    // -----------------------------
    // weekly logic + growth
    // -----------------------------
    function isoToDate(iso) {
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function addDays(iso, days) {
      const d = isoToDate(iso);
      if (!d) return null;
      d.setDate(d.getDate() + days);
      return toISODate(d);
    }

    function getWeeklySortedTrades(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      if (arr.length === 0) return [];

      const map = new Map();

      for (const x of arr) {
        const weekISO = toISODate(x.week);
        if (!weekISO) continue;

        const price = numOrNull(x.price);
        const count = numOrNull(x.count);

        const hasTrade = (count == null) ? (price != null) : (count > 0 && price != null);
        if (!hasTrade) continue;

        map.set(weekISO, { week: weekISO, price, count: count == null ? null : count });
      }

      return Array.from(map.values()).sort((a, b) => a.week.localeCompare(b.week));
    }

    function getLatestTrade(sorted) {
      return (sorted && sorted.length) ? sorted[sorted.length - 1] : null;
    }

    function getPriceAtOrBefore(sorted, targetISO) {
      if (!sorted || sorted.length === 0) return null;
      for (let i = sorted.length - 1; i >= 0; i--) {
        if (sorted[i].week <= targetISO) return sorted[i];
      }
      return null;
    }

    function getTotalTradeCount(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      let sum = 0;
      let hasAny = false;

      for (const x of arr) {
        const c = numOrNull(x.count);
        if (Number.isFinite(c) && c > 0) {
          sum += c;
          hasAny = true;
        }
      }
      return hasAny ? sum : null;
    }

    function computeGrowth(sleeve, days) {
      const sorted = getWeeklySortedTrades(sleeve);
      const latest = getLatestTrade(sorted);
      if (!latest) return null;

      const targetISO = addDays(latest.week, -days);
      if (!targetISO) return null;

      const base = getPriceAtOrBefore(sorted, targetISO);
      if (!base || !Number.isFinite(base.price) || base.price === 0) return null;

      const diff = latest.price - base.price;
      const rate = (diff / base.price) * 100;
      if (!Number.isFinite(rate)) return null;

      return { latest, base, diff, rate };
    }

    function formatGrowthLine(g) {
      const cls = g.diff > 0 ? "up" : g.diff < 0 ? "down" : "flat";
      const sign = g.diff > 0 ? "+" : g.diff < 0 ? "−" : "±";
      const arrow = g.diff > 0 ? "↑" : g.diff < 0 ? "↓" : "→";
      const abs = Math.abs(g.diff);

      const rateAbs = Math.abs(g.rate).toFixed(1);
      const rateSign = g.rate > 0 ? "+" : g.rate < 0 ? "-" : "";

      return `
        <div class="delta">
          <span class="delta-main ${cls}">${arrow} ${sign}${abs.toLocaleString()}円（${rateSign}${rateAbs}%）</span>
          <span class="chip">基準 ${escapeHtml(g.base.week)}：${g.base.price.toLocaleString()}円</span>
          <span class="chip">直近 ${escapeHtml(g.latest.week)}：${g.latest.price.toLocaleString()}円</span>
        </div>
      `;
    }

    // -----------------------------
    // main
    // -----------------------------
    async function main() {
      // common.js が header を差し込む想定なので、検索UIはそのまま利用（ページ内検索）
      const list = document.getElementById("list");
      const searchInput = document.getElementById("search");

      const metricSel = document.getElementById("metric");
      const daysSel = document.getElementById("days");
      const releaseYearSel = document.getElementById("releaseYear");
      const seriesSel = document.getElementById("series");
      const minRateSel = document.getElementById("minRate");
      const clearBtn = document.getElementById("clear");

      // 念のため：header差し込みが遅いと search がまだ無いので待つ
      const waitForSearch = async () => {
        for (let i = 0; i < 20; i++) {
          const s = document.getElementById("search");
          if (s) return s;
          await new Promise(r => setTimeout(r, 50));
        }
        return null;
      };

      const sEl = searchInput || await waitForSearch();
      if (!sEl) {
        showError("検索バーが見つかりません（header読み込みに失敗している可能性があります）");
        return;
      }

      let data;
      try {
        data = await loadData();
      } catch (e) {
        showError(e.message || "不明なエラーが発生しました");
        return;
      }
      hideError();

      const sleeves = Array.isArray(data.sleeves) ? data.sleeves : [];

      // 最終更新（直近取引週の最大日付）
      try {
        let maxWeek = null;
        for (const s of sleeves) {
          const sorted = getWeeklySortedTrades(s);
          const latest = getLatestTrade(sorted);
          if (!latest) continue;
          const w = latest.week;
          if (!maxWeek || w > maxWeek) maxWeek = w;
        }
        if (maxWeek) {
          const u = document.getElementById("updatedAt");
          u.textContent = `最終更新：${maxWeek}（週次）`;
          u.style.display = "block";
        }
      } catch (_) { }

      // セレクト初期化
      const releaseYears = uniq(sleeves.map(s => s.releaseYear)).map(Number).filter(Number.isFinite).sort((a, b) => a - b);
      const seriesList = uniq(sleeves.map(s => s.series)).sort();

      for (const y of releaseYears) {
        const opt = document.createElement("option");
        opt.value = String(y);
        opt.textContent = String(y);
        releaseYearSel.appendChild(opt);
      }
      for (const ser of seriesList) {
        const opt = document.createElement("option");
        opt.value = ser;
        opt.textContent = ser;
        seriesSel.appendChild(opt);
      }

      function render() {
        const kw = sEl.value.trim().toLowerCase();
        const metric = metricSel.value;
        const days = Number(daysSel.value || "30");
        const releaseYear = releaseYearSel.value;
        const series = seriesSel.value;
        const minRate = Number(minRateSel.value || "-999");

        list.innerHTML = "";

        const rows = [];
        for (const s of sleeves) {
          if (kw && !String(s.name || "").toLowerCase().includes(kw)) continue;
          if (releaseYear && String(s.releaseYear ?? "") !== releaseYear) continue;
          if (series && String(s.series || "") !== series) continue;

          const g = computeGrowth(s, days);
          if (!g) continue;

          // 上昇率フィルタ（指定なしなら -999）
          if (Number.isFinite(minRate) && minRate > -900) {
            if (g.rate < minRate) continue;
          }

          rows.push({ s, g });
        }

        // sort
        rows.sort((a, b) => {
          if (metric === "diffDesc") {
            if (b.g.diff !== a.g.diff) return b.g.diff - a.g.diff;
            return b.g.rate - a.g.rate;
          }
          // rateDesc
          if (b.g.rate !== a.g.rate) return b.g.rate - a.g.rate;
          return b.g.diff - a.g.diff;
        });

        const c = document.getElementById("countInfo");
        c.textContent = `表示件数：${rows.length.toLocaleString()}件（${days}日比較）`;
        c.style.display = "block";

        if (rows.length === 0) {
          list.innerHTML = `<div class="card"><div class="title">該当なし</div><div class="meta">条件に一致するスリーブがありません</div></div>`;
          return;
        }

        const frag = document.createDocumentFragment();

        for (let i = 0; i < rows.length; i++) {
          const row = rows[i];
          const rank = i + 1;

          const s = row.s;
          const g = row.g;

          const totalTrades = getTotalTradeCount(s);
          const totalTradesText = (totalTrades == null) ? "—" : `${totalTrades.toLocaleString()}件`;

          const imgSrc = String(s.imageUrl || "").trim();
          const imgHtml = imgSrc
            ? `<img class="thumb" src="${escapeHtml(imgSrc)}" alt="${escapeHtml(s.name ?? "")}" loading="lazy" referrerpolicy="no-referrer"
                 onerror="this.onerror=null; this.style.display='none';">`
            : "";

          const div = document.createElement("div");
          div.className = "card";

          const latestPriceText = `${g.latest.price.toLocaleString()}円`;
          const growthHtml = formatGrowthLine(g);

          div.innerHTML = `
            ${imgHtml}

            <div class="rank-row">
              <span class="rank-badge">${rank}位</span>
              <div class="title" style="margin:0;">${escapeHtml(s.name ?? "")}</div>
            </div>

            <div class="price">${latestPriceText} <span class="meta">（直近取引週）</span></div>

            ${growthHtml}

            <div class="badges">
              <span class="badge">総取引：${escapeHtml(totalTradesText)}</span>
              <span class="badge">発売年：${escapeHtml(s.releaseYear ?? "")}</span>
              <span class="badge">${escapeHtml(s.condition ?? "")}</span>
              <span class="badge">${escapeHtml(s.series ?? "")}</span>
            </div>

            <a class="btn" href="./detail.html?id=${encodeURIComponent(s.id ?? "")}">価格推移を見る →</a>
          `;
          frag.appendChild(div);
        }

        list.appendChild(frag);
      }

      // events
      let t = null;
      sEl.addEventListener("input", () => {
        clearTimeout(t);
        t = setTimeout(render, 80);
      });

      metricSel.addEventListener("change", render);
      daysSel.addEventListener("change", render);
      releaseYearSel.addEventListener("change", render);
      seriesSel.addEventListener("change", render);
      minRateSel.addEventListener("change", render);

      clearBtn.addEventListener("click", () => {
        sEl.value = "";
        metricSel.value = "rateDesc";
        daysSel.value = "30";
        releaseYearSel.value = "";
        seriesSel.value = "";
        minRateSel.value = "-999";
        render();
      });

      render();
    }

    main();
  </script>
</body>

</html>
