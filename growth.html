<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>高騰率ランキング｜ポケスリ相場ナビ</title>
  <meta name="description" content="ポケカスリーブの高騰率ランキング（30日）を掲載。検索・絞り込みで相場を比較できます。">
  <meta property="og:title" content="高騰率ランキング｜ポケスリ相場ナビ" />
  <meta property="og:description" content="ポケカスリーブの高騰率ランキング（30日）を掲載。検索・絞り込みで相場を比較できます。" />
  <meta property="og:image" content="https://pokesuri-navi.com/assets/favicon.svg" />
  <meta property="og:url" content="https://pokesuri-navi.com/growth.html" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">

  <!-- 共通CSS -->
  <link rel="stylesheet" href="./assets/site.css" />
  <style>
    body {
      background: #f5f7fb;
    }

    .ranking-page-top {
      display: grid;
      gap: 16px;
      margin-bottom: 20px;
    }

    .ranking-header-card,
    .ranking-filter-card {
      background: #fff;
      border: 1px solid #e6eaf2;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .06);
    }

    .ranking-header-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 24px;
    }

    .ranking-page-title {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -.02em;
      color: #0f172a;
      font-weight: 900;
    }

    .ranking-page-desc {
      margin: 10px 0 0;
      font-size: 14px;
      line-height: 1.6;
      color: #475467;
      font-weight: 700;
    }

    .ranking-status {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .ranking-status-card {
      min-width: 144px;
      padding: 12px 14px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid #e7ebf3;
    }

    .ranking-status-label {
      display: block;
      font-size: 11px;
      line-height: 1.3;
      color: #667085;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .ranking-status-value {
      display: block;
      font-size: 15px;
      line-height: 1.35;
      color: #101828;
      font-weight: 900;
    }

    .ranking-filter-card {
      padding: 18px 20px 20px;
    }

    .ranking-filter-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .ranking-filter-title {
      margin: 0;
      font-size: 13px;
      color: #344054;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .ranking-filter-sub {
      margin: 0;
      font-size: 12px;
      color: #98a2b3;
      font-weight: 700;
    }

    .ranking-filter-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr)) auto;
      gap: 12px;
      align-items: end;
    }

    .ranking-filter-field {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .ranking-filter-label {
      font-size: 12px;
      color: #475467;
      font-weight: 800;
      line-height: 1.3;
    }

    .ranking-filter-field select,
    .ranking-filter-actions button {
      width: 100%;
      height: 50px;
      border-radius: 16px;
      border: 1px solid #d7deea;
      background: #fff;
      color: #101828;
      font-size: 14px;
      font-weight: 700;
      padding: 0 16px;
      transition: border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
    }

    .ranking-filter-field select:hover,
    .ranking-filter-actions button:hover {
      border-color: #b9c5d9;
      background: #fbfcfe;
    }

    .ranking-filter-field select:focus,
    .ranking-filter-actions button:focus {
      outline: none;
      border-color: #9db5ff;
      box-shadow: 0 0 0 4px rgba(71, 122, 255, .12);
    }

    .ranking-filter-actions {
      min-width: 132px;
    }

    .ranking-filter-actions button {
      background: #f8fafc;
      color: #344054;
      cursor: pointer;
    }

    .ranking-error {
      margin-bottom: 0;
      margin-top: 12px;
    }

    @media (max-width: 900px) {
      .ranking-header-card {
        grid-template-columns: 1fr;
        padding: 20px;
      }

      .ranking-status {
        justify-content: flex-start;
      }

      .ranking-status-card {
        min-width: 0;
        flex: 1 1 140px;
      }

      .ranking-filter-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .ranking-filter-actions {
        min-width: 0;
      }
    }

    @media (max-width: 700px) {
      .ranking-filter-card {
        padding: 16px;
      }

      .ranking-filter-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .ranking-filter-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <!-- 共通ヘッダー差し込み -->
  <div id="site-header"></div>

  <div class="container">
    <nav class="breadcrumb" aria-label="パンくず">
      <a href="./index.html">ホーム</a>
      <span class="breadcrumb-sep" aria-hidden="true">></span>
      <span class="breadcrumb-current" aria-current="page">高騰率ランキング</span>
    </nav>
    <div class="ranking-page-top">
      <section class="ranking-header-card" aria-label="ページヘッダー">
        <div>
          <h1 class="ranking-page-title">高騰率ランキング</h1>
          <p class="ranking-page-desc">直近の基準価格と比較して、上昇率や上昇額が大きいスリーブを見やすく比較できます。</p>
        </div>
        <div class="ranking-status" aria-label="集計状況">
          <div class="ranking-status-card">
            <span class="ranking-status-label">最終更新</span>
            <span id="updatedAt" class="ranking-status-value">読み込み中</span>
          </div>
          <div class="ranking-status-card">
            <span class="ranking-status-label">表示件数</span>
            <span id="countInfo" class="ranking-status-value">集計中</span>
          </div>
        </div>
      </section>

      <section class="ranking-filter-card" aria-label="フィルタバー">
        <div class="ranking-filter-head">
          <div>
            <h2 class="ranking-filter-title">絞り込み</h2>
            <p class="ranking-filter-sub">条件を変えるとランキングをすぐに更新できます</p>
          </div>
        </div>

        <div class="ranking-filter-grid">
          <label class="ranking-filter-field">
            <span class="ranking-filter-label">指標</span>
            <select id="metric">
              <option value="rateDesc">上昇率（%）</option>
              <option value="diffDesc">上昇額（円）</option>
            </select>
          </label>

          <label class="ranking-filter-field">
            <span class="ranking-filter-label">期間</span>
            <select id="days">
              <option value="30">30日</option>
              <option value="14">14日</option>
              <option value="60">60日</option>
              <option value="90">90日</option>
            </select>
          </label>

          <label class="ranking-filter-field">
            <span class="ranking-filter-label">発売年</span>
            <select id="releaseYear">
              <option value="">全部</option>
            </select>
          </label>

          <label class="ranking-filter-field">
            <span class="ranking-filter-label">シリーズ</span>
            <select id="series">
              <option value="">全部</option>
            </select>
          </label>

          <label class="ranking-filter-field">
            <span class="ranking-filter-label">最低上昇率（%）</span>
            <select id="minRate">
              <option value="-999">指定なし</option>
              <option value="0">0%以上</option>
              <option value="10">+10%以上</option>
              <option value="20">+20%以上</option>
              <option value="30">+30%以上</option>
              <option value="50">+50%以上</option>
              <option value="100">+100%以上</option>
            </select>
          </label>

          <div class="ranking-filter-actions">
            <button id="clear" type="button">条件をクリア</button>
          </div>
        </div>

        <div id="error" class="error ranking-error"></div>
      </section>
    </div>

    <main>
      <div id="list" class="grid"></div>
    </main>

    <!-- 共通フッター差し込み -->
    <div id="site-footer"></div>
  </div>

  <!-- 共通JS（header/footer差し込み & nav active 等） -->
  <script src="./assets/common.js"></script>

  <script>

    // -----------------------------
    // utils
    // -----------------------------
    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "block";
      el.textContent = msg;
    }

    function hideError() {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "none";
      el.textContent = "";
    }

    function uniq(arr) {
      const s = new Set();
      for (const v of arr) {
        const t = (v == null) ? "" : String(v).trim();
        if (t) s.add(t);
      }
      return Array.from(s);
    }

    function toISODate(d) {
      const dd = new Date(d);
      if (Number.isNaN(dd.getTime())) return null;
      const y = dd.getFullYear();
      const m = String(dd.getMonth() + 1).padStart(2, "0");
      const day = String(dd.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function numOrNull(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    async function fetchJsonWithTimeout(url, { timeoutMs = 12000 } = {}) {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const res = await fetch(url, {
          cache: "no-store",
          signal: controller.signal,
          headers: { "Accept": "application/json" }
        });
        if (!res.ok) throw new Error(`データ取得に失敗しました（HTTP ${res.status}）`);
        return await res.json();
      } catch (e) {
        if (e && e.name === "AbortError") {
          throw new Error("データ取得がタイムアウトしました。時間をおいて再度お試しください。");
        }
        throw e;
      } finally {
        clearTimeout(t);
      }
    }

    async function loadData() {
      const url = window.GAS_URL;  // common.jsが同期読み込み済みなので確実に存在
      if (!url) throw new Error("GAS_URL が未設定です（common.js を確認してください）");
      const res = await fetch(url + "?v=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(`データ取得に失敗しました（HTTP ${res.status}）`);
      return await res.json();
    }

    // -----------------------------
    // weekly logic + growth
    // -----------------------------
    function isoToDate(iso) {
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function addDays(iso, days) {
      const d = isoToDate(iso);
      if (!d) return null;
      d.setDate(d.getDate() + days);
      return toISODate(d);
    }

    function getWeeklySortedTrades(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      if (arr.length === 0) return [];

      const map = new Map();

      for (const x of arr) {
        const weekISO = toISODate(x.week);
        if (!weekISO) continue;

        const price = numOrNull(x.price);
        const count = numOrNull(x.count);

        const hasTrade = (count == null) ? (price != null) : (count > 0 && price != null);
        if (!hasTrade) continue;

        map.set(weekISO, { week: weekISO, price, count: count == null ? null : count });
      }

      return Array.from(map.values()).sort((a, b) => a.week.localeCompare(b.week));
    }

    function getLatestTrade(sorted) {
      return (sorted && sorted.length) ? sorted[sorted.length - 1] : null;
    }

    function getPriceAtOrBefore(sorted, targetISO) {
      if (!sorted || sorted.length === 0) return null;
      for (let i = sorted.length - 1; i >= 0; i--) {
        if (sorted[i].week <= targetISO) return sorted[i];
      }
      return null;
    }

    function getTotalTradeCount(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      let sum = 0;
      let hasAny = false;

      for (const x of arr) {
        const c = numOrNull(x.count);
        if (Number.isFinite(c) && c > 0) {
          sum += c;
          hasAny = true;
        }
      }
      return hasAny ? sum : null;
    }

    function getGlobalLatestTradeWeek(sleeves) {
      let maxWeek = null;
      for (const s of (Array.isArray(sleeves) ? sleeves : [])) {
        const sorted = getWeeklySortedTrades(s);
        const latest = getLatestTrade(sorted);
        if (!latest) continue;
        const w = String(latest.week || "");
        if (!w) continue;
        if (!maxWeek || w > maxWeek) maxWeek = w;
      }
      return maxWeek;
    }

    function computeGrowth(sleeve, days, latestWeek) {
      const sorted = getWeeklySortedTrades(sleeve);
      const latest = getLatestTrade(sorted);
      if (!latest) return null;
      if (latestWeek && latest.week !== latestWeek) return null;

      const targetISO = addDays(latest.week, -days);
      if (!targetISO) return null;

      const base = getPriceAtOrBefore(sorted, targetISO);
      if (!base || !Number.isFinite(base.price) || base.price === 0) return null;

      const diff = latest.price - base.price;
      const rate = (diff / base.price) * 100;
      if (!Number.isFinite(rate)) return null;

      return { latest, base, diff, rate };
    }

    function formatGrowthLine(g) {
      const cls = g.diff > 0 ? "up" : g.diff < 0 ? "down" : "flat";
      const sign = g.diff > 0 ? "+" : g.diff < 0 ? "−" : "±";
      const arrow = g.diff > 0 ? "↑" : g.diff < 0 ? "↓" : "→";
      const abs = Math.abs(g.diff);

      const rateAbs = Math.abs(g.rate).toFixed(1);
      const rateSign = g.rate > 0 ? "+" : g.rate < 0 ? "-" : "";

      return `
        <div class="delta">
          <span class="delta-main ${cls}">${arrow} ${sign}${abs.toLocaleString()}円（${rateSign}${rateAbs}%）</span>
          <span class="chip">基準 ${escapeHtml(g.base.week)}：${g.base.price.toLocaleString()}円</span>
          <span class="chip">直近 ${escapeHtml(g.latest.week)}：${g.latest.price.toLocaleString()}円</span>
        </div>
      `;
    }

    // -----------------------------
    // main
    // -----------------------------
    async function main() {
      // common.js が header を差し込む想定なので、検索UIはそのまま利用（ページ内検索）
      const list = document.getElementById("list");
      const searchInput = document.getElementById("search");

      const metricSel = document.getElementById("metric");
      const daysSel = document.getElementById("days");
      const releaseYearSel = document.getElementById("releaseYear");
      const seriesSel = document.getElementById("series");
      const minRateSel = document.getElementById("minRate");
      const clearBtn = document.getElementById("clear");

      // 念のため：header差し込みが遅いと search がまだ無いので待つ
      const waitForSearch = async () => {
        for (let i = 0; i < 20; i++) {
          const s = document.getElementById("search");
          if (s) return s;
          await new Promise(r => setTimeout(r, 50));
        }
        return null;
      };

      const sEl = searchInput || await waitForSearch();
      if (!sEl) {
        showError("検索バーが見つかりません（header読み込みに失敗している可能性があります）");
        return;
      }

      let data;
      try {
        data = await loadData();
      } catch (e) {
        showError(e.message || "不明なエラーが発生しました");
        return;
      }
      hideError();

      const sleeves = Array.isArray(data.sleeves) ? data.sleeves : [];
      const latestWeek = getGlobalLatestTradeWeek(sleeves);

      // 最終更新（直近取引週の最大日付）
      try {
        if (latestWeek) {
          const u = document.getElementById("updatedAt");
          u.textContent = `${latestWeek}（週次）`;
        }
      } catch (_) { }

      // セレクト初期化
      const releaseYears = uniq(sleeves.map(s => s.releaseYear)).map(Number).filter(Number.isFinite).sort((a, b) => a - b);
      const seriesList = uniq(sleeves.map(s => s.series)).sort();

      for (const y of releaseYears) {
        const opt = document.createElement("option");
        opt.value = String(y);
        opt.textContent = String(y);
        releaseYearSel.appendChild(opt);
      }
      for (const ser of seriesList) {
        const opt = document.createElement("option");
        opt.value = ser;
        opt.textContent = ser;
        seriesSel.appendChild(opt);
      }

      function render() {
        const kw = sEl.value.trim().toLowerCase();
        const metric = metricSel.value;
        const days = Number(daysSel.value || "30");
        const releaseYear = releaseYearSel.value;
        const series = seriesSel.value;
        const minRate = Number(minRateSel.value || "-999");

        list.innerHTML = "";

        const rows = [];
        for (const s of sleeves) {
          if (kw && !String(s.name || "").toLowerCase().includes(kw)) continue;
          if (releaseYear && String(s.releaseYear ?? "") !== releaseYear) continue;
          if (series && String(s.series || "") !== series) continue;

          const g = computeGrowth(s, days, latestWeek);
          if (!g) continue;

          // 上昇率フィルタ（指定なしなら -999）
          if (Number.isFinite(minRate) && minRate > -900) {
            if (g.rate < minRate) continue;
          }

          rows.push({ s, g });
        }

        // sort
        rows.sort((a, b) => {
          if (metric === "diffDesc") {
            if (b.g.diff !== a.g.diff) return b.g.diff - a.g.diff;
            return b.g.rate - a.g.rate;
          }
          // rateDesc
          if (b.g.rate !== a.g.rate) return b.g.rate - a.g.rate;
          return b.g.diff - a.g.diff;
        });

        const c = document.getElementById("countInfo");
        c.textContent = `${rows.length.toLocaleString()}件（${days}日比較）`;

        if (rows.length === 0) {
          list.innerHTML = `<div class="card"><div class="title">該当なし</div><div class="meta">条件に一致するスリーブがありません</div></div>`;
          return;
        }

        const frag = document.createDocumentFragment();

        for (let i = 0; i < rows.length; i++) {
          const row = rows[i];
          const rank = i + 1;

          const s = row.s;
          const g = row.g;

          const totalTrades = getTotalTradeCount(s);
          const totalTradesText = (totalTrades == null) ? "—" : `${totalTrades.toLocaleString()}件`;

          const detailHref = (window.common && typeof window.common.buildSleeveDetailHref === "function")
            ? window.common.buildSleeveDetailHref(s.id ?? "")
            : `./sleeve/${encodeURIComponent(s.id ?? "")}/`;
          const imgSrc = String(s.imageUrl || "").trim();
          const imgHtml = imgSrc
            ? `<a class="thumb-link" href="${detailHref}">
                 <img class="thumb" src="${escapeHtml(imgSrc)}" alt="${escapeHtml(s.name ?? "")}" loading="lazy" referrerpolicy="no-referrer"
                   onerror="this.onerror=null; this.style.display='none';">
               </a>`
            : "";

          const div = document.createElement("div");
          div.className = "card";

          const latestPriceText = `${g.latest.price.toLocaleString()}円`;
          const growthHtml = formatGrowthLine(g);

          div.innerHTML = `
            ${imgHtml}

            <div class="rank-row">
              <span class="rank-badge">${rank}位</span>
              <div class="title" style="margin:0;">${escapeHtml(s.name ?? "")}</div>
            </div>

            <div class="price">${latestPriceText} <span class="meta">（直近取引週）</span></div>

            ${growthHtml}

            <div class="badges">
              <span class="badge">総取引：${escapeHtml(totalTradesText)}</span>
              <span class="badge">発売年：${escapeHtml(s.releaseYear ?? "")}</span>
              <span class="badge">${escapeHtml(s.condition ?? "")}</span>
              <span class="badge">${escapeHtml(s.series ?? "")}</span>
            </div>

            <a class="btn" data-sleeve-link="1" href="${detailHref}">価格推移を見る →</a>
          `;
          frag.appendChild(div);
        }

        list.appendChild(frag);
      }

      // events
      let t = null;
      sEl.addEventListener("input", () => {
        clearTimeout(t);
        t = setTimeout(render, 80);
      });

      metricSel.addEventListener("change", render);
      daysSel.addEventListener("change", render);
      releaseYearSel.addEventListener("change", render);
      seriesSel.addEventListener("change", render);
      minRateSel.addEventListener("change", render);

      clearBtn.addEventListener("click", () => {
        sEl.value = "";
        metricSel.value = "rateDesc";
        daysSel.value = "30";
        releaseYearSel.value = "";
        seriesSel.value = "";
        minRateSel.value = "-999";
        render();
      });

      render();
    }

  document.addEventListener("site:injected", () => {
    main();
  });
    
  </script>
</body>

</html>
