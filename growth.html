  <script>

    // -----------------------------
    // utils
    // -----------------------------
    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "block";
      el.textContent = msg;
    }

    function hideError() {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "none";
      el.textContent = "";
    }

    function uniq(arr) {
      const s = new Set();
      for (const v of arr) {
        const t = (v == null) ? "" : String(v).trim();
        if (t) s.add(t);
      }
      return Array.from(s);
    }

    function getCompactTagLabels(sleeve, maxItems = 2) {
      const candidates = [];
      if (typeof sleeve.series === "string") candidates.push(sleeve.series);
      if (typeof sleeve.condition === "string") candidates.push(sleeve.condition);
      if (Array.isArray(sleeve.tags)) candidates.push(...sleeve.tags);
      if (typeof sleeve.tag === "string") candidates.push(sleeve.tag);
      if (typeof sleeve.badge === "string") candidates.push(sleeve.badge);
      const seen = new Set();
      const result = [];
      for (const raw of candidates) {
        const text = String(raw || "").trim().replace(/^#/, "");
        if (!text || seen.has(text)) continue;
        seen.add(text);
        result.push(text);
        if (result.length >= maxItems) break;
      }
      return result;
    }

    function toISODate(d) {
      const dd = new Date(d);
      if (Number.isNaN(dd.getTime())) return null;
      const y = dd.getFullYear();
      const m = String(dd.getMonth() + 1).padStart(2, "0");
      const day = String(dd.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function numOrNull(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    async function fetchJsonWithTimeout(url, { timeoutMs = 12000 } = {}) {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const res = await fetch(url, {
          cache: "no-store",
          signal: controller.signal,
          headers: { "Accept": "application/json" }
        });
        if (!res.ok) throw new Error(`データ取得に失敗しました（HTTP ${res.status}）`);
        return await res.json();
      } catch (e) {
        if (e && e.name === "AbortError") {
          throw new Error("データ取得がタイムアウトしました。時間をおいて再度お試しください。");
        }
        throw e;
      } finally {
        clearTimeout(t);
      }
    }

    async function loadData() {
      if (window.common && typeof window.common.loadData === "function") {
        return await window.common.loadData();
      }
      const url = window.GAS_URL;
      if (!url) throw new Error("GAS_URL が未設定です（common.js を確認してください）");
      const res = await fetch(url, { cache: "default" });
      if (!res.ok) throw new Error(`データ取得に失敗しました（HTTP ${res.status}）`);
      return await res.json();
    }

    // -----------------------------
    // weekly logic + growth
    // -----------------------------
    function isoToDate(iso) {
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function addDays(iso, days) {
      const d = isoToDate(iso);
      if (!d) return null;
      d.setDate(d.getDate() + days);
      return toISODate(d);
    }

    function getWeeklySortedTrades(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      if (arr.length === 0) return [];

      const map = new Map();

      for (const x of arr) {
        const weekISO = toISODate(x.week);
        if (!weekISO) continue;
        if (String(weekISO).slice(-2) === "01") continue;

        const price = numOrNull(x.price);
        const count = numOrNull(x.count);

        const hasTrade = (count == null) ? (price != null) : (count > 0 && price != null);
        if (!hasTrade) continue;

        map.set(weekISO, { week: weekISO, price, count: count == null ? null : count });
      }

      return Array.from(map.values()).sort((a, b) => a.week.localeCompare(b.week));
    }

    function getLatestTrade(sorted) {
      return (sorted && sorted.length) ? sorted[sorted.length - 1] : null;
    }

    function getPriceAtOrBefore(sorted, targetISO) {
      if (!sorted || sorted.length === 0) return null;
      for (let i = sorted.length - 1; i >= 0; i--) {
        if (sorted[i].week <= targetISO) return sorted[i];
      }
      return null;
    }

    function getTotalTradeCount(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      let sum = 0;
      let hasAny = false;

      for (const x of arr) {
        const c = numOrNull(x.count);
        if (Number.isFinite(c) && c > 0) {
          sum += c;
          hasAny = true;
        }
      }
      return hasAny ? sum : null;
    }

    function getMarketRange(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      const prices = arr.map((x) => numOrNull(x && x.price)).filter((v) => Number.isFinite(v) && v > 0);
      if (!prices.length) return { min: null, max: null };
      return { min: Math.min(...prices), max: Math.max(...prices) };
    }

    function getTagLabels(sleeve, maxItems = 3) {
      const candidates = [];
      if (Array.isArray(sleeve.tags)) candidates.push(...sleeve.tags);
      if (typeof sleeve.tag === "string") candidates.push(sleeve.tag);
      if (typeof sleeve.badge === "string") candidates.push(sleeve.badge);
      if (typeof sleeve.series === "string") candidates.push(sleeve.series);
      if (typeof sleeve.condition === "string") candidates.push(sleeve.condition);
      if (typeof sleeve.releaseYear === "number" || typeof sleeve.releaseYear === "string") candidates.push(`${sleeve.releaseYear}`);
      const seen = new Set();
      const result = [];
      for (const raw of candidates) {
        const tag = String(raw || "").trim();
        if (!tag) continue;
        const normalized = tag.startsWith("#") ? tag : `#${tag}`;
        if (seen.has(normalized)) continue;
        seen.add(normalized);
        result.push(normalized);
        if (result.length >= maxItems) break;
      }
      return result.length ? result : ["#注目"];
    }

    function getPodiumBadge(rank) {
      if (rank === 1) return "🥇 1位";
      if (rank === 2) return "🥈 2位";
      return "🥉 3位";
    }

    function buildPodiumCard(row, rank) {
      const s = row.s;
      const g = row.g;
      const imgSrc = String(s.imageUrl || "").trim();
      const tagHtml = getTagLabels(s).map((tag) => `<span class="podium-chip">${escapeHtml(tag)}</span>`).join("");
      const detailHref = row.detailHref;
      const rateClass = (g.rate ?? 0) > 0 ? "up" : (g.rate ?? 0) < 0 ? "down" : "flat";
      const latestWeekText = g.latest && g.latest.week ? `対象週 ${escapeHtml(g.latest.week)}` : "対象週データなし";
      return `
        <article class="podium-card podium-card--rank${rank}">
          <div class="podium-badge">${getPodiumBadge(rank)}</div>
          <a class="podium-media" data-sleeve-link="1" href="${detailHref}">
            <img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(s.name ?? "")}" loading="${rank === 1 ? "eager" : "lazy"}" referrerpolicy="no-referrer"
              onerror="this.onerror=null; this.style.display='none';">
          </a>
          <div class="podium-content">
            <div class="podium-kicker">TOP ${rank} SLEEVE</div>
            <h${rank === 1 ? "2" : "3"} class="podium-title">${escapeHtml(s.name ?? "")}</h${rank === 1 ? "2" : "3"}>
            <div class="podium-metrics">
              <div class="podium-metric">
                <span class="podium-metric-label">最新価格</span>
                <div class="podium-price">${g.latest.price.toLocaleString()}円</div>
              </div>
              <div class="podium-metric">
                <span class="podium-metric-label">上昇率</span>
                <div class="podium-rate ${rateClass}">${(g.rate > 0 ? "+" : "") + g.rate.toFixed(1)}%</div>
              </div>
            </div>
            <div class="podium-meta">
              <div class="podium-chip-group">${tagHtml}</div>
              <span class="podium-chip">${latestWeekText}</span>
            </div>
            <div class="podium-actions">
              <a class="btn" data-sleeve-link="1" href="${detailHref}">価格推移を見る →</a>
            </div>
          </div>
        </article>
      `;
    }

    function getGlobalLatestTradeWeek(sleeves) {
      let maxWeek = null;
      for (const s of (Array.isArray(sleeves) ? sleeves : [])) {
        const sorted = getWeeklySortedTrades(s);
        const latest = getLatestTrade(sorted);
        if (!latest) continue;
        const w = String(latest.week || "");
        if (!w) continue;
        if (!maxWeek || w > maxWeek) maxWeek = w;
      }
      return maxWeek;
    }

    function computeGrowth(sleeve, days, latestWeek) {
      const sorted = getWeeklySortedTrades(sleeve);
      const latest = getLatestTrade(sorted);
      if (!latest) return null;
      if (latestWeek && latest.week !== latestWeek) return null;

      const targetISO = addDays(latest.week, -days);
      if (!targetISO) return null;

      const base = getPriceAtOrBefore(sorted, targetISO);
      if (!base || !Number.isFinite(base.price) || base.price === 0) return null;

      const diff = latest.price - base.price;
      const rate = (diff / base.price) * 100;
      if (!Number.isFinite(rate)) return null;

      return { latest, base, diff, rate };
    }

    function formatGrowthLine(g) {
      const cls = g.diff > 0 ? "up" : g.diff < 0 ? "down" : "flat";
      const sign = g.diff > 0 ? "+" : g.diff < 0 ? "−" : "±";
      const arrow = g.diff > 0 ? "↑" : g.diff < 0 ? "↓" : "→";
      const abs = Math.abs(g.diff);

      const rateAbs = Math.abs(g.rate).toFixed(1);
      const rateSign = g.rate > 0 ? "+" : g.rate < 0 ? "-" : "";

      return `
        <div class="delta">
          <span class="delta-main ${cls}">${arrow} ${sign}${abs.toLocaleString()}円（${rateSign}${rateAbs}%）</span>
          <span class="chip">基準 ${escapeHtml(g.base.week)}：${g.base.price.toLocaleString()}円</span>
          <span class="chip">直近 ${escapeHtml(g.latest.week)}：${g.latest.price.toLocaleString()}円</span>
        </div>
      `;
    }

    function renderActiveFilters(metricSel, daysSel, releaseYearSel, seriesSel, minRateSel) {
      const activeFilters = document.getElementById("activeFilters");
      if (!activeFilters) return;
      const chips = [];
      if (metricSel.value === "diffDesc") chips.push({ key: "metric", text: "指標: 上昇額（円）" });
      if (daysSel.value !== "30") {
        const selected = daysSel.options[daysSel.selectedIndex];
        const label = selected ? selected.textContent.trim() : "";
        if (label) chips.push({ key: "days", text: label });
      }
      if (releaseYearSel.value) chips.push({ key: "releaseYear", text: `発売年: ${releaseYearSel.value}` });
      if (seriesSel.value) chips.push({ key: "series", text: `シリーズ: ${seriesSel.value}` });
      if (minRateSel.value && minRateSel.value !== "-999") {
        const selected = minRateSel.options[minRateSel.selectedIndex];
        const label = selected ? selected.textContent.trim() : "";
        if (label) chips.push({ key: "minRate", text: label });
      }
      activeFilters.innerHTML = chips.map((chip) =>
        `<button class="ranking-filter-chip" type="button" data-filter-key="${escapeHtml(chip.key)}" aria-label="${escapeHtml(chip.text)} を解除">
          <span>${escapeHtml(chip.text)}</span>
          <span class="ranking-filter-chip-remove" aria-hidden="true">×</span>
        </button>`
      ).join("");
      activeFilters.classList.toggle("is-visible", chips.length > 0);
    }

    function buildStandardCard(row, rank) {
      const s = row.s;
      const tags = getCompactTagLabels(s, 2);
      const tagsHtml = tags.map((tag) => `<span class="compact-tag">${escapeHtml(tag)}</span>`).join("");
      const deltaClass = row.g.rate > 0 ? "up" : row.g.rate < 0 ? "down" : "flat";
      const deltaText = `${row.g.rate > 0 ? "+" : row.g.rate < 0 ? "-" : "±"}${Math.abs(row.g.rate).toFixed(1)}%`;
      return `
        <span class="compact-rank-badge">${rank}位</span>
        <span class="compact-thumb-wrap">
          ${s.imageUrl
            ? `<img class="compact-thumb" src="${escapeHtml(s.imageUrl)}" alt="${escapeHtml(s.name ?? "")}" loading="lazy" referrerpolicy="no-referrer"
                onerror="this.onerror=null; this.style.display='none';">`
            : ""}
        </span>
        <h3 class="compact-card-title">${escapeHtml(s.name ?? "")}</h3>
        <div class="compact-price-row">
          <div class="compact-price">${row.g.latest.price.toLocaleString()}円</div>
          <div class="compact-delta ${deltaClass}">${escapeHtml(deltaText)}</div>
        </div>
        ${tagsHtml ? `<div class="compact-tags">${tagsHtml}</div>` : ""}
      `;
    }

    // -----------------------------
    // main
    // -----------------------------
    async function main() {
      await window.common.setupDashboardChrome({ sidebarActive: "growth", topbarActive: "market" });
      const list = document.getElementById("list");
      const top3 = document.getElementById("top3");
      const top1 = document.getElementById("top1");
      const top2 = document.getElementById("top2");
      const top3Card = document.getElementById("top3Card");
      const restSection = document.getElementById("restSection");
      const metricSel = document.getElementById("metric");
      const daysSel = document.getElementById("days");
      const releaseYearSel = document.getElementById("releaseYear");
      const seriesSel = document.getElementById("series");
      const minRateSel = document.getElementById("minRate");
      const clearBtn = document.getElementById("clear");
      const activeFilters = document.getElementById("activeFilters");

      let data;
      try {
        data = await loadData();
      } catch (e) {
        showError(e.message || "不明なエラーが発生しました");
        return;
      }
      hideError();

      const sleeves = Array.isArray(data.sleeves) ? data.sleeves : [];
      const latestWeek = getGlobalLatestTradeWeek(sleeves);

      // 最終更新（直近取引週の最大日付）
      try {
        if (latestWeek) {
          const u = document.getElementById("updatedAt");
          if (u) u.textContent = `最新認識週: ${latestWeek}`;
        }
      } catch (_) { }

      // セレクト初期化
      const releaseYears = uniq(sleeves.map(s => s.releaseYear)).map(Number).filter(Number.isFinite).sort((a, b) => a - b);
      const seriesList = uniq(sleeves.map(s => s.series)).sort();

      for (const y of releaseYears) {
        const opt = document.createElement("option");
        opt.value = String(y);
        opt.textContent = String(y);
        releaseYearSel.appendChild(opt);
      }
      for (const ser of seriesList) {
        const opt = document.createElement("option");
        opt.value = ser;
        opt.textContent = ser;
        seriesSel.appendChild(opt);
      }

      function render() {
        const metric = metricSel.value;
        const days = Number(daysSel.value || "30");
        const releaseYear = releaseYearSel.value;
        const series = seriesSel.value;
        const minRate = Number(minRateSel.value || "-999");

        list.innerHTML = "";
        top1.innerHTML = "";
        top2.innerHTML = "";
        top3Card.innerHTML = "";
        top3.hidden = true;
        restSection.hidden = false;
        renderActiveFilters(metricSel, daysSel, releaseYearSel, seriesSel, minRateSel);

        const rows = [];
        for (const s of sleeves) {
          if (releaseYear && String(s.releaseYear ?? "") !== releaseYear) continue;
          if (series && String(s.series || "") !== series) continue;

          const g = computeGrowth(s, days, latestWeek);
          if (!g) continue;

          // 上昇率フィルタ（指定なしなら -999）
          if (Number.isFinite(minRate) && minRate > -900) {
            if (g.rate < minRate) continue;
          }

          const detailHref = (window.common && typeof window.common.buildSleeveDetailHref === "function")
            ? window.common.buildSleeveDetailHref(s.id ?? "")
            : `./sleeve/${encodeURIComponent(s.id ?? "")}/`;
          rows.push({ s, g, detailHref, marketRange: getMarketRange(s) });
        }

        // sort
        rows.sort((a, b) => {
          if (metric === "diffDesc") {
            if (b.g.diff !== a.g.diff) return b.g.diff - a.g.diff;
            return b.g.rate - a.g.rate;
          }
          // rateDesc
          if (b.g.rate !== a.g.rate) return b.g.rate - a.g.rate;
          return b.g.diff - a.g.diff;
        });

        const c = document.getElementById("countInfo");
        if (c) c.textContent = `${rows.length.toLocaleString()}件 / ${latestWeek ? `${latestWeek}週基準` : "最新週不明"} / ${days}日比較`;

        if (rows.length === 0) {
          list.innerHTML = `<div class="card"><div class="title">該当なし</div><div class="meta">条件に一致するスリーブがありません</div></div>`;
          return;
        }

        const topRows = rows.slice(0, 3);
        if (topRows.length) {
          top3.hidden = false;
          top1.innerHTML = buildPodiumCard(topRows[0], 1);
          if (topRows[1]) top2.innerHTML = buildPodiumCard(topRows[1], 2);
          if (topRows[2]) top3Card.innerHTML = buildPodiumCard(topRows[2], 3);
        }

        const normalRows = rows.slice(3);
        restSection.hidden = normalRows.length === 0;

        const frag = document.createDocumentFragment();

        for (let i = 0; i < normalRows.length; i++) {
          const row = normalRows[i];
          const rank = i + 4;
          const card = document.createElement("a");
          card.className = "compact-card";
          card.href = row.detailHref;
          card.setAttribute("data-sleeve-link", "1");
          card.setAttribute("aria-label", `${String(row.s.name ?? "")}の詳細を見る`);
          card.innerHTML = buildStandardCard(row, rank);
          frag.appendChild(card);
        }

        list.appendChild(frag);
      }

      // events
      metricSel.addEventListener("change", render);
      daysSel.addEventListener("change", render);
      releaseYearSel.addEventListener("change", render);
      seriesSel.addEventListener("change", render);
      minRateSel.addEventListener("change", render);

      clearBtn.addEventListener("click", () => {
        metricSel.value = "rateDesc";
        daysSel.value = "30";
        releaseYearSel.value = "";
        seriesSel.value = "";
        minRateSel.value = "-999";
        render();
      });

      if (activeFilters) {
        activeFilters.addEventListener("click", (event) => {
          const button = event.target.closest("[data-filter-key]");
          if (!button) return;
          const key = button.getAttribute("data-filter-key");
          if (key === "metric") metricSel.value = "rateDesc";
          if (key === "days") daysSel.value = "30";
          if (key === "releaseYear") releaseYearSel.value = "";
          if (key === "series") seriesSel.value = "";
          if (key === "minRate") minRateSel.value = "-999";
          render();
        });
      }

      render();
    }

  document.addEventListener("site:injected", () => {
    main();
  });
    
  </script>
</body>

</html>
