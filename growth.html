<head>

  <title>鬮倬ｨｰ邇・Λ繝ｳ繧ｭ繝ｳ繧ｰ・懊・繧ｱ繧ｹ繝ｪ逶ｸ蝣ｴ繝翫ン</title>
  <meta name="description" content="繝昴こ繧ｫ繧ｹ繝ｪ繝ｼ繝悶・鬮倬ｨｰ邇・Λ繝ｳ繧ｭ繝ｳ繧ｰ・・0譌･・峨ｒ謗ｲ霈峨よ､懃ｴ｢繝ｻ邨槭ｊ霎ｼ縺ｿ縺ｧ逶ｸ蝣ｴ繧呈ｯ碑ｼ・〒縺阪∪縺吶・>

<body>
  <!-- 蜈ｱ騾壹・繝・ム繝ｼ蟾ｮ縺苓ｾｼ縺ｿ -->
  <div id="site-header"></div>

  <div class="container">
    <div class="hero">
      <div class="hero-card">
        <div>
          <p class="hero-title">鬮倬ｨｰ邇・Λ繝ｳ繧ｭ繝ｳ繧ｰ</p>
          <p class="hero-desc">逶ｴ霑代・蜿門ｼ暮ｱ縺九ｉ30譌･蜑肴凾轤ｹ縺ｮ萓｡譬ｼ縺ｨ豈碑ｼ・＠縲∽ｸ頑・邇・′鬮倥＞鬆・↓繝ｩ繝ｳ繧ｭ繝ｳ繧ｰ陦ｨ遉ｺ縺励∪縺吶・/p>
          <p class="data-note">窶ｻ萓｡譬ｼ縺ｯ繝輔Μ繝槭い繝励Μ遲峨・螢ｲ蜊ｴ螻･豁ｴ繧偵ｂ縺ｨ縺ｫ迢ｬ閾ｪ髮・ｨ医＠縺ｦ縺・∪縺吶・/p>
          <p id="updatedAt" class="data-note" style="display:none;"></p>
          <p id="countInfo" class="data-note" style="display:none;"></p>
        </div>
      </div>
    </div>

    <div class="main">
      <aside class="panel">
        <h2>邨槭ｊ霎ｼ縺ｿ</h2>
        <p class="small">譚｡莉ｶ繧貞､画峩縺吶ｋ縺ｨ繝ｩ繝ｳ繧ｭ繝ｳ繧ｰ縺梧峩譁ｰ縺輔ｌ縺ｾ縺吶・/p>

        <div id="error" class="error"></div>

        <div class="controls">
          <label>謖・ｨ・
            <select id="metric">
              <option value="rateDesc">荳頑・邇・ｼ・・・/option>
              <option value="diffDesc">荳頑・鬘搾ｼ亥・・・/option>
            </select>
          </label>

          <label>譛滄俣
            <select id="days">
              <option value="30">30譌･</option>
              <option value="14">14譌･</option>
              <option value="60">60譌･</option>
              <option value="90">90譌･</option>
            </select>
          </label>

          <label>逋ｺ螢ｲ蟷ｴ
            <select id="releaseYear">
              <option value="">蜈ｨ驛ｨ</option>
            </select>
          </label>

          <label>繧ｷ繝ｪ繝ｼ繧ｺ
            <select id="series">
              <option value="">蜈ｨ驛ｨ</option>
            </select>
          </label>

          <label>譛菴惹ｸ頑・邇・ｼ・・・
            <select id="minRate">
              <option value="-999">謖・ｮ壹↑縺・/option>
              <option value="0">0%莉･荳・/option>
              <option value="10">+10%莉･荳・/option>
              <option value="20">+20%莉･荳・/option>
              <option value="30">+30%莉･荳・/option>
              <option value="50">+50%莉･荳・/option>
              <option value="100">+100%莉･荳・/option>
            </select>
          </label>

          <button id="clear" type="button">繧ｯ繝ｪ繧｢</button>
        </div>
      </aside>

      <main>
        <div id="list" class="grid"></div>
      </main>
    </div>

    <!-- 蜈ｱ騾壹ヵ繝・ち繝ｼ蟾ｮ縺苓ｾｼ縺ｿ -->
    <div id="site-footer"></div>
  </div>

  <!-- 蜈ｱ騾哽S・・eader/footer蟾ｮ縺苓ｾｼ縺ｿ & nav active 遲会ｼ・-->
  <script src="./assets/common.js"></script>

  <script>

    // -----------------------------
    // utils
    // -----------------------------
    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "block";
      el.textContent = msg;
    }

    function hideError() {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "none";
      el.textContent = "";
    }

    function uniq(arr) {
      const s = new Set();
      for (const v of arr) {
        const t = (v == null) ? "" : String(v).trim();
        if (t) s.add(t);
      }
      return Array.from(s);
    }

    function toISODate(d) {
      const dd = new Date(d);
      if (Number.isNaN(dd.getTime())) return null;
      const y = dd.getFullYear();
      const m = String(dd.getMonth() + 1).padStart(2, "0");
      const day = String(dd.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function numOrNull(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    async function fetchJsonWithTimeout(url, { timeoutMs = 12000 } = {}) {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const res = await fetch(url, {
          cache: "no-store",
          signal: controller.signal,
          headers: { "Accept": "application/json" }
        });
        if (!res.ok) throw new Error(`繝・・繧ｿ蜿門ｾ励↓螟ｱ謨励＠縺ｾ縺励◆・・TTP ${res.status}・荏);
        return await res.json();
      } catch (e) {
        if (e && e.name === "AbortError") {
          throw new Error("繝・・繧ｿ蜿門ｾ励′繧ｿ繧､繝繧｢繧ｦ繝医＠縺ｾ縺励◆縲よ凾髢薙ｒ縺翫＞縺ｦ蜀榊ｺｦ縺願ｩｦ縺励￥縺縺輔＞縲・);
        }
        throw e;
      } finally {
        clearTimeout(t);
      }
    }

    async function loadData() {
      if (!window.common || typeof window.common.loadData !== "function") {
        throw new Error("共通データローダーの初期化に失敗しました（assets/common.js）");
      }
      return await window.common.loadData();
    }

    // -----------------------------
    // weekly logic + growth
    // -----------------------------
    function isoToDate(iso) {
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function addDays(iso, days) {
      const d = isoToDate(iso);
      if (!d) return null;
      d.setDate(d.getDate() + days);
      return toISODate(d);
    }

    function getWeeklySortedTrades(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      if (arr.length === 0) return [];

      const map = new Map();

      for (const x of arr) {
        const weekISO = toISODate(x.week);
        if (!weekISO) continue;

        const price = numOrNull(x.price);
        const count = numOrNull(x.count);

        const hasTrade = (count == null) ? (price != null) : (count > 0 && price != null);
        if (!hasTrade) continue;

        map.set(weekISO, { week: weekISO, price, count: count == null ? null : count });
      }

      return Array.from(map.values()).sort((a, b) => a.week.localeCompare(b.week));
    }

    function getLatestTrade(sorted) {
      return (sorted && sorted.length) ? sorted[sorted.length - 1] : null;
    }

    function getPriceAtOrBefore(sorted, targetISO) {
      if (!sorted || sorted.length === 0) return null;
      for (let i = sorted.length - 1; i >= 0; i--) {
        if (sorted[i].week <= targetISO) return sorted[i];
      }
      return null;
    }

    function getTotalTradeCount(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      let sum = 0;
      let hasAny = false;

      for (const x of arr) {
        const c = numOrNull(x.count);
        if (Number.isFinite(c) && c > 0) {
          sum += c;
          hasAny = true;
        }
      }
      return hasAny ? sum : null;
    }

    function computeGrowth(sleeve, days) {
      const sorted = getWeeklySortedTrades(sleeve);
      const latest = getLatestTrade(sorted);
      if (!latest) return null;

      const targetISO = addDays(latest.week, -days);
      if (!targetISO) return null;

      const base = getPriceAtOrBefore(sorted, targetISO);
      if (!base || !Number.isFinite(base.price) || base.price === 0) return null;

      const diff = latest.price - base.price;
      const rate = (diff / base.price) * 100;
      if (!Number.isFinite(rate)) return null;

      return { latest, base, diff, rate };
    }

    function formatGrowthLine(g) {
      const cls = g.diff > 0 ? "up" : g.diff < 0 ? "down" : "flat";
      const sign = g.diff > 0 ? "+" : g.diff < 0 ? "竏・ : "ﾂｱ";
      const arrow = g.diff > 0 ? "竊・ : g.diff < 0 ? "竊・ : "竊・;
      const abs = Math.abs(g.diff);

      const rateAbs = Math.abs(g.rate).toFixed(1);
      const rateSign = g.rate > 0 ? "+" : g.rate < 0 ? "-" : "";

      return `
        <div class="delta">
          <span class="delta-main ${cls}">${arrow} ${sign}${abs.toLocaleString()}蜀・ｼ・{rateSign}${rateAbs}%・・/span>
          <span class="chip">蝓ｺ貅・${escapeHtml(g.base.week)}・・{g.base.price.toLocaleString()}蜀・/span>
          <span class="chip">逶ｴ霑・${escapeHtml(g.latest.week)}・・{g.latest.price.toLocaleString()}蜀・/span>
        </div>
      `;
    }

    // -----------------------------
    // main
    // -----------------------------
    async function main() {
      // common.js 縺・header 繧貞ｷｮ縺苓ｾｼ繧諠ｳ螳壹↑縺ｮ縺ｧ縲∵､懃ｴ｢UI縺ｯ縺昴・縺ｾ縺ｾ蛻ｩ逕ｨ・医・繝ｼ繧ｸ蜀・､懃ｴ｢・・
      const list = document.getElementById("list");
      const searchInput = document.getElementById("search");

      const metricSel = document.getElementById("metric");
      const daysSel = document.getElementById("days");
      const releaseYearSel = document.getElementById("releaseYear");
      const seriesSel = document.getElementById("series");
      const minRateSel = document.getElementById("minRate");
      const clearBtn = document.getElementById("clear");

      // 蠢ｵ縺ｮ縺溘ａ・喇eader蟾ｮ縺苓ｾｼ縺ｿ縺碁≦縺・→ search 縺後∪縺辟｡縺・・縺ｧ蠕・▽
      const waitForSearch = async () => {
        for (let i = 0; i < 20; i++) {
          const s = document.getElementById("search");
          if (s) return s;
          await new Promise(r => setTimeout(r, 50));
        }
        return null;
      };

      const sEl = searchInput || await waitForSearch();
      if (!sEl) {
        showError("讀懃ｴ｢繝舌・縺瑚ｦ九▽縺九ｊ縺ｾ縺帙ｓ・・eader隱ｭ縺ｿ霎ｼ縺ｿ縺ｫ螟ｱ謨励＠縺ｦ縺・ｋ蜿ｯ閭ｽ諤ｧ縺後≠繧翫∪縺呻ｼ・);
        return;
      }

      let data;
      try {
        data = await loadData();
      } catch (e) {
        showError(e.message || "荳肴・縺ｪ繧ｨ繝ｩ繝ｼ縺檎匱逕溘＠縺ｾ縺励◆");
        return;
      }
      hideError();

      const sleeves = Array.isArray(data.sleeves) ? data.sleeves : [];

      // 譛邨よ峩譁ｰ・育峩霑大叙蠑暮ｱ縺ｮ譛螟ｧ譌･莉假ｼ・
      try {
        let maxWeek = null;
        for (const s of sleeves) {
          const sorted = getWeeklySortedTrades(s);
          const latest = getLatestTrade(sorted);
          if (!latest) continue;
          const w = latest.week;
          if (!maxWeek || w > maxWeek) maxWeek = w;
        }
        if (maxWeek) {
          const u = document.getElementById("updatedAt");
          u.textContent = `譛邨よ峩譁ｰ・・{maxWeek}・磯ｱ谺｡・荏;
          u.style.display = "block";
        }
      } catch (_) { }

      // 繧ｻ繝ｬ繧ｯ繝亥・譛溷喧
      const releaseYears = uniq(sleeves.map(s => s.releaseYear)).map(Number).filter(Number.isFinite).sort((a, b) => a - b);
      const seriesList = uniq(sleeves.map(s => s.series)).sort();

      for (const y of releaseYears) {
        const opt = document.createElement("option");
        opt.value = String(y);
        opt.textContent = String(y);
        releaseYearSel.appendChild(opt);
      }
      for (const ser of seriesList) {
        const opt = document.createElement("option");
        opt.value = ser;
        opt.textContent = ser;
        seriesSel.appendChild(opt);
      }

      function render() {
        const kw = sEl.value.trim().toLowerCase();
        const metric = metricSel.value;
        const days = Number(daysSel.value || "30");
        const releaseYear = releaseYearSel.value;
        const series = seriesSel.value;
        const minRate = Number(minRateSel.value || "-999");

        list.innerHTML = "";

        const rows = [];
        for (const s of sleeves) {
          if (kw && !String(s.name || "").toLowerCase().includes(kw)) continue;
          if (releaseYear && String(s.releaseYear ?? "") !== releaseYear) continue;
          if (series && String(s.series || "") !== series) continue;

          const g = computeGrowth(s, days);
          if (!g) continue;

          // 荳頑・邇・ヵ繧｣繝ｫ繧ｿ・域欠螳壹↑縺励↑繧・-999・・
          if (Number.isFinite(minRate) && minRate > -900) {
            if (g.rate < minRate) continue;
          }

          rows.push({ s, g });
        }

        // sort
        rows.sort((a, b) => {
          if (metric === "diffDesc") {
            if (b.g.diff !== a.g.diff) return b.g.diff - a.g.diff;
            return b.g.rate - a.g.rate;
          }
          // rateDesc
          if (b.g.rate !== a.g.rate) return b.g.rate - a.g.rate;
          return b.g.diff - a.g.diff;
        });

        const c = document.getElementById("countInfo");
        c.textContent = `陦ｨ遉ｺ莉ｶ謨ｰ・・{rows.length.toLocaleString()}莉ｶ・・{days}譌･豈碑ｼ・ｼ荏;
        c.style.display = "block";

        if (rows.length === 0) {
          list.innerHTML = `<div class="card"><div class="title">隧ｲ蠖薙↑縺・/div><div class="meta">譚｡莉ｶ縺ｫ荳閾ｴ縺吶ｋ繧ｹ繝ｪ繝ｼ繝悶′縺ゅｊ縺ｾ縺帙ｓ</div></div>`;
          return;
        }

        const frag = document.createDocumentFragment();

        for (let i = 0; i < rows.length; i++) {
          const row = rows[i];
          const rank = i + 1;

          const s = row.s;
          const g = row.g;

          const totalTrades = getTotalTradeCount(s);
          const totalTradesText = (totalTrades == null) ? "窶・ : `${totalTrades.toLocaleString()}莉ｶ`;

          const imgSrc = String(s.imageUrl || "").trim();
          const imgHtml = imgSrc
            ? `<img class="thumb" src="${escapeHtml(imgSrc)}" alt="${escapeHtml(s.name ?? "")}" loading="lazy" referrerpolicy="no-referrer"
                 onerror="this.onerror=null; this.style.display='none';">`
            : "";

          const div = document.createElement("div");
          div.className = "card";

          const latestPriceText = `${g.latest.price.toLocaleString()}蜀・;
          const growthHtml = formatGrowthLine(g);

          div.innerHTML = `
            ${imgHtml}

            <div class="rank-row">
              <span class="rank-badge">${rank}菴・/span>
              <div class="title" style="margin:0;">${escapeHtml(s.name ?? "")}</div>
            </div>

            <div class="price">${latestPriceText} <span class="meta">・育峩霑大叙蠑暮ｱ・・/span></div>

            ${growthHtml}

            <div class="badges">
              <span class="badge">邱丞叙蠑包ｼ・{escapeHtml(totalTradesText)}</span>
              <span class="badge">逋ｺ螢ｲ蟷ｴ・・{escapeHtml(s.releaseYear ?? "")}</span>
              <span class="badge">${escapeHtml(s.condition ?? "")}</span>
              <span class="badge">${escapeHtml(s.series ?? "")}</span>
            </div>

            <a class="btn" href="./detail.html?id=${encodeURIComponent(s.id ?? "")}">萓｡譬ｼ謗ｨ遘ｻ繧定ｦ九ｋ 竊・/a>
          `;
          frag.appendChild(div);
        }

        list.appendChild(frag);
      }

      // events
      let t = null;
      sEl.addEventListener("input", () => {
        clearTimeout(t);
        t = setTimeout(render, 80);
      });

      metricSel.addEventListener("change", render);
      daysSel.addEventListener("change", render);
      releaseYearSel.addEventListener("change", render);
      seriesSel.addEventListener("change", render);
      minRateSel.addEventListener("change", render);

      clearBtn.addEventListener("click", () => {
        sEl.value = "";
        metricSel.value = "rateDesc";
        daysSel.value = "30";
        releaseYearSel.value = "";
        seriesSel.value = "";
        minRateSel.value = "-999";
        render();
      });

      render();
    }

  document.addEventListener("site:injected", () => {
    main();
  });
    
  </script>
</body>
