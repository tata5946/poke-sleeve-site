<!DOCTYPE html>
<html lang="ja">

<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="./assets/site.css" />

  <style>
    .detail-wrap {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
    }

    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin: 0 0 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .breadcrumb a {
      color: #1e5bd7;
      text-decoration: none;
      font-weight: 800;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .breadcrumb-sep {
      color: #98a2b3;
    }

    .breadcrumb-current {
      color: #344054;
      font-weight: 800;
    }

    .detail-left,
    .detail-right {
      min-width: 0;
    }

    .detail-right {
      display: none;
    }

    .detail-price-grid {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
    }

    .detail-hero {
      display: grid;
      grid-template-columns: 264px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      padding: 12px;
      border: 1px solid #e4e7ec;
      border-radius: 12px;
      background:
        radial-gradient(circle at top right, rgba(30, 91, 215, 0.07), transparent 36%),
        linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
      box-shadow: 0 8px 20px rgba(16, 24, 40, 0.05);
      font-family: "Noto Sans JP", "Noto Sans", sans-serif;
    }

    .detail-hero .thumb {
      width: 264px;
      height: 264px;
      padding: 4px;
      border: 1px solid #dbe5f2;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
      object-fit: contain;
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    }

    .detail-hero-main {
      min-width: 0;
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .name {
      font-size: clamp(24px, 3.1vw, 30px);
      font-weight: 900;
      margin: 0;
      line-height: 1.18;
      color: #101828;
      letter-spacing: -0.015em;
    }

    .detail-info-card {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(248, 250, 252, 0.9);
      display: grid;
      gap: 8px;
    }

    .detail-meta-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .detail-meta-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #d7e1f0;
      background: #fff;
      color: #1f2937;
      line-height: 1.2;
    }

    .detail-meta-chip-label {
      font-size: 10px;
      color: #667085;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .detail-meta-chip-value {
      min-width: 0;
      font-size: 12px;
      line-height: 1.2;
      color: #101828;
      font-weight: 900;
      word-break: break-word;
    }

    .kpi {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .detail-tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .detail-tag {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid #d7e1f0;
      background: #fff;
      color: #1f3a66;
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      text-decoration: none;
      transition: transform .16s ease, opacity .16s ease;
    }

    .detail-tag:hover,
    .detail-tag:focus-visible {
      text-decoration: none;
      transform: translateY(-1px);
    }

    .detail-tag--pokemon {
      background: #ecfdf3;
      border-color: #a6f4c5;
      color: #05603a;
    }

    .detail-tag--series {
      background: #eff4ff;
      border-color: #bfd4ff;
      color: #1849a9;
    }

    .detail-tag--category {
      background: #fff4ed;
      border-color: #ffd0b5;
      color: #b54708;
    }

    .detail-note {
      display: grid;
      gap: 4px;
      padding-top: 2px;
    }

    .detail-note-box {
      padding: 10px 12px;
      border: 1px solid #dbe5f2;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.88);
    }

    .box {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: linear-gradient(180deg, #fff 0%, #fbfcff 100%);
      box-shadow: 0 6px 16px rgba(16, 24, 40, .06);
      padding: 12px;
    }

    .box .label {
      font-size: 12px;
      font-weight: 900;
      color: var(--muted);
    }

    .box .value {
      margin-top: 6px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: .2px;
    }

    .chart-wrap {
      position: relative;
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background:
        radial-gradient(circle at top left, rgba(30, 91, 215, .07), transparent 34%),
        linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
      box-shadow: 0 8px 18px rgba(16, 24, 40, .07);
      padding: 10px;
      overflow: hidden;
    }

    .chart-title {
      font-size: 13px;
      font-weight: 900;
      margin: 2px 0 8px;
    }

    .chart-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin: 0 0 8px;
    }

    .chart-zoom-btn {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 900;
      padding: 4px 8px;
      cursor: pointer;
      color: #111;
    }

    .chart-zoom-label {
      font-size: 12px;
      font-weight: 900;
      color: var(--muted);
      min-width: 44px;
      text-align: right;
    }

    .chart-viewport {
      width: 100%;
      overflow: hidden;
    }

    svg.chart {
      width: 100%;
      height: auto;
      display: block;
    }

    .chart-tooltip {
      position: absolute;
      left: 50%;
      top: 8px;
      transform: translateX(-50%);
      background: rgba(17, 17, 17, .92);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      padding: 6px 10px;
      border-radius: 14px;
      display: none;
      pointer-events: none;
      white-space: normal;
      line-height: 1.45;
      text-align: center;
      max-width: min(240px, calc(100% - 16px));
      box-shadow: 0 10px 24px rgba(16, 24, 40, .24);
    }

    .chart-hit-area {
      cursor: crosshair;
    }

    .chart-main-hit {
      cursor: crosshair;
    }

    .chart-nav-hit {
      cursor: grab;
      touch-action: none;
    }

    .chart-range {
      fill: rgba(30, 91, 215, .15);
      stroke: #1e5bd7;
      stroke-width: 1;
      pointer-events: none;
    }

    .chart-handle {
      fill: #fff;
      stroke: #1e5bd7;
      stroke-width: 1.5;
      cursor: ew-resize;
      pointer-events: none;
    }

    .table-wrap {
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: auto;
      max-height: min(46vh, 420px);
      background: #fff;
      box-shadow: 0 6px 16px rgba(16, 24, 40, .06);
    }

    .table-wrap table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12px;
    }

    .table-wrap th,
    .table-wrap td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }

    .table-wrap thead th {
      font-weight: 900;
      background: #fbfcff;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .table-wrap tr:last-child td {
      border-bottom: 0;
    }

    .btn-row {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .btn-row .btn {
      width: 100%;
      text-align: center;
    }

    .btn.primary {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .btn.primary:hover {
      opacity: .92;
    }

    .share-block {
      margin-top: 10px;
    }

    .share-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .share-row .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      cursor: pointer;
      transition: transform .14s ease, box-shadow .18s ease, background-color .18s ease, border-color .18s ease;
    }

    .share-icon {
      width: 14px;
      height: 14px;
      display: inline-block;
      flex: 0 0 14px;
    }

    .btn.share-x {
      border-color: #111;
      color: #111;
    }

    .btn.share-ig {
      border-color: #e1306c;
      color: #e1306c;
    }

    .share-row .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(16, 24, 40, .14);
    }

    .share-row .btn:focus-visible {
      outline: 2px solid #7aa2ff;
      outline-offset: 2px;
    }

    .btn.share-x:hover {
      background: #f3f4f6;
      border-color: #111;
    }

    .btn.share-ig:hover {
      background: #fff1f6;
      border-color: #d91b5c;
      color: #d91b5c;
    }

    .share-status {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
      min-height: 1.2em;
    }

    .granularity-switch {
      margin-top: 10px;
      display: inline-flex;
      gap: 6px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f8fafc;
    }

    .granularity-btn {
      border: 1px solid transparent;
      background: transparent;
      color: #475467;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .granularity-btn.is-active {
      background: #fff;
      color: #111;
      border-color: var(--border);
      box-shadow: 0 2px 8px rgba(16, 24, 40, .1);
    }

    .chart-period-switch {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f8fafc;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .chart-period-btn {
      border: 1px solid transparent;
      background: transparent;
      color: #475467;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .chart-period-btn.is-active {
      background: #fff;
      color: #111;
      border-color: var(--border);
      box-shadow: 0 2px 8px rgba(16, 24, 40, .1);
    }

    .chart-subnote {
      margin-top: 8px;
      font-size: 12px;
      color: #667085;
      line-height: 1.6;
    }

    .price-panel {
      padding: 12px;
      overflow: hidden;
    }

    .price-panel-summary-copy {
      min-width: 0;
    }

    .price-panel-body {
      padding: 0;
    }

    .chart-legend {
      margin-top: 8px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 12px;
      color: #475467;
      font-weight: 700;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .legend-mark {
      font-size: 13px;
      line-height: 1;
      font-weight: 900;
    }

    .chart-footnotes {
      margin-top: 10px;
      display: grid;
      gap: 4px;
      font-size: 12px;
      color: #667085;
      line-height: 1.6;
    }

    .single-observation-card {
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 6px 16px rgba(16, 24, 40, .06);
      padding: 12px;
    }

    .single-observation-title {
      font-size: 13px;
      font-weight: 900;
      margin: 0 0 10px;
    }

    .single-observation-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 8px;
    }

    .single-observation-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fbfcff;
      padding: 8px;
    }

    .single-observation-item .label {
      font-size: 11px;
      color: #667085;
      font-weight: 800;
    }

    .single-observation-item .value {
      margin-top: 4px;
      font-size: 14px;
      color: #101828;
      font-weight: 900;
    }

    .related-sections {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .related-panel h3 {
      margin: 0;
      font-size: 16px;
    }

    .related-note {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    .related-list {
      margin-top: 12px;
      display: grid;
      gap: 10px;
    }

    .related-card {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: linear-gradient(180deg, #fff 0%, #fbfcff 100%);
      color: inherit;
      text-decoration: none;
      transition: transform .16s ease, box-shadow .18s ease, border-color .18s ease;
      box-shadow: 0 6px 16px rgba(16, 24, 40, .06);
    }

    .related-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(16, 24, 40, .12);
      border-color: #b9cdf7;
    }

    .related-card:focus-visible {
      outline: 2px solid #7aa2ff;
      outline-offset: 2px;
    }

    .related-thumb {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f2f4f7;
      box-shadow: 0 4px 10px rgba(16, 24, 40, .08);
    }

    .related-card-body {
      min-width: 0;
    }

    .related-card-name {
      font-size: 13px;
      font-weight: 900;
      color: #101828;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .related-card-price {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 900;
      color: #1e5bd7;
    }

    .related-card-meta {
      margin-top: 6px;
      font-size: 11px;
      color: #667085;
      line-height: 1.5;
    }

    .related-empty {
      padding: 12px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      background: #fbfcff;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    @media (max-width: 900px) {
      .detail-wrap {
        grid-template-columns: 1fr;
      }

      .detail-price-grid {
        grid-template-columns: 1fr;
      }

      .detail-hero {
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 10px;
        padding: 12px;
      }

      .detail-hero .thumb {
        width: 220px;
        height: 220px;
      }

      .detail-info-grid {
        grid-template-columns: 1fr;
      }

      .chart-viewport {
        overflow: hidden;
      }

      svg.chart {
        min-width: 0;
      }

      .chart-wrap {
        padding: 10px 10px 8px;
      }

      .chart-title {
        font-size: 14px;
        margin-bottom: 10px;
      }

      .chart-toolbar {
        justify-content: space-between;
        gap: 4px;
        margin-bottom: 10px;
      }

      .chart-zoom-btn {
        min-height: 34px;
        padding: 6px 8px;
        font-size: 11px;
      }

      .chart-zoom-label {
        min-width: 0;
        font-size: 11px;
        text-align: left;
      }

      .chart-tooltip {
        font-size: 13px;
        line-height: 1.5;
        max-width: min(280px, calc(100% - 16px));
      }

      .single-observation-grid {
        grid-template-columns: 1fr;
      }

      .related-sections {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .detail-hero {
        grid-template-columns: 188px minmax(0, 1fr);
        gap: 8px;
        padding: 10px;
      }

      .detail-hero .thumb {
        width: 188px;
        height: 188px;
        padding: 3px;
      }

      .detail-hero-main {
        gap: 6px;
      }

      .name {
        font-size: 22px;
        line-height: 1.15;
      }

      .detail-info-card {
        padding: 8px 9px;
        gap: 6px;
      }

      .detail-meta-chips,
      .detail-tag-list {
        gap: 6px;
      }

      .detail-meta-chip,
      .detail-tag {
        min-height: 24px;
        padding: 5px 8px;
      }

      .detail-meta-chip-value,
      .detail-tag {
        font-size: 11px;
      }

      .detail-note-box {
        padding: 8px 9px;
      }

      .kpi {
        margin-top: 4px;
        gap: 6px;
      }

      .box {
        padding: 9px 10px;
      }

      .btn-row {
        margin-top: 8px;
        gap: 8px;
      }

      .share-block {
        margin-top: 8px;
      }
    }

    @media (max-width: 420px) {
      .detail-hero {
        grid-template-columns: 1fr;
        gap: 6px;
        padding: 8px;
        border-radius: 10px;
      }

      .detail-hero .thumb {
        width: min(100%, 208px);
        height: 208px;
        margin: 0 auto;
      }

      .detail-info-card {
        padding: 8px;
        gap: 6px;
      }

      .name {
        font-size: 19px;
        text-align: center;
      }

      .detail-tag-list {
        justify-content: center;
        gap: 6px;
      }

      .detail-tag {
        min-height: 24px;
        padding: 0 7px;
        font-size: 11px;
      }

      .kpi {
        margin-top: 6px;
        gap: 6px;
      }

      .box {
        padding: 7px 8px;
        border-radius: 10px;
      }

      .box .label,
      .box .value,
      #weeklyDelta,
      #weeklyCount {
        text-align: center;
      }

      .box .value {
        font-size: 26px;
      }

      .detail-info-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px 10px;
      }

      .detail-info-label,
      .detail-meta-chip-label {
        font-size: 10px;
      }

      .detail-info-value,
      .detail-meta-chip-value {
        font-size: 13px;
      }

      .btn-row,
      .share-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .btn-row .btn,
      .share-row .btn {
        width: 100%;
        text-align: center;
      }

      .chart-period-switch {
        gap: 6px;
        flex-wrap: nowrap;
      }

      .chart-period-btn {
        flex: 0 0 auto;
      }

      .price-panel-body {
        padding: 0;
      }
    }

    @media (max-width: 700px) {
      #weeklyTable,
      #chartLegend,
      #chartFootnotes {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <div class="container">
    <div id="error" class="error"></div>

    <div class="detail-wrap">
      <div class="detail-left">
        <nav class="breadcrumb" aria-label="パンくず">
          <a href="./index.html">ホーム</a>
          <span class="breadcrumb-sep" aria-hidden="true">></span>
          <a href="./sleeves/">スリーブ</a>

    <script>window.__SLEEVE_PAGE_ID = "364681";</script>

  <script src="./assets/common.js"></script>

  <script>
    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "block";
      el.textContent = msg;
    }

    function getParam(name) {
      const u = new URL(location.href);
      return u.searchParams.get(name);
    }

    function getSleeveIdFromPath() {
      const segments = location.pathname.split("/").filter(Boolean);
      const sleeveIndex = segments.findIndex((segment) => segment === "sleeve");
      if (sleeveIndex < 0 || sleeveIndex >= segments.length - 1) return "";
      try {
        return decodeURIComponent(segments[sleeveIndex + 1] || "").trim();
      } catch (_) {
        return String(segments[sleeveIndex + 1] || "").trim();
      }
    }

    function getSleeveId() {
      const embeddedId = String(window.__SLEEVE_PAGE_ID || "").trim();
      if (embeddedId) return embeddedId;
      const pathId = getSleeveIdFromPath();
      if (pathId) return pathId;
      return String(getParam("id") || "").trim();
    }

    async function loadData() {
      if (!window.common || typeof window.common.loadData !== "function") {
        throw new Error("共通データローダーの初期化に失敗しました（assets/common.js）");
      }
      return await window.common.loadData();
    }

    function getStructuredDataScript() {
      let el = document.getElementById("productStructuredData");
      if (el) return el;
      el = document.createElement("script");
      el.type = "application/ld+json";
      el.id = "productStructuredData";
      document.head.appendChild(el);
      return el;
    }

    function getFaqStructuredDataScript() {
      let el = document.getElementById("faqStructuredData");
      if (el) return el;
      el = document.createElement("script");
      el.type = "application/ld+json";
      el.id = "faqStructuredData";
      document.head.appendChild(el);
      return el;
    }

    function updateProductStructuredData(sleeve, latestPrice, releaseDateText) {
      if (!sleeve || typeof sleeve !== "object") return;
      const name = String(sleeve.name || "").trim();
      if (!name) return;

      const imageUrl = String(sleeve.imageUrl || "").trim();
      const price = Number.isFinite(latestPrice) ? latestPrice : null;
      const descriptionParts = [
        name,
        releaseDateText ? `発売日 ${releaseDateText}` : "",
        sleeve.series ? `シリーズ ${String(sleeve.series).trim()}` : "",
        sleeve.condition ? `状態 ${String(sleeve.condition).trim()}` : ""
      ].filter(Boolean);

      const product = {
        "@context": "https://schema.org",
        "@type": "Product",
        name,
        description: descriptionParts.join(" / "),
        image: imageUrl || undefined
      };

      if (price != null) {
        product.offers = {
          "@type": "Offer",
          price,
          priceCurrency: "JPY"
        };
      }

      const script = getStructuredDataScript();
      script.textContent = JSON.stringify(product);
    }

    function updateFaqStructuredData(sleeve, latestPrice, releaseDateText) {
      if (!sleeve || typeof sleeve !== "object") return;
      const name = String(sleeve.name || "").trim();
      if (!name) return;

      const priceText = Number.isFinite(latestPrice) ? `${latestPrice.toLocaleString()}円` : "現在は掲載データを確認してください";
      const releaseText = releaseDateText || "不明";
      const mercariUrl = buildMercariSearchUrl(name);

      const faq = {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "このスリーブの相場は？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": `${name} の最新相場は ${priceText} です。詳細な価格推移はこのページのチャートをご確認ください。`
            }
          },
          {
            "@type": "Question",
            "name": "発売日は？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": `${name} の発売日は ${releaseText} です。`
            }
          },
          {
            "@type": "Question",
            "name": "どこで買える？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": `${name} はフリマアプリや中古ショップなどで購入できます。参考としてメルカリ検索ページは ${mercariUrl} です。`
            }
          }
        ]
      };

      const script = getFaqStructuredDataScript();
      script.textContent = JSON.stringify(faq);
    }

    const ACCESS_USER_ID_KEY = "pokeSleeve:accessUserId";

    function getOrCreateAccessUserId() {
      try {
        const saved = String(localStorage.getItem(ACCESS_USER_ID_KEY) || "").trim();
        if (saved) return saved;
      } catch (_) { }

      let next = "";
      try {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          next = window.crypto.randomUUID();
        }
      } catch (_) { }
      if (!next) next = `u_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;

      try { localStorage.setItem(ACCESS_USER_ID_KEY, next); } catch (_) { }
      return next;
    }

    async function logAccess(pageUrl) {
      const endpoint = (window.common && window.common.GAS_URL) || window.GAS_URL || "";
      if (!endpoint) return;

      const body = {
        action: "access",
        page: String(pageUrl || location.href),
        userAgent: navigator.userAgent || "",
        userId: getOrCreateAccessUserId()
      };

      try {
        await fetch(endpoint, {
          method: "POST",
          mode: "cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8",
            "Accept": "application/json"
          },
          body: JSON.stringify(body)
        });
      } catch (_) { }
    }

    function toISODate(d) {
      const dd = new Date(d);
      if (Number.isNaN(dd.getTime())) return null;
      const y = dd.getFullYear();
      const m = String(dd.getMonth() + 1).padStart(2, "0");
      const day = String(dd.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function formatPeriodLabel(iso) {
      const s = String(iso || "").trim();
      const month = s.match(/^(\d{4})-(\d{2})$/);
      if (month) return `${month[1]}/${Number(month[2])}`;
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return s;
      return `${m[1]}/${m[2]}/${m[3]}`;
    }

    function formatReleaseDate(rawValue) {
      if (rawValue == null) return "";

      // Google Sheets serial date (e.g. 45234 -> 2023/10/05)
      if (typeof rawValue === "number" && Number.isFinite(rawValue)) {
        const serial = rawValue;
        if (serial > 20000 && serial < 80000) {
          const epoch = Date.UTC(1899, 11, 30); // Sheets/Excel serial origin
          const ms = epoch + Math.round(serial * 86400000);
          const d = new Date(ms);
          if (!Number.isNaN(d.getTime())) {
            const y = d.getUTCFullYear();
            const m = String(d.getUTCMonth() + 1).padStart(2, "0");
            const day = String(d.getUTCDate()).padStart(2, "0");
            return `${y}/${m}/${day}`;
          }
        }
      }

      const raw = String(rawValue ?? "").trim();
      if (!raw) return "";

      const ymd = raw.match(/^(\d{4})[\/\-\.年](\d{1,2})[\/\-\.月](\d{1,2})(?:日)?$/);
      if (ymd) {
        return `${ymd[1]}/${String(Number(ymd[2])).padStart(2, "0")}/${String(Number(ymd[3])).padStart(2, "0")}`;
      }

      const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})(?:T.*)?$/);
      if (iso) return `${iso[1]}/${iso[2]}/${iso[3]}`;

      const d = new Date(raw);
      if (!Number.isNaN(d.getTime())) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}/${m}/${day}`;
      }

      return raw;
    }

    function buildReleaseDateFromParts(sleeve) {
      const y = Number(sleeve?.releaseYear ?? sleeve?.release_year ?? sleeve?.["発売年"]);
      const m = Number(sleeve?.releaseMonth ?? sleeve?.release_month ?? sleeve?.["発売月"]);
      const d = Number(sleeve?.releaseDay ?? sleeve?.release_day ?? sleeve?.["発売日"]);
      if (Number.isFinite(y) && Number.isFinite(m) && Number.isFinite(d) && y > 1900 && m >= 1 && m <= 12 && d >= 1 && d <= 31) {
        return `${String(y).padStart(4, "0")}/${String(m).padStart(2, "0")}/${String(d).padStart(2, "0")}`;
      }
      return "";
    }

    function findReleaseDateByKeyHeuristic(sleeve) {
      if (!sleeve || typeof sleeve !== "object") return "";
      for (const [k, v] of Object.entries(sleeve)) {
        const key = String(k || "");
        const isDateLikeKey = /release.*(date|at)|released.*(date|at)|発売.*(日|年月日|日付)|発売年月日/i.test(key);
        if (!isDateLikeKey) continue;
        const text = formatReleaseDate(v);
        if (/^\d{4}\/\d{2}\/\d{2}$/.test(text)) return text;
      }
      return "";
    }

    function getReleaseDateText(sleeve) {
      const candidates = [
        sleeve?.releaseDate,
        sleeve?.release_date,
        sleeve?.releaseAt,
        sleeve?.releasedAt,
        sleeve?.releasedDate,
        sleeve?.released_date,
        sleeve?.release_dt,
        sleeve?.releaseDatetime,
        sleeve?.releasedDatetime,
        sleeve?.["発売日"],
        sleeve?.["発売年月日"],
        sleeve?.["発売日付"],
        sleeve?.["リリース日"]
      ];

      for (const c of candidates) {
        const text = formatReleaseDate(c);
        if (/^\d{4}\/\d{2}\/\d{2}$/.test(text)) return text;
      }

      const fromParts = buildReleaseDateFromParts(sleeve);
      if (fromParts) return fromParts;

      const byHeuristic = findReleaseDateByKeyHeuristic(sleeve);
      if (byHeuristic) return byHeuristic;

      for (const c of candidates) {
        const text = formatReleaseDate(c);
        if (text) return text;
      }

      const y = String(sleeve?.releaseYear ?? "").trim();
      if (y) return y;
      return "不明";
    }

    function getTextValue(value) {
      return String(value ?? "").trim();
    }

    function getReleaseYearText(sleeve) {
      const year = String(sleeve?.releaseYear ?? sleeve?.release_year ?? sleeve?.["発売年"] ?? "").trim();
      return year ? `${year}年` : "";
    }

    function getDetailFieldRows(sleeve) {
      return [
        { label: "発売日", value: getReleaseDateText(sleeve) },
        { label: "公式/非公式", value: getTextValue(sleeve?.series) },
        { label: "種類", value: getTextValue(sleeve?.type) },
        { label: "販売元", value: getTextValue(sleeve?.acquisitionType) }
      ].filter((row) => row.value && row.value !== "不明");
    }

    function getDetailCategoryGroups(sleeve) {
      if (window.common && typeof window.common.getSleeveCategoryBuckets === "function") {
        const buckets = window.common.getSleeveCategoryBuckets(sleeve);
        return [
          { label: "ポケモン", values: Array.isArray(buckets.pokemon) ? buckets.pokemon : [] },
          { label: "シリーズ", values: Array.isArray(buckets.trainer) ? buckets.trainer : [] },
          { label: "カテゴリー", values: Array.isArray(buckets.category) ? buckets.category : [] }
        ];
      }

      const read = (keys) => {
        const values = [];
        for (const key of keys) {
          const value = getTextValue(sleeve?.[key]);
          if (value) values.push(value);
        }
        return Array.from(new Set(values));
      };

      return [
        { label: "ポケモン", values: read(["category1", "category2", "category3"]) },
        { label: "シリーズ", values: read(["category4", "category5", "category6"]) },
        { label: "カテゴリー", values: read(["category7", "category8", "category9"]) }
      ];
    }

    function buildHeaderBadges(sleeve) {
      return "";
    }

    function renderDetailTags(sleeve) {
      const root = document.getElementById("detailTags");
      if (!root) return;

      const categoryGroups = getDetailCategoryGroups(sleeve);
      const pokemonGroup = categoryGroups.find((group) => group.label === "ポケモン");
      const seriesGroup = categoryGroups.find((group) => group.label === "シリーズ");
      const categoryGroup = categoryGroups.find((group) => group.label === "カテゴリー");
      const chips = [];
      const addChip = (value, tone, groupKey) => {
        const text = getTextValue(value);
        if (!text || text === "不明") return;
        const href = (window.common && typeof window.common.buildSleeveCategoryHref === "function")
          ? window.common.buildSleeveCategoryHref(groupKey, text)
          : `./sleeves/?group=${encodeURIComponent(groupKey)}&tag=${encodeURIComponent(text)}`;
        chips.push(`<a class="detail-tag detail-tag--${tone}" href="${escapeHtml(href)}">${escapeHtml(text)}</a>`);
      };

      for (const value of pokemonGroup?.values || []) {
        addChip(value, "pokemon", "pokemon");
      }
      for (const value of seriesGroup?.values || []) {
        addChip(value, "series", "series");
      }
      for (const value of categoryGroup?.values || []) {
        addChip(value, "category", "category");
      }

      const uniqueChips = Array.from(new Set(chips));
      if (!uniqueChips.length) {
        root.hidden = true;
        root.innerHTML = "";
        return;
      }

      root.innerHTML = uniqueChips.join("");
      root.hidden = false;
    }

    function renderDetailInfo(sleeve) {
      const root = document.getElementById("detailInfo");
      if (!root) return;

      const fieldRows = getDetailFieldRows(sleeve);
      const note = getTextValue(sleeve?.note);

      if (!fieldRows.length && !note) {
        root.hidden = true;
        root.innerHTML = "";
        return;
      }

      const fieldHtml = fieldRows.length
        ? `<div class="detail-meta-chips">
            ${fieldRows.map((row) => `
              <span class="detail-meta-chip">
                <span class="detail-meta-chip-label">${escapeHtml(row.label)}</span>
                <span class="detail-meta-chip-value">${escapeHtml(row.value)}</span>
              </span>
            `).join("")}
          </div>`
        : "";

      const noteHtml = note
        ? `<div class="detail-note detail-note-box">
            <div class="detail-info-label">備考</div>
            <div class="detail-info-value">${escapeHtml(note)}</div>
          </div>`
        : "";

      root.innerHTML = `${fieldHtml}${noteHtml}`;
      root.hidden = false;
    }

    function getSleeveCharacter(sleeve) {
      return String(
        sleeve?.character ??
        sleeve?.characters ??
        sleeve?.chara ??
        sleeve?.["character"] ??
        ""
      ).trim();
    }

    function getSleeveCurrentPrice(sleeve) {
      const direct = Number(
        sleeve?.current?.price ??
        sleeve?.currentPrice ??
        sleeve?.price ??
        NaN
      );
      if (Number.isFinite(direct) && direct > 0) return direct;
      return getLatestComparablePrice(sleeve);
    }

    function getLatestComparablePrice(sleeve) {
      const rows = normalizeObservationRows(sleeve?.weeklyPrices);
      const latest = rows.filter((row) => row.hasTrade && Number.isFinite(row.avgPrice)).slice(-1)[0] || null;
      return latest && Number.isFinite(latest.avgPrice) ? latest.avgPrice : null;
    }

    function formatRelatedPrice(price) {
      return Number.isFinite(price) ? `${Math.round(price).toLocaleString()}円` : "価格データなし";
    }

    function buildRelatedSleeveHref(id) {
      if (window.common && typeof window.common.buildSleeveDetailHref === "function") {
        return window.common.buildSleeveDetailHref(id ?? "");
      }
      return `./sleeve/${encodeURIComponent(id ?? "")}/`;
    }

    function buildRelatedSleeveCardHtml(sleeve, options = {}) {
      if (!sleeve || !sleeve.id) return "";
      const safeOptions = options && typeof options === "object" ? options : {};
      const latestPrice = getLatestComparablePrice(sleeve);
      const href = buildRelatedSleeveHref(sleeve.id);
      const imgSrc = String(sleeve.imageUrl || "").trim();
      const metaParts = [
        String(sleeve.series || "").trim(),
        sleeve.releaseYear ? `${sleeve.releaseYear}年` : "",
        String(sleeve.condition || "").trim()
      ].filter(Boolean);
      const extraMeta = String(safeOptions.extraMeta || "").trim();
      if (extraMeta) metaParts.push(extraMeta);

      return `
        <a class="related-card" data-sleeve-link="1" href="${escapeHtml(href)}" aria-label="${escapeHtml(sleeve.name || "")}の詳細を見る">
          <img class="related-thumb" src="${escapeHtml(imgSrc)}" alt="${escapeHtml(sleeve.name || "")}" loading="lazy" referrerpolicy="no-referrer"
            onerror="this.onerror=null; this.style.visibility='hidden';">
          <div class="related-card-body">
            <div class="related-card-name">${escapeHtml(sleeve.name || "")}</div>
            <div class="related-card-price">${escapeHtml(formatRelatedPrice(latestPrice))}</div>
            <div class="related-card-meta">${escapeHtml(metaParts.join(" / ") || "シリーズ情報なし")}</div>
          </div>
        </a>
      `;
    }

    function renderRelatedList(containerId, items, emptyText, decorateItem) {
      const container = document.getElementById(containerId);
      if (!container) return false;
      if (!Array.isArray(items) || !items.length) {
        container.innerHTML = `<div class="related-empty">${escapeHtml(emptyText)}</div>`;
        return false;
      }
      container.innerHTML = items.map((item) => buildRelatedSleeveCardHtml(item, decorateItem ? decorateItem(item) : undefined)).join("");
      return true;
    }

    function uniqueSleeves(items) {
      const seen = new Set();
      const out = [];
      for (const item of (Array.isArray(items) ? items : [])) {
        const id = String(item?.id || "");
        if (!id || seen.has(id)) continue;
        seen.add(id);
        out.push(item);
      }
      return out;
    }

    function fillRelatedItems(primaryItems, fallbackGroups, limit) {
      const filled = uniqueSleeves(primaryItems).slice(0, limit);
      const seen = new Set(filled.map((item) => String(item?.id || "")));
      for (const group of fallbackGroups) {
        for (const item of uniqueSleeves(group)) {
          const id = String(item?.id || "");
          if (!id || seen.has(id)) continue;
          filled.push(item);
          seen.add(id);
          if (filled.length >= limit) return filled;
        }
      }
      return filled;
    }

    function renderRelatedSleeves(currentSleeve, sleeves) {
      const wrap = document.getElementById("relatedSections");
      if (!wrap || !currentSleeve || !Array.isArray(sleeves)) return;

      const currentId = String(currentSleeve.id || "");
      const currentCharacter = getSleeveCharacter(currentSleeve);
      const currentSeries = String(currentSleeve.series || "").trim();
      const currentPrice = getSleeveCurrentPrice(currentSleeve);
      const candidates = sleeves.filter((item) => item && String(item.id || "") && String(item.id) !== currentId);
      const sortedByPriceDistance = candidates
        .map((item) => ({ item, price: getSleeveCurrentPrice(item) }))
        .sort((a, b) => {
          const ap = a.price;
          const bp = b.price;
          if (Number.isFinite(currentPrice) && Number.isFinite(ap) && Number.isFinite(bp)) {
            const diff = Math.abs(ap - currentPrice) - Math.abs(bp - currentPrice);
            if (diff !== 0) return diff;
          }
          if (Number.isFinite(bp) && Number.isFinite(ap) && bp !== ap) return bp - ap;
          return String(a.item?.name || "").localeCompare(String(b.item?.name || ""), "ja");
        })
        .map((entry) => entry.item);

      const sameCharacterPrimary = candidates
        .filter((item) => currentCharacter && getSleeveCharacter(item) === currentCharacter);

      const sameSeriesPrimary = candidates
        .filter((item) => String(item.series || "").trim() && String(item.series || "").trim() === currentSeries)
        .sort((a, b) => {
          const ap = getSleeveCurrentPrice(a) ?? -1;
          const bp = getSleeveCurrentPrice(b) ?? -1;
          if (bp !== ap) return bp - ap;
          return String(a.name || "").localeCompare(String(b.name || ""), "ja");
        });

      const closePricePrimary = Number.isFinite(currentPrice)
        ? candidates
          .map((item) => ({ item, price: getSleeveCurrentPrice(item) }))
          .filter((entry) => Number.isFinite(entry.price) && entry.price >= currentPrice * 0.7 && entry.price <= currentPrice * 1.3)
          .sort((a, b) => {
            const diff = Math.abs(a.price - currentPrice) - Math.abs(b.price - currentPrice);
            if (diff !== 0) return diff;
            return a.price - b.price;
          })
          .map((entry) => entry.item)
        : [];

      const sameCharacter = fillRelatedItems(sameCharacterPrimary, [sameSeriesPrimary, closePricePrimary, sortedByPriceDistance], 6);
      const sameSeries = fillRelatedItems(sameSeriesPrimary, [sameCharacterPrimary, closePricePrimary, sortedByPriceDistance], 6);
      const closePrice = fillRelatedItems(closePricePrimary, [sameCharacterPrimary, sameSeriesPrimary, sortedByPriceDistance], 6);

      const hasCharacter = renderRelatedList("relatedCharacter", sameCharacter, "同じキャラクターのスリーブはまだありません。");
      const hasSeries = renderRelatedList("relatedSeries", sameSeries, "同シリーズのスリーブはまだありません。");
      const hasPrice = renderRelatedList(
        "relatedPriceBand",
        closePrice,
        "価格が近いスリーブはまだありません。",
        (item) => {
          const price = getSleeveCurrentPrice(item);
          if (!Number.isFinite(price) || !Number.isFinite(currentPrice)) return null;
          const diff = Math.round(price - currentPrice);
          const prefix = diff > 0 ? "+" : "";
          return { extraMeta: `差額 ${prefix}${diff.toLocaleString()}円` };
        }
      );

      wrap.hidden = !(hasCharacter || hasSeries || hasPrice);
    }

    function buildMercariSearchUrl(name) {
      const baseName = String(name || "").trim();
      const keyword = baseName ? `${baseName} デッキシールド` : "";
      if (!keyword) return "https://jp.mercari.com/search";
      return `https://jp.mercari.com/search?keyword=${encodeURIComponent(keyword)}`;
    }

    function normalizeWeekly(arr) {
      return (Array.isArray(arr) ? arr : [])
        .map(x => {
          const week = toISODate(x.week);
          const toNum = (v) => {
            if (v == null) return null;
            if (typeof v === "number") return Number.isFinite(v) ? v : null;
            const s = String(v).trim();
            if (!s || s === "-") return null;
            const cleaned = s.replace(/[^\d.\-]/g, "");
            if (!cleaned) return null;
            const n = Number(cleaned);
            return Number.isFinite(n) ? n : null;
          };

          const rawPrice = toNum(x.price);
          const price = (Number.isFinite(rawPrice) && rawPrice > 0) ? rawPrice : null;
          const count = toNum(x.count);
          const hasTrade = (count == null) ? (price != null) : (count > 0 && price != null);

          return { week, price: hasTrade ? price : null, count: count == null ? null : count };
        })
        .filter(x => x.week)
        .sort((a, b) => String(a.week).localeCompare(String(b.week)));
    }

    function toMonthlyFromWeekly(weeklyRows) {
      const buckets = new Map();
      for (const r of (Array.isArray(weeklyRows) ? weeklyRows : [])) {
        const week = String(r?.week || "");
        const m = week.match(/^(\d{4})-(\d{2})-\d{2}$/);
        if (!m) continue;
        const key = `${m[1]}-${m[2]}`;
        if (!buckets.has(key)) buckets.set(key, []);
        buckets.get(key).push(r);
      }

      const monthKeys = Array.from(buckets.keys()).sort((a, b) => a.localeCompare(b));
      const endBase = monthKeys.length ? monthKeys[monthKeys.length - 1] : toISODate(new Date()).slice(0, 7);
      const endDate = new Date(`${endBase}-01T00:00:00`);
      if (Number.isNaN(endDate.getTime())) return [];

      const targetMonths = [];
      const startDate = new Date(endDate.getFullYear() - 1, 0, 1);
      for (let d = new Date(startDate); d <= endDate; d.setMonth(d.getMonth() + 1)) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        targetMonths.push(`${y}-${m}`);
      }

      return targetMonths.map((month) => {
        const rows = buckets.get(month) || [];
        const prices = rows.map(x => x.price).filter(v => Number.isFinite(v));
        const price = prices.length ? Math.round(prices.reduce((sum, v) => sum + v, 0) / prices.length) : null;
        const counts = rows.map(x => x.count).filter(v => Number.isFinite(v));
        const count = counts.length ? counts.reduce((sum, v) => sum + v, 0) : null;
        return { week: month, price, count };
      });
    }

    function formatMonthAxisLabel(isoMonth) {
      const s = String(isoMonth || "");
      const m = s.match(/^(\d{4})-(\d{2})$/);
      if (!m) return formatPeriodLabel(s);
      return `${String(m[1]).slice(-2)}/${Number(m[2])}`;
    }

    function formatCompactAxisDateLabel(raw) {
      const s = String(raw || "");
      let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (m) return `${String(m[1]).slice(-2)}/${Number(m[2])}`;
      m = s.match(/^(\d{4})-(\d{2})$/);
      if (m) return `${String(m[1]).slice(-2)}/${Number(m[2])}`;
      m = s.match(/^(\d{4})$/);
      if (m) return String(m[1]).slice(-2);
      return formatPeriodLabel(s);
    }

    function parseNumberLike(v) {
      if (v == null) return null;
      if (typeof v === "number") return Number.isFinite(v) ? v : null;
      const s = String(v).trim();
      if (!s || s === "-") return null;
      const cleaned = s.replace(/[^\d.\-]/g, "");
      if (!cleaned) return null;
      const n = Number(cleaned);
      return Number.isFinite(n) ? n : null;
    }

    function parseObservationPeriod(raw) {
      const s = String(raw ?? "").trim();
      if (!s) return null;
      const week = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (week) {
        const iso = `${week[1]}-${week[2]}-${week[3]}`;
        return { granularity: "week", periodStart: iso, periodLabel: `${iso}週` };
      }
      const month = s.match(/^(\d{4})-(\d{2})$/);
      if (month) {
        const ym = `${month[1]}-${month[2]}`;
        return { granularity: "month", periodStart: `${ym}-01`, periodLabel: ym };
      }
      const year = s.match(/^(\d{4})$/);
      if (year) {
        return { granularity: "year", periodStart: `${year[1]}-01-01`, periodLabel: `${year[1]}年` };
      }
      const d = new Date(s);
      const iso = toISODate(d);
      if (iso) return { granularity: "week", periodStart: iso, periodLabel: `${iso}週` };
      return null;
    }

    function granularityJa(g) {
      if (g === "week") return "週次";
      if (g === "month") return "月次";
      return "年次";
    }

    function isIsoDateString(value) {
      return /^\d{4}-\d{2}-\d{2}$/.test(String(value || ""));
    }

    function formatDateSlash(iso) {
      const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return String(iso || "");
      return `${m[1]}/${m[2]}/${m[3]}`;
    }

    function formatMonthSlash(periodStart) {
      const m = String(periodStart || "").match(/^(\d{4})-(\d{2})-\d{2}$/);
      if (!m) return String(periodStart || "");
      return `${m[1]}/${m[2]}`;
    }

    function resolveObservationGranularity(defaultGranularity, periodStart) {
      const start = String(periodStart || "");
      if (start === "2025-01-01") return "year";
      if (isIsoDateString(start) && start >= "2025-08-01" && start <= "2025-12-31") return "month";
      if (isIsoDateString(start) && start >= "2025-01-01") return "week";
      return defaultGranularity || "year";
    }

    function isLegacy2025DisplayPeriod(periodStart) {
      const m = String(periodStart || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return false;
      const y = Number(m[1]);
      const month = Number(m[2]);
      return y === 2025 && month >= 1 && month <= 12;
    }

    function toDisplayPeriodLabel(obs) {
      if (!obs) return "";
      if (String(obs.periodStart || "") === "2025-01-01") {
        return "発売日〜2025年8月（観測）";
      }
      if (obs.granularity === "month") {
        return formatMonthSlash(obs.periodStart);
      }
      if (obs.granularity === "week" && isLegacy2025DisplayPeriod(obs.periodStart)) {
        return formatDateSlash(obs.periodStart);
      }
      return String(obs.periodLabel || obs.periodStart || "");
    }

    function normalizeObservationRows(arr) {
      const rows = Array.isArray(arr) ? arr : [];
      const buckets = new Map();
      for (const x of rows) {
        const period = parseObservationPeriod(x?.week ?? x?.period ?? x?.date);
        if (!period) continue;
        const granularity = resolveObservationGranularity(period.granularity, period.periodStart);
        const priceNum = parseNumberLike(x?.price);
        const countNum = parseNumberLike(x?.count);
        const price = Number.isFinite(priceNum) && priceNum > 0 ? priceNum : null;
        const count = Number.isFinite(countNum) ? Math.max(0, Math.round(countNum)) : null;
        const hasTrade = (count == null) ? (price != null) : (count > 0 && price != null);
        const key = `${granularity}|${period.periodStart}`;
        if (!buckets.has(key)) {
          const ts = new Date(period.periodStart).getTime();
          buckets.set(key, {
            granularity,
            periodStart: period.periodStart,
            periodLabel: period.periodLabel,
            timestamp: Number.isFinite(ts) ? ts : NaN,
            weightedPriceSum: 0,
            weightedCount: 0,
            simplePriceSum: 0,
            simpleCount: 0,
            tradeCount: 0,
            hasCount: false
          });
        }
        const b = buckets.get(key);
        if (!hasTrade || price == null) continue;
        if (Number.isFinite(count) && count > 0) {
          b.weightedPriceSum += price * count;
          b.weightedCount += count;
          b.tradeCount += count;
          b.hasCount = true;
        } else {
          b.simplePriceSum += price;
          b.simpleCount += 1;
        }
      }

      return Array.from(buckets.values())
        .map((b) => {
          let avgPrice = null;
          if (b.weightedCount > 0) avgPrice = Math.round(b.weightedPriceSum / b.weightedCount);
          else if (b.simpleCount > 0) avgPrice = Math.round(b.simplePriceSum / b.simpleCount);
          const tradeCount = b.hasCount ? b.tradeCount : null;
          const hasTrade = Number.isFinite(avgPrice) && avgPrice > 0 && (tradeCount == null || tradeCount > 0);
          return {
            granularity: b.granularity,
            periodStart: b.periodStart,
            periodLabel: b.periodLabel,
            timestamp: b.timestamp,
            avgPrice: hasTrade ? avgPrice : null,
            tradeCount,
            hasTrade
          };
        })
        .filter((r) => Number.isFinite(r.timestamp))
        .sort((a, b) => a.timestamp - b.timestamp);
    }

    function classifyObservationMode(rows) {
      const tradedCount = (Array.isArray(rows) ? rows : []).filter((r) => r.hasTrade && Number.isFinite(r.avgPrice)).length;
      if (tradedCount <= 0) return "empty";
      if (tradedCount === 1) return "single";
      if (tradedCount <= 3) return "few";
      return "normal";
    }

    function filterObservationsByPeriod(rows, periodKey) {
      const list = Array.isArray(rows) ? rows : [];
      if (!list.length) return [];
      const maxTs = Math.max(...list.map((r) => Number(r.timestamp)).filter((v) => Number.isFinite(v)));
      if (!Number.isFinite(maxTs)) return [];
      if (periodKey === "all") return list.slice();
      const dayMs = 24 * 60 * 60 * 1000;
      const startTs = periodKey === "3m" ? (maxTs - 92 * dayMs) : (maxTs - 366 * dayMs);
      return list.filter((r) => {
        if (!Number.isFinite(r.timestamp)) return false;
        if (r.timestamp < startTs || r.timestamp > maxTs) return false;
        if (periodKey === "3m") return r.granularity === "week";
        if (periodKey === "1y") return r.granularity !== "year";
        return true;
      });
    }

        return `<tr><td>${escapeHtml(periodText)}</td>${granCell}<td>${priceCell}</td><td>${countCell}</td></tr>`;
