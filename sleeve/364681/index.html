    function renderObservationChart(containerId, title, rows, options = {}) {
      const el = document.getElementById(containerId);
      if (!el) return;
      const traded = (Array.isArray(rows) ? rows : []).filter((r) => r.hasTrade && Number.isFinite(r.avgPrice));
      if (!traded.length) {
        el.innerHTML = `<div class="chart-wrap"><div class="chart-title">${escapeHtml(title)}</div><div class="meta">観測データがありません</div></div>`;
        return;
      }

      const isMobileView = window.matchMedia("(max-width: 767px)").matches;
      const W = 920;
      const H = isMobileView ? 420 : 320;
      const padL = isMobileView ? 72 : 60;
      const padR = isMobileView ? 20 : 18;
      const padT = isMobileView ? 18 : 14;
      const padB = isMobileView ? 58 : 42;
      const axisFontSize = isMobileView ? 13 : 11;
      const xAxisFontSize = isMobileView ? 13 : 11;
      const chartW = W - padL - padR;
      const chartH = H - padT - padB;

      const xMin = Math.min(...traded.map((p) => p.timestamp));
      const xMax = Math.max(...traded.map((p) => p.timestamp));
      const safeSpanX = Math.max(24 * 60 * 60 * 1000, xMax - xMin);
      const yMinRaw = Math.min(...traded.map((p) => p.avgPrice));
      const yMaxRaw = Math.max(...traded.map((p) => p.avgPrice));
      const ySpanRaw = Math.max(1, yMaxRaw - yMinRaw);
      const yPad = Math.max(20, Math.round(ySpanRaw * 0.08));
      const yMin = Math.max(0, yMinRaw - yPad);
      const yMax = yMaxRaw + yPad;

      const xToPx = (ts) => padL + ((ts - xMin) / safeSpanX) * chartW;
      const yToPx = (v) => padT + (1 - ((v - yMin) / Math.max(1, yMax - yMin))) * chartH;

      const yTicks = 3;
      const yGrid = [];
      const yLabels = [];
      for (let i = 0; i <= yTicks; i++) {
        const v = yMin + (i / yTicks) * (yMax - yMin);
        const y = yToPx(v);
        yGrid.push(`<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#e4e7ec"></line>`);
        yLabels.push(`<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="${axisFontSize}" fill="#111827">${Math.round(v).toLocaleString()}</text>`);
      }

      const xTicks = 4;
      const xLabels = [];
      for (let i = 0; i <= xTicks; i++) {
        const ts = xMin + (i / xTicks) * safeSpanX;
        const d = new Date(ts);
        const yy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        const label = safeSpanX > (550 * 24 * 60 * 60 * 1000)
          ? `${String(yy).slice(-2)}/${Number(mm)}`
          : `${mm}/${dd}`;
        const x = xToPx(ts);
        xLabels.push(`<text x="${x}" y="${H - 16}" text-anchor="middle" font-size="${xAxisFontSize}" fill="#111827">${label}</text>`);
      }

      const markerParts = [];
      const hitParts = [];
      const hitMeta = [];
      let hitIdx = 0;
      const latest = traded[traded.length - 1];
      const latestKey = latest ? `${latest.granularity}|${latest.periodStart}` : "";
      const latestPriceY = latest ? yToPx(latest.avgPrice) : null;

      function buildMarkerShape(cx, cy, radius, isLatest) {
        if (isLatest) {
          markerParts.push(`<circle cx="${cx}" cy="${cy}" r="${radius + 4}" fill="rgba(30,91,215,0.14)" stroke="none"></circle>`);
        }
        markerParts.push(`<circle cx="${cx}" cy="${cy}" r="${radius}" fill="#1e5bd7" stroke="${isLatest ? "#0f172a" : "#1e5bd7"}" stroke-width="${isLatest ? 2.4 : 1.8}"></circle>`);
      }

      const sortedTraded = traded.slice().sort((a, b) => a.timestamp - b.timestamp);
      for (const p of sortedTraded) {
        const cx = xToPx(p.timestamp);
        const cy = yToPx(p.avgPrice);
        const key = `${p.granularity}|${p.periodStart}`;
        const isLatest = key === latestKey;
        const radius = isLatest ? (isMobileView ? 9 : 8) : (isMobileView ? 7 : 6);
        buildMarkerShape(cx, cy, radius, isLatest);
        hitParts.push(`<circle class="obs-hit" data-hit="${hitIdx}" cx="${cx}" cy="${cy}" r="${isMobileView ? 18 : 14}" fill="transparent"></circle>`);
        hitMeta.push(p);
        hitIdx += 1;
      }

      el.innerHTML = `
        <div class="chart-wrap">
          <div class="chart-title">${escapeHtml(title)}</div>
          <div class="chart-tooltip"></div>
          <div class="chart-viewport">
            <svg class="chart" viewBox="0 0 ${W} ${H}">
              <g>${yGrid.join("")}</g>
              <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="#98a2b3"></line>
              <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="#98a2b3"></line>
              ${latest && Number.isFinite(latestPriceY)
          ? `<line x1="${padL}" y1="${latestPriceY}" x2="${W - padR}" y2="${latestPriceY}" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"></line>
                  <text x="${W - padR - 4}" y="${latestPriceY - 6}" text-anchor="end" font-size="${axisFontSize}" font-weight="800" fill="#64748b">現在 ¥${latest.avgPrice.toLocaleString()}</text>`
          : ""}
              <g>${markerParts.join("")}</g>
              <g>${hitParts.join("")}</g>
              <g>${yLabels.join("")}</g>
              <g>${xLabels.join("")}</g>
            </svg>
          </div>
        </div>
      `;

      const wrap = el.querySelector(".chart-wrap");
      const tip = el.querySelector(".chart-tooltip");
      const hits = Array.from(el.querySelectorAll(".obs-hit"));
      const showTip = (ev, obs) => {
        if (!tip || !wrap || !obs) return;
        const periodText = toDisplayPeriodLabel(obs);
        const avg = Number.isFinite(obs.avgPrice) ? `${obs.avgPrice.toLocaleString()}円` : "-";
        const cnt = Number.isFinite(obs.tradeCount) ? `${obs.tradeCount}件` : "-";
        tip.innerHTML = `${escapeHtml(periodText)} / 観測価格 ${escapeHtml(avg)}<br>取引件数 ${escapeHtml(cnt)}`;
        tip.style.display = "block";
        const wrapRect = wrap.getBoundingClientRect();
        const half = Math.max((tip.offsetWidth || 0) / 2, 70);
        const x = Math.min(Math.max(ev.clientX - wrapRect.left, half + 8), wrapRect.width - half - 8);
        tip.style.left = `${x}px`;
        tip.style.top = `8px`;
      };
      const hideTip = () => {
        if (tip) tip.style.display = "none";
      };

      hits.forEach((node) => {
        const idx = Number(node.getAttribute("data-hit"));
        const obs = Number.isFinite(idx) ? hitMeta[idx] : null;
        node.addEventListener("mousemove", (ev) => showTip(ev, obs));
        node.addEventListener("mouseenter", (ev) => showTip(ev, obs));
        node.addEventListener("click", (ev) => showTip(ev, obs));
      });

      if (wrap) wrap.addEventListener("mouseleave", hideTip);
    }

    function setPriceKpiFromObservations(rows) {
      const latestEl = document.getElementById("latestWeekly");
      const deltaEl = document.getElementById("weeklyDelta");
      const countEl = document.getElementById("weeklyCount");
      const labelEl = document.getElementById("latestPriceLabel");
      if (labelEl) labelEl.textContent = "最新観測価格";

      const traded = (Array.isArray(rows) ? rows : []).filter((r) => r.hasTrade && Number.isFinite(r.avgPrice));
      if (!traded.length) {
        latestEl.textContent = "-";
        deltaEl.textContent = "比較できるデータがありません";
        deltaEl.className = "delta flat";
        countEl.textContent = "取引件数: -";
        return;
      }

      const latest = traded[traded.length - 1];
      latestEl.textContent = `${latest.avgPrice.toLocaleString()}円`;
      countEl.textContent = `取引件数: ${Number.isFinite(latest.tradeCount) ? `${latest.tradeCount}件` : "-"}`;

      const prev = traded.slice(0, -1).reverse().find((r) => r.granularity === latest.granularity) || null;
      if (!prev) {
        deltaEl.textContent = "同粒度の比較データがありません";
        deltaEl.className = "delta flat";
        return;
      }

      const diff = latest.avgPrice - prev.avgPrice;
      const abs = Math.abs(diff);
      let cls = "flat";
      let arrow = "→";
      let sign = "±";
      if (diff > 0) { cls = "up"; arrow = "↑"; sign = "+"; }
      if (diff < 0) { cls = "down"; arrow = "↓"; sign = "-"; }
      deltaEl.className = "delta " + cls;
      deltaEl.textContent = `${arrow} 前回${granularityJa(latest.granularity)}観測比 ${sign}${abs.toLocaleString()}円`;
    }

    function currentShareUrl() {
      const u = new URL(location.href);
      u.hash = "";
      return u.toString();
    }

    async function copyToClipboard(text) {
      if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
        await navigator.clipboard.writeText(text);
        return true;
      }
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    }

    function setupShare(sleeve, observationRows) {
      const shareXBtn = document.getElementById("shareXBtn");
      const shareInstagramBtn = document.getElementById("shareInstagramBtn");
      const statusEl = document.getElementById("shareStatus");
      if (!shareXBtn || !shareInstagramBtn || !statusEl) return;

      const pair = latestTwoTradedObservations(observationRows);
      const priceText = (pair && pair.latest && Number.isFinite(pair.latest.avgPrice))
        ? `最新観測価格: ${pair.latest.avgPrice.toLocaleString()}円`
        : "最新観測価格: -";
      const shareUrl = currentShareUrl();
      const shareText = `【${sleeve.name || "ポケカスリーブ"}】${priceText} #ポケカ #ポケモンカード`;

      const setStatus = (msg) => {
        statusEl.textContent = msg;
      };

      shareXBtn.addEventListener("click", () => {
        const intent = new URL("https://twitter.com/intent/tweet");
        intent.searchParams.set("text", shareText);
        intent.searchParams.set("url", shareUrl);
        window.open(intent.toString(), "_blank", "noopener,noreferrer");
      });

      shareInstagramBtn.addEventListener("click", async () => {
        const text = `${shareText}\n${shareUrl}`;
        try {
          await copyToClipboard(text);
          setStatus("コピーしました。Instagramアプリで貼り付けて投稿してください。");
          window.open("https://www.instagram.com/", "_blank", "noopener,noreferrer");
        } catch (_) {
          setStatus("コピーに失敗しました。ブラウザ設定をご確認ください。");
        }
      });
    }

    function latestTwoTradedObservations(rows) {
      const traded = (Array.isArray(rows) ? rows : []).filter((r) => r.hasTrade && Number.isFinite(r.avgPrice) && r.avgPrice > 0);
      if (traded.length === 0) return null;
      const latest = traded[traded.length - 1];
      const prev = traded.length >= 2 ? traded[traded.length - 2] : null;
      return { latest, prev };
    }

    // Backward-compatible helper for legacy functions kept in this file.
    function latestTwoTradedWeeks(rows) {
      const traded = (Array.isArray(rows) ? rows : []).filter((r) => Number.isFinite(r?.price) && r.price > 0);
      if (!traded.length) return null;
      return {
        latest: traded[traded.length - 1],
        prev: traded.length >= 2 ? traded[traded.length - 2] : null
      };
    }

    function renderTableWeekly(rows) {
      if (!rows.length) return `<div class="meta">週次データがまだありません</div>`;

      const hasCount = rows.some(r => Number.isFinite(r.count));
      const html = rows.slice().reverse().map(r => {
        const priceCell = (Number.isFinite(r.price) && r.price > 0) ? `${Number(r.price).toLocaleString()}円` : "-";
        const countCell = hasCount ? `<td>${Number.isFinite(r.count) ? `${r.count}件` : "-"}</td>` : "";
        return `<tr><td>${escapeHtml(formatPeriodLabel(r.week))}</td><td>${priceCell}</td>${countCell}</tr>`;
      }).join("");

      const headCount = hasCount ? `<th>件数</th>` : "";

      return `
        <div class="table-wrap">
          <table>
            <thead><tr><th>期間</th><th>価格</th>${headCount}</tr></thead>
            <tbody>${html}</tbody>
          </table>
        </div>
      `;
    }

    function setPriceKpi(rows, labelText) {
      const latestEl = document.getElementById("latestWeekly");
      const deltaEl = document.getElementById("weeklyDelta");
      const countEl = document.getElementById("weeklyCount");
      const labelEl = document.getElementById("latestPriceLabel");
      if (labelEl) labelEl.textContent = labelText;

      const pair = latestTwoTradedWeeks(rows);

      if (!pair) {
        latestEl.textContent = "-";
        deltaEl.textContent = "比較できるデータがありません";
        deltaEl.className = "delta flat";
        countEl.textContent = "取引件数: -";
        return;
      }

      latestEl.textContent = `${pair.latest.price.toLocaleString()}円`;

      const cnt = Number.isFinite(pair.latest.count) ? pair.latest.count : null;
      countEl.textContent = `取引件数: ${cnt != null ? `${cnt}件` : "-"}`;

      if (!pair.prev) {
        deltaEl.textContent = "比較できる前週データがありません";
        deltaEl.className = "delta flat";
        return;
      }

      const diff = pair.latest.price - pair.prev.price;
      const abs = Math.abs(diff);
      let cls = "flat";
      let arrow = "→";
      let sign = "±";
      if (diff > 0) { cls = "up"; arrow = "↑"; sign = "+"; }
      if (diff < 0) { cls = "down"; arrow = "↓"; sign = "-"; }

      let pct = "";
      if (pair.prev.price !== 0) {
        const rate = (diff / pair.prev.price) * 100;
        if (Number.isFinite(rate)) {
          pct = `（${diff > 0 ? "+" : diff < 0 ? "-" : ""}${Math.abs(rate).toFixed(1)}%）`;
        }
      }

      deltaEl.className = "delta " + cls;
      deltaEl.textContent = `${arrow} 前週比 ${sign}${abs.toLocaleString()}円 ${pct}`;
    }

    function renderLineChart(containerId, title, rows, xKey, yKey, options = {}) {
      const el = document.getElementById(containerId);
      if (!el) return;
      const mode = String(options.mode || "weekly");
      const isMonthlyMode = mode === "monthly";
      const hasValidPrice = (v) => Number.isFinite(v) && v > 0;

      const data = (Array.isArray(rows) ? rows : [])
        .map(r => {
          const x = String(r?.[xKey] ?? "");
          const rawY = r?.[yKey];
          const n = Number(rawY);
          return { x, y: hasValidPrice(n) ? n : null };
        })
        .filter(p => p.x);

      const finiteData = data.filter(p => hasValidPrice(p.y));
      if (finiteData.length < 1 || data.length < 2) {
        el.innerHTML = `
          <div class="chart-wrap">
            <div class="chart-title">${escapeHtml(title)}</div>
            <div class="meta">データが不足しています</div>
          </div>`;
        return;
      }

      const isMobileView = window.matchMedia("(max-width: 767px)").matches;
      const W = 1200;
      const H = isMobileView ? 780 : 680;
      const axisFontSize = isMobileView ? 20 : 12;
      const xAxisFontSize = isMobileView ? 18 : 13;
      const padL = isMobileView ? 104 : 80;
      const padR = isMobileView ? 20 : 24;
      const mainTop = 24;
      const mainBottom = isMobileView ? 486 : 430;
      const xLabelY = isMobileView ? 554 : 458;
      const navTop = isMobileView ? 624 : 540;
      const navBottom = isMobileView ? 720 : 628;
      const ticks = 4;
      const minWindow = Math.min(Math.max(2, Math.ceil(data.length * 0.12)), data.length);

      function niceStep(range, t) {
        const rough = range / t;
        const pow = Math.pow(10, Math.floor(Math.log10(Math.max(rough, 1))));
        const candidates = [1, 2, 5, 10].map(m => m * pow);
        return candidates.reduce((best, v) => Math.abs(v - rough) < Math.abs(best - rough) ? v : best, candidates[0]);
      }

      const xToPxAll = (i) => {
        if (data.length <= 1) return padL;
        return padL + (i / (data.length - 1)) * (W - padL - padR);
      };

      function rangeLabel(start, end) {
        if (start === 0 && end === data.length - 1) {
          if (isMonthlyMode) {
            return `${formatPeriodLabel(data[0].x)} 〜 ${formatPeriodLabel(data[data.length - 1].x)}`;
          }
          return "全期間";
        }
        return `${formatPeriodLabel(data[start].x)} 〜 ${formatPeriodLabel(data[end].x)}`;
      }

      function clampRange(start, end) {
        let s = Math.max(0, Math.min(data.length - 1, Math.round(start)));
        let e = Math.max(0, Math.min(data.length - 1, Math.round(end)));
        if (s > e) [s, e] = [e, s];
        if ((e - s + 1) < minWindow) {
          const need = minWindow - (e - s + 1);
          s -= Math.ceil(need / 2);
          e += Math.floor(need / 2);
          if (s < 0) {
            e += -s;
            s = 0;
          }
          if (e > data.length - 1) {
            const over = e - (data.length - 1);
            s = Math.max(0, s - over);
            e = data.length - 1;
          }
        }
        return [s, e];
      }

      el.innerHTML = `
        <div class="chart-wrap">
          <div class="chart-title">${escapeHtml(title)}</div>
          <div class="chart-toolbar">
            <button type="button" class="chart-zoom-btn" data-zoom="out">-</button>
            <button type="button" class="chart-zoom-btn" data-zoom="in">+</button>
            <button type="button" class="chart-zoom-btn" data-zoom="reset">全期間</button>
            <span class="chart-zoom-label">全期間</span>
          </div>
          <div class="chart-tooltip"></div>
          <div class="chart-viewport">
            <svg class="chart" viewBox="0 0 ${W} ${H}">
              <defs>
                <linearGradient id="bgGrad-${escapeHtml(containerId)}" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#1e5bd7" stop-opacity="0.11" />
                  <stop offset="100%" stop-color="#1e5bd7" stop-opacity="0" />
                </linearGradient>
              </defs>
              <g class="main-grid"></g>
              <g class="main-labels"></g>
              <path class="main-fill" fill="url(#bgGrad-${escapeHtml(containerId)})"></path>
              <path class="main-line" fill="none" stroke="#1e5bd7" stroke-width="${isMobileView ? 4 : 3}" stroke-linecap="round"></path>
              <line class="hover-line" stroke="#94a3b8" stroke-width="1" style="display:none;"></line>
              <circle class="hover-dot" r="${isMobileView ? 6 : 5}" fill="#1e5bd7" style="display:none;"></circle>
              <rect class="chart-main-hit" x="${padL}" y="${mainTop}" width="${W - padL - padR}" height="${mainBottom - mainTop}" fill="transparent"></rect>
              <g class="main-x-labels"></g>
              <path class="nav-line" fill="none" stroke="#8aa1d6" stroke-width="2"></path>
              <rect class="chart-nav-hit" x="${padL}" y="${navTop}" width="${W - padL - padR}" height="${navBottom - navTop}" fill="transparent"></rect>
              <rect class="chart-range" y="${navTop}" height="${navBottom - navTop}"></rect>
              <rect class="chart-handle chart-handle-left" y="${navTop}" width="14" height="${navBottom - navTop}"></rect>
              <rect class="chart-handle chart-handle-right" y="${navTop}" width="14" height="${navBottom - navTop}"></rect>
            </svg>
          </div>
        </div>
      `;

      const wrap = el.querySelector(".chart-wrap");
      const svg = el.querySelector("svg.chart");
      const tip = el.querySelector(".chart-tooltip");
      const hitMain = el.querySelector(".chart-main-hit");
      const hitNav = el.querySelector(".chart-nav-hit");
      const hLine = el.querySelector(".hover-line");
      const hDot = el.querySelector(".hover-dot");
      const mainGrid = el.querySelector(".main-grid");
      const mainLabels = el.querySelector(".main-labels");
      const mainXLabels = el.querySelector(".main-x-labels");
      const mainFill = el.querySelector(".main-fill");
      const mainLine = el.querySelector(".main-line");
      const navLine = el.querySelector(".nav-line");
      const rangeRect = el.querySelector(".chart-range");
      const leftHandle = el.querySelector(".chart-handle-left");
      const rightHandle = el.querySelector(".chart-handle-right");
      const zoomLabel = el.querySelector(".chart-zoom-label");
      const zoomBtns = Array.from(el.querySelectorAll(".chart-zoom-btn"));

      const yAllMin = Math.min(...finiteData.map(d => d.y));
      const yAllMax = Math.max(...finiteData.map(d => d.y));
      const yAllSpan = (yAllMax - yAllMin) || 1;
      const yNavMin = yAllMin - yAllSpan * 0.08;
      const yNavMax = yAllMax + yAllSpan * 0.08;

      const yToPxNav = (v) => navTop + (1 - (v - yNavMin) / (yNavMax - yNavMin)) * (navBottom - navTop);
      const navPath = (() => {
        let d = "";
        let penDown = false;
        for (let i = 0; i < data.length; i++) {
          if (!hasValidPrice(data[i].y)) {
            penDown = false;
            continue;
          }
          d += `${penDown ? " L" : " M"} ${xToPxAll(i)} ${yToPxNav(data[i].y)}`;
          penDown = true;
        }
        return d.trim();
      })();
      navLine.setAttribute("d", navPath);

      let rangeStart = 0;
      let rangeEnd = data.length - 1;
      let activeRange = [0, data.length - 1];
      let dragMode = null;
      let dragAnchor = 0;
      let dragLength = data.length;

      function toSvgX(clientX) {
        const rect = svg.getBoundingClientRect();
        const x = clientX - rect.left;
        return (x / rect.width) * W;
      }

      function idxFromClientX(clientX) {
        const vbX = toSvgX(clientX);
        const t = (vbX - padL) / (W - padL - padR);
        const idx = Math.round(t * (data.length - 1));
        return Math.max(0, Math.min(data.length - 1, idx));
      }

      function renderRange() {
        const [s, e] = activeRange;
        const visible = data.slice(s, e + 1);
        if (!visible.length) return;

        const xToPxMain = (i) => {
          if (visible.length <= 1) return padL;
          return padL + (i / (visible.length - 1)) * (W - padL - padR);
        };

        const ys = visible.map(v => v.y).filter(v => hasValidPrice(v));
        if (!ys.length) return;
        let yMin = Math.min(...ys);
        let yMax = Math.max(...ys);
        const margin = (yMax - yMin) * 0.12 || 1;
        yMin -= margin;
        yMax += margin;
        const step = niceStep(yMax - yMin, ticks);
        yMin = Math.floor(yMin / step) * step;
        yMax = Math.ceil(yMax / step) * step;

        const yToPxMain = (v) => mainTop + (1 - (v - yMin) / (yMax - yMin)) * (mainBottom - mainTop);
        let pathD = "";
        let penDown = false;
        for (let i = 0; i < visible.length; i++) {
          const y = visible[i].y;
          if (!hasValidPrice(y)) {
            penDown = false;
            continue;
          }
          pathD += `${penDown ? " L" : " M"} ${xToPxMain(i)} ${yToPxMain(y)}`;
          penDown = true;
        }
        mainLine.setAttribute("d", pathD);
        mainFill.setAttribute("d", "");

        const gridLines = [];
        const yLabels = [];
        for (let i = 0; i <= ticks; i++) {
          const v = yMin + (i / ticks) * (yMax - yMin);
          const y = yToPxMain(v);
          const gridColor = isMobileView ? "#d7deea" : "#e6e8ef";
          const yLabelColor = "#111827";
          gridLines.push(`<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${gridColor}"/>`);
          yLabels.push(`<text x="${padL - 12}" y="${y + 4}" text-anchor="end" font-size="${axisFontSize}" fill="${yLabelColor}" font-weight="800">${Math.round(v).toLocaleString()}</text>`);
        }
        gridLines.push(`<line x1="${padL}" y1="${mainTop}" x2="${padL}" y2="${mainBottom}" stroke="#9aa4b2" stroke-width="1.2"/>`);
        gridLines.push(`<line x1="${padL}" y1="${mainBottom}" x2="${W - padR}" y2="${mainBottom}" stroke="#9aa4b2" stroke-width="1.2"/>`);
        mainGrid.innerHTML = gridLines.join("");
        mainLabels.innerHTML = yLabels.join("");

        if (isMobileView) {
          const mobileIdx = isMonthlyMode
            ? visible.map((_, i) => i)
            : (() => {
              const labelCount = Math.min(4, visible.length);
              const idxSet = new Set();
              for (let i = 0; i < labelCount; i++) {
                const ratio = labelCount === 1 ? 0 : i / (labelCount - 1);
                idxSet.add(Math.round((visible.length - 1) * ratio));
              }
              return Array.from(idxSet).sort((a, b) => a - b);
            })();
          mainXLabels.innerHTML = mobileIdx.map((i, idx) => {
            const x = xToPxMain(i);
            const text = escapeHtml(isMonthlyMode ? formatMonthAxisLabel(visible[i].x) : formatCompactAxisDateLabel(visible[i].x));
            if (isMonthlyMode) {
              const y = xLabelY;
              return `<text x="${x}" y="${y}" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">${text}</text>`;
            }
            const anchor = idx === 0 ? "start" : (idx === mobileIdx.length - 1 ? "end" : "middle");
            return `<text x="${x}" y="${xLabelY}" font-size="${xAxisFontSize}" fill="#111827" text-anchor="${anchor}" font-weight="700">${text}</text>`;
          }).join("");
        } else {
          if (isMonthlyMode) {
            mainXLabels.innerHTML = visible.map((p, i) => {
              const x = xToPxMain(i);
              const y = xLabelY;
              return `<text x="${x}" y="${y}" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">${escapeHtml(formatMonthAxisLabel(p.x))}</text>`;
            }).join("");
          } else {
            const midIdx = Math.floor((visible.length - 1) / 2);
            const xLabels = [
              { x: xToPxMain(0), text: formatCompactAxisDateLabel(visible[0].x), anchor: "start" },
              { x: xToPxMain(midIdx), text: formatCompactAxisDateLabel(visible[midIdx].x), anchor: "middle" },
              { x: xToPxMain(visible.length - 1), text: formatCompactAxisDateLabel(visible[visible.length - 1].x), anchor: "end" }
            ];
            mainXLabels.innerHTML = xLabels.map(l =>
          `<text x="${l.x}" y="${xLabelY}" font-size="${xAxisFontSize}" fill="#111827" text-anchor="${l.anchor}">${escapeHtml(l.text)}</text>`
            ).join("");
          }
        }

        const rangeX1 = xToPxAll(s);
        const rangeX2 = xToPxAll(e);
        rangeRect.setAttribute("x", rangeX1);
        rangeRect.setAttribute("width", Math.max(2, rangeX2 - rangeX1));
        leftHandle.setAttribute("x", rangeX1 - 7);
        rightHandle.setAttribute("x", rangeX2 - 7);
        zoomLabel.textContent = rangeLabel(s, e);

        hitMain.onmousemove = (ev) => {
          const vbX = toSvgX(ev.clientX);
          const t = (vbX - padL) / (W - padL - padR);
          const visIdx = Math.max(0, Math.min(visible.length - 1, Math.round(t * (visible.length - 1))));
          const point = visible[visIdx];
          const px = xToPxMain(visIdx);
          const hasValue = hasValidPrice(point?.y);
          const py = hasValue ? yToPxMain(point.y) : null;

          hLine.style.display = "block";
          hDot.style.display = hasValue ? "block" : "none";
          tip.style.display = "block";
          hLine.setAttribute("x1", px);
          hLine.setAttribute("x2", px);
          hLine.setAttribute("y1", mainTop);
          hLine.setAttribute("y2", mainBottom);
          if (hasValue) {
            hDot.setAttribute("cx", px);
            hDot.setAttribute("cy", py);
          }

          tip.textContent = `${formatPeriodLabel(point.x)} / ${hasValue ? `${point.y.toLocaleString()}円` : "-"}`;
          const wrapRect = wrap.getBoundingClientRect();
          tip.style.left = `${Math.min(Math.max(ev.clientX - wrapRect.left, 56), wrapRect.width - 56)}px`;
          const tipY = Math.max(ev.clientY - wrapRect.top - tip.offsetHeight - 12, 8);
          tip.style.top = `${tipY}px`;
        };
      }

      function updateRange(start, end) {
        const [s, e] = clampRange(start, end);
        activeRange = [s, e];
        rangeStart = s;
        rangeEnd = e;
        renderRange();
      }

      function hideHover() {
        hLine.style.display = "none";
        hDot.style.display = "none";
        tip.style.display = "none";
      }

      hitMain.addEventListener("mouseleave", hideHover);

      hitNav.addEventListener("pointerdown", (ev) => {
        const idx = idxFromClientX(ev.clientX);
        const leftX = xToPxAll(rangeStart);
        const rightX = xToPxAll(rangeEnd);
        const downX = toSvgX(ev.clientX);
        const nearLeft = Math.abs(downX - leftX) <= 20;
        const nearRight = Math.abs(downX - rightX) <= 20;

        if (nearLeft) dragMode = "left";
        else if (nearRight) dragMode = "right";
        else if (idx >= rangeStart && idx <= rangeEnd) {
          dragMode = "move";
          dragAnchor = idx - rangeStart;
          dragLength = rangeEnd - rangeStart + 1;
        } else {
          dragMode = null;
          const span = rangeEnd - rangeStart;
          const nextStart = Math.max(0, Math.min(data.length - 1 - span, idx - Math.floor(span / 2)));
          updateRange(nextStart, nextStart + span);
        }
        hitNav.setPointerCapture(ev.pointerId);
      });

      hitNav.addEventListener("pointermove", (ev) => {
        if (!dragMode) return;
        const idx = idxFromClientX(ev.clientX);
        if (dragMode === "left") updateRange(idx, rangeEnd);
        if (dragMode === "right") updateRange(rangeStart, idx);
        if (dragMode === "move") {
          let nextStart = idx - dragAnchor;
          nextStart = Math.max(0, Math.min(data.length - dragLength, nextStart));
          updateRange(nextStart, nextStart + dragLength - 1);
        }
      });

      hitNav.addEventListener("pointerup", (ev) => {
        dragMode = null;
        if (hitNav.hasPointerCapture(ev.pointerId)) hitNav.releasePointerCapture(ev.pointerId);
      });

      hitNav.addEventListener("pointercancel", (ev) => {
        dragMode = null;
        if (hitNav.hasPointerCapture(ev.pointerId)) hitNav.releasePointerCapture(ev.pointerId);
      });

      zoomBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          const mode = btn.getAttribute("data-zoom");
          const span = rangeEnd - rangeStart + 1;
          const center = Math.round((rangeStart + rangeEnd) / 2);
          if (mode === "in") {
            const nextSpan = Math.max(minWindow, Math.floor(span * 0.75));
            const half = Math.floor(nextSpan / 2);
            updateRange(center - half, center - half + nextSpan - 1);
          }
          if (mode === "out") {
            const nextSpan = Math.min(data.length, Math.ceil(span * 1.3));
            const half = Math.floor(nextSpan / 2);
            updateRange(center - half, center - half + nextSpan - 1);
          }
          if (mode === "reset") updateRange(0, data.length - 1);
        });
      });

      if (isMonthlyMode) {
        updateRange(0, data.length - 1);
      } else {
        const initialSpan = Math.max(minWindow, Math.min(data.length, Math.round(data.length * 0.7)));
        const initialStart = Math.max(0, data.length - initialSpan);
        updateRange(initialStart, data.length - 1);
      }
    }

    function normalizeChartPrice(raw) {
      return parseNumberLike(raw);
    }

    function normalizeDateFromInput(raw, fallbackDay = "01") {
      const s = String(raw ?? "").trim();
      if (!s) return "";
      const day = String(fallbackDay || "01").padStart(2, "0");
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      if (/^\d{4}-\d{2}$/.test(s)) return `${s}-${day}`;
      const iso = toISODate(s);
      return iso || "";
    }

    function enrichSeries(points) {
      return (Array.isArray(points) ? points : [])
        .map((item) => {
          const timestamp = Number.isFinite(item?.timestamp) ? item.timestamp : Date.parse(String(item?.date || ""));
          const price = normalizeChartPrice(item?.price);
          if (!Number.isFinite(timestamp) || !(Number.isFinite(price) && price > 0)) return null;
          const countValue = parseNumberLike(item?.count);
          return {
            type: String(item?.type || "").trim(),
            date: String(item?.date || "").trim(),
            price: Math.round(price),
            timestamp,
            count: Number.isFinite(countValue) && countValue >= 0 ? Math.round(countValue) : null
          };
        })
        .filter(Boolean)
        .sort((a, b) => a.timestamp - b.timestamp);
    }

    function buildYearlySeries(sleeve) {
      const out = [];
      const seen = new Set();
      const releaseYear = Number(sleeve?.releaseYear ?? sleeve?.release_year ?? sleeve?.["発売年"]);
      const releaseMonth = Number(sleeve?.releaseMonth ?? sleeve?.release_month ?? sleeve?.["発売月"]);
      const pushYearPoint = (yearValue, priceValue) => {
        const matched = String(yearValue ?? "").trim().match(/^\d{4}$/);
        const price = normalizeChartPrice(priceValue);
        if (!matched || !(Number.isFinite(price) && price > 0)) return;
        const yearNum = Number(matched[0]);
        const monthPart = (Number.isFinite(releaseYear) && Number.isFinite(releaseMonth) && yearNum === releaseYear && releaseMonth >= 1 && releaseMonth <= 12)
          ? String(releaseMonth).padStart(2, "0")
          : "01";
        const date = `${matched[0]}-${monthPart}-01`;
        const key = `yearly|${date}`;
        if (seen.has(key)) return;
        seen.add(key);
        out.push({ type: "yearly", date, price: Math.round(price) });
      };
      for (const item of (Array.isArray(sleeve?.yearlyPrices) ? sleeve.yearlyPrices : [])) {
        pushYearPoint(item?.year, item?.price);
      }
      const fallback = sleeve?.pricesByYear && typeof sleeve.pricesByYear === "object" ? sleeve.pricesByYear : null;
      if (fallback) {
        for (const [yearKey, rawPrice] of Object.entries(fallback)) {
          pushYearPoint(yearKey, rawPrice);
        }
      }
      for (const item of (Array.isArray(sleeve?.weeklyPrices) ? sleeve.weeklyPrices : [])) {
        const matched = String(item?.week ?? "").trim().match(/^(\d{4})-01-01$/);
        if (!matched) continue;
        pushYearPoint(matched[1], item?.price);
      }
      return out.sort((a, b) => a.date.localeCompare(b.date));
    }

    function buildMonthlySeries(sleeve) {
      const out = [];
      const seen = new Set();
      const pushMonthPoint = (monthValue, priceValue) => {
        const date = normalizeDateFromInput(monthValue, "01");
        const price = normalizeChartPrice(priceValue);
        if (!date || !(Number.isFinite(price) && price > 0)) return;
        const key = `monthly|${date}`;
        if (seen.has(key)) return;
        seen.add(key);
        out.push({ type: "monthly", date, price: Math.round(price) });
      };
      for (const item of (Array.isArray(sleeve?.monthlyPrices) ? sleeve.monthlyPrices : [])) {
        pushMonthPoint(item?.month, item?.price);
      }
      for (const item of (Array.isArray(sleeve?.weeklyPrices) ? sleeve.weeklyPrices : [])) {
        const matched = String(item?.week ?? "").trim().match(/^(\d{4})-(\d{2})-01$/);
        if (!matched) continue;
        pushMonthPoint(`${matched[1]}-${matched[2]}`, item?.price);
      }
      return out.sort((a, b) => a.date.localeCompare(b.date));
    }

    function buildWeeklySeries(sleeve) {
      const out = [];
      const seen = new Set();
      for (const item of (Array.isArray(sleeve?.weeklyPrices) ? sleeve.weeklyPrices : [])) {
        const date = normalizeDateFromInput(item?.week, "01");
        const price = normalizeChartPrice(item?.price);
        const countValue = parseNumberLike(item?.count);
        if (!date || !(Number.isFinite(price) && price > 0)) continue;
        const key = `weekly|${date}`;
        if (seen.has(key)) continue;
        seen.add(key);
        out.push({
          type: "weekly",
          date,
          price: Math.round(price),
          count: Number.isFinite(countValue) && countValue >= 0 ? Math.round(countValue) : null
        });
      }
      return out.sort((a, b) => a.date.localeCompare(b.date));
    }

    function buildLegacyObservationSeries(sleeve, granularities = ["year", "month", "week"]) {
      const allow = new Set(Array.isArray(granularities) ? granularities : ["year", "month", "week"]);
      return normalizeObservationRows(sleeve?.weeklyPrices)
        .filter((row) => allow.has(String(row?.granularity || "")) && Number.isFinite(row?.avgPrice) && row.avgPrice > 0)
        .map((row) => ({
          type: row.granularity === "year" ? "yearly" : row.granularity === "month" ? "monthly" : "weekly",
          date: String(row.periodStart || ""),
          price: Math.round(row.avgPrice),
          count: Number.isFinite(row.tradeCount) ? row.tradeCount : null,
          timestamp: row.timestamp
        }));
    }

    function dedupeSeriesByDate(points) {
      const priorityOf = (type) => {
        if (type === "yearly") return 3;
        if (type === "monthly") return 2;
        if (type === "weekly") return 1;
        return 0;
      };
      const map = new Map();
      for (const item of enrichSeries(points)) {
        const key = String(item?.date || "");
        if (!key) continue;
        const prev = map.get(key);
        if (!prev || priorityOf(item.type) >= priorityOf(prev.type)) {
          map.set(key, item);
        }
      }
      return Array.from(map.values()).sort((a, b) => a.timestamp - b.timestamp);
    }

    function buildFullPeriodSeries(sleeve) {
      const explicitMonthly = buildMonthlySeries(sleeve);
      const explicitWeekly = buildWeeklySeries(sleeve);
      const legacyMonthly = buildLegacyObservationSeries(sleeve, ["month"]);
      const legacyWeekly = buildLegacyObservationSeries(sleeve, ["week"]);
      return dedupeSeriesByDate([
        ...(explicitMonthly.length ? explicitMonthly : legacyMonthly),
        ...(explicitWeekly.length ? explicitWeekly : legacyWeekly)
      ]);
    }

    function buildRecentWeeklySeries(sleeve, windowDays = 92) {
      const weekly = enrichSeries(buildWeeklySeries(sleeve));
      if (!weekly.length) return [];
      const latestTs = weekly[weekly.length - 1].timestamp;
      const cutoff = latestTs - (Math.max(1, windowDays) * 24 * 60 * 60 * 1000);
      return weekly.filter((item) => item.timestamp >= cutoff);
    }

    function classifySeriesMode(points) {
      const count = Array.isArray(points) ? points.length : 0;
      if (count <= 0) return "empty";
      if (count === 1) return "single";
      if (count <= 3) return "few";
      return "normal";
    }

    function formatPointTypeLabel(type) {
      if (type === "yearly") return "年次";
      if (type === "monthly") return "月次";
      if (type === "weekly") return "週次";
      return "観測";
    }

    function formatPointDate(point, mode) {
      if (!point) return "-";
      const date = String(point.date || "");
      const m = date.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return date;
      if (mode === "3m") return date;
      if (mode === "monthly" || point.type === "monthly") return `${m[1]}年${Number(m[2])}月`;
      if (point.type === "yearly") return `${m[1]}年`;
      return date;
    }

    function renderPriceLegend(mode) {
      const el = document.getElementById("chartLegend");
      if (!el) return;
      if (mode === "all") {
        el.innerHTML = `
          <span class="legend-item"><span class="legend-mark">●</span>価格</span>
          <span class="legend-item">◎ 最新観測データ</span>
        `;
        return;
      }
      if (mode === "3m") {
        el.innerHTML = `
          <span class="legend-item"><span class="legend-mark">●</span>価格</span>
          <span class="legend-item"><span class="legend-mark">▮</span>取引件数</span>
          <span class="legend-item">◎ 最新観測データ</span>
        `;
        return;
      }
      el.innerHTML = `
        <span class="legend-item"><span class="legend-mark">●</span>月次データ</span>
        <span class="legend-item">◎ 最新観測データ</span>
      `;
    }

    function renderPriceFootnotes(mode) {
      const el = document.getElementById("chartFootnotes");
      if (!el) return;
      const lines = [
        "※過去データは買取価格も含めて補完しています。",
        "長期トレンドを把握するための参考値として掲載しています。"
      ];
      el.innerHTML = lines.map((line) => `<div>${escapeHtml(line)}</div>`).join("");
    }

    function renderPriceTable(points, mode) {
      const list = enrichSeries(points);
      if (!list.length) return `<div class="meta">観測データがありません</div>`;
      const showType = mode === "all";
      const typeHead = showType ? "<th>種別</th>" : "";
      const rows = list.slice().reverse().map((point) => {
        const typeCell = showType ? `<td>${escapeHtml(formatPointTypeLabel(point.type))}</td>` : "";
        return `<tr><td>${escapeHtml(formatPointDate(point, mode))}</td>${typeCell}<td>${point.price.toLocaleString()}円</td></tr>`;
      }).join("");
      return `
        <div class="table-wrap">
          <table>
            <thead><tr><th>期間</th>${typeHead}<th>価格</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function renderSinglePriceCard(containerId, point, mode) {
      const el = document.getElementById(containerId);
      if (!el) return;
      if (!point) {
        el.innerHTML = `<div class="chart-wrap"><div class="meta">観測データがありません</div></div>`;
        return;
      }
      el.innerHTML = `
        <div class="single-observation-card">
          <p class="single-observation-title">現在確認できる価格</p>
          <div class="single-observation-grid">
            <div class="single-observation-item">
              <div class="label">観測価格</div>
              <div class="value">${point.price.toLocaleString()}円</div>
            </div>
            <div class="single-observation-item">
              <div class="label">観測日</div>
              <div class="value">${escapeHtml(formatPointDate(point, mode))}</div>
            </div>
          </div>
          <div class="chart-subnote">観測点が1件のみのため、価格推移チャートではなく単一観測カードを表示しています。</div>
        </div>
      `;
    }

    function setPriceKpiFromSeries(points) {
      const latestEl = document.getElementById("latestWeekly");
      const deltaEl = document.getElementById("weeklyDelta");
      const countEl = document.getElementById("weeklyCount");
      const labelEl = document.getElementById("latestPriceLabel");
      if (labelEl) labelEl.textContent = "現在価格";
      const list = enrichSeries(points);
      if (!list.length) {
        latestEl.textContent = "-";
        deltaEl.textContent = "比較できるデータがありません";
        deltaEl.className = "delta flat";
        countEl.textContent = "最終観測日: -";
        return;
      }
      const latest = list[list.length - 1];
      latestEl.textContent = `${latest.price.toLocaleString()}円`;
      countEl.textContent = `最終観測日: ${formatPointDate(latest, "all")}`;
      const prev = list.length >= 2 ? list[list.length - 2] : null;
      if (!prev) {
        deltaEl.textContent = "比較できる過去データがありません";
        deltaEl.className = "delta flat";
        return;
      }
      const diff = latest.price - prev.price;
      const abs = Math.abs(diff);
      let cls = "flat";
      let arrow = "→";
      let sign = "±";
      if (diff > 0) { cls = "up"; arrow = "↑"; sign = "+"; }
      if (diff < 0) { cls = "down"; arrow = "↓"; sign = "-"; }
      deltaEl.className = "delta " + cls;
      deltaEl.textContent = `${arrow} 前回観測比 ${sign}${abs.toLocaleString()}円`;
    }

    function buildMarkerSvg(point, cx, cy, radius, isLatest, mode) {
      const stroke = isLatest ? "#0f172a" : "#1e5bd7";
      const halo = isLatest ? `<circle cx="${cx}" cy="${cy}" r="${radius + 5}" fill="rgba(30,91,215,0.14)"></circle>` : "";
      return `${halo}<circle cx="${cx}" cy="${cy}" r="${radius}" fill="#1e5bd7" stroke="${stroke}" stroke-width="${isLatest ? 2.4 : 1.8}"></circle>`;
    }

    function buildTooltipHtml(point, mode) {
      if (!point) return "";
      const dateText = formatPointDate(point, mode);
      const priceText = `${point.price.toLocaleString()}円`;
      if (mode === "all") return `${escapeHtml(formatPointTypeLabel(point.type))} / ${escapeHtml(dateText)} / ${escapeHtml(priceText)}`;
      if (mode === "3m") {
        const countText = Number.isFinite(point.count) ? `${point.count}件` : "-";
        return `${escapeHtml(dateText)}<br>価格: ${escapeHtml(priceText)}<br>取引件数: ${escapeHtml(countText)}`;
      }
      return `${escapeHtml(dateText)} / ${escapeHtml(priceText)}`;
    }

    function formatDiffAmount(value) {
      if (!Number.isFinite(value)) return "-";
      const sign = value > 0 ? "+" : value < 0 ? "-" : "±";
      return `${sign}${Math.abs(Math.round(value)).toLocaleString()}円`;
    }

    function formatDiffRate(value) {
      if (!Number.isFinite(value)) return "-";
      const sign = value > 0 ? "+" : value < 0 ? "-" : "±";
      return `${sign}${Math.abs(value).toFixed(0)}%`;
    }

    function startOfMonthTs(timestamp) {
      const d = new Date(timestamp);
      return new Date(d.getFullYear(), d.getMonth(), 1).getTime();
    }

    function addMonthsTs(timestamp, count) {
      const d = new Date(timestamp);
      return new Date(d.getFullYear(), d.getMonth() + count, 1).getTime();
    }

    function buildCalendarMonthTicks(minTs, maxTs) {
      const ticks = [];
      const startTs = startOfMonthTs(minTs);
      const endTs = startOfMonthTs(maxTs);
      for (let ts = startTs; ts <= endTs; ts = addMonthsTs(ts, 1)) {
        const d = new Date(ts);
        ticks.push({
          ts,
          year: d.getFullYear(),
          month: d.getMonth() + 1
        });
      }
      return ticks;
    }

    function renderPriceAreaChart(containerId, title, points, mode) {
      const el = document.getElementById(containerId);
      if (!el) return;
      const data = enrichSeries(points);
      if (!data.length) {
        el.innerHTML = `<div class="chart-wrap"><div class="chart-title">${escapeHtml(title)}</div><div class="meta">観測データがありません</div></div>`;
        return;
      }

      const isMobileView = window.matchMedia("(max-width: 767px)").matches;
      const W = 940;
      const H = isMobileView ? 620 : 480;
      const padL = isMobileView ? 90 : 86;
      const padR = isMobileView ? 42 : 130;
      const padT = isMobileView ? 28 : 26;
      const padB = (mode === "all" || mode === "monthly") ? (isMobileView ? 120 : 92) : (isMobileView ? 98 : 76);
      const axisFontSize = isMobileView ? 18 : 15;
      const xAxisFontSize = isMobileView ? 19 : 16;
      const labelFontSize = isMobileView ? 19 : 16;
      const subLabelFontSize = isMobileView ? 16 : 13.5;
      const chartW = W - padL - padR;
      const chartH = H - padT - padB;
      const xMin = Math.min(...data.map((item) => item.timestamp));
      const xMax = Math.max(...data.map((item) => item.timestamp));
      const spanX = Math.max(24 * 60 * 60 * 1000, xMax - xMin);
      const prices = data.map((item) => item.price);
      const yMinRaw = Math.min(...prices);
      const yMaxRaw = Math.max(...prices);
      const ySpanRaw = Math.max(1, yMaxRaw - yMinRaw);
      const yPad = Math.max(20, Math.round(ySpanRaw * 0.08));
      const yMin = yMinRaw - yPad;
      const yMax = yMaxRaw + yPad;
      const xToPx = (ts) => padL + ((ts - xMin) / spanX) * chartW;
      const yToPx = (v) => padT + (1 - ((v - yMin) / Math.max(1, yMax - yMin))) * chartH;

      const yGrid = [];
      const yLabels = [];
      for (let i = 0; i <= 3; i++) {
        const v = yMin + (i / 3) * (yMax - yMin);
        const y = yToPx(v);
        yGrid.push(`<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#dce4f0"></line>`);
        yLabels.push(`<text x="${padL - 10}" y="${y + 4}" text-anchor="end" font-size="${axisFontSize}" fill="#111827">${Math.round(v).toLocaleString()}</text>`);
      }

      let xLabels = [];
      let yearGuides = [];
      if (mode === "all" || mode === "monthly") {
        const monthTicks = buildCalendarMonthTicks(xMin, xMax);
        const labelStep = monthTicks.length > 36 ? 6 : monthTicks.length > 18 ? 3 : 2;
        xLabels = monthTicks
          .filter((tick) => tick.month === 1 || ((tick.month - 1) % labelStep === 0))
          .map((tick, index, arr) => {
            const x = xToPx(tick.ts);
            const label = `${String(tick.year).slice(-2)}/${tick.month}`;
            const anchor = index === 0 ? "start" : (index === arr.length - 1 ? "end" : "middle");
            return `<text x="${x}" y="${H - 16}" text-anchor="${anchor}" font-size="${xAxisFontSize}" fill="#111827">${escapeHtml(label)}</text>`;
          });
        yearGuides = monthTicks
          .filter((tick) => tick.month === 1)
          .map((tick) => {
            const x = xToPx(tick.ts);
            const line = `<line x1="${x}" y1="${padT}" x2="${x}" y2="${H - padB}" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"></line>`;
            const text = `<text x="${Math.min(x + 6, W - padR - 4)}" y="${padT + 14}" text-anchor="start" font-size="${subLabelFontSize}" font-weight="800" fill="#64748b">${tick.year}</text>`;
            return `${line}${text}`;
          });
      } else {
        const labelIndexes = Array.from(new Set([0, Math.floor((data.length - 1) / 2), data.length - 1]));
        xLabels = labelIndexes.map((index) => {
          const point = data[index];
          const x = xToPx(point.timestamp);
          const label = formatCompactAxisDateLabel(point.date);
          const anchor = index === 0 ? "start" : (index === data.length - 1 ? "end" : "middle");
          return `<text x="${x}" y="${H - 16}" text-anchor="${anchor}" font-size="${xAxisFontSize}" fill="#111827">${escapeHtml(label)}</text>`;
        });
      }

      const lineD = data.map((point, index) => `${index === 0 ? "M" : "L"} ${xToPx(point.timestamp)} ${yToPx(point.price)}`).join(" ");
      const areaD = `${lineD} L ${xToPx(data[data.length - 1].timestamp)} ${H - padB} L ${xToPx(data[0].timestamp)} ${H - padB} Z`;
      const first = data[0];
      const latest = data[data.length - 1];
      const firstX = xToPx(first.timestamp);
      const firstY = yToPx(first.price);
      const latestX = xToPx(latest.timestamp);
      const latestY = yToPx(latest.price);
      const diffPrice = latest.price - first.price;
      const diffRate = first.price > 0 ? ((latest.price / first.price) - 1) * 100 : null;
      const firstLabelX = isMobileView ? Math.min(firstX + 8, W - padR - 180) : Math.min(firstX + 8, W - padR - 150);
      const latestInfoX = W - (isMobileView ? 98 : 136);
      const latestInfoY = H - padB + (isMobileView ? 44 : 34);
      const latestInfoLine2Y = latestInfoY + (isMobileView ? 22 : 18);
      const latestLeaderEndX = latestInfoX - (isMobileView ? 10 : 12);
      const latestLeaderBottomY = latestInfoY - (isMobileView ? 20 : 18);
      const latestMarkerRadius = isMobileView ? 11 : 9;
      const latestLeaderStartX = latestX + latestMarkerRadius + 2;
      const latestCallout = `
        <path d="M ${latestLeaderStartX} ${latestY} L ${latestLeaderEndX} ${latestY} L ${latestLeaderEndX} ${latestLeaderBottomY}" fill="none" stroke="#1e3a5f" stroke-width="${isMobileView ? 2.2 : 2}" stroke-linecap="round" stroke-linejoin="round"></path>
        <text x="${latestInfoX}" y="${latestInfoY}" text-anchor="start" font-size="${isMobileView ? 18 : 15}" font-weight="900" fill="#111827">現在 ¥${latest.price.toLocaleString()}</text>
        <text x="${latestInfoX}" y="${latestInfoLine2Y}" text-anchor="start" font-size="${isMobileView ? 16 : 13.5}" font-weight="900" fill="${diffPrice >= 0 ? "#0f766e" : "#b42318"}">${escapeHtml(formatDiffAmount(diffPrice))} / ${escapeHtml(formatDiffRate(diffRate))}</text>
      `;
      const showVolumeBars = mode === "3m";
      const maxCount = showVolumeBars
        ? Math.max(0, ...data.map((item) => Number.isFinite(item.count) ? item.count : 0))
        : 0;
      const countTop = padT + 10;
      const countBottom = H - padB;
      const countHeight = Math.max(1, countBottom - countTop);
      const volumeBars = showVolumeBars && maxCount > 0
        ? data.map((point, index) => {
          if (index === 0 || index === data.length - 1) return "";
          if (!(Number.isFinite(point.count) && point.count > 0)) return "";
          const cx = xToPx(point.timestamp);
          const nextTs = index < data.length - 1 ? data[index + 1].timestamp : point.timestamp + ((spanX / Math.max(1, data.length - 1)) || (7 * 24 * 60 * 60 * 1000));
          const prevTs = index > 0 ? data[index - 1].timestamp : point.timestamp - ((spanX / Math.max(1, data.length - 1)) || (7 * 24 * 60 * 60 * 1000));
          const halfGap = Math.max(4, Math.min(12, Math.round((xToPx(nextTs) - xToPx(prevTs)) / 6)));
          const width = Math.max(5, halfGap);
          const h = Math.max(10, (point.count / maxCount) * countHeight * 0.76);
          const x = cx - (width / 2);
          const y = countBottom - h;
          return `<rect x="${x}" y="${y}" width="${width}" height="${h}" rx="3" fill="rgba(148,163,184,0.18)"></rect>`;
        }).join("")
        : "";
      const highIndex = prices.findIndex((value) => value === yMaxRaw);
      const lowIndex = prices.findIndex((value) => value === yMinRaw);
      const highPoint = highIndex >= 0 ? data[highIndex] : null;
      const lowPoint = lowIndex >= 0 ? data[lowIndex] : null;
      const showHighLabel = mode === "all" && highPoint && highIndex !== 0 && highIndex !== data.length - 1;
      const showLowLabel = mode === "all" && lowPoint && lowIndex !== 0 && lowIndex !== data.length - 1 && lowIndex !== highIndex;
      const highLabel = showHighLabel
         ? `<text x="${isMobileView ? Math.max(padL + 18, xToPx(highPoint.timestamp) - 80) : Math.min(xToPx(highPoint.timestamp) + 6, W - padR - 84)}" y="${Math.max(18, yToPx(highPoint.price) - 10)}" text-anchor="start" font-size="${subLabelFontSize}" font-weight="700" fill="#64748b" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round;">高値 ¥${highPoint.price.toLocaleString()}</text>`
          : "";
      const lowLabel = showLowLabel
         ? `<text x="${isMobileView ? Math.max(padL + 18, xToPx(lowPoint.timestamp) - 80) : Math.min(xToPx(lowPoint.timestamp) + 6, W - padR - 84)}" y="${Math.min(H - padB - 8, yToPx(lowPoint.price) + 16)}" text-anchor="start" font-size="${subLabelFontSize}" font-weight="700" fill="#64748b" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round;">安値 ¥${lowPoint.price.toLocaleString()}</text>`
          : "";
      const markers = data.map((point, index) => {
        const cx = xToPx(point.timestamp);
        const cy = yToPx(point.price);
        const isLatest = index === data.length - 1;
        const isFirst = index === 0;
        const radius = isLatest || isFirst ? (isMobileView ? 11 : 9) : (isMobileView ? 9 : 7);
        return `
          ${buildMarkerSvg(point, cx, cy, radius, isLatest, mode)}
          ${isFirst ? `<circle cx="${cx}" cy="${cy}" r="${radius + 4}" fill="none" stroke="rgba(15,23,42,0.16)" stroke-width="1.8"></circle>` : ""}
          <circle class="chart-hit-point" data-hit="${index}" cx="${cx}" cy="${cy}" r="${isMobileView ? 24 : 18}" fill="transparent"></circle>
        `;
      }).join("");

      el.innerHTML = `
        <div class="chart-wrap">
          <div class="chart-title">${escapeHtml(title)}</div>
          <div class="chart-tooltip"></div>
          <div class="chart-viewport">
            <svg class="chart" viewBox="0 0 ${W} ${H}">
              <defs>
                <linearGradient id="priceAreaGrad-${escapeHtml(containerId)}" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#1e5bd7" stop-opacity="0.32"></stop>
                  <stop offset="100%" stop-color="#1e5bd7" stop-opacity="0.04"></stop>
                </linearGradient>
              </defs>
              <g>${yGrid.join("")}</g>
              <g>${yearGuides.join("")}</g>
              <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="#a8b3c7"></line>
              <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="#a8b3c7"></line>
              <path d="${areaD}" fill="url(#priceAreaGrad-${escapeHtml(containerId)})"></path>
              <g>${volumeBars}</g>
              <path d="${lineD}" fill="none" stroke="#1e5bd7" stroke-width="${isMobileView ? 5.5 : 4.2}" stroke-linecap="round" stroke-linejoin="round"></path>
              ${mode === "all" ? `<line x1="${padL}" y1="${latestY}" x2="${W - padR}" y2="${latestY}" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"></line>` : ""}
              <text x="${firstLabelX}" y="${Math.max(24, firstY - 18)}" text-anchor="start" font-size="${labelFontSize}" font-weight="900" fill="#475467" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round;">開始 ¥${first.price.toLocaleString()}</text>
              ${latestCallout}
              ${highLabel}
              ${lowLabel}
              <g>${markers}</g>
              <g>${yLabels.join("")}</g>
              <g>${xLabels.join("")}</g>
              <rect class="chart-hit-area" x="${padL}" y="${padT}" width="${chartW}" height="${chartH}" fill="transparent"></rect>
            </svg>
          </div>
        </div>
      `;

      const wrap = el.querySelector(".chart-wrap");
      const tip = el.querySelector(".chart-tooltip");
      const hitNodes = Array.from(el.querySelectorAll(".chart-hit-point"));
      const showTip = (ev, index) => {
        const point = data[index];
        if (!wrap || !tip || !point) return;
        tip.innerHTML = buildTooltipHtml(point, mode);
        tip.style.display = "block";
        const wrapRect = wrap.getBoundingClientRect();
        const half = Math.max((tip.offsetWidth || 0) / 2, 70);
        const x = Math.min(Math.max(ev.clientX - wrapRect.left, half + 8), wrapRect.width - half - 8);
        tip.style.left = `${x}px`;
        tip.style.top = "8px";
      };
      const hideTip = () => {
        if (tip) tip.style.display = "none";
      };
      hitNodes.forEach((node) => {
        const index = Number(node.getAttribute("data-hit"));
        node.addEventListener("mouseenter", (ev) => showTip(ev, index));
        node.addEventListener("mousemove", (ev) => showTip(ev, index));
        node.addEventListener("click", (ev) => showTip(ev, index));
      });
      if (wrap) wrap.addEventListener("mouseleave", hideTip);
    }

    function getSeriesForMode(sleeve, mode) {
      if (mode === "monthly") {
        const explicitMonthly = buildMonthlySeries(sleeve);
        const legacyMonthly = buildLegacyObservationSeries(sleeve, ["month"]);
        return dedupeSeriesByDate(explicitMonthly.length ? explicitMonthly : legacyMonthly);
      }
      if (mode === "3m") return buildRecentWeeklySeries(sleeve, 92);
      return buildFullPeriodSeries(sleeve);
    }

    async function main() {
      const applySearchBehavior = () => {
        const search = document.getElementById("search");
        if (!search) return false;
        search.placeholder = "図鑑へ戻って検索...";
        search.addEventListener("keydown", (e) => {
          if (e.key !== "Enter") return;
          const q = search.value.trim();
          if (!q) {
            location.href = "./sleeves/";
            return;
          }
          location.href = "./sleeves/?q=" + encodeURIComponent(q);
        });
        return true;
      };
      if (!applySearchBehavior()) setTimeout(applySearchBehavior, 200);

      const id = getSleeveId();
      if (!id) {
        showError("id が指定されていません。一覧ページから開いてください。");
        return;
      }

      if (!window.__SLEEVE_PAGE_ID && !getSleeveIdFromPath()) {
        const nextHref = (window.common && typeof window.common.buildSleeveDetailHref === "function")
          ? window.common.buildSleeveDetailHref(id)
          : `./sleeve/${encodeURIComponent(id)}/`;
        location.replace(nextHref);
        return;
      }

      let data;
      try {
        data = await loadData();
      } catch (e) {
        showError(e.message || "データ読み込みに失敗しました");
        return;
      }

      const sleeves = Array.isArray(data.sleeves) ? data.sleeves : [];
      const s = sleeves.find(x => String(x.id) === String(id));
      if (!s) {
        showError("指定されたスリーブが見つかりませんでした。");
        return;
      }

      logAccess(location.href);

      document.title = `${s.name || "スリーブ相場"} - ポケスリ相場ナビ`;

      const img = document.getElementById("img");
      img.referrerPolicy = "no-referrer";
      img.src = String(s.imageUrl || "").trim();
      img.alt = s.name || "";

      const releaseDateText = getReleaseDateText(s);
      const breadcrumbCurrent = document.getElementById("breadcrumbCurrent");
      if (breadcrumbCurrent) breadcrumbCurrent.textContent = s.name || "";
      document.getElementById("name").textContent = s.name || "";
      document.getElementById("badges").innerHTML = buildHeaderBadges(s);
      renderDetailInfo(s);
      renderDetailTags(s);
      document.getElementById("backLink").href = "./sleeves/";
      const mercariLink = document.getElementById("mercariLink");
      if (mercariLink) mercariLink.href = buildMercariSearchUrl(s.name);

      const fullPeriodSeries = buildFullPeriodSeries(s);
      const latestObservation = fullPeriodSeries.length ? fullPeriodSeries[fullPeriodSeries.length - 1] : null;
      updateProductStructuredData(s, latestObservation ? latestObservation.price : null, releaseDateText);
      updateFaqStructuredData(s, latestObservation ? latestObservation.price : null, releaseDateText);
      const chartTitleEl = document.getElementById("priceSectionTitle");
      const modeNoteEl = document.getElementById("chartModeNote");
      const period3mBtn = document.getElementById("period3mBtn");
      const periodMonthlyBtn = document.getElementById("periodMonthlyBtn");
      const periodAllBtn = document.getElementById("periodAllBtn");
      let currentPeriod = "all";

      setPriceKpiFromSeries(fullPeriodSeries);
      renderRelatedSleeves(s, sleeves);

      const setPeriodButtons = (period) => {
        if (period3mBtn) period3mBtn.classList.toggle("is-active", period === "3m");
        if (periodMonthlyBtn) periodMonthlyBtn.classList.toggle("is-active", period === "monthly");
        if (periodAllBtn) periodAllBtn.classList.toggle("is-active", period === "all");
      };

      const applyPeriod = (period) => {
        currentPeriod = (period === "monthly" || period === "all") ? period : "3m";
        const scoped = enrichSeries(getSeriesForMode(s, currentPeriod));
        const mode = classifySeriesMode(scoped);
        const titleSuffix = currentPeriod === "3m" ? "（直近3か月）" : currentPeriod === "monthly" ? "（月次）" : "（全期間）";
        if (chartTitleEl) chartTitleEl.textContent = `価格推移${titleSuffix}`;
        renderPriceLegend(currentPeriod);
        renderPriceFootnotes(currentPeriod);

        if (mode === "empty") {
          document.getElementById("weeklyChart").innerHTML = `<div class="chart-wrap"><div class="meta">選択期間に観測データがありません</div></div>`;
          if (modeNoteEl) modeNoteEl.textContent = "";
        } else if (mode === "single") {
          renderSinglePriceCard("weeklyChart", scoped[0] || null, currentPeriod);
          if (modeNoteEl) modeNoteEl.textContent = "";
        } else if (mode === "few") {
          renderPriceAreaChart("weeklyChart", "価格推移", scoped, currentPeriod);
          if (modeNoteEl) modeNoteEl.textContent = "観測点が少ないため、価格推移は参考表示です。";
        } else {
          renderPriceAreaChart("weeklyChart", "価格推移", scoped, currentPeriod);
          if (modeNoteEl) modeNoteEl.textContent = "";
        }

        document.getElementById("weeklyTable").innerHTML = renderPriceTable(scoped, currentPeriod);
        setPeriodButtons(currentPeriod);
      };

      if (period3mBtn) period3mBtn.addEventListener("click", () => applyPeriod("3m"));
      if (periodMonthlyBtn) periodMonthlyBtn.addEventListener("click", () => applyPeriod("monthly"));
      if (periodAllBtn) periodAllBtn.addEventListener("click", () => applyPeriod("all"));

      applyPeriod(currentPeriod);
      setupShare(s, fullPeriodSeries.map((point) => ({
        avgPrice: point.price,
        periodStart: point.date,
        periodLabel: point.date,
        granularity: point.type === "yearly" ? "year" : point.type === "monthly" ? "month" : "week",
        hasTrade: true
      })));
    }

    document.addEventListener("DOMContentLoaded", () => main());
  </script>
</body>

</html>
