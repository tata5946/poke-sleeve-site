  <script>
    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "block";
      el.textContent = msg;
    }

    function hideError() {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "none";
      el.textContent = "";
    }

    function uniq(arr) {
      const s = new Set();
      for (const v of arr) {
        const t = (v == null) ? "" : String(v).trim();
        if (t) s.add(t);
      }
      return Array.from(s);
    }

    function parseBand(v) {
      if (!v) return null;
      const [a, b] = v.split("-").map(Number);
      if (!Number.isFinite(a) || !Number.isFinite(b)) return null;
      return { min: a, max: b };
    }

    function toISODate(d) {
      const dd = new Date(d);
      if (Number.isNaN(dd.getTime())) return null;
      const y = dd.getFullYear();
      const m = String(dd.getMonth() + 1).padStart(2, "0");
      const day = String(dd.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function numOrNull(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function formatMetaDate(value) {
      const text = String(value ?? "").trim();
      const match = text.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
      if (!match) return text || "-";
      return `${match[1]}/${Number(match[2])}/${Number(match[3])}`;
    }

    async function loadData() {
      if (window.common && typeof window.common.loadData === "function") {
        return await window.common.loadData();
      }
      const url = window.GAS_URL;
      if (!url) throw new Error("GAS_URL が設定されていません。common.js を確認してください。");
      const res = await fetch(url, { cache: "default" });
      if (!res.ok) throw new Error(`データ取得に失敗しました（HTTP ${res.status}）`);
      return await res.json();
    }

    function getWeeklyPair(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      if (arr.length === 0) return null;

      const map = new Map();
      for (const x of arr) {
        const weekISO = toISODate(x.week);
        if (!weekISO) continue;

        const price = numOrNull(x.price);
        const count = numOrNull(x.count);
        const hasTrade = (count == null) ? (price != null) : (count > 0 && price != null);
        if (!hasTrade) continue;

        map.set(weekISO, { week: weekISO, price, count: count == null ? null : count });
      }

      if (map.size === 0) return null;
      const sorted = Array.from(map.values()).sort((a, b) => a.week.localeCompare(b.week));
      const latest = sorted[sorted.length - 1];
      const prev = sorted.length >= 2 ? sorted[sorted.length - 2] : null;
      return { latest, prev };
    }

    function getSparklinePoints(sleeve, maxItems = 8) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      const map = new Map();

      for (const x of arr) {
        const weekISO = toISODate(x.week);
        if (!weekISO) continue;

        const price = numOrNull(x.price);
        const count = numOrNull(x.count);
        const hasTrade = (count == null) ? (price != null) : (count > 0 && price != null);
        if (!hasTrade || !(price > 0)) continue;

        map.set(weekISO, { week: weekISO, price });
      }

      return Array.from(map.values())
        .sort((a, b) => a.week.localeCompare(b.week))
        .slice(-maxItems)
        .map((x) => x.price);
    }

    function buildSparklineSvg(sleeve) {
      const prices = getSparklinePoints(sleeve);
      if (prices.length < 2) {
        return `<div class="sleeve-sparkline sleeve-sparkline--empty" aria-label="価格推移データなし"><span class="sleeve-sparkline-empty">推移なし</span></div>`;
      }

      const width = 86;
      const height = 36;
      const padX = 5;
      const padY = 5;
      const min = Math.min(...prices);
      const max = Math.max(...prices);
      const range = max - min;
      const step = (width - padX * 2) / Math.max(1, prices.length - 1);
      const points = prices.map((price, index) => {
        const x = padX + step * index;
        const y = range === 0
          ? height / 2
          : height - padY - ((price - min) / range) * (height - padY * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      const linePoints = points.join(" ");
      const firstX = padX.toFixed(1);
      const lastX = (padX + step * (prices.length - 1)).toFixed(1);
      const areaPoints = `${firstX},${height - padY} ${linePoints} ${lastX},${height - padY}`;

      return `
        <div class="sleeve-sparkline" aria-label="直近${prices.length}週の価格推移">
          <svg viewBox="0 0 ${width} ${height}" focusable="false" aria-hidden="true" preserveAspectRatio="none">
            <line class="sleeve-sparkline-grid" x1="5" y1="${height - padY}" x2="${width - padX}" y2="${height - padY}"></line>
            <polygon class="sleeve-sparkline-area" points="${areaPoints}"></polygon>
            <polyline class="sleeve-sparkline-line" points="${linePoints}"></polyline>
          </svg>
        </div>
      `;
    }

    function getLatestWeeklyPrice(sleeve) {
      const pair = getWeeklyPair(sleeve);
      return pair ? pair.latest.price : null;
    }

    function getTotalTradeCount(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      let sum = 0;
      let hasAny = false;

      for (const x of arr) {
        const c = numOrNull(x.count);
        if (Number.isFinite(c) && c > 0) {
          sum += c;
          hasAny = true;
        }
      }
      return hasAny ? sum : null;
    }

    function getWeeklyDeltaInfo(sleeve) {
      const pair = getWeeklyPair(sleeve);
      if (!pair || !pair.latest) return null;

      const latest = numOrNull(pair.latest.price);
      const prev = pair.prev ? numOrNull(pair.prev.price) : null;
      if (latest == null) return null;
      if (prev == null || prev <= 0) return { latest, prev: null, diff: null, rate: null };

      const diff = latest - prev;
      const rate = (diff / prev) * 100;
      return { latest, prev, diff, rate };
    }

    function getMarketRange(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      const prices = arr
        .map((x) => numOrNull(x && x.price))
        .filter((price) => Number.isFinite(price) && price > 0);

      if (!prices.length) return { min: null, max: null };
      return {
        min: Math.min(...prices),
        max: Math.max(...prices)
      };
    }

    function formatRateText(rate) {
      if (!Number.isFinite(rate)) return "?";
      const sign = rate > 0 ? "+" : "";
      return `${sign}${rate.toFixed(1)}%`;
    }

    function getDeltaClass(rate) {
      if (!Number.isFinite(rate)) return "flat";
      if (rate > 0) return "up";
      if (rate < 0) return "down";
      return "flat";
    }

    function getTagLabel(sleeve) {
      const candidates = [];
      if (Array.isArray(sleeve.tags)) candidates.push(...sleeve.tags);
      if (typeof sleeve.tag === "string") candidates.push(sleeve.tag);
      if (typeof sleeve.badge === "string") candidates.push(sleeve.badge);
      if (typeof sleeve.series === "string") candidates.push(sleeve.series);
      if (typeof sleeve.condition === "string") candidates.push(sleeve.condition);

      for (const raw of candidates) {
        const tag = String(raw || "").trim();
        if (!tag) continue;
        return tag.startsWith("#") ? tag : `#${tag}`;
      }
      return "#注目";
    }

    function getTagLabels(sleeve, maxItems = 3) {
      const candidates = [];
      if (Array.isArray(sleeve.tags)) candidates.push(...sleeve.tags);
      if (typeof sleeve.tag === "string") candidates.push(sleeve.tag);
      if (typeof sleeve.badge === "string") candidates.push(sleeve.badge);
      if (typeof sleeve.series === "string") candidates.push(sleeve.series);
      if (typeof sleeve.condition === "string") candidates.push(sleeve.condition);
      if (typeof sleeve.releaseYear === "number" || typeof sleeve.releaseYear === "string") {
        candidates.push(`${sleeve.releaseYear}`);
      }

      const seen = new Set();
      const result = [];
      for (const raw of candidates) {
        const tag = String(raw || "").trim();
        if (!tag) continue;
        const normalized = tag.startsWith("#") ? tag : `#${tag}`;
        if (seen.has(normalized)) continue;
        seen.add(normalized);
        result.push(normalized);
        if (result.length >= maxItems) break;
      }

      return result.length ? result : ["#注目"];
    }

    function getCompactDeltaDisplay(deltaInfo) {
      if (!deltaInfo || !Number.isFinite(deltaInfo.diff)) {
        return { className: "flat", text: "比較なし" };
      }
      const diff = Number(deltaInfo.diff);
      const sign = diff > 0 ? "+" : diff < 0 ? "-" : "±";
      const className = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
      return { className, text: `${sign}${Math.abs(diff).toLocaleString()}円` };
    }

    function getCompactTagLabels(sleeve, maxItems = 2) {
      const candidates = [];
      if (sleeve.series) candidates.push(sleeve.series);
      if (sleeve.condition) candidates.push(sleeve.condition);
      if (Array.isArray(sleeve.tags)) candidates.push(...sleeve.tags);
      if (typeof sleeve.tag === "string") candidates.push(sleeve.tag);
      if (typeof sleeve.badge === "string") candidates.push(sleeve.badge);

      const seen = new Set();
      const result = [];
      for (const raw of candidates) {
        const text = String(raw || "").trim().replace(/^#/, "");
        if (!text || seen.has(text)) continue;
        seen.add(text);
        result.push(text);
        if (result.length >= maxItems) break;
      }
      return result;
    }

    function buildHighlightCopy(sleeve, rank, deltaInfo) {
      const parts = [];
      if (sleeve.series) parts.push(`${sleeve.series}の注目スリーブ`);
      else parts.push("注目スリーブ");

      if (Number.isFinite(deltaInfo && deltaInfo.rate)) {
        const trend = deltaInfo.rate >= 0 ? "上昇が続く" : "変動幅に注目したい";
        parts.push(`${trend}${rank === 1 ? "トップ銘柄" : "人気候補"}`);
      } else if (sleeve.releaseYear) {
        parts.push(`${sleeve.releaseYear}年発売の存在感ある1枚`);
      } else {
        parts.push("最新価格で存在感を示す1枚");
      }

      return parts.join("。");
    }

    function getPodiumBadge(rank) {
      if (rank === 1) return "1位";
      if (rank === 2) return "2位";
      return "3位";
    }

    function buildPodiumCard(row, rank) {
      const s = row.s;
      const deltaInfo = row.deltaInfo;
      const imgSrc = String(s.imageUrl || "").trim();
      const rateClass = getDeltaClass(deltaInfo && deltaInfo.rate);
      const sparklineHtml = buildSparklineSvg(s);
      const metaItems = [
        s.releaseYear ? `YEAR ${escapeHtml(s.releaseYear)}` : "",
        s.series ? escapeHtml(s.series) : ""
      ].filter(Boolean);
      const metaHtml = metaItems.map((item) => `<span class="podium-chip">${item}</span>`).join("");

      return `
        <article class="podium-card podium-card--rank${rank}">
          <div class="podium-badge">${getPodiumBadge(rank)}</div>
          <a class="podium-media" data-sleeve-link="1" href="${row.detailHref}">
            <img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(s.name ?? "")}" loading="${rank === 1 ? "eager" : "lazy"}" referrerpolicy="no-referrer"
              onerror="this.onerror=null; this.style.display='none';">
          </a>
          <div class="podium-content">
            <div class="podium-kicker">Top ${rank} Sleeve</div>
            <h${rank === 1 ? "2" : "3"} class="podium-title">${escapeHtml(s.name ?? "")}</h${rank === 1 ? "2" : "3"}>
            <div class="podium-metrics">
              <div class="podium-metric">
                <span class="podium-metric-label">最新価格</span>
                <div class="podium-price">${row.price.toLocaleString()}円</div>
              </div>
              <div class="podium-metric">
                <span class="podium-metric-label">前週比</span>
                <div class="podium-rate ${rateClass}">${formatRateText(deltaInfo && deltaInfo.rate)}</div>
              </div>
            </div>
            <div class="podium-market-row">
              ${sparklineHtml}
            </div>
            <div class="podium-meta">
              <div class="podium-chip-group">${metaHtml}</div>
            </div>
          </div>
        </article>
      `;
    }

    function buildStandardCard(row, rank) {
      const s = row.s;
      const imgSrc = String(s.imageUrl || "").trim();
      const delta = getCompactDeltaDisplay(row.deltaInfo);
      const sparklineHtml = buildSparklineSvg(s);
      const metaItems = [
        s.releaseYear ? `YEAR ${escapeHtml(s.releaseYear)}` : "",
        s.series ? escapeHtml(s.series) : ""
      ].filter(Boolean);
      const metaHtml = metaItems.length
        ? `<div class="compact-meta">${metaItems.map((item) => `<span class="compact-meta-item">${item}</span>`).join("")}</div>`
        : "";

      return `
        <span class="compact-rank-badge">${rank}位</span>
        <span class="compact-thumb-wrap">
          ${imgSrc
            ? `<img class="compact-thumb" src="${escapeHtml(imgSrc)}" alt="${escapeHtml(s.name ?? "")}" loading="lazy" referrerpolicy="no-referrer"
                onerror="this.onerror=null; this.style.display='none';">`
            : ""}
        </span>
        <h3 class="compact-card-title">${escapeHtml(s.name ?? "")}</h3>
        <div class="compact-market-row">
          <div class="compact-price-row">
            <div class="compact-price">${row.price.toLocaleString()}円</div>
            <div class="compact-delta ${delta.className}">${escapeHtml(delta.text)}</div>
          </div>
          ${sparklineHtml}
        </div>
        ${metaHtml}
      `;
    }

    async function main() {
      await window.common.setupDashboardChrome({ sidebarActive: "ranking", topbarActive: "market" });
      const list = document.getElementById("list");
      const top3 = document.getElementById("top3");
      const top1 = document.getElementById("top1");
      const top2 = document.getElementById("top2");
      const top3Card = document.getElementById("top3Card");
      const restSection = document.getElementById("restSection");
      const releaseYearSel = document.getElementById("releaseYear");
      const seriesSel = document.getElementById("series");
      const priceBandSel = document.getElementById("priceBand");
      const activeFilters = document.getElementById("activeFilters");
      const clearBtn = document.getElementById("clear");

      let data;
      try {
        data = await loadData();
      } catch (e) {
        showError(e.message || "不明なエラーが発生しました");
        return;
      }
      hideError();

      const sleeves = Array.isArray(data.sleeves) ? data.sleeves : [];

      try {
        let maxWeek = null;
        for (const s of sleeves) {
          const p = getWeeklyPair(s);
          if (!p) continue;
          const w = p.latest.week;
          if (!maxWeek || w > maxWeek) maxWeek = w;
        }
        if (maxWeek) {
          const u = document.getElementById("updatedAt");
          if (u) {
            u.textContent = formatMetaDate(maxWeek);
            u.style.display = "block";
          }
        }
      } catch (_) { }

      const releaseYears = uniq(sleeves.map(s => s.releaseYear)).map(Number).filter(Number.isFinite).sort((a, b) => a - b);
      const seriesList = uniq(sleeves.map(s => s.series)).sort();

      for (const y of releaseYears) {
        const opt = document.createElement("option");
        opt.value = String(y);
        opt.textContent = String(y);
        releaseYearSel.appendChild(opt);
      }
      for (const ser of seriesList) {
        const opt = document.createElement("option");
        opt.value = ser;
        opt.textContent = ser;
        seriesSel.appendChild(opt);
      }

      function renderActiveFilters() {
        if (!activeFilters) return;
        const chips = [];
        if (releaseYearSel.value) chips.push({ key: "releaseYear", text: `発売年: ${releaseYearSel.value}` });
        if (seriesSel.value) chips.push({ key: "series", text: `シリーズ: ${seriesSel.value}` });
        if (priceBandSel.value) {
          const selected = priceBandSel.options[priceBandSel.selectedIndex];
          const label = selected ? selected.textContent.trim() : "";
          if (label) chips.push({ key: "priceBand", text: `価格帯: ${label}` });
        }

        activeFilters.innerHTML = chips.map((chip) =>
          `<button class="ranking-filter-chip" type="button" data-filter-key="${escapeHtml(chip.key)}" aria-label="${escapeHtml(chip.text)} を解除">
            <span>${escapeHtml(chip.text)}</span>
            <span class="ranking-filter-chip-remove" aria-hidden="true">×</span>
          </button>`
        ).join("");
        activeFilters.classList.toggle("is-visible", chips.length > 0);
      }

      function render() {
        const releaseYear = releaseYearSel.value;
        const series = seriesSel.value;
        const band = parseBand(priceBandSel.value);

        list.innerHTML = "";
        top1.innerHTML = "";
        top2.innerHTML = "";
        top3Card.innerHTML = "";
        top3.hidden = true;
        restSection.hidden = false;
        renderActiveFilters();
        const rows = [];
        for (const s of sleeves) {
          if (releaseYear && String(s.releaseYear ?? "") !== releaseYear) continue;
          if (series && String(s.series || "") !== series) continue;

          const p = getLatestWeeklyPrice(s);
          if (p == null) continue;
          if (band && (p < band.min || p > band.max)) continue;

          const pair = getWeeklyPair(s);
          const detailHref = (window.common && typeof window.common.buildSleeveDetailHref === "function")
            ? window.common.buildSleeveDetailHref(s.id ?? "")
            : `./sleeve/${encodeURIComponent(s.id ?? "")}/`;

          rows.push({
            s,
            price: p,
            week: pair ? pair.latest.week : null,
            detailHref,
            deltaInfo: getWeeklyDeltaInfo(s),
            marketRange: getMarketRange(s)
          });
        }

        rows.sort((a, b) => {
          if (b.price !== a.price) return b.price - a.price;
          return String(a.s.name ?? "").localeCompare(String(b.s.name ?? ""));
        });

        const c = document.getElementById("countInfo");
        if (c) {
          c.textContent = `${rows.length.toLocaleString()}件`;
          c.style.display = "block";
        }

        if (rows.length === 0) {
          list.innerHTML = `<div class="card"><div class="title">該当なし</div><div class="meta">条件に一致するスリーブがありません</div></div>`;
          return;
        }

        const topRows = rows.slice(0, 3);
        if (topRows.length) {
          top3.hidden = false;
          top1.innerHTML = buildPodiumCard(topRows[0], 1);
          if (topRows[1]) top2.innerHTML = buildPodiumCard(topRows[1], 2);
          if (topRows[2]) top3Card.innerHTML = buildPodiumCard(topRows[2], 3);
        }

        const normalRows = rows.slice(3);
        restSection.hidden = normalRows.length === 0;

        const frag = document.createDocumentFragment();
        for (let i = 0; i < normalRows.length; i++) {
          const row = normalRows[i];
          const card = document.createElement("a");
          card.className = "compact-card";
          card.href = row.detailHref;
          card.setAttribute("data-sleeve-link", "1");
          card.setAttribute("aria-label", `${String(row.s.name ?? "")}の詳細を見る`);
          card.innerHTML = buildStandardCard(row, i + 4);
          frag.appendChild(card);
        }

        list.appendChild(frag);
      }

      releaseYearSel.addEventListener("change", render);
      seriesSel.addEventListener("change", render);
      priceBandSel.addEventListener("change", render);

      clearBtn.addEventListener("click", () => {
        releaseYearSel.value = "";
        seriesSel.value = "";
        priceBandSel.value = "";
        render();
      });

      if (activeFilters) {
        activeFilters.addEventListener("click", (event) => {
          const btn = event.target.closest("[data-filter-key]");
          if (!btn) return;
          const key = btn.getAttribute("data-filter-key");
          if (key === "releaseYear") releaseYearSel.value = "";
          if (key === "series") seriesSel.value = "";
          if (key === "priceBand") priceBandSel.value = "";
          render();
        });
      }

      render();
    }

    main();
  </script>
</body>
</html>
