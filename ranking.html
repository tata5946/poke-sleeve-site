<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>価格ランキング | ポケスリ相場ナビ</title>
  <meta name="description" content="ポケカスリーブの価格ランキング（最新週次）を掲載。検索・絞り込みで相場を比較できます。" />
  <meta property="og:title" content="価格ランキング | ポケスリ相場ナビ" />
  <meta property="og:description" content="ポケカスリーブの価格ランキング（最新週次）を掲載。検索・絞り込みで相場を比較できます。" />
  <meta property="og:image" content="https://pokesuri-navi.com/assets/favicon.svg" />
  <meta property="og:url" content="https://pokesuri-navi.com/ranking.html" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/site.css" />
  <style>
    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin: 0 0 12px;
      font-size: 12px;
      color: var(--muted);
    }

    .breadcrumb a {
      color: #1e5bd7;
      text-decoration: none;
      font-weight: 800;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .breadcrumb-sep {
      color: #98a2b3;
    }

    .breadcrumb-current {
      color: #344054;
      font-weight: 800;
    }

    .ranking-main {
      display: grid;
      gap: 18px;
    }

    .ranking-top3 {
      display: grid;
      gap: 14px;
    }

    .ranking-top3[hidden],
    .ranking-rest-section[hidden] {
      display: none;
    }

    .ranking-top23 {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .ranking-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .ranking-section-title {
      margin: 0;
      font-size: 15px;
      font-weight: 900;
      color: #101828;
    }

    .ranking-section-note {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .podium-card {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid #f0dca7;
      box-shadow: 0 12px 28px rgba(15, 23, 42, .10);
      background: linear-gradient(180deg, #fff7de 0%, #fffdf8 100%);
      padding: 12px;
    }

    .podium-card--rank1 {
      display: grid;
      grid-template-columns: minmax(220px, 360px) minmax(0, 1fr);
      align-items: center;
      gap: 14px;
      padding: 14px;
      background:
        radial-gradient(circle at top right, rgba(255, 214, 102, .28), transparent 32%),
        linear-gradient(145deg, #fff4cd 0%, #fff9ea 44%, #fffdf8 100%);
    }

    .podium-card--rank2 {
      background:
        linear-gradient(180deg, #f8fbff 0%, #ffffff 100%);
    }

    .podium-card--rank3 {
      background:
        linear-gradient(180deg, #fffaf5 0%, #ffffff 100%);
    }

    .podium-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(17, 24, 39, .84);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      backdrop-filter: blur(8px);
    }

    .podium-media {
      display: block;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255, 255, 255, .84);
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, .04);
    }

    .podium-media img {
      width: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      background: #f4f6fa;
    }

    .podium-card--rank1 .podium-media img {
      height: 280px;
    }

    .podium-card--rank1 .podium-media {
      padding: 10px;
    }

    .podium-card:not(.podium-card--rank1) .podium-media img {
      height: 150px;
    }

    .podium-card:not(.podium-card--rank1) .podium-media {
      padding: 10px;
    }

    .podium-content {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .podium-card--rank1 .podium-content {
      margin-top: 0;
    }

    .podium-card:not(.podium-card--rank1) .podium-content {
      gap: 10px;
    }

    .podium-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .05em;
      color: #7a5b00;
      text-transform: uppercase;
    }

    .podium-card:not(.podium-card--rank1) .podium-kicker {
      color: #52606d;
    }

    .podium-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.3;
      font-weight: 900;
      color: #101828;
    }

    .podium-card:not(.podium-card--rank1) .podium-title {
      font-size: 16px;
    }

    .podium-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .podium-metric {
      padding: 10px;
      border-radius: 14px;
      background: rgba(255, 255, 255, .78);
      border: 1px solid rgba(255, 255, 255, .72);
    }

    .podium-metric-label {
      display: block;
      font-size: 11px;
      color: #667085;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .podium-price {
      font-size: 24px;
      font-weight: 900;
      line-height: 1.1;
      color: #111827;
    }

    .podium-card:not(.podium-card--rank1) .podium-price {
      font-size: 18px;
    }

    .podium-rate {
      font-size: 20px;
      font-weight: 900;
      line-height: 1.1;
    }

    .podium-card:not(.podium-card--rank1) .podium-rate {
      font-size: 16px;
    }

    .podium-summary {
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
      color: #344054;
      font-weight: 700;
    }

    .podium-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .podium-chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      background: rgba(255, 255, 255, .82);
      border: 1px solid rgba(16, 24, 40, .08);
      color: #344054;
    }

    .podium-card--rank1 .podium-chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .podium-card:not(.podium-card--rank1) .podium-chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .podium-actions {
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .podium-actions .btn {
      margin-top: 0;
    }

    .podium-card:not(.podium-card--rank1) .podium-summary,
    .podium-card:not(.podium-card--rank1) .podium-actions,
    .podium-card:not(.podium-card--rank1) .podium-kicker {
      display: none;
    }

    .podium-card:not(.podium-card--rank1) .podium-metrics {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .podium-card:not(.podium-card--rank1) .podium-metric {
      background: #fff;
    }

    .podium-card:not(.podium-card--rank1) .podium-meta {
      gap: 6px;
    }

    .podium-card:not(.podium-card--rank1) .podium-meta .podium-chip:last-child {
      display: none;
    }

    .ranking-card-note {
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.5;
      color: #475467;
      font-weight: 700;
    }

    @media (max-width: 700px) {
      .ranking-top23 {
        grid-template-columns: 1fr;
      }

      .podium-card--rank1 {
        grid-template-columns: 1fr;
      }

      .podium-card--rank1 .podium-media img {
        height: 220px;
      }

       .podium-card:not(.podium-card--rank1) .podium-media img {
        height: 130px;
      }

      .podium-metrics {
        grid-template-columns: 1fr;
      }

      .podium-title {
        font-size: 18px;
      }
    }
  </style>
</head>
<script src="./assets/common.js"></script>
<body>
  <div id="site-header"></div>

  <div class="container">
    <nav class="breadcrumb" aria-label="パンくず">
      <a href="./index.html">ホーム</a>
      <span class="breadcrumb-sep" aria-hidden="true">></span>
      <span class="breadcrumb-current" aria-current="page">価格ランキング</span>
    </nav>
    <div class="hero">
      <div class="hero-card">
        <div>
          <p class="hero-title">価格ランキング</p>
          <p class="hero-desc">最新の取引週（週次）価格が高い順にランキング表示します。</p>
          <p class="data-note">価格はプレミア価格の参考値です。取引状況により変動します。</p>
          <p id="updatedAt" class="data-note" style="display:none;"></p>
          <p id="countInfo" class="data-note" style="display:none;"></p>
        </div>
      </div>
    </div>

    <div class="main">
      <aside class="panel">
        <h2>絞り込み</h2>
        <p class="small">条件を変更するとランキングが更新されます。</p>

        <div id="error" class="error"></div>

        <div class="controls">
          <label>発売年
            <select id="releaseYear">
              <option value="">すべて</option>
            </select>
          </label>

          <label>シリーズ
            <select id="series">
              <option value="">すべて</option>
            </select>
          </label>

          <label>価格帯
            <select id="priceBand">
              <option value="">すべて</option>
              <option value="0-999">0-999円</option>
              <option value="1000-1999">1,000-1,999円</option>
              <option value="2000-2999">2,000-2,999円</option>
              <option value="3000-4999">3,000-4,999円</option>
              <option value="5000-99999999">5,000円以上</option>
            </select>
          </label>

          <button id="clear" type="button">クリア</button>
        </div>
      </aside>

      <main>
        <div class="ranking-main">
          <section id="top3" class="ranking-top3" aria-label="ランキング上位3件" hidden>
            <div id="top1"></div>
            <div id="top23" class="ranking-top23"></div>
          </section>

          <section id="restSection" class="ranking-rest-section">
            <div class="ranking-section-head">
              <h2 class="ranking-section-title">4位以降のランキング</h2>
              <p class="ranking-section-note">条件に一致したスリーブを一覧表示</p>
            </div>
            <div id="list" class="grid"></div>
          </section>
        </div>
      </main>
    </div>

    <div id="site-footer"></div>
  </div>

  <script>
    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(msg) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "block";
      el.textContent = msg;
    }

    function hideError() {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = "none";
      el.textContent = "";
    }

    function uniq(arr) {
      const s = new Set();
      for (const v of arr) {
        const t = (v == null) ? "" : String(v).trim();
        if (t) s.add(t);
      }
      return Array.from(s);
    }

    function parseBand(v) {
      if (!v) return null;
      const [a, b] = v.split("-").map(Number);
      if (!Number.isFinite(a) || !Number.isFinite(b)) return null;
      return { min: a, max: b };
    }

    function toISODate(d) {
      const dd = new Date(d);
      if (Number.isNaN(dd.getTime())) return null;
      const y = dd.getFullYear();
      const m = String(dd.getMonth() + 1).padStart(2, "0");
      const day = String(dd.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function numOrNull(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    async function loadData() {
      const url = window.GAS_URL;
      if (!url) throw new Error("GAS_URL が設定されていません。common.js を確認してください。");
      const res = await fetch(url + "?v=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(`データ取得に失敗しました（HTTP ${res.status}）`);
      return await res.json();
    }

    function getWeeklyPair(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      if (arr.length === 0) return null;

      const map = new Map();
      for (const x of arr) {
        const weekISO = toISODate(x.week);
        if (!weekISO) continue;

        const price = numOrNull(x.price);
        const count = numOrNull(x.count);
        const hasTrade = (count == null) ? (price != null) : (count > 0 && price != null);
        if (!hasTrade) continue;

        map.set(weekISO, { week: weekISO, price, count: count == null ? null : count });
      }

      if (map.size === 0) return null;
      const sorted = Array.from(map.values()).sort((a, b) => a.week.localeCompare(b.week));
      const latest = sorted[sorted.length - 1];
      const prev = sorted.length >= 2 ? sorted[sorted.length - 2] : null;
      return { latest, prev };
    }

    function getLatestWeeklyPrice(sleeve) {
      const pair = getWeeklyPair(sleeve);
      return pair ? pair.latest.price : null;
    }

    function getTotalTradeCount(sleeve) {
      const arr = Array.isArray(sleeve.weeklyPrices) ? sleeve.weeklyPrices : [];
      let sum = 0;
      let hasAny = false;

      for (const x of arr) {
        const c = numOrNull(x.count);
        if (Number.isFinite(c) && c > 0) {
          sum += c;
          hasAny = true;
        }
      }
      return hasAny ? sum : null;
    }

    function getWeeklyDeltaInfo(sleeve) {
      const pair = getWeeklyPair(sleeve);
      if (!pair || !pair.latest) return null;

      const latest = numOrNull(pair.latest.price);
      const prev = pair.prev ? numOrNull(pair.prev.price) : null;
      if (latest == null) return null;
      if (prev == null || prev <= 0) return { latest, prev: null, diff: null, rate: null };

      const diff = latest - prev;
      const rate = (diff / prev) * 100;
      return { latest, prev, diff, rate };
    }

    function formatRateText(rate) {
      if (!Number.isFinite(rate)) return "—";
      const sign = rate > 0 ? "+" : "";
      return `${sign}${rate.toFixed(1)}%`;
    }

    function getDeltaClass(rate) {
      if (!Number.isFinite(rate)) return "flat";
      if (rate > 0) return "up";
      if (rate < 0) return "down";
      return "flat";
    }

    function getTagLabel(sleeve) {
      const candidates = [];
      if (Array.isArray(sleeve.tags)) candidates.push(...sleeve.tags);
      if (typeof sleeve.tag === "string") candidates.push(sleeve.tag);
      if (typeof sleeve.badge === "string") candidates.push(sleeve.badge);
      if (typeof sleeve.series === "string") candidates.push(sleeve.series);
      if (typeof sleeve.condition === "string") candidates.push(sleeve.condition);

      for (const raw of candidates) {
        const tag = String(raw || "").trim();
        if (!tag) continue;
        return tag.startsWith("#") ? tag : `#${tag}`;
      }
      return "#注目";
    }

    function getTagLabels(sleeve, maxItems = 3) {
      const candidates = [];
      if (Array.isArray(sleeve.tags)) candidates.push(...sleeve.tags);
      if (typeof sleeve.tag === "string") candidates.push(sleeve.tag);
      if (typeof sleeve.badge === "string") candidates.push(sleeve.badge);
      if (typeof sleeve.series === "string") candidates.push(sleeve.series);
      if (typeof sleeve.condition === "string") candidates.push(sleeve.condition);
      if (typeof sleeve.releaseYear === "number" || typeof sleeve.releaseYear === "string") {
        candidates.push(`${sleeve.releaseYear}`);
      }

      const seen = new Set();
      const result = [];
      for (const raw of candidates) {
        const tag = String(raw || "").trim();
        if (!tag) continue;
        const normalized = tag.startsWith("#") ? tag : `#${tag}`;
        if (seen.has(normalized)) continue;
        seen.add(normalized);
        result.push(normalized);
        if (result.length >= maxItems) break;
      }

      return result.length ? result : ["#注目"];
    }

    function buildHighlightCopy(sleeve, rank, deltaInfo) {
      const parts = [];
      if (sleeve.series) parts.push(`${sleeve.series}の注目スリーブ`);
      else parts.push("注目スリーブ");

      if (Number.isFinite(deltaInfo && deltaInfo.rate)) {
        const trend = deltaInfo.rate >= 0 ? "上昇が続く" : "変動幅に注目したい";
        parts.push(`${trend}${rank === 1 ? "トップ銘柄" : "人気候補"}`);
      } else if (sleeve.releaseYear) {
        parts.push(`${sleeve.releaseYear}年発売の存在感ある1枚`);
      } else {
        parts.push("最新価格で存在感を示す1枚");
      }

      return parts.join("。");
    }

    function getPodiumBadge(rank) {
      if (rank === 1) return "🥇 1位";
      if (rank === 2) return "🥈 2位";
      return "🥉 3位";
    }

    function buildPodiumCard(row, rank) {
      const s = row.s;
      const deltaInfo = row.deltaInfo;
      const imgSrc = String(s.imageUrl || "").trim();
      const tagLabels = getTagLabels(s, rank === 1 ? 3 : 2);
      const summary = buildHighlightCopy(s, rank, deltaInfo);
      const rateClass = getDeltaClass(deltaInfo && deltaInfo.rate);
      const weekText = row.week ? `対象週 ${escapeHtml(row.week)}` : "対象週データなし";
      const tagHtml = tagLabels.map((tag) => `<span class="podium-chip">${escapeHtml(tag)}</span>`).join("");

      if (rank !== 1) {
        return `
          <article class="podium-card podium-card--rank${rank}">
            <div class="podium-badge">${getPodiumBadge(rank)}</div>
            <a class="podium-media" data-sleeve-link="1" href="${row.detailHref}">
              <img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(s.name ?? "")}" loading="lazy" referrerpolicy="no-referrer"
                onerror="this.onerror=null; this.style.display='none';">
            </a>
            <div class="podium-content">
              <h3 class="podium-title">${escapeHtml(s.name ?? "")}</h3>
              <div class="podium-metrics">
                <div class="podium-metric">
                  <span class="podium-metric-label">最新価格</span>
                  <div class="podium-price">${row.price.toLocaleString()}円</div>
                </div>
                <div class="podium-metric">
                  <span class="podium-metric-label">前週比</span>
                  <div class="podium-rate ${rateClass}">${formatRateText(deltaInfo && deltaInfo.rate)}</div>
                </div>
              </div>
              <div class="podium-meta">
                <div class="podium-chip-group">${tagHtml}</div>
                <span class="podium-chip">${weekText}</span>
              </div>
            </div>
          </article>
        `;
      }

      return `
        <article class="podium-card podium-card--rank${rank}">
          <div class="podium-badge">${getPodiumBadge(rank)}</div>
          <a class="podium-media" data-sleeve-link="1" href="${row.detailHref}">
            <img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(s.name ?? "")}" loading="${rank === 1 ? "eager" : "lazy"}" referrerpolicy="no-referrer"
              onerror="this.onerror=null; this.style.display='none';">
          </a>
          <div class="podium-content">
            <div class="podium-kicker">Top ${rank} Sleeve</div>
            <h2 class="podium-title">${escapeHtml(s.name ?? "")}</h2>
            <div class="podium-metrics">
              <div class="podium-metric">
                <span class="podium-metric-label">最新価格</span>
                <div class="podium-price">${row.price.toLocaleString()}円</div>
              </div>
              <div class="podium-metric">
                <span class="podium-metric-label">前週比</span>
                <div class="podium-rate ${rateClass}">${formatRateText(deltaInfo && deltaInfo.rate)}</div>
              </div>
            </div>
            <div class="podium-meta">
              <div class="podium-chip-group">${tagHtml}</div>
              <span class="podium-chip">${weekText}</span>
            </div>
            <p class="podium-summary">${escapeHtml(summary)}</p>
            <div class="podium-actions">
              <a class="btn" data-sleeve-link="1" href="${row.detailHref}">価格推移を見る →</a>
            </div>
          </div>
        </article>
      `;
    }

    function buildStandardCard(row, rank) {
      const s = row.s;
      const totalTrades = getTotalTradeCount(s);
      const totalTradesText = (totalTrades == null) ? "—" : `${totalTrades.toLocaleString()}件`;
      const imgSrc = String(s.imageUrl || "").trim();
      const imgHtml = imgSrc
        ? `<a class="thumb-link" href="${row.detailHref}">
             <img class="thumb" src="${escapeHtml(imgSrc)}" alt="${escapeHtml(s.name ?? "")}" loading="lazy" referrerpolicy="no-referrer"
               onerror="this.onerror=null; this.style.display='none';">
           </a>`
        : "";
      const weekText = row.week ? `対象週 ${escapeHtml(row.week)}` : "対象週データなし";
      const rateClass = getDeltaClass(row.deltaInfo && row.deltaInfo.rate);
      const tagLabel = getTagLabel(s);
      const summary = buildHighlightCopy(s, rank, row.deltaInfo);

      return `
        ${imgHtml}
        <div class="rank-row">
          <span class="rank-badge">${rank}位</span>
          <div class="title" style="margin:0;">${escapeHtml(s.name ?? "")}</div>
        </div>
        <div class="price">${row.price.toLocaleString()}円 <span class="meta">（最新週次）</span></div>
        <div class="delta">
          <span class="chip ${rateClass}">前週比 ${formatRateText(row.deltaInfo && row.deltaInfo.rate)}</span>
          <span class="chip">${escapeHtml(tagLabel)}</span>
        </div>
        <div class="meta" style="margin-top:4px;">${weekText}</div>
        <div class="ranking-card-note">${escapeHtml(summary)}</div>
        <div class="badges">
          <span class="badge">総取引：${escapeHtml(totalTradesText)}</span>
          <span class="badge">発売年：${escapeHtml(s.releaseYear ?? "")}</span>
          <span class="badge">${escapeHtml(s.condition ?? "")}</span>
          <span class="badge">${escapeHtml(s.series ?? "")}</span>
        </div>
        <a class="btn" data-sleeve-link="1" href="${row.detailHref}">価格推移を見る →</a>
      `;
    }

    async function main() {
      const list = document.getElementById("list");
      const top3 = document.getElementById("top3");
      const top1 = document.getElementById("top1");
      const top23 = document.getElementById("top23");
      const restSection = document.getElementById("restSection");
      const searchInput = document.getElementById("search");
      const releaseYearSel = document.getElementById("releaseYear");
      const seriesSel = document.getElementById("series");
      const priceBandSel = document.getElementById("priceBand");
      const clearBtn = document.getElementById("clear");

      let data;
      try {
        data = await loadData();
      } catch (e) {
        showError(e.message || "不明なエラーが発生しました");
        return;
      }
      hideError();

      const sleeves = Array.isArray(data.sleeves) ? data.sleeves : [];

      try {
        let maxWeek = null;
        for (const s of sleeves) {
          const p = getWeeklyPair(s);
          if (!p) continue;
          const w = p.latest.week;
          if (!maxWeek || w > maxWeek) maxWeek = w;
        }
        if (maxWeek) {
          const u = document.getElementById("updatedAt");
          u.textContent = `最終更新：${maxWeek}（週次）`;
          u.style.display = "block";
        }
      } catch (_) { }

      const releaseYears = uniq(sleeves.map(s => s.releaseYear)).map(Number).filter(Number.isFinite).sort((a, b) => a - b);
      const seriesList = uniq(sleeves.map(s => s.series)).sort();

      for (const y of releaseYears) {
        const opt = document.createElement("option");
        opt.value = String(y);
        opt.textContent = String(y);
        releaseYearSel.appendChild(opt);
      }
      for (const ser of seriesList) {
        const opt = document.createElement("option");
        opt.value = ser;
        opt.textContent = ser;
        seriesSel.appendChild(opt);
      }

      function render() {
        const kw = (searchInput ? searchInput.value : "").trim().toLowerCase();
        const releaseYear = releaseYearSel.value;
        const series = seriesSel.value;
        const band = parseBand(priceBandSel.value);

        list.innerHTML = "";
        top1.innerHTML = "";
        top23.innerHTML = "";
        top3.hidden = true;
        restSection.hidden = false;

        const rows = [];
        for (const s of sleeves) {
          if (kw && !String(s.name || "").toLowerCase().includes(kw)) continue;
          if (releaseYear && String(s.releaseYear ?? "") !== releaseYear) continue;
          if (series && String(s.series || "") !== series) continue;

          const p = getLatestWeeklyPrice(s);
          if (p == null) continue;
          if (band && (p < band.min || p > band.max)) continue;

          const pair = getWeeklyPair(s);
          const detailHref = (window.common && typeof window.common.buildSleeveDetailHref === "function")
            ? window.common.buildSleeveDetailHref(s.id ?? "")
            : `./sleeve/${encodeURIComponent(s.id ?? "")}/`;

          rows.push({
            s,
            price: p,
            week: pair ? pair.latest.week : null,
            detailHref,
            deltaInfo: getWeeklyDeltaInfo(s)
          });
        }

        rows.sort((a, b) => {
          if (b.price !== a.price) return b.price - a.price;
          return String(a.s.name ?? "").localeCompare(String(b.s.name ?? ""));
        });

        const c = document.getElementById("countInfo");
        c.textContent = `表示件数：${rows.length.toLocaleString()}件（最新週次価格順）`;
        c.style.display = "block";

        if (rows.length === 0) {
          list.innerHTML = `<div class="card"><div class="title">該当なし</div><div class="meta">条件に一致するスリーブがありません</div></div>`;
          return;
        }

        const topRows = rows.slice(0, 3);
        if (topRows.length > 0) {
          top3.hidden = false;
          top1.innerHTML = buildPodiumCard(topRows[0], 1);
          if (topRows[1]) top23.insertAdjacentHTML("beforeend", buildPodiumCard(topRows[1], 2));
          if (topRows[2]) top23.insertAdjacentHTML("beforeend", buildPodiumCard(topRows[2], 3));
        }

        const normalRows = rows.slice(3);
        restSection.hidden = normalRows.length === 0;

        const frag = document.createDocumentFragment();
        for (let i = 0; i < normalRows.length; i++) {
          const row = normalRows[i];
          const rank = i + 4;
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = buildStandardCard(row, rank);
          frag.appendChild(div);
        }

        list.appendChild(frag);
      }

      let t = null;
      if (searchInput) {
        searchInput.addEventListener("input", () => {
          clearTimeout(t);
          t = setTimeout(render, 80);
        });
      }

      releaseYearSel.addEventListener("change", render);
      seriesSel.addEventListener("change", render);
      priceBandSel.addEventListener("change", render);

      clearBtn.addEventListener("click", () => {
        if (searchInput) searchInput.value = "";
        releaseYearSel.value = "";
        seriesSel.value = "";
        priceBandSel.value = "";
        render();
      });

      render();
    }

    main();
  </script>
</body>
</html>
