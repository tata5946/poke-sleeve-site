<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>記事エディタ | ポケスリ相場ナビ</title>
  <link rel="stylesheet" href="./assets/site.css?v=20260501c" />
  <style>
    :root {
      --admin-bg:
        radial-gradient(circle at 12% 0%, rgba(255, 226, 200, .72), transparent 28%),
        radial-gradient(circle at 100% 0%, rgba(201, 239, 255, .72), transparent 32%),
        linear-gradient(180deg, #f8fbff 0%, #f4f7fb 100%);
      --admin-card: rgba(255, 255, 255, .96);
      --admin-border: #dbe4f0;
      --admin-text: #162033;
      --admin-muted: #667085;
      --admin-shadow: 0 14px 36px rgba(15, 23, 42, .10);
    }

    body.admin-article-page {
      margin: 0;
      min-height: 100vh;
      background: var(--admin-bg);
      color: var(--admin-text);
      font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    }

    .admin-shell {
      max-width: 1500px;
      margin: 0 auto;
      padding: 28px 20px 40px;
      display: grid;
      gap: 18px;
    }

    .admin-hero,
    .admin-panel {
      border: 1px solid var(--admin-border);
      border-radius: 22px;
      background: var(--admin-card);
      box-shadow: var(--admin-shadow);
    }

    .admin-hero {
      padding: 22px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .admin-hero h1 {
      margin: 0;
      font-size: clamp(26px, 3.2vw, 40px);
      line-height: 1.1;
    }

    .admin-hero p {
      margin: 8px 0 0;
      color: var(--admin-muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .admin-badge {
      display: inline-flex;
      width: fit-content;
      padding: 7px 11px;
      border-radius: 999px;
      background: #eff4ff;
      color: #1849a9;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-admin {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border: 0;
      border-radius: 12px;
      padding: 0 15px;
      font: inherit;
      font-size: 14px;
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
      color: #344054;
      background: #fff;
      border: 1px solid #d5deeb;
    }

    .btn-admin.primary {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, #2563eb 0%, #14b8a6 100%);
      box-shadow: 0 12px 22px rgba(37, 99, 235, .18);
    }

    .btn-admin.secondary {
      color: #1849a9;
      background: #eff4ff;
      border-color: #c7d7fe;
    }

    .editor-layout {
      display: grid;
      grid-template-columns: 390px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .admin-panel {
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    .panel-title {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
    }

    .field-grid,
    .field {
      display: grid;
      gap: 10px;
    }

    .field label {
      color: #344054;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid #d5deeb;
      border-radius: 12px;
      background: #fff;
      padding: 11px 12px;
      font: inherit;
      color: #101828;
      box-sizing: border-box;
    }

    .field textarea {
      min-height: 92px;
      resize: vertical;
      line-height: 1.7;
    }

    .hint {
      margin: 0;
      color: var(--admin-muted);
      font-size: 12px;
      line-height: 1.65;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      border: 1px solid #d5deeb;
      border-radius: 14px;
      background: #f8fbff;
    }

    .tool-btn,
    .tool-select,
    .tool-color {
      min-height: 36px;
      border: 1px solid #cfd8e7;
      border-radius: 10px;
      background: #fff;
      color: #243044;
      font: inherit;
      font-size: 13px;
      font-weight: 900;
    }

    .tool-btn {
      min-width: 38px;
      padding: 0 10px;
      cursor: pointer;
    }

    .tool-select {
      padding: 0 10px;
    }

    .tool-color {
      width: 42px;
      padding: 4px;
    }

    .editor {
      min-height: 540px;
      padding: 24px;
      border: 1px solid #d5deeb;
      border-radius: 16px;
      background: #fff;
      color: #243044;
      line-height: 1.95;
      outline: none;
      overflow-wrap: anywhere;
    }

    .editor:focus {
      border-color: #8db1ff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }

    .editor h2,
    .editor h3 {
      color: #111827;
      line-height: 1.35;
    }

    .preview {
      min-height: 540px;
      padding: 24px;
      border: 1px solid #d5deeb;
      border-radius: 16px;
      background: #fff;
      color: #243044;
      line-height: 1.95;
    }

    .preview img,
    .editor img {
      max-width: 100%;
      border-radius: 12px;
    }

    .article-list {
      display: grid;
      gap: 8px;
      max-height: 360px;
      overflow: auto;
    }

    .article-list button {
      display: grid;
      gap: 4px;
      width: 100%;
      padding: 10px;
      border: 1px solid #d5deeb;
      border-radius: 12px;
      background: #fff;
      color: #243044;
      text-align: left;
      cursor: pointer;
    }

    .article-list strong {
      font-size: 13px;
    }

    .article-list span {
      color: var(--admin-muted);
      font-size: 12px;
      font-weight: 700;
    }

    .status-line {
      min-height: 22px;
      color: var(--admin-muted);
      font-size: 13px;
      font-weight: 800;
    }

    .status-line.ok { color: #047857; }
    .status-line.ng { color: #b42318; }

    @media (max-width: 980px) {
      .admin-hero,
      .editor-layout {
        grid-template-columns: 1fr;
      }

      .admin-hero {
        display: grid;
      }
    }
  </style>
</head>

<body class="admin-article-page">
  <main class="admin-shell">
    <section class="admin-hero">
      <div>
        <div class="admin-badge">ARTICLE EDITOR</div>
        <h1>記事を書く</h1>
        <p>管理画面で記事を作成し、投稿すると公開側の記事一覧に表示されます。実公開用にはJSONを書き出して `articles.json` に反映します。</p>
      </div>
      <div class="admin-actions">
        <a class="btn-admin secondary" href="./articles.html" target="_blank" rel="noopener">記事一覧を見る</a>
        <a class="btn-admin secondary" href="./admin-promo.html">管理トップへ</a>
      </div>
    </section>

    <section class="editor-layout">
      <aside class="admin-panel">
        <h2 class="panel-title">記事設定</h2>
        <div class="field-grid">
          <div class="field">
            <label for="titleInput">タイトル</label>
            <input id="titleInput" type="text" maxlength="120" placeholder="例: 5/11週のスリーブ相場まとめ" />
          </div>
          <div class="field">
            <label for="slugInput">URL用ID</label>
            <input id="slugInput" type="text" maxlength="80" placeholder="例: weekly-market-2026-05-11" />
            <p class="hint">半角英数字とハイフン推奨。空ならタイトルから自動生成します。</p>
          </div>
          <div class="field">
            <label for="excerptInput">説明文</label>
            <textarea id="excerptInput" maxlength="240" placeholder="記事一覧やSNS向けの短い説明"></textarea>
          </div>
          <div class="field">
            <label for="categoryInput">カテゴリ</label>
            <input id="categoryInput" type="text" maxlength="40" value="相場コラム" />
          </div>
          <div class="field">
            <label for="coverInput">カバー画像URL</label>
            <input id="coverInput" type="url" placeholder="https://..." />
          </div>
          <div class="field">
            <label for="dateInput">公開日</label>
            <input id="dateInput" type="date" />
          </div>
        </div>
        <div class="admin-actions">
          <button id="newBtn" type="button" class="btn-admin">新規</button>
          <button id="draftBtn" type="button" class="btn-admin secondary">下書き保存</button>
          <button id="publishBtn" type="button" class="btn-admin primary">投稿</button>
        </div>
        <div class="admin-actions">
          <button id="exportBtn" type="button" class="btn-admin secondary">articles.jsonを書き出し</button>
          <button id="copyJsonBtn" type="button" class="btn-admin">JSONコピー</button>
        </div>
        <div id="status" class="status-line"></div>
        <h2 class="panel-title">保存済み記事</h2>
        <div id="articleList" class="article-list"></div>
      </aside>

      <section class="admin-panel">
        <h2 class="panel-title">本文</h2>
        <div class="toolbar" aria-label="本文装飾">
          <button class="tool-btn" type="button" data-command="bold">B</button>
          <button class="tool-btn" type="button" data-command="italic">I</button>
          <button class="tool-btn" type="button" data-command="underline">U</button>
          <button class="tool-btn" type="button" data-block="h2">H2</button>
          <button class="tool-btn" type="button" data-block="h3">H3</button>
          <button class="tool-btn" type="button" data-block="p">P</button>
          <button class="tool-btn" type="button" data-command="insertUnorderedList">箇条書き</button>
          <button class="tool-btn" type="button" data-command="insertOrderedList">番号</button>
          <button class="tool-btn" type="button" data-command="justifyLeft">左</button>
          <button class="tool-btn" type="button" data-command="justifyCenter">中央</button>
          <button class="tool-btn" type="button" data-command="justifyRight">右</button>
          <select id="fontSelect" class="tool-select" aria-label="フォント">
            <option value="">フォント</option>
            <option value="'Noto Sans JP', sans-serif">Noto Sans JP</option>
            <option value="'Yu Gothic UI', 'Meiryo', sans-serif">Yu Gothic</option>
            <option value="'Hiragino Mincho ProN', 'Yu Mincho', serif">明朝</option>
            <option value="Inter, sans-serif">Inter</option>
          </select>
          <input id="colorInput" class="tool-color" type="color" value="#243044" aria-label="文字色" />
          <button id="linkBtn" class="tool-btn" type="button">リンク</button>
          <button id="imageBtn" class="tool-btn" type="button">画像</button>
          <button id="quoteBtn" class="tool-btn" type="button">引用</button>
          <button class="tool-btn" type="button" data-command="undo">戻す</button>
          <button class="tool-btn" type="button" data-command="redo">進む</button>
        </div>
        <div id="editor" class="editor" contenteditable="true" aria-label="記事本文"></div>
      </section>

      <section class="admin-panel">
        <h2 class="panel-title">プレビュー</h2>
        <div id="preview" class="preview"></div>
      </section>
    </section>
  </main>

  <script>
    const ARTICLE_LOCAL_KEY = "pokeSleeve:articles:local:v1";
    let currentId = "";

    const qs = (id) => document.getElementById(id);

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function todayISO() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function slugify(value) {
      const raw = String(value || "").trim().toLowerCase();
      const ascii = raw
        .replace(/[^\w\s-]/g, "")
        .replace(/\s+/g, "-")
        .replace(/_+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "");
      return ascii || `article-${todayISO()}`;
    }

    function setStatus(text, type = "") {
      const el = qs("status");
      if (!el) return;
      el.textContent = text;
      el.className = `status-line ${type}`;
    }

    function sanitizeHtml(html) {
      const template = document.createElement("template");
      template.innerHTML = String(html || "");
      const allowedTags = new Set(["P", "BR", "STRONG", "B", "EM", "I", "U", "H2", "H3", "UL", "OL", "LI", "A", "IMG", "BLOCKQUOTE", "SPAN", "DIV", "FONT"]);
      const allowedAttrs = new Set(["href", "src", "alt", "title", "style", "target", "rel", "face", "color", "size"]);

      const walk = (node) => {
        for (const child of Array.from(node.children)) {
          if (!allowedTags.has(child.tagName)) {
            child.replaceWith(...Array.from(child.childNodes));
            continue;
          }
          for (const attr of Array.from(child.attributes)) {
            if (!allowedAttrs.has(attr.name)) child.removeAttribute(attr.name);
          }
          if (child.tagName === "A") {
            const href = child.getAttribute("href") || "";
            if (!/^(https?:|\.\/|\/|#)/i.test(href)) child.removeAttribute("href");
            child.setAttribute("target", "_blank");
            child.setAttribute("rel", "noopener");
          }
          if (child.tagName === "IMG") {
            const src = child.getAttribute("src") || "";
            if (!/^https?:/i.test(src)) child.remove();
          }
          if (child.hasAttribute("style")) {
            const style = child.getAttribute("style") || "";
            const safe = style.split(";").map((part) => part.trim()).filter((part) => /^(color|text-align|font-family)\s*:/i.test(part)).join("; ");
            if (safe) child.setAttribute("style", safe);
            else child.removeAttribute("style");
          }
          walk(child);
        }
      };
      walk(template.content);
      return template.innerHTML.trim();
    }

    function readStoredArticles() {
      try {
        const raw = localStorage.getItem(ARTICLE_LOCAL_KEY);
        const data = raw ? JSON.parse(raw) : [];
        return Array.isArray(data) ? data : [];
      } catch (_) {
        return [];
      }
    }

    function writeStoredArticles(articles) {
      localStorage.setItem(ARTICLE_LOCAL_KEY, JSON.stringify(articles));
    }

    function readForm(status) {
      const title = qs("titleInput").value.trim();
      if (!title) throw new Error("タイトルを入力してください。");
      const slug = slugify(qs("slugInput").value || title);
      const html = sanitizeHtml(qs("editor").innerHTML);
      if (!html || html === "<br>") throw new Error("本文を入力してください。");
      const now = new Date().toISOString();
      return {
        id: currentId || slug,
        slug,
        title,
        excerpt: qs("excerptInput").value.trim(),
        category: qs("categoryInput").value.trim() || "相場コラム",
        coverImage: qs("coverInput").value.trim(),
        publishedAt: qs("dateInput").value || todayISO(),
        updatedAt: now,
        status,
        html
      };
    }

    function fillForm(article) {
      currentId = article?.id || "";
      qs("titleInput").value = article?.title || "";
      qs("slugInput").value = article?.slug || "";
      qs("excerptInput").value = article?.excerpt || "";
      qs("categoryInput").value = article?.category || "相場コラム";
      qs("coverInput").value = article?.coverImage || "";
      qs("dateInput").value = article?.publishedAt || todayISO();
      qs("editor").innerHTML = article?.html || "<p>ここに本文を書いてください。</p>";
      updatePreview();
    }

    function saveArticle(status) {
      const article = readForm(status);
      const articles = readStoredArticles();
      const next = [article, ...articles.filter((item) => item.slug !== article.slug && item.id !== article.id)];
      writeStoredArticles(next);
      currentId = article.id;
      renderArticleList();
      updatePreview();
      setStatus(status === "published" ? "投稿しました。公開側の記事一覧にも表示されます。" : "下書きを保存しました。", "ok");
      return article;
    }

    function renderArticleList() {
      const list = qs("articleList");
      const articles = readStoredArticles().sort((a, b) => String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")));
      if (!articles.length) {
        list.innerHTML = `<p class="hint">保存済み記事はまだありません。</p>`;
        return;
      }
      list.innerHTML = articles.map((article) => `
        <button type="button" data-load="${escapeHtml(article.id || article.slug)}">
          <strong>${escapeHtml(article.title || "無題")}</strong>
          <span>${escapeHtml(article.status === "published" ? "公開" : "下書き")} / ${escapeHtml(article.slug || "")}</span>
        </button>
      `).join("");
    }

    function updatePreview() {
      const title = qs("titleInput").value.trim() || "無題の記事";
      const excerpt = qs("excerptInput").value.trim();
      const html = sanitizeHtml(qs("editor").innerHTML);
      qs("preview").innerHTML = `
        <h1>${escapeHtml(title)}</h1>
        ${excerpt ? `<p><strong>${escapeHtml(excerpt)}</strong></p>` : ""}
        <hr>
        ${html || "<p>本文プレビュー</p>"}
      `;
    }

    function exec(command, value = null) {
      qs("editor").focus();
      document.execCommand(command, false, value);
      updatePreview();
    }

    function downloadJson() {
      const articles = readStoredArticles().filter((article) => article.status === "published");
      const payload = JSON.stringify({ articles }, null, 2);
      const blob = new Blob([payload], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "articles.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      setStatus("articles.jsonを書き出しました。", "ok");
    }

    async function copyJson() {
      const articles = readStoredArticles().filter((article) => article.status === "published");
      const payload = JSON.stringify({ articles }, null, 2);
      await navigator.clipboard.writeText(payload);
      setStatus("JSONをコピーしました。", "ok");
    }

    document.addEventListener("DOMContentLoaded", () => {
      qs("dateInput").value = todayISO();
      fillForm(null);
      renderArticleList();

      document.querySelectorAll("[data-command]").forEach((button) => {
        button.addEventListener("click", () => exec(button.dataset.command));
      });
      document.querySelectorAll("[data-block]").forEach((button) => {
        button.addEventListener("click", () => exec("formatBlock", button.dataset.block));
      });
      qs("fontSelect").addEventListener("change", (event) => {
        if (!event.target.value) return;
        exec("fontName", event.target.value);
      });
      qs("colorInput").addEventListener("input", (event) => exec("foreColor", event.target.value));
      qs("linkBtn").addEventListener("click", () => {
        const url = prompt("リンクURLを入力してください");
        if (url) exec("createLink", url);
      });
      qs("imageBtn").addEventListener("click", () => {
        const url = prompt("画像URLを入力してください");
        if (url) exec("insertImage", url);
      });
      qs("quoteBtn").addEventListener("click", () => exec("formatBlock", "blockquote"));
      qs("editor").addEventListener("input", updatePreview);
      ["titleInput", "excerptInput", "categoryInput", "coverInput", "dateInput"].forEach((id) => {
        qs(id).addEventListener("input", updatePreview);
      });
      qs("newBtn").addEventListener("click", () => {
        currentId = "";
        fillForm(null);
        setStatus("新規記事を作成します。");
      });
      qs("draftBtn").addEventListener("click", () => {
        try { saveArticle("draft"); } catch (error) { setStatus(error.message || "保存に失敗しました。", "ng"); }
      });
      qs("publishBtn").addEventListener("click", () => {
        try { saveArticle("published"); } catch (error) { setStatus(error.message || "投稿に失敗しました。", "ng"); }
      });
      qs("exportBtn").addEventListener("click", downloadJson);
      qs("copyJsonBtn").addEventListener("click", () => copyJson().catch(() => setStatus("コピーに失敗しました。", "ng")));
      qs("articleList").addEventListener("click", (event) => {
        const button = event.target.closest("[data-load]");
        if (!button) return;
        const id = button.dataset.load;
        const article = readStoredArticles().find((item) => String(item.id || item.slug) === id);
        if (article) {
          fillForm(article);
          setStatus("記事を読み込みました。", "ok");
        }
      });
    });
  </script>
</body>

</html>
