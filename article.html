  <script>
    window.common.setupDashboardChrome({ sidebarActive: "articles", topbarActive: "articles" });
  </script>
  <script>
    const ARTICLE_LOCAL_KEY = "pokeSleeve:articles:local:v1";

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(value) {
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return "";
      return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
    }

    function normalizeArticle(article) {
      if (!article || typeof article !== "object") return null;
      const slug = String(article.slug || article.id || "").trim();
      const title = String(article.title || "").trim();
      if (!slug || !title) return null;
      return {
        id: String(article.id || slug),
        slug,
        title,
        excerpt: String(article.excerpt || "").trim(),
        category: String(article.category || "相場コラム").trim(),
        coverImage: String(article.coverImage || "").trim(),
        publishedAt: String(article.publishedAt || article.updatedAt || "").trim(),
        status: String(article.status || "published").trim(),
        linkUrl: String(article.linkUrl || "").trim(),
        html: String(article.html || "")
      };
    }

    async function loadArticles() {
      let fileArticles = [];
      try {
        const res = await fetch("./articles.json", { cache: "reload", headers: { "Accept": "application/json" } });
        if (res.ok) {
          const data = await res.json();
          fileArticles = Array.isArray(data?.articles) ? data.articles : [];
        }
      } catch (_) {}

      let localArticles = [];
      try {
        if (window.common?.readLocalArticles) {
          localArticles = await window.common.readLocalArticles(ARTICLE_LOCAL_KEY);
        } else {
          const raw = localStorage.getItem(ARTICLE_LOCAL_KEY);
          const data = raw ? JSON.parse(raw) : [];
          localArticles = Array.isArray(data) ? data : [];
        }
      } catch (_) {}

      const map = new Map();
      [...fileArticles, ...localArticles].forEach((item) => {
        const article = normalizeArticle(item);
        if (article && article.status !== "draft") map.set(article.slug, article);
      });
      return Array.from(map.values()).sort((a, b) => String(b.publishedAt).localeCompare(String(a.publishedAt)));
    }

    function renderArticle(article) {
      const mount = document.getElementById("articleMount");
      const crumb = document.getElementById("breadcrumbTitle");
      if (!mount) return;
      if (!article) {
        if (crumb) crumb.textContent = "記事が見つかりません";
        document.title = "記事が見つかりません - ポケスリ相場ナビ";
        if (window.common && typeof window.common.setStructuredData === "function") {
          window.common.setStructuredData("articleStructuredData", null);
        }
        mount.innerHTML = `<div class="article-empty">記事が見つかりませんでした。<br><a href="./articles.html">記事一覧へ戻る</a></div>`;
        return;
      }
      if (crumb) crumb.textContent = article.title;
      document.title = `${article.title} - ポケスリ相場ナビ`;
      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc && article.excerpt) metaDesc.setAttribute("content", article.excerpt);
      if (window.common && typeof window.common.updateArticleStructuredData === "function") {
        window.common.updateArticleStructuredData("articleStructuredData", {
          title: article.title,
          description: article.excerpt,
          image: article.coverImage,
          datePublished: article.publishedAt,
          dateModified: article.updatedAt || article.publishedAt,
          url: location.href
        });
      }
      mount.innerHTML = `
        <article class="article-detail">
          ${article.coverImage ? `<img class="article-cover" src="${escapeHtml(article.coverImage)}" alt="">` : `<div class="article-cover" aria-hidden="true"></div>`}
          <header class="article-head">
            <div class="article-meta">
              <span>${escapeHtml(article.category || "記事")}</span>
              <span>${escapeHtml(formatDate(article.publishedAt))}</span>
            </div>
            <h1 class="article-detail-title">${escapeHtml(article.title)}</h1>
            ${article.excerpt ? `<p class="article-detail-excerpt">${escapeHtml(article.excerpt)}</p>` : ""}
          </header>
          <div class="article-body">${article.html || "<p>本文がありません。</p>"}</div>
        </article>
      `;
    }

    const id = new URLSearchParams(location.search).get("id") || "";
    loadArticles().then((articles) => {
      const article = articles.find((item) => item.slug === id) || null;
      if (article?.linkUrl) {
        location.replace(article.linkUrl);
        return;
      }
      renderArticle(article);
    }).catch(() => renderArticle(null));
  </script>
